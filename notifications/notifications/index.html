<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MAILROOM | THE CRIB</title>
    <!-- EmailJS Library -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #333;
            color: #fff;
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 2px solid #0f0;
            margin-bottom: 20px;
        }

        .back-btn {
            color: #0f0;
            text-decoration: none;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            font-size: 1.5em;
            text-shadow: 0 0 10px #0f0;
        }

        .notif-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .thread-group {
            background: #222;
            border: 1px solid #444;
            border-radius: 12px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .thread-header {
            background: #444;
            padding: 10px 15px;
            border-bottom: 1px solid #0f0;
            font-weight: bold;
            color: #0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .message-card {
            padding: 15px;
            border-bottom: 1px solid #333;
            position: relative;
            animation: fadeIn 0.4s ease;
            border-left: 4px solid #0f0;
        }

        .message-card:last-child { border-bottom: none; }

        .my-message {
            border-left: 4px solid #888;
            background: #2a2a2a;
        }

        .tag {
            font-size: 0.65em;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 8px;
            display: inline-block;
        }
        .tag-global { background: #0f0; color: #000; }
        .tag-group { background: #0088ff; color: #fff; }
        .tag-private { background: #ff00ff; color: #fff; }
        .tag-sent { background: #444; color: #ccc; border: 1px solid #888; }

        .sender-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .sender-img {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 1px solid #0f0;
        }

        .sender-name { font-weight: bold; font-size: 0.9em; }
        .body { font-size: 0.9em; color: #ddd; line-height: 1.4; white-space: pre-wrap; margin-bottom: 10px;}
        .time { font-size: 0.7em; color: #888; margin-top: 8px; display: block; }

        .attachment-link {
            display: inline-block;
            background: #111;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8em;
            margin-top: 5px;
            transition: 0.2s;
        }

        .attachment-link:hover {
            background: #0f0;
            color: #000;
        }

        .action-btns {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }

        .btn-small {
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            cursor: pointer;
            transition: 0.2s;
        }

        .reply-btn { border-color: #0f0; color: #0f0; }
        .reply-btn:hover { background: #0f0; color: #000; }

        .delete-btn { border-color: #ff4444; color: #ff4444; }
        .delete-btn:hover { background: #ff4444; color: #fff; }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #0f0;
            color: #000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
            border: none;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #222;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 2px solid #0f0;
            max-height: 90vh;
            overflow-y: auto;
        }

        input, textarea {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .file-input-wrapper {
            margin: 10px 0;
            border: 1px dashed #444;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            background: #1a1a1a;
            transition: 0.3s;
        }

        .file-input-wrapper:hover {
            border-color: #0f0;
        }

        .file-label {
            color: #0f0;
            font-size: 0.85em;
            cursor: pointer;
            display: block;
        }

        .send-btn {
            background: #0f0;
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }

        .send-btn:disabled {
            background: #444;
            cursor: not-allowed;
            color: #888;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../../" class="back-btn">← THE CRIB</a>
        <h1>MAILROOM</h1>
        <div id="user-display" style="font-size: 0.8em; color: #0f0; display: flex; align-items: center; gap: 8px;">
            Connecting...
        </div>
    </div>

    <div class="notif-container" id="thread-list">
        <p style="text-align:center; color:#0f0;">Summoning the scrolls...</p>
    </div>

    <button class="fab" id="open-compose">+</button>

    <div class="modal" id="composeModal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top:0; color:#0f0;">New Scroll</h2>
            <input type="text" id="msgRecipient" placeholder="To: (Name, Email, or GLOBAL)">
            <p style="font-size: 0.7em; color: #888; margin-top: -5px;">GLOBAL alerts EVERYONE who has logged in.</p>
            <input type="text" id="msgSubject" placeholder="Subject">
            <textarea id="msgBody" rows="4" placeholder="Message content..."></textarea>
            
            <div class="file-input-wrapper">
                <input type="file" id="msgFile" style="display: none;" accept="image/*,video/*,application/pdf">
                <label for="msgFile" class="file-label" id="fileStatus">📁 ATTACH PHOTO/FILE (OPTIONAL)</label>
            </div>

            <button class="send-btn" id="final-send">DISPATCH</button>
            <button style="background:none; border:none; color:#888; margin-top:15px; cursor:pointer; width:100%;" id="close-modal">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, orderBy, limit, serverTimestamp, doc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const SERVICE_ID = "service_n2hsxcf";
        const TEMPLATE_ID = "template_rip4cmz"; 
        const PUBLIC_KEY = "B27WRyM1IvaQI_Ysy";
        const MY_ADMIN_EMAIL = "open.it.out.fortnite@gmail.com"; 

        let currentUser = null;

        async function notifyViaEmail(recipientInput, senderName, scrollSubject, scrollBody, fileUrl) {
            emailjs.init(PUBLIC_KEY);
            const lowerRecipient = recipientInput.toLowerCase();
            const isGlobal = lowerRecipient === "global";
            const apiKey = ""; 

            let targetEmails = [];
            let threadHistory = "";

            try {
                const baseSubject = scrollSubject.replace(/^Re:\s+/i, "").trim().toLowerCase();
                const q = query(collection(db, "messages"), orderBy("timestamp", "desc"), limit(20));
                const snap = await getDocs(q);
                
                let historyItems = [];
                snap.forEach(d => {
                    const data = d.data();
                    const msgSub = (data.subject || "").replace(/^Re:\s+/i, "").trim().toLowerCase();
                    if (msgSub === baseSubject) {
                        const date = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleString() : "Just now";
                        historyItems.push(`[${date}] ${data.senderName}: ${data.body}`);
                    }
                });
                
                if (historyItems.length > 1) {
                    threadHistory = "\n\n--- SCROLL CHRONICLES (Thread History) ---\n" + historyItems.join("\n\n");
                }
            } catch (e) { console.log("History lookup failed."); }

            if (isGlobal) {
                try {
                    const q = query(collection(db, "messages"), limit(300));
                    const snap = await getDocs(q);
                    const emailSet = new Set();
                    emailSet.add(MY_ADMIN_EMAIL);
                    snap.forEach(d => {
                        const data = d.data();
                        if (data.senderEmail && data.senderEmail.includes('@')) {
                            emailSet.add(data.senderEmail.toLowerCase());
                        }
                    });
                    targetEmails = Array.from(emailSet);
                } catch(e) { targetEmails = [MY_ADMIN_EMAIL]; }
            } else if (recipientInput.includes('@')) {
                targetEmails = [recipientInput];
            } else {
                try {
                    const q = query(collection(db, "messages"), limit(100));
                    const snap = await getDocs(q);
                    snap.forEach(d => {
                        const data = d.data();
                        if (data.senderName?.toLowerCase() === lowerRecipient) {
                            targetEmails.push(data.senderEmail);
                        }
                    });
                } catch(e) { console.error("Lookup failed"); }
            }

            if (targetEmails.length === 0) targetEmails = [MY_ADMIN_EMAIL];

            const systemPrompt = `You are the Courier of THE CRIB. Hype up ${recipientInput} because ${senderName} sent a scroll. Mention the subject: "${scrollSubject}". ${fileUrl ? "Explicitly mention there is a visual attachment/photo to check out." : ""} Roast Connor for being a zesty iPad kid with zero security (oink oink). Max 2 sentences.`;

            let hypeIntro = `New dispatch regarding: ${scrollSubject}`;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Write the intro." }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                const result = await response.json();
                hypeIntro = result.candidates?.[0]?.content?.parts?.[0]?.text || hypeIntro;
            } catch (e) {}

            const finalMessage = `
SUBJECT: ${scrollSubject.toUpperCase()}
FROM: ${senderName}

${hypeIntro}

--- LATEST SCROLL ---
${scrollBody}

${fileUrl ? `[VISUAL ATTACHMENT]: ${fileUrl}` : "No files attached."}

${threadHistory}

------------------
[!] NO-REPLY AUTO DISPATCH. 
DUNGEON STATUS: SECURED.
            `.trim();

            const uniqueEmails = [...new Set(targetEmails)];
            for (const email of uniqueEmails) {
                try {
                    await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
                        to_name: recipientInput,
                        to_email: email,
                        from_name: senderName,
                        subject: `[SCROLL] ${scrollSubject}`,
                        message: finalMessage
                    });
                } catch (err) { console.error("Courier error:", err); }
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-display').innerHTML = `
                    <img src="${user.photoURL || ''}" style="width: 20px; height: 20px; border-radius: 50%; border: 1px solid #0f0;">
                    <span>${user.displayName || 'Hero'}</span>
                `;
                loadThreads();
            } else {
                window.location.href = "../login/"; 
            }
        });

        document.getElementById('msgFile').onchange = function() {
            if(this.files[0]) {
                document.getElementById('fileStatus').innerText = `✅ READY: ${this.files[0].name}`;
                document.getElementById('fileStatus').style.color = "#0f0";
            } else {
                document.getElementById('fileStatus').innerText = "📁 ATTACH PHOTO/FILE (OPTIONAL)";
                document.getElementById('fileStatus').style.color = "#0f0";
            }
        };

        window.initReply = function(email, name, subject) {
            document.getElementById('modal-title').innerText = "Reply to Thread";
            document.getElementById('msgRecipient').value = email || name;
            const cleanSub = subject.replace(/^Re:\s+/i, "");
            document.getElementById('msgSubject').value = "Re: " + cleanSub;
            document.getElementById('composeModal').style.display = 'flex';
            document.getElementById('msgBody').focus();
        };

        window.deleteMessage = async function(msgId) {
            if (confirm("Burn this scroll?")) {
                try { await deleteDoc(doc(db, "messages", msgId)); } catch (e) {}
            }
        };

        function loadThreads() {
            const q = query(collection(db, "messages"), orderBy("timestamp", "asc"), limit(300));
            onSnapshot(q, (snapshot) => {
                const threadList = document.getElementById('thread-list');
                threadList.innerHTML = '';
                const threads = {}; 

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const recipients = (data.recipient || "").split(',').map(r => r.trim().toLowerCase());
                    const isGlobal = recipients.includes('global');
                    const isForMe = isGlobal || 
                        recipients.includes(currentUser.displayName?.toLowerCase()) || 
                        recipients.includes(currentUser.email?.toLowerCase()) ||
                        recipients.includes(currentUser.uid);
                    const isFromMe = data.senderUid === currentUser.uid;

                    if (isForMe || isFromMe) {
                        const baseSubject = (data.subject || "No Subject").replace(/^Re:\s+/i, "").trim().toLowerCase();
                        if (!threads[baseSubject]) threads[baseSubject] = [];
                        threads[baseSubject].push({ id: docSnap.id, ...data, isSentByMe: isFromMe, isGlobal: isGlobal, isGroup: recipients.length > 1 });
                    }
                });

                Object.keys(threads).sort((a, b) => {
                    const lastA = threads[a][threads[a].length - 1].timestamp?.seconds || 0;
                    const lastB = threads[b][threads[b].length - 1].timestamp?.seconds || 0;
                    return lastB - lastA;
                }).forEach(sub => {
                    const msgGroup = threads[sub];
                    const threadContainer = document.createElement('div');
                    threadContainer.className = 'thread-group';
                    const displaySubject = msgGroup[0].subject.replace(/^Re:\s+/i, "");
                    threadContainer.innerHTML = `<div class="thread-header">
                        <span>${displaySubject.toUpperCase()}</span>
                        <span style="font-size: 0.7em; opacity: 0.7;">${msgGroup.length} MESSAGES</span>
                    </div>`;

                    msgGroup.forEach((msg) => {
                        const time = msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleString([], {hour: '2-digit', minute:'2-digit', month:'short', day:'numeric'}) : 'Sending...';
                        const card = document.createElement('div');
                        card.className = `message-card ${msg.isSentByMe ? 'my-message' : ''}`;
                        let tagClass = 'tag-private'; let tagText = 'Private';
                        if(msg.isGlobal) { tagClass = 'tag-global'; tagText = 'Global'; }
                        else if(msg.isGroup) { tagClass = 'tag-group'; tagText = 'Group Chat'; }
                        else if(msg.isSentByMe) { tagClass = 'tag-sent'; tagText = 'Sent'; }

                        card.innerHTML = `
                            <span class="tag ${tagClass}">${tagText}</span>
                            <div class="action-btns">
                                ${!msg.isSentByMe ? `<button class="btn-small reply-btn" onclick="initReply('${msg.senderEmail || ''}', '${msg.senderName}', '${msg.subject}')">Reply</button>` : ''}
                                <button class="btn-small delete-btn" onclick="deleteMessage('${msg.id}')">Delete</button>
                            </div>
                            <div class="sender-info">
                                <img src="${msg.senderPhoto || ''}" class="sender-img" onerror="this.src='https://via.placeholder.com/30'">
                                <span class="sender-name">${msg.isSentByMe ? 'You' : msg.senderName}</span>
                            </div>
                            <div class="body">${msg.body}</div>
                            ${msg.fileUrl ? `<a href="${msg.fileUrl}" target="_blank" class="attachment-link">🖼️ VIEW PHOTO/FILE</a>` : ''}
                            <span class="time">${time}</span>
                        `;
                        threadContainer.appendChild(card);
                    });
                    threadList.appendChild(threadContainer);
                });

                if (threadList.innerHTML === '') {
                    threadList.innerHTML = '<p style="text-align:center; color:#888; margin-top:50px;">The Mailroom is empty.</p>';
                }
            });
        }

        const modal = document.getElementById('composeModal');
        document.getElementById('open-compose').onclick = () => {
            document.getElementById('modal-title').innerText = "New Scroll";
            document.getElementById('msgRecipient').value = '';
            document.getElementById('msgSubject').value = '';
            document.getElementById('msgBody').value = '';
            document.getElementById('msgFile').value = '';
            document.getElementById('fileStatus').innerText = "📁 ATTACH PHOTO/FILE (OPTIONAL)";
            modal.style.display = 'flex';
        };
        document.getElementById('close-modal').onclick = () => modal.style.display = 'none';

        document.getElementById('final-send').onclick = async () => {
            const sendBtn = document.getElementById('final-send');
            const recipient = document.getElementById('msgRecipient').value.trim();
            const subject = document.getElementById('msgSubject').value.trim();
            const body = document.getElementById('msgBody').value.trim();
            const fileInput = document.getElementById('msgFile');

            if (!recipient || !subject || !body) return alert("Forms are mandatory, hero.");
            if (recipient.toLowerCase().includes('connor')) return alert("Oink oink—security blocked that zesty bot.");

            sendBtn.disabled = true;
            sendBtn.innerText = "UPLOADING...";

            let fileUrl = null;

            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    // Clean filename for iPad compatibility
                    const safeName = file.name.replace(/[^a-z0-9.]/gi, '_').toLowerCase();
                    const filePath = `mailroom/${currentUser.uid}/${Date.now()}_${safeName}`;
                    const storageRef = ref(storage, filePath);
                    
                    try {
                        // Use a blob conversion which is more stable for iPad uploads
                        const blob = new Blob([file], { type: file.type });
                        const uploadResult = await uploadBytes(storageRef, blob);
                        fileUrl = await getDownloadURL(uploadResult.ref);
                    } catch (uploadError) {
                        console.error("iPad Upload snag:", uploadError);
                        const proceed = confirm("iPad blocked the upload (oink oink). Dispatch scroll WITHOUT the photo?");
                        if (!proceed) {
                             sendBtn.disabled = false;
                             sendBtn.innerText = "DISPATCH";
                             return;
                        }
                    }
                }

                sendBtn.innerText = "DISPATCHING...";

                await addDoc(collection(db, "messages"), {
                    senderName: currentUser.displayName || 'Hero',
                    senderEmail: currentUser.email || '',
                    senderPhoto: currentUser.photoURL || '', 
                    senderUid: currentUser.uid,
                    recipient: recipient, 
                    subject: subject,
                    body: body,
                    fileUrl: fileUrl,
                    timestamp: serverTimestamp()
                });

                await notifyViaEmail(recipient, currentUser.displayName, subject, body, fileUrl);
                modal.style.display = 'none';
            } catch (e) { 
                console.error("General Send Error:", e);
                alert("Dispatch failed. Error code: " + (e.code || "UNKNOWN")); 
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = "DISPATCH";
            }
        };
    </script>
</body>
</html>
