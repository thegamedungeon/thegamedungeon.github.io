<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE MAILROOM | THE CRIB</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #333;
            color: #fff;
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 2px solid #0f0;
            margin-bottom: 20px;
        }

        .back-btn {
            color: #0f0;
            text-decoration: none;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            font-size: 1.5em;
            text-shadow: 0 0 10px #0f0;
        }

        .notif-container {
            max-width: 500px;
            margin: 0 auto;
            text-align: left;
        }

        .message-card {
            background: #444;
            border-left: 5px solid #0f0;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            position: relative;
            animation: slideIn 0.3s ease-out;
        }

        .tag {
            font-size: 0.7em;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 8px;
            display: inline-block;
        }

        .tag-global { background: #0f0; color: #000; }
        .tag-private { background: #ff00ff; color: #fff; }

        .sender-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .sender-img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #0f0;
            background: #222;
        }

        .sender-name { font-weight: bold; font-size: 1em; color: #fff; }

        .subject { font-size: 1.1em; margin-bottom: 5px; color: #0f0; font-weight: bold; }
        .body { font-size: 0.95em; color: #ddd; line-height: 1.4; }
        .time { font-size: 0.7em; color: #888; margin-top: 10px; display: block; }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #0f0;
            color: #000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
            border: none;
            cursor: pointer;
            z-index: 10;
        }

        .fab:hover { transform: scale(1.1); box-shadow: 0 0 20px #0f0; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #222;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 2px solid #0f0;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
        }

        input, textarea {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, textarea:focus { border-color: #0f0; }

        .send-btn {
            background: #0f0;
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
        }

        .loading-text { color: #0f0; font-style: italic; text-align: center; width: 100%; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../" class="back-btn">← THE CRIB</a>
        <h1>MAILROOM</h1>
        <div id="user-display" style="font-size: 0.8em; color: #0f0; display: flex; align-items: center; gap: 8px;">
            Connecting...
        </div>
    </div>

    <div class="notif-container" id="notif-list">
        <p class="loading-text">Fetching dungeon scrolls...</p>
    </div>

    <button class="fab" id="open-compose">+</button>

    <div class="modal" id="composeModal">
        <div class="modal-content">
            <h2 style="margin-top:0; color:#0f0;">Compose Scroll</h2>
            <input type="text" id="msgRecipient" placeholder="To: (Email, Name, or GLOBAL)">
            <input type="text" id="msgSubject" placeholder="Subject">
            <textarea id="msgBody" rows="4" placeholder="Message content..."></textarea>
            <button class="send-btn" id="final-send">SEND TO THE VOID</button>
            <button style="background:none; border:none; color:#888; margin-top:15px; cursor:pointer; width:100%;" id="close-modal">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                const userPhoto = user.photoURL || 'https://via.placeholder.com/30';
                document.getElementById('user-display').innerHTML = `
                    <img src="${userPhoto}" style="width: 20px; height: 20px; border-radius: 50%; border: 1px solid #0f0;">
                    <span>${user.displayName || 'Guest'}</span>
                `;
                loadMessages();
            } else {
                window.location.href = "../login/"; 
            }
        });

        function loadMessages() {
            // Get last 50 messages to ensure we don't miss anything
            const q = query(collection(db, "messages"), orderBy("timestamp", "desc"), limit(50));
            
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('notif-list');
                container.innerHTML = '';

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const target = data.recipient.toLowerCase();
                    const isGlobal = target === 'global';
                    
                    // Logic to check if you are the intended reader
                    const isForMe = 
                        isGlobal || 
                        target === currentUser.displayName?.toLowerCase() || 
                        target === currentUser.email?.toLowerCase() ||
                        target === currentUser.uid;

                    if (isForMe) {
                        const card = document.createElement('div');
                        card.className = 'message-card';
                        
                        const timeString = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleString([], { hour: '2-digit', minute: '2-digit' }) : 'Pending...';

                        card.innerHTML = `
                            <span class="tag ${isGlobal ? 'tag-global' : 'tag-private'}">${isGlobal ? 'Global' : 'Private'}</span>
                            <div class="sender-info">
                                <img src="${data.senderPhoto || 'https://via.placeholder.com/30'}" class="sender-img" onerror="this.src='https://via.placeholder.com/30'">
                                <span class="sender-name">${data.senderName}</span>
                            </div>
                            <div class="subject">${data.subject}</div>
                            <div class="body">${data.body}</div>
                            <span class="time">${timeString}</span>
                        `;
                        container.appendChild(card);
                    }
                });

                if (container.innerHTML === '') {
                    container.innerHTML = '<p style="color:#888; text-align:center;">The scrolls are empty. Start the chat.</p>';
                }
            }, (error) => {
                console.error("Firebase Snapshot Error:", error);
            });
        }

        // Modal Controls
        const modal = document.getElementById('composeModal');
        document.getElementById('open-compose').onclick = () => modal.style.display = 'flex';
        document.getElementById('close-modal').onclick = () => modal.style.display = 'none';

        document.getElementById('final-send').onclick = async () => {
            const recipient = document.getElementById('msgRecipient').value.trim();
            const subject = document.getElementById('msgSubject').value.trim();
            const body = document.getElementById('msgBody').value.trim();

            if (!recipient || !subject || !body) return alert("Fill the form, don't be mid.");

            // Standard Roast Protection - Connor is blocked by name and likely email variants
            const connorBlock = ['connor', 'connor@gmail.com']; 
            if (connorBlock.includes(recipient.toLowerCase())) {
                alert("Security Error: Target 'Connor' is too zesty. Message intercepted and burned.");
                return;
            }

            try {
                await addDoc(collection(db, "messages"), {
                    senderName: currentUser.displayName || 'Unknown Hero',
                    senderPhoto: currentUser.photoURL || '', 
                    senderUid: currentUser.uid,
                    recipient: recipient, // Can be Name, Email, or GLOBAL
                    subject: subject,
                    body: body,
                    timestamp: serverTimestamp()
                });
                
                modal.style.display = 'none';
                document.getElementById('msgRecipient').value = '';
                document.getElementById('msgSubject').value = '';
                document.getElementById('msgBody').value = '';
            } catch (e) {
                console.error("Save failed:", e);
                alert("The Database rejected your scroll.");
            }
        };
    </script>
</body>
</html>
