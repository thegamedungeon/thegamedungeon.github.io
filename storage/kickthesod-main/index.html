<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kick the Sod: V3.6 (Noodle Limbs Update)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
        canvas { display: block; }
        
        #start-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        #logo-img {
            max-width: 300px;
            filter: drop-shadow(0 0 20px #e74c3c);
            margin-bottom: 20px;
        }
        .play-btn {
            background: #e74c3c;
            color: white;
            padding: 15px 50px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .play-btn:active { transform: scale(0.95); }

        #game-ui { display: none; }
        .ui-overlay { position: absolute; top: 100px; left: 20px; z-index: 10; pointer-events: none; }
        
        .controls { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; background: rgba(0,0,0,0.9); padding: 12px; border-radius: 20px; border: 2px solid #e74c3c; pointer-events: auto; }
        .btn { width: 45px; height: 45px; border-radius: 10px; border: none; background: #1a1a1a; color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
        .btn.active { background: #e74c3c; box-shadow: 0 0 10px #e74c3c; }
        
        #oink-overlay { display: none; position: fixed; inset: 0; background: black; z-index: 999; flex-direction: column; align-items: center; justify-content: center; color: red; font-weight: 900; text-align: center; }
    </style>
</head>
<body>
    <div id="start-screen">
        <img id="logo-img" src="/storage/photos/kts.png" alt="Kick the Sod" onerror="this.src='https://via.placeholder.com/300x150?text=KICK+THE+SOD'">
        <button class="play-btn" onclick="startGame()">Play</button>
        <p class="text-white mt-6 font-bold uppercase tracking-widest text-xs">V3.6 Noodle Limbs Update</p>
    </div>

    <div id="oink-overlay">
        <h1 class="text-6xl mb-4">OINK OINK</h1>
        <p class="text-2xl">BOT-BRAINED BEHAVIOR DETECTED</p>
        <p class="text-xl mt-4">YOU'RE BLICKED.</p>
        <span class="text-8xl mt-8">🐷</span>
    </div>

    <div id="game-ui">
        <div class="controls">
            <button class="btn active" id="grab-tool" title="Grab">🖐️</button>
            <button class="btn" id="slap-tool" title="Slap">👊</button>
            <button class="btn" id="sword-tool" title="Sword">🗡️</button>
            <button class="btn" id="fork-tool" title="Fork Test">🍴</button>
            <button class="btn" id="tnt-tool" title="TNT">💣</button>
            <button class="btn" id="gravity-tool">🌀</button>
            <button class="btn" id="clear-tool">🧹</button>
            <button class="btn" id="add-sod-btn" style="background: #27ae60;">➕</button>
            <button class="btn" id="reset-btn">🔄</button>
        </div>

        <div class="ui-overlay">
            <h1 class="text-red-600 text-2xl font-black italic tracking-tighter mb-2">KICK THE SODS</h1>
            <p class="text-gray-300 font-bold text-sm mb-2">Total Score: <span id="total-score" class="text-white">0</span></p>
            <p id="sod-count-display" class="text-red-500 font-bold text-xs uppercase tracking-widest">Active Sods: 0</p>
        </div>
    </div>

    <script>
        const { Engine, Render, Runner, World, Bodies, Body, Constraint, MouseConstraint, Mouse, Composite, Vector, Events } = Matter;
        
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

        function playSound(type) {
            if (!audioCtx || audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.12);
                osc.start(); osc.stop(now + 0.12);
            } else if (type === 'slice') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(); osc.stop(now + 0.1);
            } else if (type === 'boom') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.6);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(); osc.stop(now + 0.6);
            }
        }

        const engine = Engine.create({ positionIterations: 5, velocityIterations: 5 }); 
        const world = engine.world;
        const totalScoreEl = document.getElementById('total-score');
        const sodCountEl = document.getElementById('sod-count-display');
        const oinkOverlay = document.getElementById('oink-overlay');
        const gameUI = document.getElementById('game-ui');
        const startScreen = document.getElementById('start-screen');
        
        let totalScore = 0; let currentTool = 'grab'; let gravityState = 1; let bloodParticles = [];
        const MAX_AURA = 500000; 

        const render = Render.create({ 
            element: document.body, 
            engine: engine, 
            options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: '#0a0a0a' } 
        });
        
        function startGame() {
            initAudio();
            startScreen.style.display = 'none';
            gameUI.style.display = 'block';
            updateBoundaries();
            Render.run(render);
            Runner.run(Runner.create(), engine);
            createSodInstance();
        }

        let walls = [];
        function updateBoundaries() {
            if (walls.length > 0) World.remove(world, walls);
            const w = window.innerWidth;
            const h = window.innerHeight;
            const thickness = 600; 
            walls = [
                Bodies.rectangle(w / 2, h + thickness / 2, w * 10, thickness, { isStatic: true, label: 'ground', friction: 1, render: { fillStyle: '#111' } }),
                Bodies.rectangle(w / 2, -thickness / 2, w * 10, thickness, { isStatic: true, label: 'wall' }),
                Bodies.rectangle(-thickness / 2, h / 2, thickness, h * 10, { isStatic: true, label: 'wall' }),
                Bodies.rectangle(w + thickness / 2, h / 2, thickness, h * 10, { isStatic: true, label: 'wall' })
            ];
            World.add(world, walls);
        }

        window.addEventListener('resize', () => {
            render.options.width = window.innerWidth;
            render.options.height = window.innerHeight;
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            updateBoundaries();
        });

        let sodInstances = [];

        function createSodInstance() {
            const id = Math.random().toString(36).substr(2, 6);
            // Jitter start position to handle mass spawning
            const x = (window.innerWidth / 2) + (Math.random() - 0.5) * 100;
            const y = (window.innerHeight / 2) + (Math.random() - 0.5) * 100;

            const head = Bodies.circle(x, y - 80, 22, { render: { fillStyle: '#f1c40f' }, label: 'head', sodId: id, friction: 0.1 });
            const torso = Bodies.rectangle(x, y, 35, 65, { render: { fillStyle: '#e74c3c' }, label: 'chest', sodId: id, friction: 0.1 });
            
            // Arms - Two segments each
            const lArmUpper = Bodies.rectangle(x - 25, y - 10, 10, 25, { render: { fillStyle: '#f1c40f' }, sodId: id });
            const lArmLower = Bodies.rectangle(x - 25, y + 10, 10, 25, { render: { fillStyle: '#f1c40f' }, sodId: id });
            const rArmUpper = Bodies.rectangle(x + 25, y - 10, 10, 25, { render: { fillStyle: '#f1c40f' }, sodId: id });
            const rArmLower = Bodies.rectangle(x + 25, y + 10, 10, 25, { render: { fillStyle: '#f1c40f' }, sodId: id });

            // Legs - Two segments each
            const lLegUpper = Bodies.rectangle(x - 12, y + 45, 12, 30, { render: { fillStyle: '#2c3e50' }, sodId: id });
            const lLegLower = Bodies.rectangle(x - 12, y + 70, 12, 30, { render: { fillStyle: '#2c3e50' }, sodId: id });
            const rLegUpper = Bodies.rectangle(x + 12, y + 45, 12, 30, { render: { fillStyle: '#2c3e50' }, sodId: id });
            const rLegLower = Bodies.rectangle(x + 12, y + 70, 12, 30, { render: { fillStyle: '#2c3e50' }, sodId: id });

            const group = Composite.create();
            Composite.add(group, [head, torso, lArmUpper, lArmLower, rArmUpper, rArmLower, lLegUpper, lLegLower, rLegUpper, rLegLower]);
            
            const jointStiffness = 0.08; 
            const joints = [
                Constraint.create({ bodyA: head, bodyB: torso, pointA: {x:0, y:20}, pointB: {x:0, y:-32}, stiffness: jointStiffness, length: 5, render: {visible: false} }),
                Constraint.create({ bodyA: torso, bodyB: lArmUpper, pointA: {x:-18, y:-20}, pointB: {x:0, y:-10}, stiffness: jointStiffness, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: lArmUpper, bodyB: lArmLower, pointA: {x:0, y:12}, pointB: {x:0, y:-12}, stiffness: jointStiffness, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: torso, bodyB: rArmUpper, pointA: {x:18, y:-20}, pointB: {x:0, y:-10}, stiffness: jointStiffness, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: rArmUpper, bodyB: rArmLower, pointA: {x:0, y:12}, pointB: {x:0, y:-12}, stiffness: jointStiffness, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: torso, bodyB: lLegUpper, pointA: {x:-10, y:32}, pointB: {x:0, y:-15}, stiffness: jointStiffness, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: lLegUpper, bodyB: lLegLower, pointA: {x:0, y:15}, pointB: {x:0, y:-15}, stiffness: jointStiffness, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: torso, bodyB: rLegUpper, pointA: {x:10, y:32}, pointB: {x:0, y:-15}, stiffness: jointStiffness, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: rLegUpper, bodyB: rLegLower, pointA: {x:0, y:15}, pointB: {x:0, y:-15}, stiffness: jointStiffness, length: 2, render: {visible: false} })
            ];
            Composite.add(group, joints);

            World.add(world, group);
            sodInstances.push({ id, composite: group, aura: MAX_AURA, isDead: false, parts: { head, torso } });
            updateSodCounter();
        }

        function updateSodCounter() {
            sodCountEl.innerText = `Active Sods: ${sodInstances.filter(s => !s.isDead).length}`;
        }

        function damageSod(instance, amt) {
            if (instance.isDead) return;
            instance.aura = Math.max(0, instance.aura - amt);
            totalScore += Math.floor(amt / 100); totalScoreEl.innerText = totalScore.toLocaleString();
            if (instance.aura <= 0) {
                instance.isDead = true;
                updateSodCounter();
                setTimeout(() => {
                    Composite.clear(instance.composite, false); World.remove(world, instance.composite);
                    sodInstances = sodInstances.filter(s => s.id !== instance.id);
                    if (sodInstances.filter(s => !s.isDead).length === 0) createSodInstance();
                    updateSodCounter();
                }, 4000);
            }
        }

        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                const bodies = [pair.bodyA, pair.bodyB];
                const sodPart = bodies.find(b => b.sodId);
                const other = bodies.find(b => !b.sodId);
                
                if (sodPart && other) {
                    const inst = sodInstances.find(s => s.id === sodPart.sodId);
                    if (inst && !inst.isDead) {
                        const relVel = Vector.magnitude(Vector.sub(pair.bodyA.velocity, pair.bodyB.velocity));
                        if ((other.label === 'ground' || other.label === 'wall') && relVel > 12) { 
                            damageSod(inst, Math.floor(relVel * 450));
                            spawnBlood(sodPart.position.x, sodPart.position.y, 4);
                            playSound('hit');
                        } else if (relVel > 3 && other.label !== 'ground' && other.label !== 'wall') {
                            let type = 'hit'; let mult = 100;
                            if (other.label === 'sword-item') { mult = 300; type = 'slice'; }
                            else if (other.label === 'fork') { mult = 1000; type = 'slice'; }
                            damageSod(inst, Math.floor(relVel * mult));
                            spawnBlood(sodPart.position.x, sodPart.position.y, 2);
                            playSound(type);
                        }
                    }
                }
            });
        });

        Events.on(render, 'afterRender', () => {
            const context = render.context;
            sodInstances.forEach(inst => {
                const { head } = inst.parts;
                if (!head) return;
                const pct = inst.aura / MAX_AURA;
                context.fillStyle = 'rgba(0,0,0,0.5)'; context.fillRect(head.position.x - 30, head.position.y - 50, 60, 6);
                context.fillStyle = pct > 0.5 ? '#2ecc71' : '#e74c3c'; context.fillRect(head.position.x - 30, head.position.y - 50, 60 * pct, 6);
                context.save(); context.translate(head.position.x, head.position.y); context.rotate(head.angle);
                context.font = '24px Arial'; context.textAlign = 'center';
                context.fillText(inst.isDead ? '💀' : (inst.aura < 200000 ? '🥴' : '😤'), 0, 8);
                context.restore();
            });
            bloodParticles.forEach((p, i) => {
                context.fillStyle = `rgba(200, 0, 0, ${p.opacity})`; context.beginPath();
                context.arc(p.x, p.y, p.size, 0, Math.PI * 2); context.fill();
                p.opacity -= 0.02; if (p.opacity <= 0) bloodParticles.splice(i, 1);
            });
        });

        function spawnPhysicalSword(x, y) { World.add(world, Bodies.rectangle(x, y, 40, 80, { label: 'sword-item', density: 0.1, render: { sprite: { texture: 'https://em-content.zobj.net/source/apple/354/crossed-swords_2694-fe0f.png', xScale: 0.5, yScale: 0.5 } } })); }
        function spawnFork(x, y) { 
            const f = Bodies.rectangle(x, y, 40, 10, { label: 'fork', frictionAir: 0, render: { fillStyle: '#ccc' } }); 
            Body.setVelocity(f, { x: (Math.random()-0.5)*15, y: 30 }); World.add(world, f); 
        }
        function spawnBlood(x, y, count) { for (let i = 0; i < count; i++) bloodParticles.push({ x, y, size: Math.random()*3+1, opacity: 1 }); }

        function triggerAction(clientX, clientY) {
            const rect = render.canvas.getBoundingClientRect();
            const x = clientX - rect.left; const y = clientY - rect.top;
            if (currentTool === 'sword') spawnPhysicalSword(x, y);
            if (currentTool === 'fork') spawnFork(x, y);
            if (currentTool === 'slap') {
                playSound('hit');
                sodInstances.forEach(inst => {
                    Composite.allBodies(inst.composite).forEach(b => {
                        if (Vector.magnitude(Vector.sub(b.position, {x, y})) < 200) {
                            Body.applyForce(b, b.position, Vector.mult(Vector.normalise(Vector.sub(b.position, {x, y})), 0.8));
                            damageSod(inst, 5000);
                        }
                    });
                });
            }
            if (currentTool === 'tnt') {
                playSound('boom');
                Composite.allBodies(world).forEach(b => {
                    if (b.isStatic) return;
                    const dir = Vector.sub(b.position, {x, y}); const dist = Vector.magnitude(dir);
                    if (dist < 500) {
                        Body.applyForce(b, b.position, Vector.mult(Vector.normalise(dir), (500 - dist) * 0.06));
                        if (b.sodId) damageSod(sodInstances.find(s => s.id === b.sodId), 8000);
                    }
                });
            }
        }

        render.canvas.addEventListener('mousedown', (e) => triggerAction(e.clientX, e.clientY));
        render.canvas.addEventListener('touchstart', (e) => { 
            if (currentTool !== 'grab') e.preventDefault(); 
            const t = e.touches[0]; triggerAction(t.clientX, t.clientY); 
        }, { passive: false });

        const tools = ['grab', 'slap', 'sword', 'fork', 'tnt'];
        tools.forEach(t => document.getElementById(t + '-tool').addEventListener('click', () => {
            currentTool = t; document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById(t + '-tool').classList.add('active'); mouseConstraint.enabled = (t === 'grab');
        }));

        document.getElementById('gravity-tool').addEventListener('click', () => { gravityState *= -1; world.gravity.y = gravityState; });
        document.getElementById('clear-tool').addEventListener('click', () => {
            Composite.allBodies(world).forEach(b => { if (b.label === 'sword-item' || b.label === 'fork') World.remove(world, b); });
        });
        document.getElementById('add-sod-btn').addEventListener('click', createSodInstance);
        document.getElementById('reset-btn').addEventListener('click', () => location.reload());

        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, { mouse: mouse, constraint: { stiffness: 0.15, render: { visible: false } } });
        World.add(world, mouseConstraint);
    </script>
</body>
</html>
