<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sod Sandbox: Daimyan Strength Update</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; }
        .controls { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            z-index: 20; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; 
            background: rgba(0,0,0,0.9); padding: 10px; border-radius: 15px; border: 2px solid #e74c3c;
        }
        .btn { width: 42px; height: 42px; border-radius: 8px; background: #1a1a1a; color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; border: none; }
        .btn.active { background: #e74c3c; box-shadow: 0 0 10px #e74c3c; }
    </style>
</head>
<body>
    <div class="controls">
        <button class="btn active" id="grab-tool">🖐️</button>
        <button class="btn" id="slap-tool">👊</button>
        <button class="btn" id="sword-tool">🗡️</button>
        <button class="btn" id="car-tool">🚗</button>
        <button class="btn" id="slow-mo-btn">⏳</button>
        <button class="btn" id="add-sod-btn" style="background: #27ae60;">➕</button>
    </div>

    <script>
        const { Engine, Render, Runner, World, Bodies, Body, Constraint, MouseConstraint, Mouse, Composite, Vector, Events } = Matter;
        const engine = Engine.create();
        const world = engine.world;
        let currentTool = 'grab', sodInstances = [];

        const render = Render.create({ 
            element: document.body, engine: engine, 
            options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: '#080808' } 
        });

        // --- DAIMYAN STRENGTH SOD FACTORY ---
        function createSodInstance() {
            const id = Math.random().toString(36).substr(2, 5);
            const x = window.innerWidth / 2, y = 200;
            
            // Higher density (0.005 instead of default) makes him feel "heavy"
            const head = Bodies.circle(x, y, 22, { label: 'head', sodId: id, density: 0.008, render: { fillStyle: '#f1c40f' } });
            const torso = Bodies.rectangle(x, y + 45, 35, 60, { label: 'chest', sodId: id, density: 0.01, render: { fillStyle: '#e74c3c' } });
            
            // Stiffness at 0.6 makes him stand tall like he's actually tuff
            const neck = Constraint.create({ 
                bodyA: head, bodyB: torso, 
                pointA: {x:0, y:18}, pointB: {x:0, y:-30}, 
                stiffness: 0.6, length: 2, render: {visible: false} 
            });

            const body = Composite.create();
            Composite.add(body, [head, torso, neck]);
            World.add(world, body);
            sodInstances.push({ id, composite: body, aura: 800000, isDead: false, head });
        }

        // --- DAIMYAN-LEVEL PUNCH LOGIC ---
        function triggerAction(clientX, clientY) {
            const rect = render.canvas.getBoundingClientRect();
            const x = clientX - rect.left, y = clientY - rect.top;

            if (currentTool === 'slap') {
                sodInstances.forEach(inst => {
                    Composite.allBodies(inst.composite).forEach(b => {
                        const dist = Vector.magnitude(Vector.sub(b.position, {x, y}));
                        if (dist < 150) {
                            // High-impact impulse (0.9 force) - The Daimyan Punch
                            const forceDirection = Vector.normalise(Vector.sub(b.position, {x, y}));
                            Body.applyForce(b, b.position, Vector.mult(forceDirection, 1.2));
                            
                            // Only take damage if the punch is actually "tuff"
                            const impactDmg = (150 - dist) * 250;
                            if (impactDmg > 5000) damageSod(inst, impactDmg);
                        }
                    });
                });
            }
            if (currentTool === 'car') {
                const car = Bodies.rectangle(x, y, 120, 50, { density: 0.05, render: { fillStyle: '#34495e' } });
                World.add(world, car);
            }
        }

        function damageSod(inst, amt) {
            if (!inst || inst.isDead) return;
            inst.aura -= amt;
            if (inst.aura <= 0) {
                inst.isDead = true;
                // Collapse joints on death
                inst.composite.constraints.forEach(c => c.stiffness = 0.01);
            }
        }

        // --- UI & INPUT ---
        render.canvas.addEventListener('mousedown', (e) => triggerAction(e.clientX, e.clientY));
        document.getElementById('add-sod-btn').onclick = createSodInstance;
        document.getElementById('slow-mo-btn').onclick = () => engine.timing.timeScale = engine.timing.timeScale === 1 ? 0.2 : 1;
        
        ['grab', 'slap', 'sword', 'car'].forEach(t => {
            document.getElementById(t+'-tool').onclick = () => {
                currentTool = t;
                document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                document.getElementById(t+'-tool').classList.add('active');
            };
        });

        World.add(world, Bodies.rectangle(window.innerWidth/2, window.innerHeight+30, window.innerWidth*2, 60, { isStatic: true }));
        Render.run(render);
        Runner.run(Runner.create(), engine);
        createSodInstance();
    </script>
</body>
</html>
