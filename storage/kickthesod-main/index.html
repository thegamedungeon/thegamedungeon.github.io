<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kick the Sod: Gory Edition - The Game Dungeon</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
        canvas { display: block; }
        .ui-overlay { position: absolute; top: 100px; left: 20px; z-index: 10; pointer-events: none; }
        .controls { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; background: rgba(0,0,0,0.9); padding: 12px; border-radius: 20px; border: 2px solid #e74c3c; pointer-events: auto; box-shadow: 0 0 20px rgba(231, 76, 60, 0.4); }
        .btn { width: 45px; height: 45px; border-radius: 10px; border: none; background: #1a1a1a; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
        .btn:active { transform: scale(0.9); }
        .btn.active { background: #e74c3c; box-shadow: 0 0 10px #e74c3c; }
        #damage-popup { position: absolute; color: #e74c3c; font-weight: 900; text-transform: uppercase; pointer-events: none; font-size: 1.2rem; text-shadow: 2px 2px 0px #000; animation: floatUp 0.8s ease-out forwards; z-index: 100; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 1; } 50% { transform: translateY(-40px) scale(1.2); } 100% { transform: translateY(-100px) scale(1.3); opacity: 0; } }
        .stat-card { background: rgba(20, 20, 20, 0.8); padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #e74c3c; min-width: 200px; }
        .aura-bar-container { width: 100%; height: 12px; background: #111; border-radius: 6px; margin-top: 6px; overflow: hidden; border: 1px solid #333; }
        .aura-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00ff00, #2ecc71); transition: width 0.1s linear; }
    </style>
</head>
<body>
    <div class="controls">
        <button class="btn active" id="grab-tool">🖐️</button>
        <button class="btn" id="slap-tool">👊</button>
        <button class="btn" id="sword-tool">🗡️</button>
        <button class="btn" id="fork-tool">🍴</button>
        <button class="btn" id="tnt-tool">💣</button>
        <button class="btn" id="gravity-tool">🌀</button>
        <button class="btn" id="clear-tool">🧹</button>
        <button class="btn" id="add-sod-btn">➕</button>
        <button class="btn" id="reset-btn">🔄</button>
    </div>

    <div class="ui-overlay">
        <h1 class="text-red-600 text-2xl font-black italic tracking-tighter mb-2">KICK THE SODS</h1>
        <p class="text-gray-300 font-bold text-sm mb-2">Total Humiliations: <span id="total-score" class="text-white">0</span></p>
        <div id="sod-stats-container"></div>
    </div>

    <script>
        const { Engine, Render, Runner, World, Bodies, Body, Constraint, MouseConstraint, Mouse, Composite, Vector, Events } = Matter;

        // FIXED: High-speed collision detection to stop floor-clipping
        const engine = Engine.create({ positionIterations: 10, velocityIterations: 10 });
        const world = engine.world;
        const totalScoreEl = document.getElementById('total-score');
        const statsContainer = document.getElementById('sod-stats-container');
        
        let totalScore = 0;
        let currentTool = 'grab';
        let gravityState = 1;
        let bloodParticles = [];
        
        const PROTECTION_DURATION = 500; 
        const MERCY_TIMEOUT = 5000; 
        const MAX_AURA = 500000; 

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: '#0a0a0a' }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight + 25, window.innerWidth*2, 50, { isStatic: true, label: 'ground', render: { fillStyle: '#111' } });
        const wallLeft = Bodies.rectangle(-100, window.innerHeight/2, 50, window.innerHeight * 4, { isStatic: true });
        const wallRight = Bodies.rectangle(window.innerWidth + 100, window.innerHeight/2, 50, window.innerHeight * 4, { isStatic: true });
        World.add(world, [ground, wallLeft, wallRight]);

        let sodInstances = [];

        function createSodInstance() {
            if (sodInstances.length >= 3) return;
            const id = Math.random().toString(36).substr(2, 9);
            const x = Math.random() * (window.innerWidth - 200) + 100;
            const y = window.innerHeight / 2;
            const skinTone = '#f1c40f'; 
            const pantsColor = '#2c3e50';
            const shirtColor = '#e74c3c';

            const head = Bodies.circle(x, y - 110, 24, { friction: 0.1, restitution: 0.5, render: { fillStyle: skinTone }, label: 'head', sodId: id });
            const torso = Bodies.rectangle(x, y - 55, 40, 60, { friction: 0.1, render: { fillStyle: shirtColor }, label: 'chest', sodId: id });
            const ipad = Bodies.rectangle(x + 50, y - 40, 25, 35, { render: { fillStyle: '#000', strokeStyle: '#3498db', lineWidth: 2 }, label: 'ipad', sodId: id });

            const limbs = [
                Bodies.rectangle(x - 30, y - 65, 12, 30, { render: { fillStyle: skinTone }, label: 'limb', sodId: id }),
                Bodies.rectangle(x - 30, y - 35, 10, 30, { render: { fillStyle: skinTone }, label: 'limb', sodId: id }),
                Bodies.rectangle(x + 30, y - 65, 12, 30, { render: { fillStyle: skinTone }, label: 'limb', sodId: id }),
                Bodies.rectangle(x + 30, y - 35, 10, 30, { render: { fillStyle: skinTone }, label: 'limb', sodId: id }),
                Bodies.rectangle(x - 15, y - 10, 16, 35, { render: { fillStyle: pantsColor }, label: 'limb', sodId: id }),
                Bodies.rectangle(x - 15, y + 25, 14, 35, { render: { fillStyle: pantsColor }, label: 'limb', sodId: id }),
                Bodies.rectangle(x + 15, y - 10, 16, 35, { render: { fillStyle: pantsColor }, label: 'limb', sodId: id }),
                Bodies.rectangle(x + 15, y + 25, 14, 35, { render: { fillStyle: pantsColor }, label: 'limb', sodId: id })
            ];

            const allBodies = [head, torso, ipad, ...limbs];
            const joints = [
                Constraint.create({ bodyA: head, pointB: { x: 0, y: -30 }, bodyB: torso, stiffness: 0.15, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: torso, pointA: { x: -20, y: -25 }, bodyB: limbs[0], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: limbs[0], pointA: { x: 0, y: 15 }, bodyB: limbs[1], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: torso, pointA: { x: 20, y: -25 }, bodyB: limbs[2], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: limbs[2], pointA: { x: 0, y: 15 }, bodyB: limbs[3], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: torso, pointA: { x: -12, y: 30 }, bodyB: limbs[4], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: limbs[4], pointA: { x: 0, y: 15 }, bodyB: limbs[5], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: torso, pointA: { x: 12, y: 30 }, bodyB: limbs[6], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: limbs[6], pointA: { x: 0, y: 15 }, bodyB: limbs[7], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: limbs[3], pointA: { x: 0, y: 15 }, bodyB: ipad, stiffness: 0.03, length: 5, render: {visible: false} })
            ];

            const group = Composite.create();
            Composite.add(group, [...allBodies, ...joints]);
            World.add(world, group);

            const instance = {
                id: id, composite: group, aura: MAX_AURA, spawnTime: Date.now(), lastHitTime: Date.now(), isDead: false, ui: createSodUI(id)
            };
            sodInstances.push(instance);
        }

        function createSodUI(id) {
            const div = document.createElement('div');
            div.className = 'stat-card';
            div.id = `ui-${id}`;
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-[11px] text-white font-black uppercase">Immortal Sod</span>
                    <span id="status-${id}" class="text-[9px] text-green-400 font-bold">Acting Tuff</span>
                </div>
                <div class="aura-bar-container"><div id="aura-${id}" class="aura-fill"></div></div>
                <div id="hp-text-${id}" class="text-[10px] text-gray-400 font-mono mt-1">HP: 500k / 500k</div>
                <div id="mercy-${id}" style="display:none; color: #fff; font-size: 10px; margin-top: 4px;">Respawn: <span id="timer-${id}">5.0</span>s</div>
            `;
            statsContainer.appendChild(div);
            return div;
        }

        function damageSod(instance, amt) {
            if (instance.isDead) return;
            instance.aura = Math.max(0, instance.aura - amt);
            totalScore += Math.floor(amt / 100);
            totalScoreEl.innerText = totalScore;
            instance.lastHitTime = Date.now();

            const auraBar = document.getElementById(`aura-${instance.id}`);
            const hpText = document.getElementById(`hp-text-${instance.id}`);
            if (hpText) hpText.innerText = `HP: ${Math.floor(instance.aura).toLocaleString()} / 500,000`;

            if (auraBar) {
                const percent = (instance.aura / MAX_AURA) * 100;
                auraBar.style.width = percent + '%';
                if (percent < 25) auraBar.style.background = '#ff0000';
            }
            if (instance.aura <= 0) {
                instance.isDead = true;
                const status = document.getElementById(`status-${instance.id}`);
                if(status) { status.innerText = "FINALLY FOLDED"; status.style.color = "#ff0000"; }
            }
        }

        // FIXED: DAMAGE FROM EVERYTHING (Slamming, Swords, Forks)
        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                const bodies = [pair.bodyA, pair.bodyB];
                const sodPart = bodies.find(b => b.sodId);
                const otherBody = bodies.find(b => !b.sodId);

                if (sodPart && otherBody) {
                    const inst = sodInstances.find(s => s.id === sodPart.sodId);
                    if (inst && !inst.isDead) {
                        const relativeVelocity = Vector.magnitude(Vector.sub(pair.bodyA.velocity, pair.bodyB.velocity));
                        if (relativeVelocity > 3) {
                            let multiplier = 50; 
                            if (otherBody.label === 'sword-item') multiplier = 150;
                            if (otherBody.label === 'fork') multiplier = 500; // BUFFED FORK TEST
                            
                            damageSod(inst, Math.floor(relativeVelocity * multiplier));
                            spawnBlood(sodPart.position.x, sodPart.position.y, 4);
                            triggerShake(relativeVelocity / 2);
                        }
                    }
                }
            });
        });

        // Spawning logic
        function spawnPhysicalSword(x, y) {
            const sword = Bodies.rectangle(x, y, 40, 80, { label: 'sword-item', density: 0.1, render: { visible: false } });
            World.add(world, sword);
            showPopup(x, y, "🗡️ DROPPED");
        }

        function spawnFork(x, y) {
            const fork = Bodies.rectangle(x, y, 40, 10, { label: 'fork', render: { fillStyle: '#ccc' } });
            Body.setVelocity(fork, { x: (Math.random()-0.5)*40, y: -30 });
            World.add(world, fork);
            showPopup(x, y, "🍴 FORK TEST");
        }

        // Mouse/Touch Interaction
        function triggerAction(clientX, clientY) {
            const rect = render.canvas.getBoundingClientRect();
            const x = clientX - rect.left; const y = clientY - rect.top;
            if (currentTool === 'sword') spawnPhysicalSword(x, y);
            if (currentTool === 'fork') spawnFork(x, y);
            if (currentTool === 'slap') {
                sodInstances.forEach(inst => {
                    Composite.allBodies(inst.composite).forEach(body => {
                        const dist = Vector.magnitude(Vector.sub(body.position, {x, y}));
                        if (dist < 120) {
                            Body.applyForce(body, body.position, Vector.mult(Vector.normalise(Vector.sub(body.position, {x, y})), 0.5));
                            damageSod(inst, 2000);
                        }
                    });
                });
                showPopup(x, y, "WHACK");
            }
            if (currentTool === 'tnt') {
                Composite.allBodies(world).forEach(body => {
                    if (body.isStatic) return;
                    const dir = Vector.sub(body.position, {x, y});
                    const dist = Vector.magnitude(dir);
                    if (dist < 450) {
                        Body.applyForce(body, body.position, Vector.mult(Vector.normalise(dir), (450 - dist) * 0.045));
                        if (body.sodId) damageSod(sodInstances.find(s => s.id === body.sodId), 5000);
                    }
                });
                triggerShake(20);
                showPopup(x, y, "BOOM");
            }
        }

        render.canvas.addEventListener('mousedown', (e) => triggerAction(e.clientX, e.clientY));
        render.canvas.addEventListener('touchstart', (e) => {
            if (currentTool !== 'grab') e.preventDefault();
            const t = e.touches[0]; triggerAction(t.clientX, t.clientY);
        }, { passive: false });

        // Tool Switcher
        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tool + '-tool').classList.add('active');
            mouseConstraint.enabled = (tool === 'grab');
        }

        const tools = ['grab', 'slap', 'sword', 'fork', 'tnt'];
        tools.forEach(t => document.getElementById(t + '-tool').addEventListener('mousedown', () => setTool(t)));

        document.getElementById('gravity-tool').addEventListener('mousedown', () => { gravityState *= -1; world.gravity.y = gravityState; });
        document.getElementById('clear-tool').addEventListener('mousedown', () => {
            Composite.allBodies(world).forEach(b => { if (b.label === 'sword-item' || b.label === 'fork') World.remove(world, b); });
        });
        document.getElementById('add-sod-btn').addEventListener('mousedown', createSodInstance);
        document.getElementById('reset-btn').addEventListener('mousedown', () => location.reload());

        // Rendering Extras (Emojis & Blood)
        Events.on(render, 'afterRender', () => {
            const context = render.context;
            Composite.allBodies(world).forEach(body => {
                if (body.label === 'sword-item') {
                    context.save(); context.translate(body.position.x, body.position.y); context.rotate(body.angle + Math.PI/4);
                    context.font = '60px Arial'; context.fillText('🗡️', -30, 30); context.restore();
                }
                if (body.sodId && body.label === 'head') {
                    const inst = sodInstances.find(s => s.id === body.sodId);
                    context.font = '24px Arial';
                    context.fillText(inst.isDead ? '💀' : (inst.aura < 100000 ? '🥴' : '😤'), body.position.x - 12, body.position.y + 8);
                }
            });
            bloodParticles.forEach((p, i) => {
                context.fillStyle = `rgba(180, 0, 0, ${p.opacity})`; context.beginPath();
                context.arc(p.x, p.y, p.size, 0, Math.PI * 2); context.fill();
                p.opacity -= 0.02; if (p.opacity <= 0) bloodParticles.splice(i, 1);
            });
        });

        function spawnBlood(x, y, count) {
            for (let i = 0; i < count; i++) bloodParticles.push({ x: x + (Math.random()-0.5)*15, y: y + (Math.random()-0.5)*15, size: Math.random()*3+1, opacity: 1 });
        }

        function triggerShake(intensity) {
            let i = Math.min(intensity, 15);
            let c = 0; let interval = setInterval(() => {
                document.body.style.transform = `translate(${(Math.random()-0.5)*i}px, ${(Math.random()-0.5)*i}px)`;
                if (++c > 5) { clearInterval(interval); document.body.style.transform = ''; }
            }, 30);
        }

        function showPopup(x, y, text) {
            const p = document.createElement('div'); p.id = 'damage-popup'; p.style.left = x + 'px'; p.style.top = y + 'px';
            p.innerText = text; document.body.appendChild(p); setTimeout(() => p.remove(), 800);
        }

        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, { mouse: mouse, constraint: { stiffness: 0.15, render: { visible: false } } });
        World.add(world, mouseConstraint);

        createSodInstance();
    </script>
</body>
</html>
