<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kick the Sod: Gory Edition - The Game Dungeon</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
        }
        .ui-overlay {
            position: absolute;
            top: 100px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }
        .controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background: rgba(0,0,0,0.9);
            padding: 12px;
            border-radius: 20px;
            border: 2px solid #e74c3c;
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.4);
        }
        .btn {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            border: none;
            background: #1a1a1a;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.9); }
        .btn.active { background: #e74c3c; box-shadow: 0 0 10px #e74c3c; }
        
        #damage-popup {
            position: absolute;
            color: #e74c3c;
            font-weight: 900;
            text-transform: uppercase;
            pointer-events: none;
            font-size: 1.2rem;
            text-shadow: 2px 2px 0px #000;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            50% { transform: translateY(-40px) scale(1.2); }
            100% { transform: translateY(-100px) scale(1.3); opacity: 0; }
        }
        .stat-card {
            background: rgba(20, 20, 20, 0.8);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #e74c3c;
            min-width: 200px;
        }
        .aura-bar-container {
            width: 100%;
            height: 12px;
            background: #111;
            border-radius: 6px;
            margin-top: 6px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .aura-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #2ecc71);
            transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body>
    <div class="controls">
        <button class="btn active" id="grab-tool" title="Grab/Pick up">🖐️</button>
        <button class="btn" id="slap-tool" title="Slap">👊</button>
        <button class="btn" id="sword-tool" title="Spawn Sword">🗡️</button>
        <button class="btn" id="fork-tool" title="The Fork Test">🍴</button>
        <button class="btn" id="tnt-tool" title="TNT">💣</button>
        <button class="btn" id="gravity-tool" title="Gravity Shift">🌀</button>
        <button class="btn" id="clear-tool" title="Clean Scene">🧹</button>
        <button class="btn" id="add-sod-btn" title="Spawn Another Sod">➕</button>
        <button class="btn" id="reset-btn" title="Reset All">🔄</button>
    </div>

    <div class="ui-overlay">
        <h1 class="text-red-600 text-2xl font-black italic tracking-tighter mb-2">KICK THE SODS</h1>
        <p class="text-gray-300 font-bold text-sm mb-2">Total Humiliations: <span id="total-score" class="text-white">0</span></p>
        <div id="sod-stats-container"></div>
    </div>

    <script>
        const { Engine, Render, Runner, World, Bodies, Body, Constraint, MouseConstraint, Mouse, Composite, Vector, Events } = Matter;

        const engine = Engine.create();
        const world = engine.world;
        const totalScoreEl = document.getElementById('total-score');
        const statsContainer = document.getElementById('sod-stats-container');
        
        let totalScore = 0;
        let currentTool = 'grab';
        let gravityState = 1;
        let bloodParticles = [];
        
        const PROTECTION_DURATION = 1500; 
        const MERCY_TIMEOUT = 5000; 
        const MAX_AURA = 500000; // Sod is now a GOD-TIER TANK

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: '#0a0a0a'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight + 25, window.innerWidth*2, 50, { isStatic: true, label: 'ground', render: { fillStyle: '#111' } });
        const wallLeft = Bodies.rectangle(-100, window.innerHeight/2, 50, window.innerHeight * 4, { isStatic: true });
        const wallRight = Bodies.rectangle(window.innerWidth + 100, window.innerHeight/2, 50, window.innerHeight * 4, { isStatic: true });
        World.add(world, [ground, wallLeft, wallRight]);

        let sodInstances = [];

        function createSodInstance() {
            if (sodInstances.length >= 3) return;
            const id = Math.random().toString(36).substr(2, 9);
            const x = Math.random() * (window.innerWidth - 200) + 100;
            const y = window.innerHeight / 2;
            const skinTone = '#f1c40f'; 
            const pantsColor = '#2c3e50';
            const shirtColor = '#e74c3c';

            const head = Bodies.circle(x, y - 110, 24, { friction: 0.1, restitution: 0.5, render: { fillStyle: skinTone }, label: 'head', sodId: id });
            const torso = Bodies.rectangle(x, y - 55, 40, 60, { friction: 0.1, render: { fillStyle: shirtColor }, label: 'chest', sodId: id });
            const ipad = Bodies.rectangle(x + 50, y - 40, 25, 35, { render: { fillStyle: '#000', strokeStyle: '#3498db', lineWidth: 2 }, label: 'ipad', sodId: id });

            const limbs = [
                Bodies.rectangle(x - 30, y - 65, 12, 30, { render: { fillStyle: skinTone }, label: 'limb', sodId: id }),
                Bodies.rectangle(x - 30, y - 35, 10, 30, { render: { fillStyle: skinTone }, label: 'limb', sodId: id }),
                Bodies.rectangle(x + 30, y - 65, 12, 30, { render: { fillStyle: skinTone }, label: 'limb', sodId: id }),
                Bodies.rectangle(x + 30, y - 35, 10, 30, { render: { fillStyle: skinTone }, label: 'limb', sodId: id }),
                Bodies.rectangle(x - 15, y - 10, 16, 35, { render: { fillStyle: pantsColor }, label: 'limb', sodId: id }),
                Bodies.rectangle(x - 15, y + 25, 14, 35, { render: { fillStyle: pantsColor }, label: 'limb', sodId: id }),
                Bodies.rectangle(x + 15, y - 10, 16, 35, { render: { fillStyle: pantsColor }, label: 'limb', sodId: id }),
                Bodies.rectangle(x + 15, y + 25, 14, 35, { render: { fillStyle: pantsColor }, label: 'limb', sodId: id })
            ];

            const allBodies = [head, torso, ipad, ...limbs];
            const joints = [
                Constraint.create({ bodyA: head, pointB: { x: 0, y: -30 }, bodyB: torso, stiffness: 0.15, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: torso, pointA: { x: -20, y: -25 }, bodyB: limbs[0], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: limbs[0], pointA: { x: 0, y: 15 }, bodyB: limbs[1], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: torso, pointA: { x: 20, y: -25 }, bodyB: limbs[2], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: limbs[2], pointA: { x: 0, y: 15 }, bodyB: limbs[3], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: torso, pointA: { x: -12, y: 30 }, bodyB: limbs[4], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: limbs[4], pointA: { x: 0, y: 15 }, bodyB: limbs[5], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: torso, pointA: { x: 12, y: 30 }, bodyB: limbs[6], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: limbs[6], pointA: { x: 0, y: 15 }, bodyB: limbs[7], pointB: { x: 0, y: -15 }, stiffness: 0.08, length: 2, render: {visible: false} }),
                Constraint.create({ bodyA: limbs[3], pointA: { x: 0, y: 15 }, bodyB: ipad, stiffness: 0.03, length: 5, render: {visible: false} })
            ];

            const group = Composite.create();
            Composite.add(group, [...allBodies, ...joints]);
            World.add(world, group);

            const instance = {
                id: id,
                composite: group,
                aura: MAX_AURA,
                spawnTime: Date.now(),
                lastHitTime: Date.now(),
                isDead: false,
                ui: createSodUI(id)
            };
            sodInstances.push(instance);
        }

        function createSodUI(id) {
            const div = document.createElement('div');
            div.className = 'stat-card';
            div.id = `ui-${id}`;
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-[11px] text-white font-black uppercase tracking-widest">Immortal Sod</span>
                    <span id="status-${id}" class="text-[9px] text-green-400 font-bold uppercase">Acting Tuff</span>
                </div>
                <div class="aura-bar-container"><div id="aura-${id}" class="aura-fill"></div></div>
                <div id="hp-text-${id}" class="text-[10px] text-gray-400 font-mono mt-1">HP: 500,000 / 500,000</div>
                <div id="mercy-${id}" class="mercy-timer-text" style="display:none; color: #fff; font-size: 10px; margin-top: 4px;">Respawn in: <span id="timer-${id}">5.0</span>s</div>
            `;
            statsContainer.appendChild(div);
            return div;
        }

        function spawnPhysicalSword(x, y) {
            const sword = Bodies.rectangle(x, y, 40, 80, {
                label: 'sword-item',
                friction: 0.5,
                restitution: 0.3,
                density: 0.1,
                render: { visible: false }
            });
            World.add(world, sword);
            showPopup(x, y, "🗡️ SWORD DROPPED");
        }

        function damageSod(instance, amt) {
            if (instance.isDead) return;
            if (Date.now() - instance.spawnTime < PROTECTION_DURATION) return;
            
            // Hard cap on damage per hit to ensure he stays alive for many hits
            const cappedAmt = Math.min(amt, 2500); 
            
            instance.aura = Math.max(0, instance.aura - cappedAmt);
            totalScore += Math.floor(cappedAmt / 10); // Adjust score scaling
            totalScoreEl.innerText = Math.floor(totalScore);
            instance.lastHitTime = Date.now();

            const auraBar = document.getElementById(`aura-${instance.id}`);
            const hpText = document.getElementById(`hp-text-${instance.id}`);
            
            if (hpText) hpText.innerText = `HP: ${Math.floor(instance.aura).toLocaleString()} / 500,000`;

            if (auraBar) {
                const percent = (instance.aura / MAX_AURA) * 100;
                auraBar.style.width = percent + '%';
                if (percent < 25) auraBar.style.background = 'linear-gradient(90deg, #ff0000, #c0392b)';
                else if (percent < 50) auraBar.style.background = 'linear-gradient(90deg, #f1c40f, #f39c12)';
            }
            if (instance.aura <= 0) {
                instance.isDead = true;
                const status = document.getElementById(`status-${instance.id}`);
                if(status) {
                    status.innerText = "FINALLY FOLDED";
                    status.classList.replace('text-green-400', 'text-red-500');
                }
            }
        }

        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                const bodies = [pair.bodyA, pair.bodyB];
                const sword = bodies.find(b => b.label === 'sword-item');
                const sodPart = bodies.find(b => b.sodId);
                
                if (sword && sodPart) {
                    const inst = sodInstances.find(s => s.id === sodPart.sodId);
                    if (inst && !inst.isDead) {
                        const vel = Vector.magnitude(sword.velocity);
                        if (vel > 2) {
                            // Damage scales with velocity but is capped
                            damageSod(inst, Math.floor(vel * 80)); 
                            spawnBlood(sodPart.position.x, sodPart.position.y, 4);
                            triggerShake(vel / 1.2);
                        }
                    }
                }
            });
        });

        Events.on(render, 'afterRender', () => {
            const context = render.context;
            const now = Date.now();

            Composite.allBodies(world).forEach(body => {
                if (body.label === 'sword-item') {
                    context.save();
                    context.translate(body.position.x, body.position.y);
                    context.rotate(body.angle + Math.PI/4);
                    context.font = '60px Arial';
                    context.textAlign = 'center';
                    context.textBaseline = 'middle';
                    context.fillText('🗡️', 0, 0);
                    context.restore();
                }
            });

            sodInstances.forEach(inst => {
                if (inst.isDead) {
                    const elapsed = now - inst.lastHitTime;
                    const remaining = Math.max(0, (MERCY_TIMEOUT - elapsed) / 1000);
                    
                    const mercyDiv = document.getElementById(`mercy-${inst.id}`);
                    const timerSpan = document.getElementById(`timer-${inst.id}`);
                    if (mercyDiv) mercyDiv.style.display = "block";
                    if (timerSpan) timerSpan.innerText = remaining.toFixed(1);

                    if (elapsed > MERCY_TIMEOUT) {
                        World.remove(world, inst.composite);
                        inst.ui.remove();
                        sodInstances = sodInstances.filter(s => s.id !== inst.id);
                        createSodInstance();
                        return;
                    }
                }

                Composite.allBodies(inst.composite).forEach(body => {
                    if (body.label === 'head') {
                        context.font = '24px Arial';
                        let emoji = inst.isDead ? '💀' : (inst.aura < 100000 ? '🥴' : '😤');
                        context.fillText(emoji, body.position.x - 12, body.position.y + 8);
                    }
                });
            });

            bloodParticles.forEach((p, i) => {
                context.beginPath();
                context.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                context.fillStyle = `rgba(180, 0, 0, ${p.opacity})`;
                context.fill();
                p.opacity -= 0.01;
                if (p.opacity <= 0) bloodParticles.splice(i, 1);
            });
        });

        function spawnBlood(x, y, count = 5) {
            for (let i = 0; i < count; i++) {
                bloodParticles.push({
                    x: x + (Math.random() - 0.5) * 10,
                    y: y + (Math.random() - 0.5) * 10,
                    size: Math.random() * 3 + 1,
                    opacity: 1
                });
            }
        }

        function triggerShake(intensity = 5) {
            intensity = Math.min(intensity, 15);
            let count = 0;
            const interval = setInterval(() => {
                document.body.style.transform = `translate(${(Math.random()-0.5)*intensity}px, ${(Math.random()-0.5)*intensity}px)`;
                if (++count > 5) { clearInterval(interval); document.body.style.transform = ''; }
            }, 30);
        }

        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, { 
            mouse: mouse, 
            constraint: { stiffness: 0.15, render: { visible: false } } 
        });
        World.add(world, mouseConstraint);

        const tools = ['grab', 'slap', 'sword', 'fork', 'tnt'];
        tools.forEach(t => {
            const btn = document.getElementById(t + '-tool');
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); setTool(t); });
            btn.addEventListener('mousedown', () => setTool(t));
        });

        document.getElementById('gravity-tool').addEventListener('mousedown', () => toggleGravity());
        document.getElementById('gravity-tool').addEventListener('touchstart', (e) => { e.preventDefault(); toggleGravity(); });
        
        document.getElementById('clear-tool').addEventListener('mousedown', () => clearItems());
        document.getElementById('clear-tool').addEventListener('touchstart', (e) => { e.preventDefault(); clearItems(); });

        document.getElementById('add-sod-btn').addEventListener('mousedown', createSodInstance);
        document.getElementById('reset-btn').addEventListener('mousedown', () => location.reload());

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tool + '-tool').classList.add('active');
            mouseConstraint.enabled = (tool === 'grab');
        }

        function toggleGravity() {
            gravityState *= -1;
            engine.world.gravity.y = (gravityState === 1 ? 1 : -1);
        }

        function clearItems() {
            Composite.allBodies(world).forEach(b => {
                if (b.label === 'sword-item' || b.label === 'fork') World.remove(world, b);
            });
        }

        function triggerAction(clientX, clientY) {
            if (currentTool === 'grab') return;
            const rect = render.canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            
            if (currentTool === 'sword') {
                spawnPhysicalSword(x, y);
            } else if (currentTool === 'slap') {
                sodInstances.forEach(inst => {
                    Composite.allBodies(inst.composite).forEach(body => {
                        const dist = Vector.magnitude(Vector.sub(body.position, {x, y}));
                        if (dist < 120) {
                            Body.applyForce(body, body.position, Vector.mult(Vector.normalise(Vector.sub(body.position, {x, y})), 0.6));
                            damageSod(inst, 500); // Slaps feel meaningful but won't kill quick
                        }
                    });
                });
                showPopup(x, y, "WHACK");
            } else if (currentTool === 'tnt') {
                Composite.allBodies(world).forEach(body => {
                    if (body.isStatic) return;
                    const dir = Vector.sub(body.position, {x, y});
                    const dist = Vector.magnitude(dir);
                    if (dist < 450) {
                        Body.applyForce(body, body.position, Vector.mult(Vector.normalise(dir), (450 - dist) * 0.045));
                        if (body.sodId) damageSod(sodInstances.find(s => s.id === body.sodId), 1500);
                    }
                });
                triggerShake(25);
                showPopup(x, y, "BOOM");
            } else if (currentTool === 'fork') {
                const fork = Bodies.rectangle(x, y, 40, 5, { label: 'fork', render: { fillStyle: '#ccc' } });
                Body.setVelocity(fork, { x: (Math.random()-0.5)*35, y: -25 });
                World.add(world, fork);
            }
        }

        render.canvas.addEventListener('mousedown', (e) => triggerAction(e.clientX, e.clientY));
        render.canvas.addEventListener('touchstart', (e) => {
            if (currentTool !== 'grab') e.preventDefault();
            const touch = e.touches[0];
            triggerAction(touch.clientX, touch.clientY);
        }, { passive: false });

        function showPopup(x, y, text) {
            const p = document.createElement('div');
            p.id = 'damage-popup';
            p.style.left = x + 'px'; p.style.top = y + 'px';
            p.innerText = text;
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }

        createSodInstance();
    </script>
</body>
</html>
