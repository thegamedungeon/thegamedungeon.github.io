<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unfair Mario - The Game Dungeon</title>

    <!-- Ruffle Engine -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        ruffle-player {
            width: 100%;
            height: 100%;
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #333;
            border-top: 6px solid #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Touch Buttons */
        .touch-btn {
            position: absolute;
            bottom: 20px;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 20;
            user-select: none;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 24px;
        }

        #jumpBtn { right: 30px; bottom: 120px; background: rgba(0,255,0,0.25); }
        #leftBtn { left: 30px; bottom: 70px; }
        #rightBtn { left: 130px; bottom: 70px; }
    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <h2 style="color:#00ff00;">LOADING "MARIO"...</h2>
        <p style="color:#666;">Bypassing Bot-Brained Security...</p>
    </div>

    <!-- Game -->
    <div id="game-container">
        <div id="player" style="width:100%; height:100%;"></div>
    </div>

    <!-- Touch Controls -->
    <div id="jumpBtn" class="touch-btn">JUMP</div>
    <div id="leftBtn" class="touch-btn">←</div>
    <div id="rightBtn" class="touch-btn">→</div>

    <!-- Load CSS -->
    <link rel="stylesheet" href="/storage/unfair-mario-browser-port-main/assets/css/c.css">

    <!-- Ruffle Loader -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("player").appendChild(player);

            player.load("https://thegamedungeon.github.io/storage/unfair-mario-browser-port-main/assets/unfair-mario.swf")
                .then(() => {
                    console.log("Flash game loaded successfully!");

                    setTimeout(() => {
                        const loader = document.getElementById("loader");
                        loader.style.opacity = "0";
                        setTimeout(() => loader.remove(), 500);
                    }, 1500);
                })
                .catch((e) => {
                    document.querySelector("h2").innerText = "FAILED TO LOAD SWF";
                    document.querySelector("h2").style.color = "red";
                    console.error("Ruffle failed:", e);
                });
        });
    </script>

    <!-- FIXED BUTTON SCRIPT -->
    <script>
        function sendKey(key, type) {
            const keyCodes = {
                ArrowLeft: 37,
                ArrowUp: 38,
                ArrowRight: 39
            };

            const event = new KeyboardEvent(type, {
                key: key,
                code: key,
                keyCode: keyCodes[key],
                which: keyCodes[key],
                bubbles: true,
                cancelable: true
            });

            document.dispatchEvent(event);

            const canvas = document.querySelector("canvas");
            if (canvas) canvas.dispatchEvent(event);
        }

        function bindButton(id, key) {
            const btn = document.getElementById(id);
            btn.addEventListener("touchstart", e => {
                e.preventDefault();
                sendKey(key, "keydown");
            });
            btn.addEventListener("touchend", e => {
                e.preventDefault();
                sendKey(key, "keyup");
            });
        }

        bindButton("jumpBtn", "ArrowUp");
        bindButton("leftBtn", "ArrowLeft");
        bindButton("rightBtn", "ArrowRight");
    </script>

</body>
</html>
