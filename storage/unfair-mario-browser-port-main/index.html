<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unfair Mario - The Game Dungeon</title>
    <!-- Ruffle Engine Script -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Make the Ruffle player fill the screen */
        ruffle-player {
            width: 100%;
            height: 100%;
        }

        /* The Loading Overlay */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #333;
            border-top: 6px solid #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

              .touch-btn {
    position: absolute;
    bottom: 20px;
    width: 80px;
    height: 80px;
    background: rgba(255, 255, 255, 0.2); /* Light transparent white */
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    z-index: 10;
    user-select: none;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: sans-serif;
    font-weight: bold;
}

/* Right Side: Gas and Boost */
#gasBtn { right: 30px; bottom: 120px; background: rgba(0, 255, 0, 0.2); }

/* Left Side: Tilt */
#tiltLeftBtn { left: 30px; bottom: 70px; }
#tiltRightBtn { left: 130px; bottom: 70px; }

        h2 { margin-top: 20px; letter-spacing: 2px; color: #00ff00; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <h2>LOADING "MARIO"...</h2>
        <p style="color: #666;">Bypassing Bot-Brained Security...</p>
    </div>

    <div id="game-container">
        <div id="player" style="width: 100%; height: 100%;"></div>
    </div>

<div id="gasBtn" class="touch-btn">JUMP</div>
<div id="tiltLeftBtn" class="touch-btn">←</div>
<div id="tiltRightBtn" class="touch-btn">→</div>

    <script src="/storage/unfair-mario-browser-port-main/assets/js/c.js"></script>
    <link rel="stylesheet" href="/storage/unfair-mario-browser-port-main/assets/css/c.css">
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player");
            container.appendChild(player);

            // Using your direct GitHub Pages URL for the SWF
            player.load("https://thegamedungeon.github.io/storage/unfair-mario-browser-port-main/assets/unfair-mario.swf").then(() => {
                console.log("Flash game loaded successfully!");
                
                // Keep the loader up for a bit to ensure the canvas is ready
                setTimeout(() => {
                    const loader = document.getElementById('loader');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }, 1500);
            }).catch((e) => {
                document.querySelector('h2').innerText = "FAILED TO LOAD SWF";
                document.querySelector('h2').style.color = "red";
                console.error("Ruffle failed:", e);
            });
        });
    </script>
    <script>
  function simulateKey(code, type) {
    const event = new KeyboardEvent(type, {
      key: code,
      keyCode: code === 'ArrowUp' ? 38 : code === 'ArrowLeft' ? 37 : code === 'ArrowRight' ? 39 : 88, // 88 is 'X' for boost
      which: code === 'ArrowUp' ? 38 : 0,
      bubbles: true
    });
    document.dispatchEvent(event);
    // Also try dispatching to the canvas specifically
    const canvas = document.querySelector('canvas');
    if (canvas) canvas.dispatchEvent(event);
  }

  const setupBtn = (id, key) => {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); simulateKey(key, 'keydown'); });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); simulateKey(key, 'keyup'); });
  };

  // Map your buttons to keys (ETD2 usually uses Arrows and X or Ctrl)
  setupBtn('jumpBtn', 'ArrowUp');
  setupBtn('tiltLeftBtn', 'ArrowLeft');
  setupBtn('tiltRightBtn', 'ArrowRight');
</script>
</body>
</html>
