<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unfair Mario - The Game Dungeon</title>
    <!-- Ruffle Engine Script -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Make the Ruffle player fill the screen */
        ruffle-player {
            width: 100%;
            height: 100%;
        }

        /* The Loading Overlay */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #333;
            border-top: 6px solid #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 { margin-top: 20px; letter-spacing: 2px; color: #00ff00; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <h2>LOADING "MARIO"...</h2>
        <p style="color: #666;">Bypassing Bot-Brained Security...</p>
    </div>

    <div id="game-container">
        <div id="player" style="width: 100%; height: 100%;"></div>
    </div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="jumpBtn">JUMP</button>

    <script src="/storage/unfair-mario-browser-port-main/assets/js/c.js"></script>
    <script src="/storage/unfair-mario-browser-port-main/assets/css/c.css"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player");
            container.appendChild(player);

            // Using your direct GitHub Pages URL for the SWF
            player.load("https://thegamedungeon.github.io/storage/unfair-mario-browser-port-main/assets/unfair-mario.swf").then(() => {
                console.log("Flash game loaded successfully!");
                
                // Keep the loader up for a bit to ensure the canvas is ready
                setTimeout(() => {
                    const loader = document.getElementById('loader');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }, 1500);
            }).catch((e) => {
                document.querySelector('h2').innerText = "FAILED TO LOAD SWF";
                document.querySelector('h2').style.color = "red";
                console.error("Ruffle failed:", e);
            });
        });
    </script>
</body>
</html>
