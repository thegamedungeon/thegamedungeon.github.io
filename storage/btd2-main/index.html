<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BTD2 - The Game Dungeon</title>
    <!-- Ruffle Engine Script -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Loading Overlay */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #333;
            border-top: 6px solid #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 { margin-top: 20px; letter-spacing: 2px; color: #00ff00; }

        /* Control Bar for iPad */
        #controls {
            position: fixed;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: none;
        }

        .touch-btn {
            pointer-events: auto;
            background: rgba(0, 255, 0, 0.3);
            border: 2px solid #00ff00;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
            user-select: none;
            -webkit-user-select: none;
        }

        .touch-btn:active {
            background: rgba(0, 255, 0, 0.6);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <h2>LOADING BTD2...</h2>
        <p style="color: #666;">Bypassing Bot-Brained Security...</p>
    </div>

    <div id="game-container">
        <div id="player"></div>
    </div>

    <div id="controls">
        <button class="touch-btn" id="start-btn">NEXT ROUND / START (SPACE)</button>
    </div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("player");
            container.appendChild(player);

            // REPLACE THIS URL with the actual path to your BTD2.swf in your repo
            player.load("/storage/btd2-main/assets/bloons-td-2.swf").then(() => {
                console.log("Flash game loaded successfully!");
                
                // Give it a 1.5 second buffer to actually initialize before hiding loader
                setTimeout(() => {
                    const loader = document.getElementById('loader');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }, 1500);
            }).catch((e) => {
                document.querySelector('h2').innerText = "FAILED TO LOAD SWF";
                document.querySelector('h2').style.color = "red";
                console.error("Ruffle failed:", e);
            });

            // iPad Input Hack: Map the button to the Spacebar
            const startBtn = document.getElementById('start-btn');
            startBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const spaceEvent = new KeyboardEvent('keydown', {
                    key: ' ',
                    code: 'Space',
                    keyCode: 32,
                    which: 32,
                    bubbles: true
                });
                window.dispatchEvent(spaceEvent);
            });
        });
    </script>
</body>
</html>
