<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CRIB | HPMS HIGH COUNCIL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root {
            --green-belt: #00ff00;
            --bg-black: #050505;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-black);
            color: white;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        /* View Switching Logic */
        .page-view {
            display: none;
            width: 100%;
            height: 100vh;
            padding-top: 80px;
            overflow-y: auto;
            position: absolute;
            top: 0; left: 0;
            background: var(--bg-black);
        }
        .active-view { 
            display: block !important; 
            z-index: 50; 
            animation: appFade 0.3s ease-in-out; 
        }

        @keyframes appFade {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header UI */
        .nav-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; position: fixed; top: 0; width: 100%; height: 70px;
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px);
            z-index: 9000; border-bottom: 1px solid rgba(0, 255, 0, 0.1);
        }
        
        .crib-logo {
            text-shadow: 0 0 15px var(--green-belt);
            color: var(--green-belt);
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1.5px;
        }

        /* The Only Button That Matters */
        .vault-btn {
            background: rgba(0, 255, 0, 0.03);
            border: 2px solid var(--green-belt);
            color: var(--green-belt);
            padding: 22px 0;
            border-radius: 28px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 5px;
            width: 100%;
            font-size: 1.2rem;
        }

        .vault-btn:hover {
            background: var(--green-belt);
            color: black;
            box-shadow: 0 0 40px var(--green-belt);
            transform: scale(1.03);
        }

        /* Card System */
        .game-card {
            background: #0f0f0f;
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 35px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .game-card:hover {
            border-color: var(--green-belt);
            background: #151515;
            transform: translateY(-5px);
        }

        /* Inputs */
        .crib-input {
            width: 100%; padding: 18px; background: #0a0a0a;
            border: 1px solid #1a1a1a; border-radius: 20px; color: white; font-weight: bold;
        }
        .crib-input:focus { border-color: var(--green-belt); outline: none; }

        /* Loader */
        #loading-screen {
            position: fixed; inset: 0; display: none;
            align-items: center; justify-content: center;
            background: #000; z-index: 10000;
        }
    </style>
</head>
<body>

    <!-- Game Launch Loader -->
    <div id="loading-screen">
        <div class="text-center">
            <div class="w-16 h-16 border-4 border-green-500 border-t-transparent rounded-full animate-spin mb-4 mx-auto"></div>
            <div class="text-green-500 font-black tracking-widest text-xs uppercase">Blicking Ads...</div>
        </div>
    </div>

    <!-- Main Navigation -->
    <div class="nav-header">
        <div class="crib-logo text-2xl cursor-pointer" onclick="showView('home')">THE CRIB</div>
        <div id="auth-status">
            <button class="text-[10px] font-black uppercase tracking-widest border border-green-500/40 px-4 py-2 rounded-lg text-green-500 hover:bg-green-500 hover:text-black transition-all" onclick="showView('login')">🔑 LOGIN</button>
        </div>
    </div>

    <!-- VIEW: HOME (AUTHENTIC & CLEAN) -->
    <section id="view-home" class="page-view active-view">
        <div class="flex flex-col items-center justify-center min-h-[85vh] text-center px-6">
            <div class="mb-4">
                <span class="text-green-500 text-[10px] font-black px-4 py-1 rounded-full border border-green-500/20 uppercase">Dungeon v4.0.1</span>
            </div>
            <h1 class="text-8xl sm:text-9xl font-black crib-logo mb-2 tracking-tighter">THE CRIB</h1>
            <p class="text-gray-600 uppercase tracking-[0.5em] text-[10px] mb-12 font-bold italic">High Council HQ | Secure Proxy</p>
            
            <div class="w-72">
                <!-- ZERO OTHER BUTTONS EXIST HERE -->
                <button class="vault-btn" onclick="showView('vault')">🎮 OPEN VAULT</button>
            </div>

            <div class="mt-20 opacity-20">
                <p class="text-[9px] text-fuchsia-800 font-black uppercase italic tracking-widest">Roster Purged. Treason Avoided. Whistle Subsided.</p>
            </div>
        </div>
    </section>

    <!-- VIEW: VAULT (THE DUNGEON) -->
    <section id="view-vault" class="page-view">
        <div class="max-w-6xl mx-auto px-6 pb-32">
            <div class="text-center mb-12">
                <h2 class="text-5xl font-black crib-logo mb-2 uppercase italic">The Vault</h2>
                <p class="text-gray-500 text-[10px] uppercase tracking-widest font-bold">Encrypted Session Persistence Active</p>
            </div>
            <div class="max-w-md mx-auto mb-10">
                <input type="text" id="vaultSearch" onkeyup="filterVault()" class="crib-input text-center" placeholder="FILTER DUNGEON...">
            </div>
            <div id="vaultGrid" class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <!-- Data injection -->
            </div>
        </div>
    </section>

    <!-- VIEW: LOGIN -->
    <section id="view-login" class="page-view">
        <div class="flex items-center justify-center min-h-[80vh] px-6">
            <div class="w-full max-w-sm bg-[#0a0a0a] p-10 rounded-[2.5rem] border border-white/5 text-center shadow-2xl">
                <h2 class="text-3xl font-black crib-logo mb-8 uppercase italic">Council Gate</h2>
                <div class="space-y-4">
                    <input type="email" id="email-in" class="crib-input" placeholder="User ID">
                    <input type="password" id="pass-in" class="crib-input" placeholder="Secret Key">
                    <button class="vault-btn !py-4 !text-lg !rounded-2xl" onclick="handleLogin()">AUTHENTICATE</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Iframe Game Layer -->
    <div id="game-layer" style="display:none; position:fixed; inset:0; background:black; z-index:20000;">
        <button onclick="exitGame()" class="fixed top-6 left-6 z-[20001] bg-black/80 text-white w-12 h-12 rounded-full border border-white/10 font-bold hover:bg-green-500 hover:text-black transition-all">✕</button>
        <iframe id="game-frame" src="about:blank" class="w-full h-full border-none" allowfullscreen></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const games = [
            { name: 'Ragdoll Hit', logo: '/storage/photos/rh.png', path: 'rh.html' },
            { name: 'Cookie Clicker', logo: '/storage/photos/cc.png', path: 'cc.html' },
            { name: 'Geometry Dash', logo: '/storage/photos/gd.png', path: 'gd.html' },
            { name: 'Polytrack', logo: '/storage/photos/polytrack.png', path: 'poly.html' },
            { name: 'Minecraft', logo: '/storage/photos/minecraft.png', path: 'mc.html' },
            { name: 'Proxycrib', logo: '/storage/photos/proxicrib.png', path: 'proxy.html' },
            { name: 'Kick The Sod', logo: '/storage/photos/kts.png', path: 'kts.html' }
        ];

        window.showView = (id) => {
            document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active-view'));
            const target = document.getElementById('view-' + id);
            if(target) target.classList.add('active-view');
        };

        window.enterDungeon = (path) => {
            const loader = document.getElementById('loading-screen');
            loader.style.display = 'flex';
            setTimeout(() => {
                document.getElementById('game-frame').src = path;
                document.getElementById('game-layer').style.display = 'block';
                loader.style.display = 'none';
            }, 1200);
        };

        window.exitGame = () => {
            document.getElementById('game-layer').style.display = 'none';
            document.getElementById('game-frame').src = 'about:blank';
        };

        const grid = document.getElementById('vaultGrid');
        games.forEach(g => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => enterDungeon(g.path);
            card.innerHTML = `
                <img src="${g.logo}" onerror="this.src='https://placehold.co/100/000/0f0?text=HQ'" class="w-[90px] h-[90px] object-cover rounded-3xl mx-auto mb-4">
                <h3 class="font-black text-xs uppercase tracking-tight">${g.name}</h3>
                <div id="stat-${g.name.replace(/\s+/g, '')}" class="text-green-500 text-[9px] font-bold mt-2 opacity-50">UNLOCKED</div>
            `;
            grid.appendChild(card);
        });

        onAuthStateChanged(auth, (user) => {
            const slot = document.getElementById('auth-status');
            if (user) {
                slot.innerHTML = `<span class="text-[10px] font-black text-green-500 uppercase tracking-widest">👤 ${user.email.split('@')[0]}</span>`;
                onSnapshot(doc(db, "playtime", user.uid), (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        games.forEach(g => {
                            const min = data[g.name] || 0;
                            const el = document.getElementById(`stat-${g.name.replace(/\s+/g, '')}`);
                            if (el && min > 0) el.innerText = min >= 60 ? `${(min/60).toFixed(1)}h Played` : `${Math.floor(min)}m Played`;
                        });
                    }
                });
            }
        });

        window.handleLogin = () => {
            const email = document.getElementById('email-in').value;
            const pass = document.getElementById('pass-in').value;
            signInWithEmailAndPassword(auth, email, pass).then(() => showView('home')).catch(err => alert("LACK OF CLEARANCE: " + err.message));
        };

        window.filterVault = () => {
            const val = document.getElementById('vaultSearch').value.toLowerCase();
            document.querySelectorAll('.game-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(val) ? 'block' : 'none';
            });
        };
    </script>
</body>
    </html>
