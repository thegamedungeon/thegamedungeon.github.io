<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CribMan AI Chat - The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dungeon: {
                            900: '#0b0f19',
                            800: '#111827',
                            700: '#1f2937',
                            600: '#374151',
                            accent: '#8b5cf6',
                            cyan: '#06b6d4',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
        .glow-pulse { animation: pulse-glow 2s infinite alternate; }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px rgba(139, 92, 246, 0.4); }
            100% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.8); }
        }
    </style>
</head>
<body class="bg-dungeon-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col overflow-hidden">

    <header class="bg-dungeon-800 border-b border-dungeon-700 h-16 flex items-center justify-between px-4 z-40 relative shrink-0">
        <div class="flex items-center space-x-3">
            <button id="sidebar-toggle-btn" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-dungeon-700 transition">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🤖</span>
                <h1 class="font-display font-bold text-xl bg-gradient-to-r from-dungeon-cyan to-dungeon-accent bg-clip-text text-transparent">CribMan</h1>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button id="settings-btn" class="p-2 text-slate-400 hover:text-white hover:bg-dungeon-700 rounded-lg transition">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
            <div id="account-container" class="flex items-center space-x-2 bg-dungeon-700 p-1.5 pr-3 rounded-full border border-dungeon-600 cursor-pointer">
                <div id="avatar-element" class="w-7 h-7 rounded-full bg-dungeon-accent flex items-center justify-center text-white font-bold text-xs">👤</div>
                <span id="account-username" class="text-xs font-medium max-w-[100px] truncate">Guest Bro</span>
            </div>
        </div>
    </header>

    <div class="flex flex-1 relative overflow-hidden">
        <aside id="chat-sidebar" class="fixed inset-y-16 left-0 w-80 bg-dungeon-800 border-r border-dungeon-700 z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col overflow-hidden">
            <div class="p-4 border-b border-dungeon-700 flex justify-between items-center bg-dungeon-800/80">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Active Chats</span>
                <button id="new-chat-btn" class="text-xs bg-dungeon-cyan/20 text-dungeon-cyan px-2.5 py-1.5 rounded-lg border border-dungeon-cyan/30">Fresh Chat</button>
            </div>
            <div id="chats-scroller" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
            <div class="p-3 bg-dungeon-900 border-t border-dungeon-700">
                <button id="memory-bank-btn" class="w-full text-xs bg-dungeon-700 hover:bg-dungeon-600 text-slate-200 py-2.5 rounded-lg border border-dungeon-600">Open Memory Bank</button>
            </div>
        </aside>

        <main id="chat-workspace" class="flex-1 flex flex-col bg-dungeon-900 md:pl-80 transition-all duration-300 h-full overflow-hidden">
            <div id="chat-messages-container" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center p-6 space-y-6">
                    <div class="w-20 h-20 bg-gradient-to-br from-dungeon-cyan to-dungeon-accent rounded-2xl flex items-center justify-center text-4xl glow-pulse">🤖</div>
                    <h2 class="font-bold text-3xl">Let's get cooking!</h2>
                </div>
                <div id="active-chat-viewport" class="hidden space-y-4 max-w-4xl mx-auto pb-10">
                    <div id="messages-list-wrapper" class="space-y-4"></div>
                    <div id="ai-skeleton-loader" class="hidden flex items-start space-x-3 bg-dungeon-800/40 p-4 rounded-xl border border-dungeon-700 animate-pulse">
                        <div class="w-8 h-8 rounded-full bg-dungeon-cyan/30"></div>
                        <div class="h-4 bg-slate-700 rounded w-1/2"></div>
                    </div>
                </div>
            </div>

            <footer class="bg-dungeon-800 border-t border-dungeon-700 p-4 shrink-0">
                <form id="chat-query-form" class="max-w-4xl mx-auto flex items-center space-x-2">
                    <input type="text" id="chat-input-field" placeholder="Draft a prompt..." class="flex-1 bg-dungeon-900 border border-dungeon-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-dungeon-cyan" autocomplete="off" disabled>
                    <button type="submit" id="submit-prompt-btn" class="bg-gradient-to-r from-dungeon-cyan to-dungeon-accent text-white rounded-xl px-5 py-3 font-bold" disabled>Send</button>
                </form>
                <div class="max-w-4xl mx-auto mt-2 text-[10px] text-slate-500 px-1" id="connection-status-lbl">Initializing...</div>
            </footer>
        </main>
    </div>

    <div id="memory-bank-modal" class="fixed inset-0 bg-black/75 z-50 flex items-center justify-center hidden">
        <div class="bg-dungeon-800 rounded-2xl w-full max-w-lg p-6 border border-dungeon-700">
            <h4 class="font-bold mb-4">Memory Bank Context</h4>
            <textarea id="memory-bank-json-textarea" rows="10" class="w-full bg-dungeon-900 border border-dungeon-700 rounded-xl p-3 text-xs font-mono"></textarea>
            <div class="flex justify-end mt-4 space-x-2">
                <button class="modal-close-trigger px-4 py-2 text-slate-400">Discard</button>
                <button id="save-memory-bank-btn" class="bg-dungeon-accent px-4 py-2 rounded-lg text-white">Save</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-black/75 z-50 flex items-center justify-center hidden">
        <div class="bg-dungeon-800 rounded-2xl w-full max-w-sm p-6 border border-dungeon-700">
            <h4 class="font-bold mb-4">API Settings</h4>
            <input type="password" id="custom-api-key-input" placeholder="Paste AI Studio Key..." class="w-full bg-dungeon-900 border border-dungeon-700 rounded-xl px-3 py-2 text-sm mb-4">
            <div class="flex justify-end space-x-2">
                <button class="modal-close-trigger text-slate-400">Cancel</button>
                <button id="save-settings-btn" class="bg-dungeon-cyan px-4 py-2 rounded-lg text-white">Save</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // IMPORTANT: NEVER hardcode real API keys in production code. 
        // Use a secure environment variable or restricted backend service.
        const firebaseConfig = {
            apiKey: "YOUR_REDACTED_API_KEY",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        const appState = {
            currentUser: { uid: null, name: "Guest Bro" },
            memoryBank: { user: "null", context: "Connor is zesty.", insideJokes: { "oink oink": "Bot-brained" } }
        };

        // Sidebar Logic
        const sidebar = document.getElementById('chat-sidebar');
        const workspace = document.getElementById('chat-workspace');
        
        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            if (window.innerWidth >= 768) {
                workspace.classList.toggle('md:pl-80');
            }
        }

        document.getElementById('sidebar-toggle-btn').addEventListener('click', toggleSidebar);
        
        onAuthStateChanged(auth, async (user) => {
            try {
                if (user) {
                    appState.currentUser.uid = user.uid;
                    document.getElementById('connection-status-lbl').textContent = "Cloud Sync Online";
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth init failure, continuing in sandbox mode.");
                document.getElementById('connection-status-lbl').textContent = "Offline Mode (Sandbox)";
            } finally {
                document.getElementById('chat-input-field').disabled = false;
                document.getElementById('submit-prompt-btn').disabled = false;
            }
        });

        // UI Handlers
        document.getElementById('settings-btn').addEventListener('click', () => document.getElementById('settings-modal').classList.remove('hidden'));
        document.getElementById('memory-bank-btn').addEventListener('click', () => {
            document.getElementById('memory-bank-json-textarea').value = JSON.stringify(appState.memoryBank, null, 2);
            document.getElementById('memory-bank-modal').classList.remove('hidden');
        });

        document.querySelectorAll('.modal-close-trigger').forEach(b => b.addEventListener('click', () => {
            document.getElementById('memory-bank-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.add('hidden');
        }));

        // Fixed Save Button Logic
        document.getElementById('save-memory-bank-btn').addEventListener('click', () => {
            try {
                const newData = JSON.parse(document.getElementById('memory-bank-json-textarea').value);
                appState.memoryBank = newData;
                console.log("Memory bank updated locally.");
                document.getElementById('memory-bank-modal').classList.add('hidden');
            } catch (e) {
                alert("Invalid JSON format, bro!");
            }
        });

        document.getElementById('save-settings-btn').addEventListener('click', () => {
            const key = document.getElementById('custom-api-key-input').value;
            if (key) {
                console.log("Settings saved.");
                document.getElementById('settings-modal').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
