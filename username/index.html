<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE DUNGEON | USER PROFILE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --dungeon-green: #00ff41;
            --dark-grey: #0a0a0a;
            --terminal-red: #ff3131;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-grey);
            font-family: 'Courier New', Courier, monospace;
            color: var(--dungeon-green);
            overflow-x: hidden;
        }

        .glitch-text {
            text-transform: uppercase;
            letter-spacing: 0.3rem;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .profile-border {
            border: 2px solid rgba(0, 255, 65, 0.2);
            background: rgba(0, 255, 65, 0.02);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .stat-box {
            border-left: 3px solid var(--dungeon-green);
            background: rgba(0, 255, 65, 0.05);
        }

        .blicked {
            color: var(--terminal-red) !important;
            border-color: var(--terminal-red) !important;
            text-shadow: 0 0 10px rgba(255, 49, 49, 0.5);
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--dark-grey);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        /* Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 99;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-6">

    <div id="loading-overlay">
        <div class="text-2xl animate-pulse">AUTHENTICATING...</div>
    </div>

    <!-- User Header -->
    <div class="w-full max-w-2xl mt-12 mb-8 text-center">
        <div id="avatar-ring" class="w-32 h-32 rounded-full border-4 border-green-500 mx-auto mb-6 flex items-center justify-center bg-gray-900 overflow-hidden profile-border">
            <i data-lucide="user" class="w-16 h-16"></i>
        </div>
        <h1 id="user-display-name" class="glitch-text text-4xl font-black mb-2">USERNAME</h1>
        <p id="user-handle" class="opacity-60 text-lg">@handle</p>
    </div>

    <!-- Main Profile Card -->
    <div class="w-full max-w-2xl profile-border rounded-xl p-8 relative">
        <div class="absolute top-4 right-4 text-[10px] opacity-30">SECURE_ACCESS_V3</div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="stat-box p-4">
                <h3 class="text-xs opacity-50 mb-1">CURRENT RANK</h3>
                <p id="rank-val" class="text-xl font-bold">UNRANKED</p>
            </div>
            <div class="stat-box p-4">
                <h3 class="text-xs opacity-50 mb-1">VIBE STATUS</h3>
                <p id="vibe-val" class="text-xl font-bold">NEUTRAL</p>
            </div>
            <div class="stat-box p-4 md:col-span-2">
                <h3 class="text-xs opacity-50 mb-1">HELL'S THREAD TOP TRACK</h3>
                <p id="music-val" class="text-lg font-bold">NO_AUDIO_FOUND</p>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-green-900/30">
            <h3 class="text-xs opacity-50 mb-3">DUNGEON ACTIVITY (HOURS)</h3>
            <div class="flex items-center gap-4">
                <div class="flex-1 bg-green-900/20 h-4 rounded-full overflow-hidden">
                    <div id="grind-bar" class="bg-green-500 h-full w-0 transition-all duration-1000"></div>
                </div>
                <span id="grind-text" class="text-sm">0h</span>
            </div>
        </div>
    </div>

    <!-- Back Button -->
    <button onclick="window.location.href='https://thegamedungeon.qzz.io'" class="mt-12 px-8 py-3 border-2 border-green-500 hover:bg-green-500 hover:text-black transition-all font-bold tracking-widest uppercase flex items-center gap-2">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Return to The Crib
    </button>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ADD YOUR CONFIG HERE BRO
        const firebaseConfig = {
            apiKey: "",
            authDomain: "",
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProfile() {
            // 1. Get the username from the URL path
            // Example: /open.it.out.fortnite/
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            const username = pathParts[0] || "guest";

            const nameEl = document.getElementById('user-display-name');
            const handleEl = document.getElementById('user-handle');
            const rankEl = document.getElementById('rank-val');
            const vibeEl = document.getElementById('vibe-val');
            const musicEl = document.getElementById('music-val');
            const grindBar = document.getElementById('grind-bar');
            const grindText = document.getElementById('grind-text');
            const loader = document.getElementById('loading-overlay');
            const avatarRing = document.getElementById('avatar-ring');

            try {
                // 2. Query Firebase for the user
                const userRef = doc(db, "users", username);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    const data = userSnap.data();
                    
                    // Update UI with real data
                    nameEl.innerText = data.displayName || username.toUpperCase();
                    handleEl.innerText = `@${username}`;
                    rankEl.innerText = data.rank || "Green Belt";
                    vibeEl.innerText = data.vibe || "The Architect";
                    musicEl.innerText = data.topTrack || "Hell's Thread Mix";
                    
                    // Animate the grind bar
                    const hours = data.hoursPlayed || 0;
                    grindText.innerText = `${hours}h`;
                    setTimeout(() => {
                        grindBar.style.width = `${Math.min(hours, 100)}%`;
                    }, 100);

                } else {
                    // 3. OINK OINK - User is fake or blicked
                    handleEl.innerText = `@${username}`;
                    nameEl.innerText = "USER BLICKED";
                    nameEl.classList.add('blicked');
                    rankEl.innerText = "ACCESS DENIED";
                    vibeEl.innerText = "NOT IN GANG";
                    musicEl.innerText = "Connor's Zesty Theme";
                    avatarRing.classList.add('blicked');
                    document.title = "404 - BLICKED";
                }
            } catch (error) {
                console.error("Dungeon Error:", error);
                nameEl.innerText = "DATABASE OFFLINE";
            } finally {
                // Remove loader
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
                lucide.createIcons();
            }
        }

        window.onload = loadProfile;
    </script>
</body>
</html>
