name: Unzip Basket Random
on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Process Zip
        run: |
          # Go to the actual folder where you uploaded the zip
          cd storage/basket-main
          
          # Find the zip file (handles basket-main.zip)
          ZIP_NAME=$(ls *.zip | head -n 1)
          
          if [ -z "$ZIP_NAME" ]; then
            echo "Error: No zip file found in storage/basket-main/! Check the path."
            exit 1
          fi
          
          echo "Dungeon Bot found: $ZIP_NAME"
          
          # Move back to storage to create the clean folder
          cd ..
          TARGET_DIR="basket-random"
          mkdir -p "$TARGET_DIR"
          
          # Unzip from the subfolder into our new clean target folder
          unzip -o "basket-main/$ZIP_NAME" -d "$TARGET_DIR"
          
          # Clean up: Remove the zip and the old nested folder
          rm "basket-main/$ZIP_NAME"
          
          # Check if the zip had an inner folder (like 'basket-main/') and move files up
          INNER_DIR=$(ls -d "$TARGET_DIR"/*/ 2>/dev/null | head -n 1)
          if [ -n "$INNER_DIR" ]; then
             echo "Detected inner folder: $INNER_DIR. Yeeting files to root..."
             mv "$INNER_DIR"* "$TARGET_DIR/"
             rm -rf "$INNER_DIR"
          fi
          
          # Delete the now empty original upload folder to keep it Daimyan-proof
          rmdir "basket-main" || echo "Folder not empty yet"

      - name: Commit and Push
        run: |
          git config --global user.name 'Dungeon-Bot'
          git config --global user.email 'bot@thegamedungeon.io'
          git add .
          git commit -m "Dungeon Bot extracted the loot from the basket-main subfolder."
          git push
