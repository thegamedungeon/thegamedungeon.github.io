name: Unzip booty Random
on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Process Zip
        run: |
          echo "--- STARTING DUNGEON SCAN ---"
          # This will show us EVERY file in the logs so we can debug the oink oink security
          ls -R
          
          # 1. AGGRESSIVE SEARCH
          # We search for any file ending in .zip, ignoring case, anywhere in the repo
          echo "Searching for the stash..."
          ZIP_PATH=$(find . -iname "*.zip" -not -path "*/.*" | head -n 1)
          
          if [ -z "$ZIP_PATH" ]; then
            echo "Error: The bot is blind. No zip found."
            exit 1
          fi
          
          echo "Loot found at: $ZIP_PATH"
          
          # 2. SETUP TARGET
          TARGET_DIR="storage/basket-random"
          mkdir -p "$TARGET_DIR"
          
          # 3. UNZIP
          unzip -o "$ZIP_PATH" -d "$TARGET_DIR"
          
          # 4. CLEANUP THE MESS
          # Delete the zip and the folder it was in
          ORIGINAL_DIR=$(dirname "$ZIP_PATH")
          rm "$ZIP_PATH"
          if [ "$ORIGINAL_DIR" != "." ] && [ "$ORIGINAL_DIR" != "./storage" ]; then
            rm -rf "$ORIGINAL_DIR"
          fi
          
          # 5. FIX THE 'FOLDER INSIDE A ZIP' GLITCH
          # Moves files up if the zip had a subfolder
          INNER_DIR=$(ls -d "$TARGET_DIR"/*/ 2>/dev/null | head -n 1)
          if [ -n "$INNER_DIR" ]; then
             mv "$INNER_DIR"* "$TARGET_DIR/"
             rm -rf "$INNER_DIR"
          fi

      - name: Commit and Push
        run: |
          git config --global user.name 'Dungeon-Bot'
          git config --global user.email 'bot@thegamedungeon.io'
          git add .
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Dungeon Bot secured the loot. Connor is a bot."
            git push
          fi
