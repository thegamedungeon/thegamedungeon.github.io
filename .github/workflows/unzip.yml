name: Unzip Basket Random
on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Process Zip
        run: |
          cd storage
          
          # Use the specific name you provided
          ZIP_NAME="basket-main.zip"
          TARGET_DIR="basket-random"
          
          if [ ! -f "$ZIP_NAME" ]; then
            echo "Error: $ZIP_NAME not found in storage folder!"
            exit 1
          fi
          
          echo "Extracting $ZIP_NAME into $TARGET_DIR..."
          
          # Force extract all nested folders
          unzip -o "$ZIP_NAME" -d "$TARGET_DIR"
          
          # Clean up the zip file
          rm "$ZIP_NAME"
          
          # If the zip had a folder inside it, move contents up one level
          # This keeps the path clean for your Vault link
          if [ -d "$TARGET_DIR/BasketRandom-main" ]; then
             cp -r "$TARGET_DIR/BasketRandom-main/"* "$TARGET_DIR/"
             rm -rf "$TARGET_DIR/BasketRandom-main"
          fi

      - name: Commit and Push
        run: |
          git config --global user.name 'Dungeon-Bot'
          git config --global user.email 'bot@thegamedungeon.io'
          git add .
          git commit -m "Unzipped basket-main.zip - Connor's zesty security defeated"
          git push
