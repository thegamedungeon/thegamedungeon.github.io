name: Unzip Basket Random
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hard-Coded Process
        run: |
          echo "--- DEBUG: CHECKING SPECIFIC PATH ---"
          # We check the exact folder from your screenshot
          ls -R storage/basket-main/ || echo "Folder storage/basket-main not found!"
          
          # 1. SET EXACT PATH
          # Based on your screenshot, this is exactly where it is.
          ZIP_PATH="storage/basket-main/basket-main.zip"
          TARGET_DIR="storage/basket-random"
          
          if [ ! -f "$ZIP_PATH" ]; then
            echo "Error: $ZIP_PATH does not exist."
            echo "Searching for any file named basket-main.zip just in case..."
            ZIP_PATH=$(find . -name "basket-main.zip" | head -n 1)
          fi
          
          if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
             echo "CRITICAL ERROR: basket-main.zip is missing from the repo."
             exit 1
          fi

          echo "Dungeon Bot locked onto: $ZIP_PATH"
          
          # 2. PREP VAULT
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          
          # 3. EXTRACTION
          echo "Cracking the vault..."
          unzip -o "$ZIP_PATH" -d "$TARGET_DIR"
          
          # 4. CLEANUP
          # Remove the zip and the temporary upload folder
          rm -rf "storage/basket-main"
          
          # 5. FIX DOUBLE FOLDER GLITCH
          INNER_DIR=$(ls -d "$TARGET_DIR"/*/ 2>/dev/null | head -n 1)
          if [ -n "$INNER_DIR" ]; then
             echo "Fixing nested iPad folder..."
             mv "$INNER_DIR"* "$TARGET_DIR/"
             rm -rf "$INNER_DIR"
          fi

      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'Dungeon-Bot'
          git config --global user.email 'bot@thegamedungeon.io'
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to push."
          else
            git commit -m "Dungeon Bot forced the basket-main.zip extraction. Oink oink defeated."
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" main --force
          fi
