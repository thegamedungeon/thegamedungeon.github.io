<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: white; }
        .nav-active { filter: brightness(1.5); border-top: 2px solid white; }
        .loading-spinner { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .content-view { width: 100%; height: calc(100vh - 80px); overflow: hidden; }
        .full-iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body class="h-screen flex flex-col bg-black">

    <div id="app-container" class="flex-grow overflow-y-auto pb-20">
        <div id="main-content" class="h-full flex flex-col items-center justify-center">
            <div class="loading-spinner w-12 h-12 rounded-full border-4 border-gray-700"></div>
        </div>
    </div>

    <div id="custom-modal-container" class="fixed inset-0 z-[200] hidden items-center justify-center bg-black bg-opacity-85 p-4">
        <div id="custom-modal-content" class="bg-gray-900 border border-gray-800 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl scale-95 transition-all duration-200">
            <!-- Dynamic modal content goes here -->
        </div>
    </div>

    <nav class="sticky bottom-0 bg-black border-t border-gray-800 p-3 flex justify-around items-center z-50">
        <button onclick="switchView('home')" id="nav-home" class="nav-btn p-2 transition">
            <img src="/storage/photos/tgdtc.png" class="w-8 h-8 object-contain">
        </button>
        <button onclick="switchView('play')" id="nav-play" class="nav-btn p-2 transition">
            <img src="/storage/photos/play.png" class="w-8 h-8 object-contain">
        </button>
        <button onclick="switchView('chat')" id="nav-chat" class="nav-btn p-2 transition">
            <img src="/storage/photos/chat.png" class="w-8 h-8 object-contain">
        </button>
        <button onclick="switchView('account')" id="nav-account" class="nav-btn p-2 transition">
            <img id="nav-pfp" src="https://placehold.co/40x40/333/fff?text=?" class="w-8 h-8 rounded-full border border-gray-600 object-cover">
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, arrayRemove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUserData = null;

        // Bind auth and functions to window so inline HTML onclick handlers can access them
        window.auth = auth;
        window.handleLogin = () => signInWithPopup(auth, new GoogleAuthProvider());
        window.handleSignOut = () => signOut(auth).then(() => { location.reload(); });

        // Listen for messages/alerts from the iframe to trigger a reload on login
        window.addEventListener('message', (event) => {
            const activeNav = document.getElementById('nav-account');
            if (activeNav && activeNav.classList.contains('nav-active') && !auth.currentUser) {
                location.reload();
            }
        });

        window.customAlert = (message) => {
            const container = document.getElementById('custom-modal-container');
            const content = document.getElementById('custom-modal-content');
            content.innerHTML = `
                <p class="text-gray-200 text-lg mb-6">${message}</p>
                <button onclick="document.getElementById('custom-modal-container').classList.add('hidden')" class="bg-blue-600 px-6 py-2 rounded-xl text-sm font-bold w-full hover:bg-blue-500">OK</button>
            `;
            container.classList.remove('hidden');
            container.classList.add('flex');
        };

        window.customConfirm = (message, onConfirm) => {
            const container = document.getElementById('custom-modal-container');
            const content = document.getElementById('custom-modal-content');
            content.innerHTML = `
                <p class="text-gray-200 text-lg mb-6">${message}</p>
                <div class="flex gap-3">
                    <button id="modal-cancel" class="bg-gray-800 text-gray-400 px-4 py-2 rounded-xl text-sm w-1/2">Cancel</button>
                    <button id="modal-confirm" class="bg-red-600 px-4 py-2 rounded-xl text-sm font-bold w-1/2">Confirm</button>
                </div>
            `;
            container.classList.remove('hidden');
            container.classList.add('flex');
            
            document.getElementById('modal-cancel').onclick = () => {
                container.classList.add('hidden');
            };
            document.getElementById('modal-confirm').onclick = () => {
                container.classList.add('hidden');
                onConfirm();
            };
        };

        window.customPrompt = (message, placeholder, onPromptConfirm) => {
            const container = document.getElementById('custom-modal-container');
            const content = document.getElementById('custom-modal-content');
            content.innerHTML = `
                <p class="text-gray-200 text-lg mb-4">${message}</p>
                <input type="text" id="modal-input" placeholder="${placeholder}" class="bg-black border border-gray-800 text-white p-3 rounded-xl w-full mb-6 focus:outline-none focus:border-blue-500 text-center">
                <div class="flex gap-3">
                    <button id="modal-cancel" class="bg-gray-800 text-gray-400 px-4 py-2 rounded-xl text-sm w-1/2">Cancel</button>
                    <button id="modal-confirm" class="bg-blue-600 px-4 py-2 rounded-xl text-sm font-bold w-1/2">Submit</button>
                </div>
            `;
            container.classList.remove('hidden');
            container.classList.add('flex');
            
            document.getElementById('modal-cancel').onclick = () => {
                container.classList.add('hidden');
            };
            document.getElementById('modal-confirm').onclick = () => {
                const value = document.getElementById('modal-input').value;
                container.classList.add('hidden');
                onPromptConfirm(value);
            };
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('nav-pfp').src = user.photoURL;
                const cleanEmail = user.email.split('@')[0];
                
                const bannedRef = doc(db, 'artifacts', 'the-game-dungeon-4d75d', 'public', 'data', 'banned-users', cleanEmail);
                const bannedSnap = await getDoc(bannedRef);
                if (bannedSnap.exists()) {
                    document.body.innerHTML = "<div class='flex h-screen items-center justify-center text-red-500 font-bold'>You have been blicked.</div>";
                    return;
                }

                const userRef = doc(db, 'artifacts', 'the-game-dungeon-4d75d', 'public', 'data', 'users', cleanEmail);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    currentUserData = { ...userSnap.data(), email: user.email, id: cleanEmail };
                } else {
                    currentUserData = { username: "Guest", friends: [], email: user.email, id: cleanEmail };
                    await setDoc(userRef, currentUserData);
                }
                switchView('home');
            } else {
                // Instantly take unauthenticated users to the account/login iframe tab
                switchView('account');
            }
        });

        window.switchView = async (view, params = {}) => {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('nav-active'));
            document.getElementById(`nav-${view}`).classList.add('nav-active');
            
            const content = document.getElementById('main-content');
            content.innerHTML = `<div class="p-4 text-center">Loading...</div>`;
            
            // SECURITY CHECK: Block unauthorized tabs and direct them back to Account
            if (!auth.currentUser && view !== 'account') {
                renderNotLoggedIn();
                return;
            }
            
            if (view === 'home') renderHome();
            else if (view === 'play') renderPlay();
            else if (view === 'chat') renderChat(params.target);
            else if (view === 'account') renderAccount();
        };

        window.renderNotLoggedIn = () => {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="p-8 flex flex-col items-center justify-center text-center h-full max-w-sm mx-auto">
                    <div class="bg-gray-950 border border-gray-900 p-8 rounded-3xl w-full shadow-2xl">
                        <div class="w-16 h-16 bg-red-950 border border-red-900 rounded-full flex items-center justify-center mx-auto mb-6">
                            <span class="text-3xl text-red-500">🔒</span>
                        </div>
                        <h2 class="text-2xl font-bold mb-3 text-white">You aren't logged in</h2>
                        <p class="text-gray-400 text-sm mb-8 leading-relaxed">Access to Home, Play and Chat is locked until you sign in to your dungeon profile.</p>
                        <button onclick="switchView('account')" class="bg-white text-black hover:bg-gray-200 transition px-6 py-4 rounded-xl font-bold w-full shadow-lg">
                            Go to Account Tab
                        </button>
                    </div>
                </div>
            `;
        };

        window.deleteFriend = async (email) => {
            customConfirm(`Remove ${email} from friends?`, async () => {
                const userRef = doc(db, 'artifacts', 'the-game-dungeon-4d75d', 'public', 'data', 'users', currentUserData.id);
                await updateDoc(userRef, { friends: arrayRemove(email) });
                currentUserData.friends = currentUserData.friends.filter(f => f !== email);
                renderHome();
            });
        };

        window.sendScroll = (email) => {
            switchView('chat', { target: encodeURIComponent(email) });
        };

        window.renderHome = () => {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="p-8 flex flex-col items-center">
                    <img src="/storage/photos/tgdl.png" class="w-64 h-64 mx-auto mb-8 shadow-2xl border-4 border-gray-800">
                    <h1 class="text-4xl font-bold text-center mb-10">Welcome, ${currentUserData.username || 'User'}!</h1>
                    <div class="w-full max-w-sm">
                        <h2 class="text-xl mb-4 font-semibold text-gray-400">Friends</h2>
                        <div id="friends-list" class="space-y-3">
                            ${currentUserData.friends?.map(f => `
                                <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 flex justify-between items-center">
                                    <span>${f}</span>
                                    <div class="flex gap-2">
                                        <button onclick="sendScroll('${f}')" class="bg-blue-600 px-3 py-1 rounded-lg text-sm font-bold">Scroll</button>
                                        <button onclick="deleteFriend('${f}')" class="bg-red-900 px-3 py-1 rounded-lg text-sm">Delete</button>
                                    </div>
                                </div>
                            `).join('') || '<p class="text-gray-600">No friends added yet.</p>'}
                        </div>
                    </div>
                </div>
            `;
        };

        window.getGameLogo = (name) => {
            const parts = name.trim().split(/\s+/);
            if (parts.length === 1) return `/storage/photos/${parts[0].toLowerCase()}.png`;
            const initials = parts.map(p => p[0]).join('').toLowerCase();
            return `/storage/photos/${initials}.png`;
        };

        window.renderPlay = () => {
            const container = document.getElementById('main-content');
            const games = ["Ragdoll Hit"]; 
            container.innerHTML = `
                <div class="p-6 w-full max-w-2xl">
                    <h1 class="text-3xl font-bold mb-8 text-center">Game Vault</h1>
                    <div class="grid grid-cols-2 gap-4">
                        ${games.map(game => `
                            <button onclick="launchGame('${game}')" class="group flex flex-col items-center p-2 rounded-2xl transition hover:bg-gray-800 border border-transparent hover:border-gray-700">
                                <img src="${getGameLogo(game)}" 
                                     onerror="this.onerror=null; this.src='https://placehold.co/200x200/333/fff?text=${game.charAt(0)}';" 
                                     class="w-full aspect-square object-cover rounded-xl shadow-lg">
                                <span class="mt-2 text-sm font-medium text-gray-300 group-hover:text-white">${game}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        };

        window.launchGame = (gameName) => {
            const container = document.getElementById('main-content');
            container.innerHTML = `<div class="flex h-full items-center justify-center"><div class="loading-spinner w-12 h-12 rounded-full border-4 border-gray-700"></div></div>`;
            const page = gameName.toLowerCase().replace(/\s+/g, '-');
            setTimeout(() => {
                container.innerHTML = `
                    <div class="w-full h-full flex flex-col">
                        <div class="p-4 bg-gray-900 text-sm">Now playing: ${gameName}</div>
                        <iframe src="/play/${page}/" class="w-full flex-grow border-0"></iframe>
                    </div>
                `;
            }, 800);
        };

        window.renderChat = (targetEmail) => {
            const src = targetEmail ? `/chat/pwa/?sendmessage=${targetEmail}` : "/chat/pwa/";
            document.getElementById('main-content').innerHTML = `
                <div id="chat-container" class="content-view">
                    <iframe src="${src}" title="Chat" class="full-iframe"></iframe>
                </div>
            `;
        };

        window.renderAccount = () => {
            const container = document.getElementById('main-content');
            
            // If logged out, render the login iframe
            if (!auth.currentUser) {
                container.innerHTML = `
                    <div id="login-container" class="content-view">
                        <iframe src="/account/login/" title="Login" class="full-iframe"></iframe>
                    </div>
                `;
                return;
            }

            const isAdmin = currentUserData.email === 'open.it.out.fortnite@gmail.com';
            container.innerHTML = `
                <div class="p-8 text-center flex flex-col items-center max-w-sm w-full">
                    <img src="${auth.currentUser.photoURL}" class="w-32 h-32 rounded-full mb-6 shadow-xl border-4 border-gray-800">
                    <h2 class="text-2xl font-bold">${currentUserData.username}</h2>
                    <p class="text-gray-400 mb-8">${currentUserData.email}</p>
                    <button class="bg-gray-800 w-full mb-3 p-3 rounded-xl border border-gray-700">Edit Username</button>
                    ${isAdmin ? `<button id="admin-btn" class="bg-red-900 text-red-200 w-full mb-3 p-3 rounded-xl border border-red-700 font-bold">Admin Settings</button>` : ''}
                    <button onclick="handleSignOut()" class="bg-black border border-gray-700 w-full p-3 rounded-xl">Log Out</button>
                </div>
            `;
            if (isAdmin) document.getElementById('admin-btn').onclick = () => showAdminPopup();
        };

        function showAdminPopup() {
            const popup = document.createElement('div');
            popup.className = "fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-[100]";
            popup.innerHTML = `
                <div class="bg-gray-900 p-6 rounded-2xl border border-gray-700 w-80 text-center">
                    <h2 class="text-xl font-bold mb-4">Admin Controls</h2>
                    <button id="btn-blick" class="w-full bg-red-600 py-3 rounded-lg mb-2 hover:bg-red-500 font-bold">Blick User</button>
                    <button id="btn-unblick" class="w-full bg-blue-600 py-3 rounded-lg mb-2 hover:bg-blue-500 font-bold">Unblick User</button>
                    <button onclick="this.parentElement.parentElement.remove()" class="w-full mt-4 text-gray-500">Close</button>
                </div>
            `;
            document.body.appendChild(popup);
            document.getElementById('btn-blick').onclick = () => {
                customPrompt("Enter email or username to blick:", "username / email", async (target) => {
                    if(target) {
                        await setDoc(doc(db, 'artifacts', 'the-game-dungeon-4d75d', 'public', 'data', 'banned-users', target), { banned: true });
                        customAlert("User blicked.");
                    }
                });
            };
            document.getElementById('btn-unblick').onclick = () => {
                customPrompt("Enter email to unblick:", "user@example.com", async (target) => {
                    if(target) {
                        await deleteDoc(doc(db, 'artifacts', 'the-game-dungeon-4d75d', 'public', 'data', 'banned-users', target));
                        customAlert("User unblicked.");
                    }
                });
            };
        }

        function renderLogin() {
            document.getElementById('main-content').innerHTML = `
                <div class="text-center p-8">
                    <h1 class="text-4xl font-bold mb-8">The Game Dungeon</h1>
                    <button onclick="handleLogin()" class="bg-white text-black px-8 py-4 rounded-xl font-bold">Login with Google</button>
                </div>
            `;
        }
    </script>
</body>
</html>
