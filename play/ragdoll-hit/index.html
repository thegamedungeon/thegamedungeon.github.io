<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragdoll Hit | The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif;
        }

        /* Android-style Zoom Animation */
        @keyframes appLaunch {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #splash-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121212;
            z-index: 50;
            transition: opacity 0.5s ease;
        }

        .launch-logo {
            animation: appLaunch 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        #game-layout {
            display: none; 
            height: 100vh;
            flex-direction: column;
        }

        .controls-bar {
            background-color: #1a1a1a;
            border-bottom: 2px solid #00ff00;
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-glow {
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.6);
            color: #00ff00;
        }

        #gameFrame {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="splash-overlay">
        <img src="/storage/photos/ragdoll.png" class="launch-logo" id="logo" onerror="this.src='/storage/photos/cc.png'">
    </div>

    <div id="game-layout">
        <nav class="controls-bar">
            <a href="/play/" class="text-gray-400 hover:text-[#00ff00] transition-colors text-sm">⬅️ Back to The Vault</a>
            <h1 class="text-xl font-bold header-glow">Ragdoll Hit</h1>
            <div class="w-10"></div> </nav>
        
        <iframe id="gameFrame" src="about:blank" allowfullscreen></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { initTracker } from "/storage/js/tracker.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        initTracker("Ragdoll Hit");

        const splash = document.getElementById('splash-overlay');
        const layout = document.getElementById('game-layout');
        const iframe = document.getElementById('gameFrame');

        window.onload = () => {
            iframe.src = "/storage/ragdoll-hit-main/index.html";

            setTimeout(() => {
                splash.style.opacity = '0';
                layout.style.display = 'flex';
                
                setTimeout(() => {
                    splash.remove();
                }, 500);
            }, 1500);
        };
    </script>
</body>
</html>
