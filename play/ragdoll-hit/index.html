<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon | Ragdoll Hit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden; /* No scrolling to keep proportions tight */
            margin: 0;
            position: relative;
        }

        /* Taskbar Styles */
        .taskbar {
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 40; /* Lower than game when active */
            transition: transform 0.5s ease;
        }

        .taskbar.hidden-taskbar {
            transform: translateY(100%);
        }

        .nav-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .nav-item.active {
            color: #3b82f6;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background: #3b82f6;
            border-radius: 50%;
        }

        /* Game Launcher Styles */
        #game-hero {
            transition: opacity 0.5s ease;
        }

        #rh-logo {
            width: 200px;
            height: 200px;
            object-fit: contain;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 60;
        }

        /* The Game Iframe Layer */
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50; /* Higher than taskbar */
            display: none;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Back Button - Left Wall */
        #exit-btn {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-left: none;
            padding: 15px 10px;
            border-radius: 0 10px 10px 0;
            z-index: 100;
            display: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        #exit-btn:hover {
            background: #ef4444;
        }

        .pfp-container {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            background: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* Animation Classes */
        .launching {
            position: fixed !important;
            margin: 0 !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) rotate(720deg) scale(10) !important;
        }

        .slide-down {
            transform: translate(-50%, 150%) rotate(720deg) scale(10) !important;
            transition: transform 1s ease-in !important;
        }

        .return-spin {
            transform: translate(-50%, -50%) rotate(-720deg) scale(1) !important;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }
    </style>
</head>
<body>

    <!-- Main Menu Content -->
    <main id="game-hero" class="h-full flex flex-col items-center justify-center p-6 pb-24">
        <div id="logo-wrap" class="relative flex items-center justify-center mb-6">
            <img id="rh-logo" src="/storage/photos/rh.png" alt="Ragdoll Hit">
        </div>
        
        <div id="ui-content" class="text-center">
            <h2 class="text-3xl font-black italic tracking-tighter mb-4">RAGDOLL HIT</h2>
            <button onclick="launchGame()" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-3 px-12 rounded-full uppercase tracking-widest transition-all transform hover:scale-110 active:scale-95 shadow-lg shadow-blue-900/40">
                Play Now
            </button>
        </div>
    </main>

    <!-- Game Layer -->
    <div id="game-container">
        <iframe id="game-iframe" src=""></iframe>
    </div>

    <!-- Persistent Back Button -->
    <button id="exit-btn" onclick="exitGame()">
        <i class="fa-solid fa-chevron-left text-white text-xs"></i>
    </button>

    <!-- Taskbar -->
    <nav id="main-taskbar" class="taskbar fixed bottom-0 left-0 w-full h-16 flex items-center justify-around px-4">
        <button onclick="location.href='/home/'" class="nav-item flex flex-col items-center">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] mt-1">Home</span>
        </button>
        <button class="nav-item active flex flex-col items-center">
            <i class="fa-solid fa-gamepad text-xl"></i>
            <span class="text-[10px] mt-1">Play</span>
        </button>
        <button onclick="location.href='/chat/'" class="nav-item flex flex-col items-center">
            <i class="fa-solid fa-comment-dots text-xl"></i>
            <span class="text-[10px] mt-1">Chat</span>
        </button>
        <button onclick="location.href='/call/'" class="nav-item flex flex-col items-center">
            <i class="fa-solid fa-phone text-xl"></i>
            <span class="text-[10px] mt-1">Call</span>
        </button>
        <button onclick="location.href='/account/'" class="nav-item flex flex-col items-center">
            <div id="pfp-slot" class="pfp-container">
                <i class="fa-solid fa-user text-lg"></i>
            </div>
            <span class="text-[10px] mt-1">Account</span>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const pfpSlot = document.getElementById('pfp-slot');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email && user.email.endsWith('@gmail.com')) {
                    pfpSlot.innerHTML = `<img src="${user.photoURL}" class="w-full h-full object-cover">`;
                } else {
                    const initials = user.displayName ? user.displayName.split(' ').map(n => n[0]).join('').toUpperCase() : "TC";
                    pfpSlot.innerHTML = `<span>${initials}</span>`;
                }
            }
        });
    </script>

    <script>
        const logo = document.getElementById('rh-logo');
        const ui = document.getElementById('ui-content');
        const gameContainer = document.getElementById('game-container');
        const iframe = document.getElementById('game-iframe');
        const exitBtn = document.getElementById('exit-btn');
        const taskbar = document.getElementById('main-taskbar');

        function launchGame() {
            // 1. Hide UI and Hide Taskbar
            ui.style.opacity = '0';
            taskbar.classList.add('hidden-taskbar');
            
            // 2. Start Spin and Expansion
            logo.classList.add('launching');

            // 3. Prep Iframe in background
            iframe.src = "/storage/ragdoll-hit-main/";

            // 4. Once expanded, wait for "loading" and then slide away
            setTimeout(() => {
                gameContainer.style.display = 'block';
                exitBtn.style.display = 'block';
                
                // Wait for iframe to breathe, then slide logo down
                setTimeout(() => {
                    logo.classList.add('slide-down');
                }, 500);
            }, 800);
        }

        function exitGame() {
            // 1. Slide logo back up
            logo.classList.remove('slide-down');
            
            // 2. Wait for it to cover the screen, then kill the game
            setTimeout(() => {
                gameContainer.style.display = 'none';
                iframe.src = ""; 
                exitBtn.style.display = 'none';

                // 3. Bring taskbar back
                taskbar.classList.remove('hidden-taskbar');

                // 4. Spin back to life and shrink
                logo.classList.remove('launching');
                logo.classList.add('return-spin');

                // 5. Reveal UI
                setTimeout(() => {
                    ui.style.opacity = '1';
                    setTimeout(() => {
                        logo.classList.remove('return-spin');
                    }, 800);
                }, 600);
            }, 500);
        }
    </script>
</body>
</html>
