<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragdoll Hit | The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Sidebar Transition */
        #side-menu {
            transition: transform 0.3s ease-in-out;
            transform: translateX(-100%);
        }
        #side-menu.open {
            transform: translateX(0);
        }
        /* The "Wall" Handle */
        #menu-trigger {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 0 10px 10px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-left: none;
            transition: width 0.2s;
        }
        #menu-trigger:hover {
            width: 30px;
            background: rgba(255, 255, 255, 0.4);
        }
        #menu-trigger i {
            color: white;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- The Game -->
    <iframe src="/storage/ragdoll-hit-main/" title="Ragdoll Hit"></iframe>

    <!-- The Left Wall Trigger -->
    <div id="menu-trigger" onclick="toggleMenu()">
        <span style="color: white; transform: rotate(90deg); font-weight: bold; font-family: sans-serif;">|||</span>
    </div>

    <!-- Slide-out Menu -->
    <div id="side-menu" class="fixed top-0 left-0 h-full w-64 bg-zinc-900 shadow-2xl z-[150] flex flex-col p-6 border-r border-zinc-700">
        <h2 class="text-white text-2xl font-bold mb-8">Menu</h2>
        
        <div class="flex-grow flex flex-col items-center justify-center space-y-6">
            <p class="text-zinc-300 text-lg text-center">Want to leave?</p>
            
            <button onclick="leavePage()" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-colors">
                YES
            </button>
            
            <button onclick="toggleMenu()" class="w-full py-3 bg-zinc-700 hover:bg-zinc-600 text-white font-bold rounded-lg transition-colors">
                STAY
            </button>
        </div>

        <div class="mt-auto pt-6 text-zinc-500 text-xs text-center border-t border-zinc-800">
            The Game Dungeon Admin Panel
        </div>
    </div>

    <!-- Overlay to close menu when clicking game area -->
    <div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 hidden z-[140]"></div>

    <script>
        const menu = document.getElementById('side-menu');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            const isOpen = menu.classList.contains('open');
            if (isOpen) {
                menu.classList.remove('open');
                overlay.classList.add('hidden');
            } else {
                menu.classList.add('open');
                overlay.classList.remove('hidden');
            }
        }

        function leavePage() {
            // Goes back to the last page in the browser history
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Fallback to The Crib if there's no history
                window.location.href = "https://thegamedungeon.github.io/";
            }
        }

        // Close menu on Escape key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menu.classList.contains('open')) {
                toggleMenu();
            }
        });
    </script>
</body>
</html>
