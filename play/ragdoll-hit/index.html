<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon - Ragdoll Hit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        .game-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .iframe-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            border: 3px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e1e1e;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #2d2d2d;
        }
        .game-title-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .main-app-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: cover;
        }
        .game-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .fullscreen-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .back-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .fullscreen-btn:hover {
            background-color: #ff6b81;
        }
        .back-btn:hover {
            background-color: #ff6b81;
        }
        .fullscreen-btn:active {
            transform: scale(0.98);
        }
        .back-btn:active {
            transform: scale(0.98);
        }
        .recommendations-section {
            margin-top: 15px;
            width: 100%;
            max-width: 800px;
        }
        .rec-heading {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .rec-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .rec-card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .rec-card:hover {
            background-color: #252525;
            transform: translateY(-2px);
            border-color: #444;
        }
        .rec-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #333;
        }
        .rec-info {
            flex: 1;
        }
        .rec-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- The Game Viewport Box -->
        <div class="iframe-wrapper" id="gameFrameContainer">
            <iframe id="gameIframe" src="/storage/ragdoll-hit-main/tgd/" allowfullscreen></iframe>
        </div>

        <!-- System Controls Underframe -->
        <div class="control-bar">
            <div class="game-title-section">
                <img src="/storage/photos/rh.png" alt="Ragdoll Hit" class="main-app-icon" onerror="this.style.display='none'">
                <span class="game-title">RAGDOLL HIT</span>
            </div>
            <button class="fullscreen-btn" onclick="toggleFullscreen()">FULLSCREEN</button>
            <button class="back-btn" onclick="goHome()">BACK</button>
        </div>
    </div>

    <!-- Recommendations Tray -->
    <div class="recommendations-section">
        <div class="rec-heading">Next up from the dungeon:</div>
        <div class="rec-grid" id="recGrid">
            <!-- Driven dynamically via text index parsing -->
        </div>
    </div>

    <script>
        // Native viewport layout handling
        function toggleFullscreen() {
            const container = document.getElementById('gameFrameContainer');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.error(`Fullscreen request failed: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function goHome() {
    // Create the dark background overlay
    const overlay = document.createElement('div');
    overlay.style = "position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; z-index:99999;";

    // Create the center box
    const box = document.createElement('div');
    box.style = "background:#1e1e1e; padding:25px; border-radius:8px; border:2px solid #ff4757; text-align:center; min-width:250px;";
    box.innerHTML = `
        <p style="color:#fff; font-size:1.2rem; font-weight:bold; margin-bottom:20px;">Are you sure?</p>
        <div style="display:flex; gap:15px; justify-content:center;">
            <button id="popNo" style="background:#333; color:#fff; border:none; padding:8px 20px; border-radius:5px; cursor:pointer; font-weight:bold;">No</button>
            <button id="popYes" style="background:#ff4757; color:#fff; border:none; padding:8px 20px; border-radius:5px; cursor:pointer; font-weight:bold;">Yes</button>
        </div>
    `;

    overlay.appendChild(box);
    document.body.appendChild(overlay);

    // Make the buttons actually do stuff
    document.getElementById('popNo').onclick = () => overlay.remove();
    document.getElementById('popYes').onclick = () => window.location.href = '/play/';
}
        
        // Logic processing engine for structural path verification
        async function loadRecommendations() {
            try {
                const response = await fetch('/storage/g/all.txt');
                if (!response.ok) throw new Error('Network failure parsing master manifest file');
                
                const text = await response.text();
                // Filter content splits cleanly by newline or carriage lines
                let games = text.split('\n')
                                .map(g => g.trim())
                                .filter(g => g.length > 0);

                // Filter rule: Exclude current active build asset
                games = games.filter(game => game.toLowerCase() !== 'ragdoll hit');

                if (games.length === 0) return;

                // Randomizing slice selection algorithm parameters
                const shuffled = games.sort(() => 0.5 - Math.random());
                const selectedGames = shuffled.slice(0, 2);

                const recGrid = document.getElementById('recGrid');
                recGrid.innerHTML = ''; // Purge initial structure frame

                selectedGames.forEach(gameName => {
                    // Logic rule evaluation: Icon routing layout properties
                    const words = gameName.split(/\s+/).filter(w => w.length > 0);
                    let filename = "";

                    if (words.length === 1) {
                        filename = gameName.toLowerCase() + ".png";
                    } else {
                        // Multi-word rule calculation logic
                        const initials = words.map(w => w[0]).join('').toLowerCase();
                        filename = initials + ".png";
                    }
                    const iconPath = `/storage/photos/${filename}`;

                    // Click routing formatting logic conversion
                    const routeName = gameName.toLowerCase().replace(/\s+/g, '-');
                    const targetUrl = `/play/${routeName}/`;

                    // Generate UI markup injection modules safely
                    const card = document.createElement('div');
                    card.className = 'rec-card';
                    card.onclick = () => window.location.href = targetUrl;

                    card.innerHTML = `
                        <img src="${iconPath}" alt="${gameName}" class="rec-icon" onerror="this.src='/storage/photos/default.png';">
                        <div class="rec-info">
                            <div class="rec-title">${gameName}</div>
                        </div>
                    `;
                    recGrid.appendChild(card);
                });

            } catch (error) {
                console.error('Failed processing dynamic engine assets:', error);
                document.getElementById('recGrid').innerHTML = '<div style="color: #666; font-size: 0.9rem;">Could not load standard recommendations module.</div>';
            }
        }

        // Boot system scripts on render cycle termination
        window.addEventListener('DOMContentLoaded', loadRecommendations);
    </script>
  <script type="module">
    // Import your Daimyan Proof logic
    import { initTracker } from "/storage/js/tracker.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Standard Dungeon Config
    const firebaseConfig = {
        apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
        authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
        projectId: "the-game-dungeon-4d75d",
        storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
        messagingSenderId: "533459716906",
        appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
    };

    // Initialize Firebase for this page so the tracker has an active context
    const app = initializeApp(firebaseConfig);
    getAuth(app);
    getFirestore(app);

    // Initialize the tracker with the specific Hall of Records name
    // This must match your UI cards exactly!
    initTracker("Ragdoll Hit");
</script>
</body>
</html>
