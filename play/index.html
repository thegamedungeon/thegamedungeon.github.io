<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play | The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Animation for the letters flying in */
        .letter {
            position: fixed;
            font-size: 5rem;
            font-weight: 900;
            color: #3b82f6; /* Blue-500 */
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            pointer-events: none;
        }

        /* Game Card Styles */
        .game-card {
            background: #171717;
            border: 1px solid #262626;
            border-radius: 1rem;
            overflow: hidden;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .game-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            transform: scale(1.05);
        }

        .show-games .game-card {
            opacity: 1;
            transform: translateY(0);
        }

        .game-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-8">

    <!-- Auth Guard Overlay -->
    <div id="loading-screen" class="fixed inset-0 bg-black z-[200] flex items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
    </div>

    <!-- Letter Entities -->
    <div id="L-P" class="letter" style="top: -150px; left: -150px;">P</div>
    <div id="L-L" class="letter" style="top: -150px; right: -150px;">L</div>
    <div id="L-A" class="letter" style="bottom: -150px; left: -150px;">A</div>
    <div id="L-Y" class="letter" style="bottom: -150px; right: -150px;">Y</div>

    <!-- Main Content Container -->
    <div id="game-container" class="max-w-6xl w-full hidden mt-24">
        <!-- The Header where letters land -->
        <div id="header-target" class="h-32 flex justify-center items-center mb-16">
            <!-- Space reserved for letters -->
        </div>

        <!-- Games Grid -->
        <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Game 1 -->
            <a href="/play/ragdoll-hit/" class="game-card">
                <div class="h-48 bg-neutral-800 flex items-center justify-center">
                    <img src="/storage/photos/rh.png" alt="Game 1" class="game-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span class="hidden text-neutral-500 font-mono">ICON MISSING</span>
                </div>
                <div class="p-4 bg-neutral-900 border-t border-white/5">
                    <h3 class="text-xl font-bold tracking-tight">RAGDOLL HIT</h3>
                </div>
            </a>
            <!-- Game 2 -->
            <a href="/play/geometry-dash/" class="game-card">
                <div class="h-48 bg-neutral-800 flex items-center justify-center">
                    <img src="/storage/photos/gd.png" alt="Game 2" class="game-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span class="hidden text-neutral-500 font-mono">ICON MISSING</span>
                </div>
                <div class="p-4 bg-neutral-900 border-t border-white/5">
                    <h3 class="text-xl font-bold tracking-tight">GEOMETRY DASH</h3>
                </div>
            </a>
            <!-- Game 3 -->
            <a href="/play/cookie-clicker/" class="game-card">
                <div class="h-48 bg-neutral-800 flex items-center justify-center">
                    <img src="/storage/photos/cc.png" alt="Game 3" class="game-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span class="hidden text-neutral-500 font-mono">ICON MISSING</span>
                </div>
                <div class="p-4 bg-neutral-900 border-t border-white/5">
                    <h3 class="text-xl font-bold tracking-tight">COOKIE CLICKER</h3>
                </div>
            </a>
            <!-- Game 4 -->
            <a href="/play/polytrack/" class="game-card">
                <div class="h-48 bg-neutral-800 flex items-center justify-center">
                    <img src="/storage/photos/polytrack.png" alt="Game 4" class="game-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span class="hidden text-neutral-500 font-mono">ICON MISSING</span>
                </div>
                <div class="p-4 bg-neutral-900 border-t border-white/5">
                    <h3 class="text-xl font-bold tracking-tight">POLYTRACK</h3>
                </div>
            </a>
            <!-- Game 5 -->
            <a href="/play/minecraft/" class="game-card">
                <div class="h-48 bg-neutral-800 flex items-center justify-center">
                    <img src="/storage/photos/minecraft.png" alt="Game 5" class="game-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span class="hidden text-neutral-500 font-mono">ICON MISSING</span>
                </div>
                <div class="p-4 bg-neutral-900 border-t border-white/5">
                    <h3 class="text-xl font-bold tracking-tight">MINECRAFT</h3>
                </div>
            </a>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "/accounts/login/";
            } else {
                document.getElementById('loading-screen').style.display = 'none';
                startIntroSequence();
            }
        });

        function startIntroSequence() {
            const container = document.getElementById('game-container');
            container.classList.remove('hidden');

            const p = document.getElementById('L-P');
            const l = document.getElementById('L-L');
            const a = document.getElementById('L-A');
            const y = document.getElementById('L-Y');

            setTimeout(() => {
                const centerX = window.innerWidth / 2;
                const targetY = 80; // Distance from top

                // FLY IN: Positioning logic to spell "PLAY" centered at the top
                // P - L - A - Y
                
                p.style.top = `${targetY}px`;
                p.style.left = `${centerX - 160}px`;

                l.style.top = `${targetY}px`;
                l.style.left = `${centerX - 60}px`;
                l.style.right = 'auto'; // Reset corner style

                a.style.top = `${targetY}px`;
                a.style.bottom = 'auto'; // Reset corner style
                a.style.left = `${centerX + 40}px`;

                y.style.top = `${targetY}px`;
                y.style.bottom = 'auto'; // Reset corner style
                y.style.left = `${centerX + 140}px`;
                y.style.right = 'auto'; // Reset corner style

                // Show the grid after letters arrive
                setTimeout(() => {
                    document.body.classList.add('show-games');
                }, 1300);
            }, 100);
        }
    </script>
</body>
</html>
