<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, setDoc, arrayUnion, arrayRemove, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
        authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
        projectId: "the-game-dungeon-4d75d",
        storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
        messagingSenderId: "533459716906",
        appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = "the-game-dungeon-4d75d";

    // Initialize EmailJS with your Public Key
    (function() {
        emailjs.init("B27WRyM1IvaQI_Ysy");
    })();

    let currentUserData = null;

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = "/account/login/";
            return;
        }
        initSocial(user);
    });

    // ... [initSocial, renderFriends, renderRequests, getPfpUrl functions remain the same] ...

    // The Email Courier Function
    window.sendEmailNotification = (targetEmail, senderName) => {
        const templateParams = {
            to_email: targetEmail,
            from_name: senderName,
            message: `${senderName} just sent you a friend request on The Crib! Hop on to accept it.`
        };

        emailjs.send('service_zywiuax', 'template_58qiu5r', templateParams)
            .then(() => {
                console.log('Email delivered by the Courier!');
            }, (error) => {
                console.error('Email blicked:', error);
            });
    };

    window.sendRequest = async (targetEmail) => {
        const myEmail = auth.currentUser.email;
        const myPrefix = myEmail.split('@')[0];
        const targetPrefix = targetEmail.split('@')[0];
        
        try {
            // 1. Update the Vault (Firestore)
            await updateDoc(doc(db, `artifacts/${appId}/public/data/users/${targetPrefix}`), { 
                requests: arrayUnion(myEmail) 
            });
            await updateDoc(doc(db, `artifacts/${appId}/public/data/users/${myPrefix}`), { 
                sentRequests: arrayUnion(targetEmail) 
            });
            
            // 2. Trigger the Email Notification
            sendEmailNotification(targetEmail, myPrefix);
            
            closeModals();
        } catch (e) {
            console.error("Dungeon Error:", e);
        }
    };

    // ... [rest of the unfriend and modal logic remains the same] ...
</script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, setDoc, arrayUnion, arrayRemove, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "the-game-dungeon-4d75d";

        let currentUserData = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "/account/login/";
                return;
            }
            initSocial(user);
        });

        async function initSocial(user) {
            const prefix = user.email.split('@')[0];
            const userDocPath = `artifacts/${appId}/public/data/users/${prefix}`;
            
            onSnapshot(doc(db, userDocPath), (snap) => {
                if (snap.exists()) {
                    currentUserData = snap.data();
                    renderFriends(currentUserData.friends || []);
                    renderRequests(currentUserData.requests || []);
                } else {
                    setDoc(doc(db, userDocPath), { email: user.email, friends: [], requests: [] });
                }
            });
        }

        function renderFriends(friends) {
            const list = document.getElementById('friends-list');
            list.innerHTML = friends.filter(f => f !== 'null').map(email => {
                const pfp = getPfpUrl(email);
                return `
                    <button onclick="showUserDetail('${email}')" class="friend-btn w-10 h-10 rounded-full border-2 border-white/5 overflow-hidden flex-shrink-0">
                        <img src="${pfp}" class="w-full h-full object-cover">
                    </button>
                `;
            }).join('');
        }

        function renderRequests(requests) {
            const list = document.getElementById('requests-list');
            const badge = document.getElementById('request-count');
            
            if (requests.length > 0) {
                badge.innerText = requests.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            list.innerHTML = requests.map(email => `
                <div class="flex items-center justify-between p-3 glass rounded-2xl">
                    <div class="flex items-center space-x-3">
                        <img src="${getPfpUrl(email)}" class="w-8 h-8 rounded-full">
                        <span class="text-xs font-bold truncate max-w-[120px]">${email.split('@')[0]}</span>
                    </div>
                    <div class="flex space-x-1">
                        <button onclick="handleRequest('${email}', 'accept')" class="p-2 bg-green-500/20 text-green-500 rounded-lg hover:bg-green-500/40"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
                        <button onclick="handleRequest('${email}', 'deny')" class="p-2 bg-red-500/20 text-red-500 rounded-lg hover:bg-red-500/40"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-neutral-600 text-xs py-4">No pending requests</p>';
        }

        function getPfpUrl(email) {
            const domain = email.split('@')[1];
            const prefix = email.split('@')[0];
            if (domain.includes('gmail')) return `https://ui-avatars.com/api/?name=${prefix}&background=ea4335&color=fff`;
            if (domain.includes('outlook') || domain.includes('hotmail')) return `https://ui-avatars.com/api/?name=${prefix}&background=0078d4&color=fff`;
            return `https://ui-avatars.com/api/?name=${prefix}&background=333&color=fff`;
        }

        window.showUserDetail = async (email) => {
            const prefix = email.split('@')[0];
            document.getElementById('modal-name').innerText = prefix;
            document.getElementById('modal-email').innerText = email;
            document.getElementById('modal-pfp').src = getPfpUrl(email);
            
            const actions = document.getElementById('modal-actions');
            actions.innerHTML = '';

            const isFriend = currentUserData.friends?.includes(email);
            const isPending = currentUserData.sentRequests?.includes(email);

            if (isFriend) {
                actions.innerHTML = `<button onclick="unfriend('${email}')" class="w-full py-4 bg-red-600/10 text-red-500 rounded-2xl font-bold uppercase text-xs hover:bg-red-600/20">Unfriend</button>`;
            } else if (isPending) {
                actions.innerHTML = `<button class="w-full py-4 glass text-neutral-500 rounded-2xl font-bold uppercase text-xs" disabled>Pending...</button>`;
            } else if (email !== auth.currentUser.email) {
                actions.innerHTML = `<button onclick="sendRequest('${email}')" class="w-full py-4 bg-blue-600 rounded-2xl font-black italic uppercase tracking-tighter">Add Friend</button>`;
            }

            document.getElementById('user-modal').classList.remove('hidden');
        };

        window.findUserByEmail = async () => {
            const email = document.getElementById('add-email-input').value.trim();
            if (!email) return;
            const prefix = email.split('@')[0];
            const docRef = doc(db, `artifacts/${appId}/public/data/users/${prefix}`);
            const snap = await getDoc(docRef);

            if (snap.exists()) {
                closeModals();
                showUserDetail(email);
            } else {
                alert("User not found in the Dungeon.");
            }
        };

        // Update THIS version in the bottom script tag
window.sendRequest = async (targetEmail) => {
    const myEmail = auth.currentUser.email;
    const myPrefix = myEmail.split('@')[0];
    const targetPrefix = targetEmail.split('@')[0];
    
    try {
        // 1. Update the Vault (Firestore)
        await updateDoc(doc(db, `artifacts/${appId}/public/data/users/${targetPrefix}`), { 
            requests: arrayUnion(myEmail) 
        });
        await updateDoc(doc(db, `artifacts/${appId}/public/data/users/${myPrefix}`), { 
            sentRequests: arrayUnion(targetEmail) 
        });
        
        // 2. Trigger the Email Notification (The Courier)
        // We call the function defined in your first script tag
        if (window.sendEmailNotification) {
            window.sendEmailNotification(targetEmail, myPrefix);
        }
        
        closeModals();
    } catch (e) {
        console.error("Dungeon Error:", e);
    }
};

        window.handleRequest = async (email, action) => {
            const myPrefix = auth.currentUser.email.split('@')[0];
            const targetPrefix = email.split('@')[0];
            const myRef = doc(db, `artifacts/${appId}/public/data/users/${myPrefix}`);
            const targetRef = doc(db, `artifacts/${appId}/public/data/users/${targetPrefix}`);
            await updateDoc(myRef, { requests: arrayRemove(email) });
            if (action === 'accept') {
                await updateDoc(myRef, { friends: arrayUnion(email) });
                await updateDoc(targetRef, { friends: arrayUnion(auth.currentUser.email) });
            }
            await updateDoc(targetRef, { sentRequests: arrayRemove(auth.currentUser.email) });
        };

        window.bulkHandle = async (action) => {
            if (!currentUserData.requests || currentUserData.requests.length === 0) return;
            for (const email of [...currentUserData.requests]) {
                await handleRequest(email, action);
            }
            closeModals();
        };

        window.unfriend = async (email) => {
            const myPrefix = auth.currentUser.email.split('@')[0];
            const targetPrefix = email.split('@')[0];
            await updateDoc(doc(db, `artifacts/${appId}/public/data/users/${myPrefix}`), { friends: arrayRemove(email) });
            await updateDoc(doc(db, `artifacts/${appId}/public/data/users/${targetPrefix}`), { friends: arrayRemove(auth.currentUser.email) });
            closeModals();
        };

        window.openAddFriendModal = () => document.getElementById('add-modal').classList.remove('hidden');
        window.openRequestsModal = () => document.getElementById('requests-modal').classList.remove('hidden');
        window.closeModals = () => {
            document.querySelectorAll('.modal-bg').forEach(m => m.classList.add('hidden'));
        };

        const grid = document.getElementById('game-grid');
        games.forEach(g => {
            grid.innerHTML += `
                <a href="/play/${g.icon}/" class="glass rounded-[2rem] p-4 flex flex-col items-center hover:bg-white/5 transition-all">
                    <img src="/storage/photos/${g.icon}.png" class="w-full aspect-square rounded-3xl object-cover mb-4" onerror="this.src='/storage/photos/tgdtc.png'">
                    <span class="text-[10px] font-black uppercase tracking-widest text-neutral-400">${g.name}</span>
                </a>
            `;
        });

    </script>
