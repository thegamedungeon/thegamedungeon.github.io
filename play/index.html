<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon | Play</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            position: relative;
            /* Scrolling enabled to prevent blicked content */
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Internal Navigation Loader */
        #nav-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(10px);
            display: none;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        /* Taskbar Styles */
        .taskbar {
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 40; 
            transition: transform 0.5s ease;
        }

        .nav-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
        }

        .nav-item.active {
            color: #3b82f6;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background: #3b82f6;
            border-radius: 50%;
        }

        /* Game Grid Styles */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        .game-btn {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .game-btn:hover {
            transform: translateY(-5px);
            border-color: #3b82f6;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .game-icon {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            margin-bottom: 12px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .game-title {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #efefef;
        }

        .pfp-container {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            background: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Internal Navigation Loader -->
    <div id="nav-loader">
        <div class="flex flex-col items-center">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <p id="loader-status" class="mt-4 font-bold text-blue-500 uppercase tracking-widest text-sm">Switching Sectors...</p>
        </div>
    </div>

    <!-- Main Game Selection View -->
    <main class="min-h-screen flex flex-col items-center justify-start p-6 pt-12 pb-32">
        <div class="mb-10 text-center">
            <h1 class="text-4xl font-black italic tracking-tighter text-blue-500 mb-2">PLAY SECTOR</h1>
            <p class="text-gray-500 text-xs uppercase tracking-widest">Select your training simulation</p>
        </div>

        <div class="game-grid">
            <!-- Ragdoll Hit -->
            <div onclick="launchGame('Ragdoll Hit')" class="game-btn">
                <img src="/storage/photos/rh.png" class="game-icon" alt="RH">
                <span class="game-title">Ragdoll Hit</span>
            </div>

            <!-- Cookie Clicker -->
            <div onclick="launchGame('Cookie Clicker')" class="game-btn">
                <img src="/storage/photos/cc.png" class="game-icon" alt="CC">
                <span class="game-title">Cookie Clicker</span>
            </div>

            <!-- Geometry Dash -->
            <div onclick="launchGame('Geometry Dash')" class="game-btn">
                <img src="/storage/photos/gd.png" class="game-icon" alt="GD">
                <span class="game-title">Geometry Dash</span>
            </div>

            <!-- PolyTrack -->
            <div onclick="launchGame('PolyTrack')" class="game-btn">
                <img src="/storage/photos/polytrack.png" class="game-icon" alt="PT">
                <span class="game-title">PolyTrack</span>
            </div>

            <!-- Minecraft -->
            <div onclick="launchGame('Minecraft')" class="game-btn">
                <img src="/storage/photos/minecraft.png" class="game-icon" alt="MC">
                <span class="game-title">Minecraft</span>
            </div>

            <!-- Ragdoll Melon -->
            <div onclick="launchGame('Ragdoll Melon')" class="game-btn">
                <img src="/storage/photos/rm.png" class="game-icon" alt="CC">
                <span class="game-title">Ragdoll Melon</span>
            </div>
        </div>
    </main>

    <!-- Taskbar -->
    <nav id="main-taskbar" class="taskbar fixed bottom-0 left-0 w-full h-16 flex items-center justify-around px-4">
        <button onclick="navTo('home')" class="nav-item flex flex-col items-center">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] mt-1">Home</span>
        </button>
        <button onclick="navTo('play')" class="nav-item active flex flex-col items-center">
            <i class="fa-solid fa-gamepad text-xl"></i>
            <span class="text-[10px] mt-1">Play</span>
        </button>
        <button onclick="navTo('chat')" class="nav-item flex flex-col items-center">
            <i class="fa-solid fa-comment-dots text-xl"></i>
            <span class="text-[10px] mt-1">Chat</span>
        </button>
        <button onclick="navTo('call')" class="nav-item flex flex-col items-center">
            <i class="fa-solid fa-phone text-xl"></i>
            <span class="text-[10px] mt-1">Call</span>
        </button>
        <button onclick="navTo('account')" class="nav-item flex flex-col items-center">
            <div id="pfp-slot" class="pfp-container">
                <i class="fa-solid fa-user text-lg"></i>
            </div>
            <span class="text-[10px] mt-1">Account</span>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const pfpSlot = document.getElementById('pfp-slot');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email && user.email.endsWith('@gmail.com')) {
                    pfpSlot.innerHTML = `<img src="${user.photoURL}" class="w-full h-full object-cover">`;
                } else {
                    const initials = user.displayName ? user.displayName.split(' ').map(n => n[0]).join('').toUpperCase() : "TC";
                    pfpSlot.innerHTML = `<span>${initials}</span>`;
                }
            }
        });
    </script>

    <script>
        function navTo(page) {
            const loader = document.getElementById('nav-loader');
            const statusLabel = document.getElementById('loader-status');
            const url = page === 'home' ? '/home/' : `/${page}/`;
            
            statusLabel.innerText = `Loading ${page}...`;
            loader.style.display = 'flex';
            loader.style.opacity = '1';

            setTimeout(() => {
                if (window.self !== window.top) {
                    window.parent.postMessage({ type: 'NAVIGATE', url: url }, '*');
                } else {
                    window.location.href = url;
                }
            }, 600);
        }

        function launchGame(gameName) {
            // Converts "Cookie Clicker" to "cookie-clicker/"
            const slug = gameName.toLowerCase().replace(/\s+/g, '-') + '/';
            navTo(`play/${slug}`);
        }
    </script>
</body>
</html>
