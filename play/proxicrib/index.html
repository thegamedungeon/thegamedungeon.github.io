<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module" src="storage/js/vpn.js>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyCrib | The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif;
        }

        /* Android-style Zoom Animation */
        @keyframes appLaunch {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #splash-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121212;
            z-index: 50;
            transition: opacity 0.5s ease;
        }

        .launch-logo {
            animation: appLaunch 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        #game-layout {
            display: none; 
            height: 100vh;
            width: 100vw;
        }

        #gameFrame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="splash-overlay">
        <img src="/storage/photos/proxycrib.png" class="launch-logo" id="logo" onerror="this.src='/storage/photos/cc.png'">
    </div>

    <div id="game-layout">
        <iframe id="gameFrame" src="about:blank" allowfullscreen></iframe>
    </div>

    <script type="module">
        // FIX: Using 10.7.1 to match stats.html and main site
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        // FIX: Pointing to the NEW tracker that writes to the correct 'playtime' collection
        import { initTracker } from "/storage/js/tracker.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        
        // This kicks off the minute-by-minute tracking
        initTracker("ProxyCrib");

        const splash = document.getElementById('splash-overlay');
        const layout = document.getElementById('game-layout');
        const iframe = document.getElementById('gameFrame');

        window.onload = () => {
            iframe.src = "/storage/proxy-main/index.html";

            setTimeout(() => {
                splash.style.opacity = '0';
                layout.style.display = 'block';
                
                setTimeout(() => {
                    splash.remove();
                }, 500);
            }, 1500);
        };
    </script>
</body>
</html>
