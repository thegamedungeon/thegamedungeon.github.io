<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tunnel | Game #12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tab-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 8px 8px 0 0;
            max-width: 150px;
        }
        .tab-btn.active {
            background: rgba(51, 65, 85, 0.9);
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
        }
        .url-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.2s;
        }
        .url-input:focus {
            border-color: #38bdf8;
            outline: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }
        .status-online { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-offline { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        
        /* Hide scrollbars for a cleaner look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <div class="flex flex-col h-full">
        <!-- Header / Tab Bar -->
        <div class="glass-panel flex items-center px-4 pt-2 gap-2 overflow-x-auto no-scrollbar">
            <div id="tabs-container" class="flex gap-1">
                <!-- Tabs will be injected here -->
            </div>
            <button onclick="addTab()" id="add-tab-btn" class="p-2 hover:bg-slate-700 rounded-full transition-colors text-slate-400">
                <i class="fas fa-plus text-xs"></i>
            </button>
            <div class="ml-auto flex items-center gap-4 text-xs font-bold text-slate-500 uppercase tracking-widest pb-2">
                <span>Proxicrib</span>
                <div id="proxy-status-container" class="flex items-center">
                    <span id="status-dot" class="status-dot status-offline"></span>
                    <span id="status-text">Engine Offline</span>
                </div>
            </div>
        </div>

        <div class="glass-panel p-2 flex items-center gap-3">
            <div class="flex gap-2">
                <button onclick="navBack()" class="p-2 hover:bg-slate-700 rounded-lg text-slate-400"><i class="fas fa-chevron-left"></i></button>
                <button onclick="navForward()" class="p-2 hover:bg-slate-700 rounded-lg text-slate-400"><i class="fas fa-chevron-right"></i></button>
                <button onclick="refreshTab()" class="p-2 hover:bg-slate-700 rounded-lg text-slate-400"><i class="fas fa-redo"></i></button>
            </div>
            <div class="flex-1 relative">
                <input type="text" id="url-input" 
                       class="url-input w-full py-1.5 px-4 rounded-full text-sm text-slate-200" 
                       placeholder="Search Google or enter a URL..."
                       onkeydown="if(event.key === 'Enter') go()">
            </div>
            <button onclick="go()" class="bg-sky-600 hover:bg-sky-500 px-4 py-1.5 rounded-full text-sm font-bold transition-colors">GO</button>
        </div>

        <div id="viewport-container" class="flex-1 relative bg-white">
            <!-- Home Screen (Shows when no URL is loaded) -->
            <div id="home-screen" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center text-center p-6 z-10">
                <div class="mb-8">
                    <i class="fas fa-shield-alt text-6xl text-sky-500 mb-4"></i>
                    <h1 class="text-4xl font-black italic tracking-tighter mb-2">THE TUNNEL</h1>
                    <p class="text-slate-400 max-w-md">Game #12: Network Simulation & Stealth Access Hub. Use the URL bar above to begin.</p>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full max-w-2xl">
                    <button onclick="quickLink('https://google.com')" class="p-4 bg-slate-800 rounded-xl hover:bg-slate-700 transition-all border border-slate-700">
                        <i class="fab fa-google text-2xl mb-2"></i>
                        <div class="text-xs font-bold">Google</div>
                    </button>
                    <button onclick="quickLink('https://now.gg')" class="p-4 bg-slate-800 rounded-xl hover:bg-slate-700 transition-all border border-slate-700">
                        <i class="fas fa-gamepad text-2xl mb-2"></i>
                        <div class="text-xs font-bold">Now.gg</div>
                    </button>
                    <button onclick="quickLink('https://youtube.com')" class="p-4 bg-slate-800 rounded-xl hover:bg-slate-700 transition-all border border-slate-700">
                        <i class="fab fa-youtube text-2xl mb-2"></i>
                        <div class="text-xs font-bold">YouTube</div>
                    </button>
                    <button onclick="quickLink('https://discord.com')" class="p-4 bg-slate-800 rounded-xl hover:bg-slate-700 transition-all border border-slate-700">
                        <i class="fab fa-discord text-2xl mb-2"></i>
                        <div class="text-xs font-bold">Discord</div>
                    </button>
                </div>
                <p class="mt-8 text-slate-600 text-xs uppercase tracking-widest">Powered by Scramjet & Wisp Engine</p>
            </div>
            
            <!-- IFrames will be dynamically added here -->
        </div>
    </div>

    <script>
        // CONFIGURATION: Using your hydrovolter wisp server
        const WISP_URL = "wss://admin.proxy.hydrovolter.com/scramjet/wisp/";
        
        async function registerSW() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            if ('serviceWorker' in navigator) {
                try {
                    // Registration assumes files are in /service/ folder
                    await navigator.serviceWorker.register('service/sw.js', {
                        scope: 'service/'
                    });
                    statusDot.className = 'status-dot status-online';
                    statusText.innerText = 'Engine Active';
                    statusText.className = 'text-green-500 animate-pulse';
                    console.log('Scramjet Service Worker registered!');
                } catch (err) {
                    statusDot.className = 'status-dot status-offline';
                    statusText.innerText = 'Engine Offline';
                    console.error('SW registration failed. Make sure files are in /service/ folder.');
                }
            }
        }

        let tabs = [
            { id: 1, title: "New Tab", url: "", active: true }
        ];
        let currentTabId = 1;

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            
            tabs.forEach(tab => {
                const btn = document.createElement('div');
                btn.className = `tab-btn flex items-center gap-2 px-4 py-2 text-sm font-medium cursor-pointer ${tab.active ? 'active' : 'text-slate-400 hover:bg-slate-800'}`;
                btn.onclick = () => switchTab(tab.id);
                
                btn.innerHTML = `
                    <span class="truncate max-w-[100px]">${tab.title}</span>
                    <i class="fas fa-times hover:text-red-400" onclick="event.stopPropagation(); closeTab(${tab.id})"></i>
                `;
                container.appendChild(btn);
            });
            
            // Show/Hide Add button based on tab count (limit 5)
            document.getElementById('add-tab-btn').style.display = tabs.length >= 5 ? 'none' : 'block';
        }

        function addTab() {
            if (tabs.length >= 5) return;
            const newId = Math.max(...tabs.map(t => t.id), 0) + 1;
            tabs.forEach(t => t.active = false);
            tabs.push({ id: newId, title: "New Tab", url: "", active: true });
            currentTabId = newId;
            renderTabs();
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('url-input').value = '';
            updateIframeVisibility();
        }

        function switchTab(id) {
            tabs.forEach(t => {
                t.active = t.id === id;
            });
            currentTabId = id;
            const activeTab = tabs.find(t => t.id === id);
            document.getElementById('url-input').value = activeTab.url;
            
            if (!activeTab.url) {
                document.getElementById('home-screen').classList.remove('hidden');
            } else {
                document.getElementById('home-screen').classList.add('hidden');
            }
            
            renderTabs();
            updateIframeVisibility();
        }

        function closeTab(id) {
            if (tabs.length === 1) return;
            const index = tabs.findIndex(t => t.id === id);
            const wasActive = tabs[index].active;
            
            // Remove iframe
            const iframe = document.getElementById(`iframe-${id}`);
            if (iframe) iframe.remove();
            
            tabs.splice(index, 1);
            
            if (wasActive) {
                switchTab(tabs[Math.max(0, index - 1)].id);
            } else {
                renderTabs();
            }
        }

        function updateIframeVisibility() {
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                if (iframe.id === `iframe-${currentTabId}`) {
                    iframe.classList.remove('hidden');
                } else {
                    iframe.classList.add('hidden');
                }
            });
        }

        function createIframe(id) {
            const ifr = document.createElement('iframe');
            ifr.id = `iframe-${id}`;
            ifr.className = 'hidden';
            document.getElementById('viewport-container').appendChild(ifr);
        }

        function quickLink(url) {
            document.getElementById('url-input').value = url;
            go();
        }

        function go() {
            const input = document.getElementById('url-input').value.trim();
            if (!input) return;

            let url = input;
            // Handle search vs direct URL
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                if (url.includes('.') && !url.includes(' ')) {
                    url = 'https://' + url;
                } else {
                    url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
                }
            }

            const activeTab = tabs.find(t => t.id === currentTabId);
            activeTab.url = url;
            try {
                activeTab.title = new URL(url).hostname;
            } catch(e) {
                activeTab.title = "Searching...";
            }

            // ENCODING: This is how Scramjet handles URLs. 
            // We prepend /service/ which is intercepted by the SW
            const proxiedUrl = window.location.origin + 'service/' + btoa(url).replace(/\//g, '_').replace(/\+/g, '-').replace(/=/g, '');
            
            let iframe = document.getElementById(`iframe-${currentTabId}`);
            if (!iframe) {
                createIframe(currentTabId);
                iframe = document.getElementById(`iframe-${currentTabId}`);
            }
            
            iframe.src = proxiedUrl;
            document.getElementById('home-screen').classList.add('hidden');
            iframe.classList.remove('hidden');
            renderTabs();
        }

        function navBack() {
            const iframe = document.getElementById(`iframe-${currentTabId}`);
            if (iframe) iframe.contentWindow.history.back();
        }

        function navForward() {
            const iframe = document.getElementById(`iframe-${currentTabId}`);
            if (iframe) iframe.contentWindow.history.forward();
        }

        function refreshTab() {
            const iframe = document.getElementById(`iframe-${currentTabId}`);
            if (iframe) iframe.src = iframe.src;
        }

        // Initialize
        window.onload = () => {
            registerSW();
            createIframe(1);
            renderTabs();
        };
    </script>
</body>
</html>
