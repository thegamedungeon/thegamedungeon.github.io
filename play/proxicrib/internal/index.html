<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tunnel | Game #12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tab-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 8px 8px 0 0;
            max-width: 160px;
            cursor: pointer;
            position: relative;
        }
        .tab-btn.active {
            background: #1e293b;
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
        }
        .url-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }
        .url-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            outline: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            display: none;
        }
        iframe.active {
            display: block;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-online { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-offline { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col h-full">

    <div class="glass-panel flex items-center px-4 pt-2 gap-2 overflow-x-auto no-scrollbar">
        <div id="tabs-container" class="flex gap-1">
            <!-- Tabs injected here -->
        </div>
        <button onclick="addTab()" id="add-tab-btn" class="p-2 hover:bg-slate-700 rounded-full transition-colors text-slate-400">
            <i class="fas fa-plus text-xs"></i>
        </button>
        
        <div class="ml-auto flex items-center gap-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest pb-2">
            <div class="flex items-center">
                <span id="status-dot" class="status-dot status-offline"></span>
                <span id="status-text">Engine Off</span>
            </div>
            <span class="hidden sm:inline">Game #12</span>
        </div>
    </div>

    <div class="glass-panel p-2 flex items-center gap-3">
        <div class="flex gap-1">
            <button onclick="navBack()" class="p-2 hover:bg-slate-700 rounded-lg text-slate-400 transition-colors"><i class="fas fa-arrow-left"></i></button>
            <button onclick="navForward()" class="p-2 hover:bg-slate-700 rounded-lg text-slate-400 transition-colors"><i class="fas fa-arrow-right"></i></button>
            <button onclick="refreshTab()" class="p-2 hover:bg-slate-700 rounded-lg text-slate-400 transition-colors"><i class="fas fa-redo-alt"></i></button>
        </div>
        
        <div class="flex-1 relative">
            <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-600 text-xs"></i>
            <input type="text" id="url-input" 
                   class="url-input w-full py-1.5 pl-8 pr-4 rounded-full text-sm text-slate-200" 
                   placeholder="Enter URL or Search..."
                   onkeydown="if(event.key === 'Enter') go()">
        </div>
        
        <button onclick="go()" class="bg-sky-600 hover:bg-sky-500 px-6 py-1.5 rounded-full text-sm font-black italic transition-all active:scale-95">GO</button>
    </div>

    <div id="viewport-container" class="flex-1 relative bg-slate-950">
        <!-- Home Screen -->
        <div id="home-screen" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-0">
            <div class="mb-8 animate-pulse">
                <i class="fas fa-bolt text-5xl text-sky-500 mb-4"></i>
                <h1 class="text-3xl font-black italic tracking-tighter">TUNNEL ENGINE</h1>
                <p class="text-slate-500 text-xs uppercase tracking-[0.2em] mt-1">Proxicrib Internal System</p>
            </div>
            
            <div class="grid grid-cols-2 gap-3 w-full max-w-md">
                <button onclick="quickLink('https://google.com')" class="p-3 bg-slate-900/50 border border-slate-800 rounded-xl hover:border-sky-500 transition-all">
                    <i class="fab fa-google text-xl text-slate-400"></i>
                </button>
                <button onclick="quickLink('https://now.gg')" class="p-3 bg-slate-900/50 border border-slate-800 rounded-xl hover:border-sky-500 transition-all">
                    <i class="fas fa-gamepad text-xl text-slate-400"></i>
                </button>
                <button onclick="quickLink('https://youtube.com')" class="p-3 bg-slate-900/50 border border-slate-800 rounded-xl hover:border-sky-500 transition-all">
                    <i class="fab fa-youtube text-xl text-slate-400"></i>
                </button>
                <button onclick="quickLink('https://discord.com')" class="p-3 bg-slate-900/50 border border-slate-800 rounded-xl hover:border-sky-500 transition-all">
                    <i class="fab fa-discord text-xl text-slate-400"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let tabs = [{ id: Date.now(), title: "New Tab", url: "", active: true }];
        const MAX_TABS = 5;

        function updateStatus() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(regs => {
                    const active = regs.some(r => r.active && r.scope.includes('service'));
                    const dot = document.getElementById('status-dot');
                    const text = document.getElementById('status-text');
                    
                    if (active) {
                        dot.className = 'status-dot status-online';
                        text.innerText = 'Engine Active';
                        text.className = 'text-green-500';
                    } else {
                        dot.className = 'status-dot status-offline';
                        text.innerText = 'Engine Off';
                    }
                });
            }
        }

        function render() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            
            tabs.forEach(tab => {
                const btn = document.createElement('div');
                btn.className = `tab-btn flex items-center gap-2 px-4 py-2 text-xs font-bold ${tab.active ? 'active' : 'text-slate-500'}`;
                btn.onclick = () => switchTab(tab.id);
                
                btn.innerHTML = `
                    <span class="truncate max-w-[80px]">${tab.title}</span>
                    <i class="fas fa-times hover:text-red-500 transition-colors" onclick="event.stopPropagation(); closeTab(${tab.id})"></i>
                `;
                container.appendChild(btn);
            });

            document.getElementById('add-tab-btn').style.display = tabs.length >= MAX_TABS ? 'none' : 'block';
            updateStatus();
        }

        function addTab() {
            if (tabs.length >= MAX_TABS) return;
            tabs.forEach(t => t.active = false);
            const id = Date.now();
            tabs.push({ id, title: "New Tab", url: "", active: true });
            render();
            switchTab(id);
        }

        function switchTab(id) {
            tabs.forEach(t => t.active = t.id === id);
            const activeTab = tabs.find(t => t.id === id);
            
            document.getElementById('url-input').value = activeTab.url;
            document.getElementById('home-screen').style.display = activeTab.url ? 'none' : 'flex';
            
            document.querySelectorAll('iframe').forEach(ifr => {
                ifr.classList.toggle('active', ifr.id === `ifr-${id}`);
            });
            render();
        }

        function closeTab(id) {
            if (tabs.length === 1) return;
            const idx = tabs.findIndex(t => t.id === id);
            const wasActive = tabs[idx].active;
            
            const ifr = document.getElementById(`ifr-${id}`);
            if (ifr) ifr.remove();
            
            tabs.splice(idx, 1);
            if (wasActive) switchTab(tabs[Math.max(0, idx - 1)].id);
            else render();
        }

        function go() {
            const input = document.getElementById('url-input').value.trim();
            if (!input) return;

            // Simple search logic
            const url = input.includes('.') && !input.includes(' ') 
                ? (input.startsWith('http') ? input : 'https://' + input) 
                : 'https://www.google.com/search?q=' + encodeURIComponent(input);
            
            const activeTab = tabs.find(t => t.active);
            activeTab.url = url;
            try {
                activeTab.title = new URL(url).hostname;
            } catch {
                activeTab.title = "Searching...";
            }

            let ifr = document.getElementById(`ifr-${activeTab.id}`);
            if (!ifr) {
                ifr = document.createElement('iframe');
                ifr.id = `ifr-${activeTab.id}`;
                document.getElementById('viewport-container').appendChild(ifr);
            }
            
            // CRITICAL: Pointing to the Bridge gateway to prevent 404
            ifr.src = `./bridge.html?url=${encodeURIComponent(url)}`;
            ifr.classList.add('active');
            document.getElementById('home-screen').style.display = 'none';
            render();
        }

        function quickLink(url) {
            document.getElementById('url-input').value = url;
            go();
        }

        function navBack() {
            const activeTab = tabs.find(t => t.active);
            const ifr = document.getElementById(`ifr-${activeTab.id}`);
            if (ifr) ifr.contentWindow.history.back();
        }

        function navForward() {
            const activeTab = tabs.find(t => t.active);
            const ifr = document.getElementById(`ifr-${activeTab.id}`);
            if (ifr) ifr.contentWindow.history.forward();
        }

        function refreshTab() {
            const activeTab = tabs.find(t => t.active);
            const ifr = document.getElementById(`ifr-${activeTab.id}`);
            if (ifr) ifr.src = ifr.src;
        }

        // Initialize
        window.onload = () => {
            render();
            setInterval(updateStatus, 3000);
        };
    </script>
</body>
</html>
