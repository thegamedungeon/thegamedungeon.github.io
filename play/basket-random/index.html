<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basket Random | The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        
        body {
            background-color: #000; /* Pitch black for that sleek launch feel */
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden; /* Prevent scrolling during launch */
        }

        /* The Android-style Zoom Animation */
        @keyframes appLaunch {
            0% {
                transform: scale(0.2);
                opacity: 0;
            }
            70% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Fade out the logo before game shows */
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        .launch-logo {
            animation: appLaunch 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .fade-out {
            animation: fadeOut 0.4s ease forwards;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none; /* Hidden until launch finishes */
            z-index: 10;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #splash-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121212;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div id="splash-overlay">
        <img src="/storage/photos/br.png" alt="Basket Random" class="launch-logo" id="logo">
    </div>

    <div id="game-container">
        <iframe id="gameFrame" src="/storage/BasketRandom-main/"></iframe>
    </div>

    <script>
        const splash = document.getElementById('splash-overlay');
        const logo = document.getElementById('logo');
        const container = document.getElementById('game-container');
        const iframe = document.getElementById('gameFrame');

        // Start the sequence
        window.addEventListener('load', () => {
            // 1. Wait for the "Zoom" animation to almost finish (600ms)
            setTimeout(() => {
                // 2. Start fading out the splash screen
                splash.classList.add('fade-out');
                
                // 3. Show the game container and set the source
                container.style.display = 'block';
                iframe.src = "/storage/cookieclick-main/index.html";
                
                // 4. Fully remove splash from DOM after fade finishes to save memory
                setTimeout(() => {
                    splash.remove();
                    document.body.style.overflow = 'auto';
                }, 400);

            }, 1000); // 1 second total "hype" time before game loads
        });
    </script>
</body>
</html>
