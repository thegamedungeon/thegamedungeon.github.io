<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basket Random | The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/storage/js/fs.js" defer></script>
    <script type="module" src="/storage/js/status.js" data-game="Basket Random"></script>
    <style>
        body { background-color: #0b0b0b; color: #ffffff; font-family: 'Inter', sans-serif; overflow: hidden; }
        #game-wrapper { transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: scale(0); opacity: 0; width: 0; height: 0; }
        #game-wrapper.expanded { transform: scale(1); opacity: 1; width: 100vw; height: 100vh; }
        
        #side-drawer {
            position: fixed; right: 0; top: 50%; transform: translateY(-50%) translateX(100%);
            background: #1e1e1e; border: 1px solid #3b82f6; border-right: none;
            padding: 1rem; border-radius: 12px 0 0 12px; transition: transform 0.3s ease; z-index: 100;
        }
        #side-drawer.open { transform: translateY(-50%) translateX(0); }
        
        #music-panel {
            position: fixed; right: 0; top: 0; bottom: 0; width: 320px;
            background: #000; transform: translateX(100%); transition: transform 0.3s ease; z-index: 120;
        }
        #music-panel.open { transform: translateX(0); }
        
        .modal-bg { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center">

    <div id="loading-screen" class="fixed inset-0 bg-black z-[200] flex items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
    </div>

    <div id="launcher-menu" class="flex flex-col items-center space-y-6 fade-in">
        <img src="/storage/photos/br.png" alt="Basket Random" class="w-48 h-48 rounded-2xl border-4 border-blue-500 shadow-2xl shadow-blue-500/20">
        <h1 class="text-4xl font-black italic text-blue-500 tracking-tighter">BASKET RANDOM</h1>
        <div class="flex space-x-4">
            <a href="/play/" class="px-8 py-3 bg-neutral-800 hover:bg-neutral-700 font-bold rounded-xl transition-all border border-white/10">BACK</a>
            <button onclick="launchGame()" class="px-12 py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl transition-all shadow-lg shadow-blue-600/30">PLAY</button>
            <a href="/play/basket-random/?fs=true" class="px-8 py-3 bg-green-800 hover:bg-neutral-700 font-bold rounded-xl transition-all border border-white/10">FULLSCREEN</a>
        </div>
    </div>

    <div id="game-wrapper" class="fixed inset-0 z-50 flex items-center justify-center bg-black">
        <iframe id="game-frame" src="" class="w-full h-full border-none"></iframe>
    </div>

    <div id="side-drawer">
        <div class="flex flex-col gap-4">
            <button onclick="toggleMusic()" class="text-blue-500 font-bold">MUSIC</button>
            <button onclick="toggleQuitMenu()" class="text-red-500 font-bold">QUIT</button>
        </div>
    </div>

    <div id="music-panel">
        <iframe src="/music/" class="w-full h-full border-none"></iframe>
        <button onclick="toggleMusic()" class="absolute top-2 left-2 text-white bg-red-600 px-2 py-1 rounded">X</button>
    </div>

    <div id="quit-modal" class="fixed inset-0 z-[110] hidden flex items-center justify-center modal-bg">
        <div class="bg-neutral-900 border border-white/10 p-8 rounded-2xl text-center space-y-6 shadow-2xl">
            <h2 class="text-2xl font-bold tracking-tight">ARE YOU SURE?</h2>
            <div class="flex space-x-4 justify-center">
                <button onclick="closeModal()" class="px-8 py-2 bg-neutral-800 rounded-lg font-bold hover:bg-neutral-700">NO</button>
                <button onclick="confirmQuit()" class="px-8 py-2 bg-red-600 rounded-lg font-bold hover:bg-red-500">YES</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Fail-safe: hide loading screen after 3 seconds anyway
        const failSafe = setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
        }, 3000);

        onAuthStateChanged(auth, (user) => {
            clearTimeout(failSafe);
            if (!user) {
                window.location.href = "/account/login/";
            } else {
                document.getElementById('loading-screen').style.display = 'none';
            }
        });

        window.launchGame = () => {
            document.getElementById('game-frame').src = "/storage/basran-m-ma-mai-main/";
            document.getElementById('game-wrapper').classList.add('expanded');
            document.getElementById('side-drawer').classList.add('open');
        };

        window.toggleMusic = () => document.getElementById('music-panel').classList.toggle('open');
        window.toggleQuitMenu = () => document.getElementById('quit-modal').classList.remove('hidden');
        window.closeModal = () => document.getElementById('quit-modal').classList.add('hidden');
        
        window.confirmQuit = () => {
            closeModal();
            document.getElementById('side-drawer').classList.remove('open');
            document.getElementById('music-panel').classList.remove('open');
            document.getElementById('game-wrapper').classList.remove('expanded');
            setTimeout(() => document.getElementById('game-frame').src = "", 600);
        };
    </script>
</body>
</html>
