<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE HALL OF RECORDS | THE CRIB</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #0f0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f0;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .back-btn {
            color: #0f0;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #0f0;
            padding: 5px 10px;
        }

        h1 {
            text-shadow: 0 0 15px #0f0;
            letter-spacing: 3px;
        }

        .total-box {
            background: #222;
            border: 2px solid #0f0;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 40px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        .total-time {
            font-size: 3em;
            font-weight: bold;
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .game-card {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 12px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .game-card:hover {
            border-color: #0f0;
            transform: translateY(-3px);
            background: #333;
        }

        .game-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid #444;
            background: #111;
        }

        .game-info {
            flex-grow: 1;
        }

        .game-name {
            font-size: 0.9em;
            display: block;
            text-transform: uppercase;
            color: #0f0;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .game-hours {
            font-size: 1.4em;
            color: #fff;
            font-weight: bold;
        }

        .progress-bar {
            height: 6px;
            background: #111;
            margin-top: 8px;
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
        }

        .progress-fill {
            height: 100%;
            background: #0f0;
            width: 0%;
            transition: width 1s ease-in-out;
            box-shadow: 0 0 8px #0f0;
        }

        .roast-footer {
            margin-top: 50px;
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../" class="back-btn">← RETURN TO VAULT</a>
        <div id="user-info" style="font-size: 0.9em;">Hero: Authenticating...</div>
    </div>

    <h1>VAULT CHRONOMETER</h1>

    <div class="total-box">
        <span style="font-size: 0.9em; color: #888;">TOTAL TIME IN THE CRIB</span>
        <span class="total-time" id="total-dungeon-time">0.0h</span>
    </div>

    <div class="grid" id="stats-grid">
        <p style="color: #666; grid-column: 1/-1;">Unlocking the archives...</p>
    </div>

    <p class="roast-footer">
        Icon data synced via /storage/photos/pictures.txt<br>
        Connor is still a bot. Oink oink.
    </p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // MAP FOR PICTURES
        let iconMap = {};
        const MISSING_ICON = "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/iOS_iOS_7_icon_grid.svg/1024px-iOS_iOS_7_icon_grid.svg.png";

        // Step 1: Fetch the pictures.txt mapping
        async function loadIconMap() {
            try {
                const response = await fetch('/storage/photos/pictures.txt');
                const text = await response.text();
                const lines = text.split('\n');
                lines.forEach(line => {
                    if (line.includes('=')) {
                        const [name, fileName] = line.split('=').map(s => s.trim());
                        iconMap[name.toLowerCase()] = `/storage/photos/${fileName}`;
                    }
                });
                console.log("Icon Map Loaded:", iconMap);
            } catch (e) {
                console.error("Failed to load icon map:", e);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('user-info').innerText = `Hero: ${user.displayName || 'Warrior'}`;
                await loadIconMap(); // Ensure we have the map before loading stats
                loadStats(user.uid);
            } else {
                setTimeout(() => window.location.href = "../../login/", 2000);
            }
        });

        function loadStats(uid) {
            const statsDoc = doc(db, "playtime", uid);

            onSnapshot(statsDoc, (docSnap) => {
                const grid = document.getElementById('stats-grid');
                
                if (!docSnap.exists()) {
                    grid.innerHTML = '<p style="color: #888; grid-column: 1/-1;">No records found. Grind more.</p>';
                    return;
                }

                grid.innerHTML = '';
                const data = docSnap.data(); 
                let totalMinutes = 0;
                let maxMinutes = 1;

                const validEntries = Object.entries(data).filter(([_, val]) => typeof val === 'number');

                validEntries.forEach(([_, mins]) => {
                    totalMinutes += mins;
                    if (mins > maxMinutes) maxMinutes = mins;
                });

                validEntries.sort((a, b) => b[1] - a[1]).forEach(([gameName, minutes]) => {
                    const hours = (minutes / 60).toFixed(1);
                    const percentage = (minutes / maxMinutes) * 100;
                    
                    // Determine which icon to use
                    let iconUrl = iconMap[gameName.toLowerCase()] || MISSING_ICON;
                    
                    // Specific check for the vaulted Basket Random
                    if (gameName.toLowerCase().includes("basket random")) {
                        iconUrl = MISSING_ICON; 
                    }

                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <img src="${iconUrl}" class="game-icon" onerror="this.src='${MISSING_ICON}'">
                        <div class="game-info">
                            <span class="game-name">${gameName}</span>
                            <span class="game-hours">${hours}h</span>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${percentage}%"></div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                document.getElementById('total-dungeon-time').innerText = (totalMinutes / 60).toFixed(1) + "h";
            });
        }
    </script>
</body>
</html>
