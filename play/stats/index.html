<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module" src="storage/js/vpn.js>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE HALL OF RECORDS | THE CRIB</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #0f0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f0;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .back-btn {
            color: #0f0;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #0f0;
            padding: 5px 10px;
        }

        h1 {
            text-shadow: 0 0 15px #0f0;
            letter-spacing: 3px;
        }

        .total-box {
            background: #222;
            border: 2px solid #0f0;
            padding: 20px 30px;
            border-radius: 15px;
            display: inline-flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            text-align: left;
        }

        .total-icon {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            border: 1px solid #0f0;
            object-fit: cover;
        }

        .total-text-group {
            display: flex;
            flex-direction: column;
        }

        .total-time {
            font-size: 3em;
            font-weight: bold;
            line-height: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 12px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .game-card:hover {
            border-color: #0f0;
            transform: translateY(-3px);
            background: #333;
        }

        .game-icon {
            width: 65px;
            height: 65px;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid #444;
            background: #111;
            flex-shrink: 0;
        }

        .game-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .game-name {
            font-size: 0.85em;
            display: block;
            text-transform: uppercase;
            color: #0f0;
            font-weight: bold;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-hours {
            font-size: 1.4em;
            color: #fff;
            font-weight: bold;
        }

        .progress-bar {
            height: 6px;
            background: #111;
            margin-top: 8px;
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
        }

        .progress-fill {
            height: 100%;
            background: #0f0;
            width: 0%;
            transition: width 1s ease-in-out;
            box-shadow: 0 0 8px #0f0;
        }

        .roast-footer {
            margin-top: 50px;
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../../" class="back-btn">← RETURN TO VAULT</a>
        <div id="user-info" style="font-size: 0.9em;">Hero: Authenticating...</div>
    </div>

    <h1>VAULT CHRONOMETER</h1>

    <div class="total-box">
        <!-- THE GAME DUNGEON PHOTO ADDED HERE -->
        <img src="/storage/photos/tgdtc.png" class="total-icon" id="dungeon-main-photo" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/iOS_iOS_7_icon_grid.svg/1024px-iOS_iOS_7_icon_grid.svg.png'">
        <div class="total-text-group">
            <span style="font-size: 0.9em; color: #888;">TOTAL TIME IN THE CRIB</span>
            <span class="total-time" id="total-dungeon-time">0.0h</span>
        </div>
    </div>

    <div class="grid" id="stats-grid">
        <p style="color: #666; grid-column: 1/-1;">Parsing storage protocols...</p>
    </div>

    <p class="roast-footer">
        Dungeon Mapping: /storage/photos/pictures.txt<br>
        Connor's IQ is still a 404 error. Oink oink.
    </p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let iconMap = {};
        const MISSING_ICON = "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/iOS_iOS_7_icon_grid.svg/1024px-iOS_iOS_7_icon_grid.svg.png";

        async function loadIconMap() {
            try {
                const response = await fetch('/storage/photos/pictures.txt?v=' + Date.now());
                if (!response.ok) throw new Error("File not found");
                
                const text = await response.text();
                text.split('\n').forEach(line => {
                    if (line.includes('=')) {
                        const [name, file] = line.split('=').map(s => s.trim().toLowerCase());
                        iconMap[name] = `/storage/photos/${file}`;
                    }
                });
                
                // Also check if "The Game Dungeon" has a specific icon override in the txt
                if (iconMap['the game dungeon']) {
                    document.getElementById('dungeon-main-photo').src = iconMap['the game dungeon'];
                }
                
                console.log("Vault Mapping Secured:", iconMap);
            } catch (e) {
                console.warn("Falling back to manual pathing logic...", e);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('user-info').innerText = `Hero: ${user.displayName || 'Warrior'}`;
                await loadIconMap(); 
                loadStats(user.uid);
            } else {
                window.location.href = "../../login/";
            }
        });

        function loadStats(uid) {
            const statsDoc = doc(db, "playtime", uid);

            onSnapshot(statsDoc, (docSnap) => {
                const grid = document.getElementById('stats-grid');
                if (!docSnap.exists()) {
                    grid.innerHTML = '<p style="color: #888; grid-column: 1/-1;">No data found in the archive.</p>';
                    return;
                }

                grid.innerHTML = '';
                const data = docSnap.data(); 
                let totalMinutes = 0;
                let maxMinutes = 1;

                const entries = Object.entries(data).filter(([_, val]) => typeof val === 'number');
                entries.forEach(([_, mins]) => {
                    totalMinutes += mins;
                    if (mins > maxMinutes) maxMinutes = mins;
                });

                entries.sort((a, b) => b[1] - a[1]).forEach(([gameName, minutes]) => {
                    const hours = (minutes / 60).toFixed(1);
                    const percentage = (minutes / maxMinutes) * 100;
                    const cleanName = gameName.trim().toLowerCase();
                    
                    let iconUrl = iconMap[cleanName];
                    
                    if (cleanName.includes("basket random")) {
                        iconUrl = MISSING_ICON;
                    }

                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <img src="${iconUrl || MISSING_ICON}" class="game-icon" onerror="this.src='${MISSING_ICON}'">
                        <div class="game-info">
                            <span class="game-name">${gameName}</span>
                            <span class="game-hours">${hours}h</span>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${percentage}%"></div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                document.getElementById('total-dungeon-time').innerText = (totalMinutes / 60).toFixed(1) + "h";
            });
        }
    </script>
</body>
</html>
