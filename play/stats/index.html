<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE HALL OF RECORDS | THE CRIB</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #0f0;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f0;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .back-btn {
            color: #0f0;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #0f0;
            padding: 5px 10px;
        }

        h1 {
            text-shadow: 0 0 15px #0f0;
            letter-spacing: 3px;
        }

        .total-box {
            background: #222;
            border: 2px solid #0f0;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 40px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        .total-time {
            font-size: 3em;
            font-weight: bold;
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .game-card {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 20px;
            border-radius: 10px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            text-align: left;
        }

        .game-card:hover {
            border-color: #0f0;
            transform: translateY(-5px);
        }

        .game-name {
            font-size: 1.1em;
            margin-bottom: 10px;
            display: block;
            text-transform: uppercase;
            color: #0f0;
        }

        .game-hours {
            font-size: 1.5em;
            color: #fff;
            font-weight: bold;
        }

        .progress-bar {
            height: 8px;
            background: #444;
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #0f0;
            width: 0%;
            transition: width 1s ease-in-out;
            box-shadow: 0 0 10px #0f0;
        }

        .roast-footer {
            margin-top: 50px;
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../../" class="back-btn">← RETURN TO VAULT</a>
        <div id="user-info" style="font-size: 0.9em;">Hero: Loading...</div>
    </div>

    <h1>VAULT CHRONOMETER</h1>

    <div class="total-box">
        <span style="font-size: 0.9em; color: #888;">FULL GAME DUNGEON TIME</span>
        <span class="total-time" id="total-dungeon-time">0.0h</span>
    </div>

    <div class="grid" id="stats-grid">
        <p style="color: #666;">Synchronizing with the Vault...</p>
    </div>

    <p class="roast-footer">
        Connor's total time: 0.0h (Too busy being bot-brained).<br>
        Dungeon Status: SECURED.
    </p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-info').innerText = `Hero: ${user.displayName || 'Warrior'}`;
                loadStats(user.uid);
            } else {
                // If not logged in, they can't have stats. Send them to login.
                window.location.href = "../../login/";
            }
        });

        function loadStats(uid) {
            // Path: playtime/{userId}
            // Ensure your tracker.js is updating fields in this document!
            const statsDoc = doc(db, "playtime", uid);

            onSnapshot(statsDoc, (docSnap) => {
                const grid = document.getElementById('stats-grid');
                grid.innerHTML = '';
                
                if (!docSnap.exists()) {
                    grid.innerHTML = '<p style="color: #888; grid-column: 1/-1;">No records found in the archives. Start a game to begin tracking.</p>';
                    document.getElementById('total-dungeon-time').innerText = "0.0h";
                    return;
                }

                const data = docSnap.data(); 
                let totalMinutes = 0;
                let maxMinutes = 1;

                // First pass: find total and max for scaling
                const gameEntries = Object.entries(data);
                gameEntries.forEach(([name, mins]) => {
                    if (typeof mins === 'number') {
                        totalMinutes += mins;
                        if (mins > maxMinutes) maxMinutes = mins;
                    }
                });

                // Second pass: build the UI
                gameEntries.sort((a, b) => b[1] - a[1]).forEach(([gameName, minutes]) => {
                    if (typeof minutes !== 'number') return;

                    const hours = (minutes / 60).toFixed(1);
                    const percentage = (minutes / maxMinutes) * 100;

                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <span class="game-name">${gameName}</span>
                        <span class="game-hours">${hours}h</span>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percentage}%"></div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                document.getElementById('total-dungeon-time').innerText = (totalMinutes / 60).toFixed(1) + "h";
            }, (error) => {
                console.error("Vault Error:", error);
                grid.innerHTML = '<p style="color: #f00;">Error accessing the archives. Check your connection.</p>';
            });
        }
    </script>
</body>
</html>
