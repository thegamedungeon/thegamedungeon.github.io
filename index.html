<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Game Dungeon | CribOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --taskbar-height: 70px;
        }

        body, html { 
            margin: 0; padding: 0; 
            height: 100svh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: black; 
            touch-action: none; 
            color: white;
            user-select: none;
        }
        
        #boot-screen { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        
        #login-screen { 
            position: fixed; inset: 0; 
            background: rgba(0,0,0,0.95); 
            z-index: 9000; display: none; align-items: center; justify-content: center; 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
        }
        
        #desktop { 
            width: 100vw; 
            height: 100svh; 
            background-size: cover; 
            background-position: center; 
            position: relative; 
            display: none; 
            overflow: hidden;
        }

        .login-card {
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px; border-radius: 2.5rem; 
            width: 90%; max-width: 380px;
            text-align: center; box-shadow: 0 0 60px rgba(59, 130, 246, 0.15);
            display: flex; flex-direction: column; align-items: center;
        }

        .login-avatar-wrapper {
            width: 100px; height: 100px;
            margin-bottom: 24px;
            border-radius: 50%;
            border: 3px solid #3b82f6;
            overflow: hidden;
            flex-shrink: 0;
        }
        .login-avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .app-icon { 
            width: 90px; display: flex; flex-direction: column; align-items: center; cursor: pointer; margin: 12px; 
            transition: 0.2s; -webkit-tap-highlight-color: transparent; 
        }
        .app-icon:active { transform: scale(0.9); }
        .app-icon img { width: 65px; height: 65px; border-radius: 16px; margin-bottom: 8px; pointer-events: none; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .app-label { color: white; font-size: 11px; text-align: center; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        .window { 
            position: absolute; background: #161616; border: 1px solid #333; border-radius: 16px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.7); display: flex; flex-direction: column; 
            overflow: hidden; transition: opacity 0.2s, transform 0.2s;
            min-width: 300px; min-height: 200px;
        }
        .window.minimized {
            transform: scale(0.8) translateY(100px);
            opacity: 0;
            pointer-events: none;
        }
        .window.maximized {
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: calc(100svh - var(--taskbar-height) - 10px) !important;
            border-radius: 0;
        }

        .window-header { 
            background: #222; height: 45px; display: flex; align-items: center; 
            padding: 0 15px; cursor: move; user-select: none; border-bottom: 1px solid #333;
            touch-action: none;
        }
        .window-controls { display: flex; gap: 8px; }
        .control-btn { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; border: none; }
        .close { background: #ff5f56; } 
        .min { background: #ffbd2e; }
        .max { background: #27c93f; }
        
        .window-title { flex-grow: 1; text-align: center; color: #eee; font-size: 12px; font-weight: 600; pointer-events: none; }
        .window-content { flex-grow: 1; background: #000; position: relative; overflow: auto; }
        iframe { width: 100%; height: 100%; border: none; }

        #taskbar { 
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); 
            width: auto; height: var(--taskbar-height); 
            background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            display: flex; align-items: center; padding: 0 15px; z-index: 99999;
            border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
            gap: 10px;
        }
        
        .taskbar-item { 
            width: 50px; height: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; 
            transition: 0.2s; border-radius: 12px; position: relative;
        }
        .taskbar-item:active { transform: scale(0.8); }
        .taskbar-item img { width: 38px; height: 38px; border-radius: 10px; }
        .taskbar-item.active::after {
            content: ''; position: absolute; bottom: -5px; width: 4px; height: 4px; background: #3b82f6; border-radius: 50%;
        }

        #clock { border-left: 1px solid rgba(255,255,255,0.1); padding-left: 15px; margin-left: 5px; color: rgba(255,255,255,0.7); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
        
        /* BROWSER UI */
        .browser-container { height: 100%; display: flex; flex-direction: column; background: #111; }
        .browser-toolbar { background: #222; padding: 10px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #333; }
        .browser-url-bar { flex: 1; background: #000; border: 1px solid #444; border-radius: 8px; padding: 8px 15px; color: #fff; outline: none; font-size: 14px; }
        .browser-url-bar:focus { border-color: #3b82f6; }
        .browser-go-btn { background: #3b82f6; color: white; font-weight: bold; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="boot-screen">
        <img src="/storage/photos/tgdtc.png" class="w-20 mb-4 animate-pulse">
        <div class="text-[10px] font-mono opacity-40 uppercase tracking-[0.2em]">CribOS Core v2.0</div>
    </div>

    <div id="login-screen">
        <div class="login-card">
            <div class="login-avatar-wrapper">
                <img src="/storage/photos/user.png" id="login-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Crib&background=3b82f6&color=fff'">
            </div>
            <h2 id="login-greeting" class="text-xl font-bold mb-6 italic text-blue-400">Welcome to the Crib</h2>
            
            <div id="login-form" class="w-full space-y-3">
                <input type="text" id="username-field" placeholder="Choose a Resident Name" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center text-white outline-none focus:border-blue-500 transition">
                <input type="password" id="pass-field" placeholder="Passkey (Any works)" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center text-white outline-none focus:border-blue-500 transition">
                
                <button onclick="doLogin()" class="w-full bg-blue-600 py-4 rounded-xl font-bold active:scale-95 transition-transform shadow-lg shadow-blue-900/20">ENTER CRIB</button>
                
                <div class="flex items-center gap-2 py-2">
                    <div class="flex-grow h-[1px] bg-white/10"></div>
                    <span class="text-[10px] text-white/30 font-bold uppercase tracking-widest">Instant Resident</span>
                    <div class="flex-grow h-[1px] bg-white/10"></div>
                </div>

                <button onclick="googleFastpass()" class="w-full bg-white text-black py-3 rounded-xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-transform">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
                    <span>Google Fastpass</span>
                </button>
            </div>
        </div>
    </div>

    <div id="desktop">
        <div id="icon-layer" class="flex flex-col flex-wrap h-[calc(100svh-100px)] p-6 items-start gap-2"></div>
        
        <div id="taskbar">
            <div class="taskbar-item" onclick="toggleMenu('start-menu')">
                <img src="/storage/photos/tgdtc.png">
            </div>
            <div class="flex items-center gap-2" id="running-apps-dock"></div>
            <div id="clock">00:00</div>
        </div>

        <div id="start-menu" class="fixed bottom-24 left-1/2 -translate-x-1/2 w-[340px] bg-zinc-900/95 border border-white/10 rounded-[24px] p-5 hidden flex-col z-[100001] backdrop-blur-3xl shadow-2xl">
            <div class="flex items-center gap-4 mb-6 p-2 border-b border-white/10 pb-5">
                <img src="/storage/photos/user.png" class="w-12 h-12 rounded-full border-2 border-blue-500" id="menu-avatar">
                <div class="flex flex-col">
                    <span id="stat-name" class="font-bold text-white text-lg">Wanderer</span>
                    <span class="text-[10px] text-blue-400 uppercase font-black tracking-widest">Crib Resident</span>
                </div>
            </div>
            <div class="grid grid-cols-1 gap-1" id="start-list"></div>
            <div class="mt-6 pt-4 border-t border-white/10 flex justify-between items-center">
                <button onclick="location.reload()" class="text-[10px] text-zinc-500 uppercase font-bold tracking-tighter">Restart CribOS</button>
                <span class="text-[10px] text-zinc-700">Ver 2.3.1</span>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let state = {
            z: 100,
            windows: {},
            installed: ['browser', 'scrolls', 'ytmusic', 'cc', 'gd', 'kts', 'minecraft', 'polytrack', 'rh', 'settings']
        };

        const APPS = {
            browser: { name: 'ProxiCrib', icon: '/storage/photos/proxicrib.png', type: 'browser' },
            scrolls: { name: 'Scrolls', icon: 'https://cdn-icons-png.flaticon.com/512/3064/3064197.png', url: '/storage/scrolls-main/index.html' },
            ytmusic: { name: 'YT Music', icon: '/storage/photos/ytmusic.png', type: 'ytm' },
            settings: { name: 'Settings', icon: '/storage/photos/settings.png' },
            cc: { name: 'Cookie Clicker', icon: '/storage/photos/cc.png', url: '/storage/cookieclick-main/index.html' },
            gd: { name: 'Geometry Dash', icon: '/storage/photos/gd.png', url: '/storage/gdl-main/index.html' },
            kts: { name: 'Kick the Sod', icon: '/storage/photos/kts.png', url: '/storage/kickthesod-main/index.html' },
            minecraft: { name: 'Minecraft', icon: '/storage/photos/minecraft.png', url: '/storage/minecraft-main/index.html' },
            polytrack: { name: 'Polytrack', icon: '/storage/photos/polytrack.png', url: '/storage/polytrack-0.5.2-clean-main/index.html' },
            rh: { name: 'Ragdoll Hit', icon: '/storage/photos/rh.png', url: '/storage/ragdoll-hit-main/index.html' }
        };

        const applySavedWallpaper = () => {
            const wall = localStorage.getItem('crib_wall') || 'https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070&auto=format&fit=crop';
            document.getElementById('desktop').style.backgroundImage = `url('${wall}')`;
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('stat-name').innerText = user.displayName || localStorage.getItem('crib_username') || "Resident";
                if (user.photoURL) {
                    document.getElementById('menu-avatar').src = user.photoURL;
                    document.getElementById('login-avatar').src = user.photoURL;
                }
            }
        });

        window.googleFastpass = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                document.getElementById('stat-name').innerText = result.user.displayName;
                if (result.user.photoURL) {
                    document.getElementById('menu-avatar').src = result.user.photoURL;
                }
                enterDesktop();
            } catch (e) { enterDesktop(); }
        };

        window.doLogin = async () => {
            const user = document.getElementById('username-field').value.trim();
            await signInAnonymously(auth);
            const finalName = user || "Wanderer";
            document.getElementById('stat-name').innerText = finalName;
            localStorage.setItem('crib_username', finalName);
            enterDesktop();
        };

        function enterDesktop() {
            applySavedWallpaper();
            document.getElementById('login-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('desktop').style.display = 'block';
                renderIcons();
                startClock();
            }, 400);
        }

        function startClock() {
            const update = () => {
                const d = new Date();
                document.getElementById('clock').innerText = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            };
            update(); setInterval(update, 1000);
        }

        window.toggleMenu = (id) => {
            const m = document.getElementById(id);
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        };

        function renderIcons() {
            const layer = document.getElementById('icon-layer');
            const startList = document.getElementById('start-list');
            layer.innerHTML = ''; startList.innerHTML = '';
            
            state.installed.forEach(id => {
                const app = APPS[id];
                const div = document.createElement('div');
                div.className = 'app-icon';
                div.onclick = () => launchApp(id);
                div.innerHTML = `<img src="${app.icon}"><span class="app-label">${app.name}</span>`;
                layer.appendChild(div);

                const sItem = document.createElement('div');
                sItem.className = 'flex items-center gap-3 p-3 hover:bg-white/10 rounded-xl cursor-pointer text-white text-sm transition';
                sItem.innerHTML = `<img src="${app.icon}" class="w-8 h-8 rounded-lg shadow-md"><span>${app.name}</span>`;
                sItem.onclick = () => { launchApp(id); toggleMenu('start-menu'); };
                startList.appendChild(sItem);
            });
        }

        window.launchApp = (id) => {
            const app = APPS[id];
            if (id === 'settings') return openSettings();
            if (id === 'browser') return openBrowser();
            if (app.type === 'ytm') return openYTMusic();
            createWindow(id, app.name, app.url, app.icon);
        };

        // --- NEW PROXICRIB BROWSER LOGIC ---
        function openBrowser() {
            const html = `
                <div class="browser-container">
                    <div class="browser-toolbar">
                        <input type="text" id="browser-input" class="browser-url-bar" placeholder="Enter URL or Search Query..." 
                               onkeydown="if(event.key==='Enter') window.browse()" 
                               onclick="window.clearBrowserBar()">
                        <button onclick="window.browse()" class="browser-go-btn">GO</button>
                    </div>
                    <div class="flex-grow bg-black relative">
                        <iframe id="browser-iframe" class="w-full h-full" onload="window.browserLoaded()"></iframe>
                    </div>
                </div>
            `;
            createWindow('browser', 'ProxiCrib', null, '/storage/photos/proxicrib.png', html);
        }

        window.clearBrowserBar = () => {
            const input = document.getElementById('browser-input');
            if (input.value === 'LOADING...' || input.value === 'BYPASSED') {
                input.value = '';
            }
        };

        window.browse = () => {
            const input = document.getElementById('browser-input');
            const frame = document.getElementById('browser-iframe');
            let query = input.value.trim();
            if (!query) return;

            input.value = "LOADING...";

            let targetUrl = "";
            const isUrl = /^(https?:\/\/)?([\w\-]+\.)+[\w\-]+(\/.*)?$/.test(query);

            if (isUrl) {
                if (!query.startsWith('http')) query = 'https://' + query;
                targetUrl = query;
            } else {
                // Bing Search Logic
                targetUrl = `https://www.bing.com/search?q=${encodeURIComponent(query)}&form=QBLH&sp=-1&ghc=1&lq=0`;
            }

            // Wrap in the bypass proxy
            frame.src = `https://nodeunbl0cker.vercel.app/proxy/https:/${targetUrl.replace(/^https?:\/\//, '')}`;
        };

        window.browserLoaded = () => {
            const input = document.getElementById('browser-input');
            if (input && input.value === 'LOADING...') {
                input.value = 'BYPASSED';
            }
        };

        function openYTMusic() {
            const html = `
                <div class="ytm-container">
                    <div class="ytm-header">
                        <div class="ytm-search-row">
                            <input type="text" id="ytm-search-input" class="ytm-search" placeholder="Search song or artist..." onkeydown="if(event.key==='Enter') window.ytmAction('search')">
                            <button onclick="window.ytmAction('playlist')" class="ytm-btn">Playlist</button>
                        </div>
                    </div>
                    <div class="ytm-player-box">
                        <iframe id="ytm-frame" src="https://www.youtube.com/embed?enablejsapi=1&listType=search&list=music&autoplay=1" allow="autoplay; encrypted-media"></iframe>
                    </div>
                </div>
            `;
            createWindow('ytmusic', 'YouTube Music', null, '/storage/photos/ytmusic.png', html);
        }

        window.ytmAction = (type) => {
            const input = document.getElementById('ytm-search-input');
            const frame = document.getElementById('ytm-frame');
            if (!frame) return;
            const val = input.value.trim();
            if (type === 'search') frame.src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(val)}&autoplay=1`;
        };

        function createWindow(appId, title, url, icon, customHtml = null) {
            if (state.windows[appId]) return toggleMinimize(appId);
            const winId = 'win_' + appId;
            const win = document.createElement('div');
            win.id = winId; win.className = 'window';
            state.z++; win.style.zIndex = state.z;
            
            win.style.width = appId === 'ytmusic' ? '380px' : '850px';
            win.style.height = appId === 'ytmusic' ? '600px' : '550px';
            win.style.left = '100px'; win.style.top = '50px';

            win.innerHTML = `
                <div class="window-header" onmousedown="window.initDrag(event, '${winId}')" ontouchstart="window.initDrag(event, '${winId}')">
                    <div class="window-controls">
                        <button class="control-btn close" onclick="window.closeWin('${appId}')"></button>
                        <button class="control-btn min" onclick="window.toggleMinimize('${appId}')"></button>
                        <button class="control-btn max" onclick="window.toggleMaximize('${winId}')"></button>
                    </div>
                    <div class="window-title">${title}</div>
                </div>
                <div class="window-content" onmousedown="window.bringToFront('${winId}')">
                    ${customHtml ? customHtml : `<iframe src="${url}"></iframe>`}
                    <div class="absolute inset-0 bg-transparent pointer-events-none" id="cover_${winId}"></div>
                </div>
            `;
            document.getElementById('desktop').appendChild(win);
            state.windows[appId] = { id: winId, title, icon };
            updateDock();
        }

        window.bringToFront = (id) => {
            state.z++;
            const el = document.getElementById(id);
            if (el) el.style.zIndex = state.z;
        };

        window.toggleMinimize = (appId) => {
            const el = document.getElementById('win_' + appId);
            if (el.classList.contains('minimized')) {
                el.classList.remove('minimized');
                window.bringToFront('win_' + appId);
            } else {
                el.classList.add('minimized');
            }
        };

        window.toggleMaximize = (id) => document.getElementById(id).classList.toggle('maximized');

        window.closeWin = (appId) => {
            const win = document.getElementById('win_' + appId);
            if (win) win.remove();
            delete state.windows[appId];
            updateDock();
        };

        function updateDock() {
            const dock = document.getElementById('running-apps-dock');
            dock.innerHTML = '';
            Object.keys(state.windows).forEach(appId => {
                const app = state.windows[appId];
                const div = document.createElement('div');
                div.className = 'taskbar-item active';
                div.onclick = () => toggleMinimize(appId);
                div.innerHTML = `<img src="${app.icon}">`;
                dock.appendChild(div);
            });
        }

        window.initDrag = (e, id) => {
            const el = document.getElementById(id);
            window.bringToFront(id);
            if (el.classList.contains('maximized')) return;
            const covers = document.querySelectorAll('[id^="cover_"]');
            covers.forEach(c => c.style.pointerEvents = 'auto');
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            let startX = clientX, startY = clientY;
            let startL = el.offsetLeft, startT = el.offsetTop;
            const move = (ev) => {
                const moveX = ev.type.includes('touch') ? ev.touches[0].clientX : ev.clientX;
                const moveY = ev.type.includes('touch') ? ev.touches[0].clientY : ev.clientY;
                el.style.left = (startL + moveX - startX) + 'px';
                el.style.top = (startT + moveY - startY) + 'px';
            };
            const stop = () => {
                covers.forEach(c => c.style.pointerEvents = 'none');
                window.removeEventListener('mousemove', move);
                window.removeEventListener('mouseup', stop);
                window.removeEventListener('touchmove', move);
                window.removeEventListener('touchend', stop);
            };
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', stop);
            window.addEventListener('touchmove', move, { passive: false });
            window.addEventListener('touchend', stop);
        };

        function openSettings() {
            const currentWall = localStorage.getItem('crib_wall') || '';
            const html = `<div class="p-8"><h2 class="text-3xl font-black mb-8 italic text-blue-500 uppercase">System Settings</h2><div class="bg-zinc-900/50 p-6 rounded-2xl border border-white/5"><h3 class="text-xs font-bold uppercase tracking-widest text-zinc-400 mb-4">Desktop Background</h3><input type="text" id="wall-input" class="w-full bg-black border border-white/10 p-4 rounded-xl text-sm mb-4 outline-none focus:border-blue-500" placeholder="Image URL..." value="${currentWall}"><button onclick="window.saveWall()" class="w-full bg-blue-600 py-4 rounded-xl font-bold active:scale-95 transition">Apply Wallpaper</button></div></div>`;
            createWindow('settings', 'Settings', null, '/storage/photos/settings.png', html);
        }

        window.saveWall = () => {
            const url = document.getElementById('wall-input').value;
            localStorage.setItem('crib_wall', url);
            document.getElementById('desktop').style.backgroundImage = `url('${url}')`;
        };

        applySavedWallpaper();
        setTimeout(() => {
            document.getElementById('boot-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('login-screen').style.display = 'flex';
            }, 500);
        }, 1500);

    </script>
</body>
</html>
