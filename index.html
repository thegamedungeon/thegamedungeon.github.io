<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Game Dungeon | CribOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --taskbar-height: 64px;
        }

        body, html { 
            margin: 0; padding: 0; 
            height: 100svh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: black; 
            touch-action: manipulation;
            color: white;
        }
        
        #boot-screen { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        
        #login-screen { 
            position: fixed; inset: 0; 
            background: rgba(0,0,0,0.95); 
            z-index: 9000; display: none; align-items: center; justify-content: center; 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
        }
        
        #desktop { 
            width: 100vw; 
            height: 100svh; 
            background-size: cover; 
            background-position: center; 
            position: relative; 
            display: none; 
        }

        .login-card {
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px; border-radius: 2.5rem; 
            width: 90%; max-width: 380px;
            text-align: center; box-shadow: 0 0 60px rgba(59, 130, 246, 0.15);
            display: flex; flex-direction: column; align-items: center;
        }

        .login-avatar-wrapper {
            width: 100px; height: 100px;
            margin-bottom: 24px;
            border-radius: 50%;
            border: 3px solid #3b82f6;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .login-avatar-wrapper img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .app-icon { 
            width: 90px; display: flex; flex-direction: column; align-items: center; cursor: pointer; margin: 12px; 
            transition: 0.2s; -webkit-tap-highlight-color: transparent; 
        }
        .app-icon:active { transform: scale(0.9); background: rgba(255,255,255,0.1); border-radius: 12px; }
        .app-icon img { width: 60px; height: 60px; border-radius: 14px; margin-bottom: 8px; pointer-events: none; object-fit: cover; }
        .app-label { color: white; font-size: 11px; text-align: center; font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        .window { 
            position: absolute; background: #1a1a1a; border: 1px solid #333; border-radius: 16px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden; 
        }
        .window-header { background: #262626; height: 40px; display: flex; align-items: center; padding: 0 12px; cursor: move; user-select: none; border-bottom: 1px solid #333; }
        .control-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: none; margin-right: 8px; }
        .close { background: #ff5f56; } 
        .window-title { flex-grow: 1; text-align: center; color: #aaa; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .window-content { flex-grow: 1; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        #taskbar { 
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); 
            width: auto; min-width: 300px; height: var(--taskbar-height); 
            background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; align-items: center; padding: 0 12px; z-index: 99999;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
        }
        
        .taskbar-item { width: 48px; height: 48px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; border-radius: 10px; }
        .taskbar-item:hover { background: rgba(255,255,255,0.1); }
        .taskbar-item img { width: 34px; height: 34px; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="boot-screen">
        <img src="/storage/photos/tgdtc.png" class="w-20 mb-4 animate-pulse">
        <div class="text-[10px] font-mono opacity-40 uppercase tracking-[0.2em]">CribOS Core Loading...</div>
    </div>

    <div id="login-screen">
        <div class="login-card">
            <div class="login-avatar-wrapper">
                <img src="/storage/photos/user.png" id="login-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Crib&background=3b82f6&color=fff'">
            </div>
            <h2 id="login-greeting" class="text-xl font-bold mb-6 italic text-blue-400">Welcome to the Crib</h2>
            
            <div id="login-form" class="w-full space-y-3">
                <input type="text" id="username-field" placeholder="Username" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center text-white outline-none focus:border-blue-500 transition">
                <input type="password" id="pass-field" placeholder="Password (Optional)" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center text-white outline-none focus:border-blue-500 transition">
                
                <button onclick="doLogin()" class="w-full bg-blue-600 py-4 rounded-xl font-bold active:scale-95 transition-transform shadow-lg shadow-blue-900/20">UNLOCK</button>
                
                <div class="flex items-center gap-2 py-2">
                    <div class="flex-grow h-[1px] bg-white/10"></div>
                    <span class="text-[10px] text-white/30 font-bold uppercase tracking-widest">OR</span>
                    <div class="flex-grow h-[1px] bg-white/10"></div>
                </div>

                <!-- Google Fastpass -->
                <button onclick="googleFastpass()" class="w-full bg-white text-black py-3 rounded-xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-transform">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
                    <span>Google Fastpass</span>
                </button>

                <!-- Create Account Link -->
                <p class="text-[11px] text-white/40 pt-2">
                    New here? <a href="#" onclick="showCreateAccount()" class="text-blue-400 font-bold hover:underline">Create Account</a>
                </p>
            </div>
        </div>
    </div>

    <div id="desktop">
        <div id="icon-layer" class="flex flex-col flex-wrap h-[calc(100svh-80px)] p-6 items-start gap-2"></div>
        <div id="taskbar">
            <div class="taskbar-item" onclick="toggleMenu('start-menu')">
                <img src="/storage/photos/tgdtc.png">
            </div>
            <div class="flex-grow flex justify-center gap-2" id="running-apps">
                <div class="taskbar-item" onclick="launchApp('browser')"><img src="/storage/photos/proxicrib.png"></div>
                <div class="taskbar-item" onclick="launchApp('scrolls')"><img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png"></div>
                <div class="taskbar-item" onclick="launchApp('settings')"><img src="/storage/photos/settings.png"></div>
            </div>
            <div id="clock" class="px-4 text-xs font-bold font-mono text-white/50">00:00</div>
        </div>

        <div id="start-menu" class="fixed bottom-24 left-1/2 -translate-x-1/2 w-[320px] bg-zinc-900/95 border border-white/10 rounded-[20px] p-4 hidden flex-col z-[100001] backdrop-blur-xl">
            <div class="flex items-center gap-3 mb-6 p-2 border-b border-white/10 pb-4">
                <img src="/storage/photos/user.png" class="w-10 h-10 rounded-full" id="menu-avatar">
                <span id="stat-name" class="font-bold text-white">Wanderer</span>
            </div>
            <div class="space-y-1" id="start-list"></div>
            <div class="mt-6 pt-4 border-t border-white/10 text-center">
                <button onclick="location.reload()" class="text-[10px] text-zinc-500 hover:text-white uppercase font-bold">Restart System</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let state = {
            z: 100,
            installed: ['browser', 'scrolls', 'cc', 'gd', 'kts', 'minecraft', 'polytrack', 'rh', 'settings']
        };

        const APPS = {
            browser: { name: 'ProxiCrib', icon: '/storage/photos/proxicrib.png' },
            scrolls: { name: 'Scrolls', icon: 'https://cdn-icons-png.flaticon.com/512/3064/3064197.png' },
            settings: { name: 'Settings', icon: '/storage/photos/settings.png' },
            cc: { name: 'Cookie Clicker', icon: '/storage/photos/cc.png', url: '/storage/cookieclick-main/index.html' },
            gd: { name: 'Geometry Dash', icon: '/storage/photos/gd.png', url: '/storage/gdl-main/index.html' },
            kts: { name: 'Kick the Sod', icon: '/storage/photos/kts.png', url: '/storage/kickthesod-main/index.html' },
            minecraft: { name: 'Minecraft', icon: '/storage/photos/minecraft.png', url: '/storage/minecraft-main/index.html' },
            polytrack: { name: 'Polytrack', icon: '/storage/photos/polytrack.png', url: '/storage/polytrack-0.5.2-clean-main/index.html' },
            rh: { name: 'Ragdoll Hit', icon: '/storage/photos/rh.png', url: '/storage/ragdoll-hit-main/index.html' }
        };

        window.googleFastpass = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                document.getElementById('stat-name').innerText = user.displayName;
                if (user.photoURL) {
                    document.getElementById('menu-avatar').src = user.photoURL;
                }
                enterDesktop();
            } catch (error) {
                console.error("Fastpass failed", error);
            }
        };

        window.showCreateAccount = () => {
            document.getElementById('login-greeting').innerText = "Join the Dungeon";
            document.getElementById('username-field').placeholder = "Email Address";
            document.getElementById('pass-field').placeholder = "New Password";
            const btn = document.querySelector('#login-form button');
            btn.innerText = "CREATE ACCOUNT";
            btn.onclick = window.doCreate;
        };

        window.doCreate = async () => {
            const email = document.getElementById('username-field').value;
            const pass = document.getElementById('pass-field').value;
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                document.getElementById('stat-name').innerText = email.split('@')[0];
                enterDesktop();
            } catch (e) {
                alert(e.message);
            }
        };

        window.doLogin = async () => {
            const user = document.getElementById('username-field').value.trim();
            const pass = document.getElementById('pass-field').value;
            if (pass === 'crib123' || pass === '') {
                if (!auth.currentUser) await signInAnonymously(auth);
                document.getElementById('stat-name').innerText = user || "Wanderer";
                enterDesktop();
            } else {
                alert("Wrong key. Try again.");
            }
        };

        function enterDesktop() {
            document.getElementById('login-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('desktop').style.display = 'block';
                const savedWall = localStorage.getItem('crib_wall') || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80';
                document.getElementById('desktop').style.backgroundImage = `url('${savedWall}')`;
                renderIcons();
                startClock();
            }, 400);
        }

        function startClock() {
            const update = () => {
                const d = new Date();
                document.getElementById('clock').innerText = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            };
            update(); setInterval(update, 1000);
        }

        window.toggleMenu = (id) => {
            const m = document.getElementById(id);
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        };

        function renderIcons() {
            const layer = document.getElementById('icon-layer');
            const startList = document.getElementById('start-list');
            layer.innerHTML = ''; startList.innerHTML = '';
            state.installed.forEach(id => {
                const app = APPS[id];
                const div = document.createElement('div');
                div.className = 'app-icon';
                div.onclick = () => launchApp(id);
                div.innerHTML = `<img src="${app.icon}"><span class="app-label">${app.name}</span>`;
                layer.appendChild(div);
                const sItem = document.createElement('div');
                sItem.className = 'flex items-center gap-3 p-2 hover:bg-white/10 rounded-lg cursor-pointer text-white text-xs';
                sItem.innerHTML = `<img src="${app.icon}" class="w-6 h-6 rounded"><span>${app.name}</span>`;
                sItem.onclick = () => { launchApp(id); toggleMenu('start-menu'); };
                startList.appendChild(sItem);
            });
        }

        window.launchApp = (id) => {
            if (id === 'browser') return createWindow('ProxiCrib', null, `<div class="h-full bg-zinc-900 flex items-center justify-center text-white/20">Browser is Loading...</div>`);
            if (id === 'settings') return createWindow('Settings', null, `<div class="p-8 text-white">Settings coming soon.</div>`);
            createWindow(APPS[id].name, APPS[id].url);
        };

        function createWindow(title, url, customHtml = null) {
            const id = 'win_' + Math.random().toString(36).substr(2, 9);
            const win = document.createElement('div');
            win.id = id; win.className = 'window';
            state.z++; win.style.zIndex = state.z;
            const isMobile = window.innerWidth < 768;
            win.style.width = isMobile ? '92%' : '800px';
            win.style.height = isMobile ? '70%' : '500px';
            win.style.left = isMobile ? '4%' : '100px';
            win.style.top = isMobile ? '30px' : '60px';
            win.innerHTML = `<div class="window-header" onmousedown="window.initDrag(event, '${id}')"><button class="control-btn close" onclick="window.closeWin('${id}')"></button><div class="window-title">${title}</div></div><div class="window-content">${customHtml || `<iframe src="${url}"></iframe>`}</div>`;
            document.getElementById('desktop').appendChild(win);
        }

        window.closeWin = (id) => document.getElementById(id).remove();
        window.initDrag = (e, id) => {
            const el = document.getElementById(id);
            if (e.target.classList.contains('control-btn')) return;
            let startX = e.clientX, startY = e.clientY, startL = el.offsetLeft, startT = el.offsetTop;
            const move = (ev) => { el.style.left = (startL + ev.clientX - startX) + 'px'; el.style.top = (startT + ev.clientY - startY) + 'px'; };
            const stop = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop); };
            window.addEventListener('mousemove', move); window.addEventListener('mouseup', stop);
        };

        setTimeout(() => {
            document.getElementById('boot-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('login-screen').style.display = 'flex';
            }, 500);
        }, 1200);

    </script>
</body>
</html>
