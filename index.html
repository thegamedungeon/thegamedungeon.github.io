<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon | The Crib</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #system-loader {
            background: #020617;
            display: flex;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="min-h-screen overflow-hidden">

    <!-- Pre-check System Loader (Prevent Sucker Punching) -->
    <div id="system-loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center">
        <img src="/storage/photos/tgdtc.png" alt="Logo" class="w-32 h-32 mb-8 animate-pulse rounded-2xl">
        <div class="w-48 h-1.5 bg-slate-800 rounded-full overflow-hidden">
            <div class="h-full bg-blue-600 animate-[loading_2s_ease-in-out_infinite]"></div>
        </div>
        <p class="mt-4 text-blue-400 font-mono text-sm tracking-widest uppercase">Initializing Security...</p>
    </div>

    <!-- Login Overlay -->
    <div id="login-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black bg-opacity-95 p-4">
        <div class="glass max-w-md w-full p-8 rounded-2xl text-center relative border-blue-500/30">
            <img src="/storage/photos/tgdtc.png" alt="Logo" class="w-24 h-24 mx-auto mb-6 rounded-xl shadow-lg">
            <h2 class="text-3xl font-extrabold mb-2 text-blue-400">Restricted Access</h2>
            <p class="text-gray-400 mb-8">Login to enter The Crib and check your stats.</p>
            
            <a href="/login/" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition-all flex items-center justify-center gap-3">
                <i class="fas fa-sign-in-alt"></i> Sign In to The Dungeon
            </a>
            
            <p class="mt-6 text-xs text-gray-500 uppercase tracking-widest">Authorized Personnel Only</p>
            
            <!-- The Trap Button -->
            <button id="close-modal-trap" class="absolute top-4 right-4 text-gray-700 hover:text-red-500 transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="hidden opacity-0 transition-opacity duration-1000">
        <!-- Header -->
        <header class="p-6 glass mb-8 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <img src="/storage/photos/tgdtc.png" alt="Logo" class="w-12 h-12 rounded-lg">
                    <h1 class="text-2xl font-black tracking-tighter text-blue-400">THE GAME DUNGEON</h1>
                </div>
                <div id="user-info" class="flex items-center gap-3">
                    <span class="text-sm font-medium text-gray-400" id="user-display-id"></span>
                    <div class="w-10 h-10 bg-blue-900 rounded-full border-2 border-blue-500 flex items-center justify-center">
                        <i class="fas fa-user text-blue-300"></i>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-6 pb-20">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Games Section -->
                <div class="lg:col-span-2">
                    <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                        <i class="fas fa-gamepad text-blue-500"></i> Featured Games
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="games-grid">
                        <!-- Game Cards Generated by JS -->
                    </div>
                </div>

                <!-- Friends & Stats Sidebar -->
                <div class="space-y-8">
                    <section class="glass p-6 rounded-2xl">
                        <h2 class="text-xl font-bold mb-4 flex items-center gap-3">
                            <i class="fas fa-users text-green-400"></i> The Squad
                        </h2>
                        <div id="friends-list" class="space-y-4"></div>
                    </section>

                    <section class="glass p-6 rounded-2xl">
                        <h2 class="text-xl font-bold mb-4 flex items-center gap-3">
                            <i class="fas fa-clock text-orange-400"></i> Your Playtime
                        </h2>
                        <div id="playtime-stats" class="space-y-4 text-sm"></div>
                    </section>
                </div>

            </div>
        </main>
    </div>

    <style>
        @keyframes loading {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "the-game-dungeon";

        const games = [
            { name: "Ragdoll Hit", icon: "/storage/photos/rh.png", path: "/ragdoll-hit/" },
            { name: "GDL", icon: "/storage/photos/gd.png", path: "/gdl/" },
            { name: "Cookie Clicker", icon: "/storage/photos/cc.png", path: "/cookie-clicker/" },
            { name: "Minecraft", icon: "/storage/photos/minecraft.png", path: "/minecraft/" },
            { name: "Polytrack", icon: "/storage/photos/polytrack.png", path: "/polytrack/" }
        ];

        const loader = document.getElementById('system-loader');
        const loginModal = document.getElementById('login-modal');
        const mainContent = document.getElementById('main-content');
        const trapBtn = document.getElementById('close-modal-trap');

        // Security Trap
        trapBtn.onclick = () => {
            window.close();
            document.body.innerHTML = "<div style='background:black; color:red; height:100vh; display:flex; align-items:center; justify-center; font-family:sans-serif; text-align:center;'><h1>OINK OINK</h1><p>Unauthorized Closure Detected. Session Nuked.</p></div>";
            setTimeout(() => { location.href = "about:blank"; }, 400);
        };

        // Check Auth State (Delayed for safety)
        onAuthStateChanged(auth, (user) => {
            // Fake a tiny bit of load time to ensure assets are ready
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.classList.add('hidden'), 500);

                if (user) {
                    document.body.classList.remove('overflow-hidden');
                    mainContent.classList.remove('hidden');
                    setTimeout(() => mainContent.classList.add('opacity-100'), 50);
                    document.getElementById('user-display-id').innerText = `ID: ${user.uid.substring(0, 8)}`;
                    initDashboard(user);
                } else {
                    loginModal.classList.remove('hidden');
                    loginModal.classList.add('flex');
                }
            }, 1500);
        });

        function initDashboard(user) {
            renderGames();
            loadFriends(user);
            loadPlaytime(user);
        }

        function renderGames() {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = games.map(game => `
                <a href="${game.path}" class="game-card glass p-6 rounded-2xl flex items-center gap-5 transition-all duration-300">
                    <img src="${game.icon}" class="w-16 h-16 rounded-xl shadow-lg border border-slate-700" onerror="this.src='https://via.placeholder.com/64'">
                    <div>
                        <h3 class="text-xl font-bold">${game.name}</h3>
                        <span class="text-xs text-blue-400 font-semibold uppercase tracking-wider">Launch <i class="fas fa-play ml-1"></i></span>
                    </div>
                </a>
            `).join('');
        }

        function loadFriends(user) {
            const list = document.getElementById('friends-list');
            const friendsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'friends');
            
            onSnapshot(friendsRef, (snapshot) => {
                if (snapshot.empty) {
                    list.innerHTML = `<div class="text-gray-500 italic text-sm p-4 bg-slate-800/20 rounded-lg">No homies online yet.</div>`;
                    return;
                }
                list.innerHTML = '';
                snapshot.forEach(doc => {
                    const friend = doc.data();
                    const statusColor = friend.online ? 'bg-green-500' : 'bg-gray-600';
                    list.innerHTML += `
                        <div class="flex items-center justify-between p-3 bg-slate-800/30 rounded-xl border border-white/5">
                            <div class="flex items-center gap-3">
                                <div class="relative">
                                    <div class="w-10 h-10 bg-blue-500/10 rounded-full flex items-center justify-center border border-blue-500/20">
                                        <i class="fas fa-user text-xs"></i>
                                    </div>
                                    <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 ${statusColor} rounded-full border-2 border-slate-900"></div>
                                </div>
                                <p class="font-bold text-sm">${friend.name || 'Gamer'}</p>
                            </div>
                        </div>
                    `;
                });
            }, (err) => console.error(err));
        }

        function loadPlaytime(user) {
            const stats = document.getElementById('playtime-stats');
            const statsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'playtime');
            
            onSnapshot(statsRef, (snapshot) => {
                if (snapshot.empty) {
                    stats.innerHTML = `<p class="text-gray-500 italic">Play games to log hours!</p>`;
                    return;
                }
                stats.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    stats.innerHTML += `
                        <div class="space-y-1">
                            <div class="flex justify-between text-xs font-semibold">
                                <span>${doc.id}</span>
                                <span class="text-blue-400">${data.hours}h</span>
                            </div>
                            <div class="w-full h-1 bg-slate-800 rounded-full overflow-hidden">
                                <div class="h-full bg-blue-500" style="width: ${Math.min(data.hours, 100)}%"></div>
                            </div>
                        </div>
                    `;
                });
            }, (err) => console.error(err));
        }
    </script>
</body>
</html>
