DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GAME DUNGEON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --dungeon-green: #00ff41;
            --dark-grey: #0a0a0a; /* Almost black */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-grey);
            font-family: 'Courier New', Courier, monospace;
            color: var(--dungeon-green);
            user-select: none;
            touch-action: none; 
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: transform 1s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.8s ease;
            background-color: var(--dark-grey);
        }
