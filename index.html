            if (user) {
                document.getElementById('nav-pfp').src = user.photoURL;
                const cleanEmail = user.email.split('@')[0];
                
                // Blicked check
                const bannedRef = doc(db, 'artifacts', 'the-game-dungeon-4d75d', 'public', 'data', 'banned-users', cleanEmail);
                const bannedSnap = await getDoc(bannedRef);
                if (bannedSnap.exists()) {
                    document.body.innerHTML = "<div class='flex h-screen items-center justify-center text-red-500'>You have been blicked.</div>";
                    return;
                }

                const userRef = doc(db, 'artifacts', 'the-game-dungeon-4d75d', 'public', 'data', 'users', cleanEmail);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    currentUserData = { ...userSnap.data(), email: user.email, id: cleanEmail };
                } else {
                    currentUserData = { username: "Guest", friends: [], email: user.email, id: cleanEmail };
                    await setDoc(userRef, currentUserData);
                }
                switchView('home');
            } else {
                renderLogin();
            }
        });

        window.switchView = async (view) => {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('nav-active'));
            document.getElementById(`nav-${view}`).classList.add('nav-active');
            
            const content = document.getElementById('main-content');
            content.innerHTML = `<div class="p-4 text-center">Loading...</div>`;
            
            if (view === 'home') renderHome();
            else if (view === 'play') renderPlay();
            else if (view === 'chat') renderChat();
            else if (view === 'account') renderAccount();
        };

            container.innerHTML = `

                    <h1 class="text-4xl font-bold text-center mb-10">Welcome, ${currentUserData.username || 'User'}!</h1>
                    <div class="w-full max-w-sm">
                        <h2 class="text-xl mb-4 font-semibold text-gray-400">Friends</h2>
                        <div id="friends-list" class="space-y-3">
                            ${currentUserData.friends?.map(f => `<div class="bg-gray-900 p-4 rounded-xl border border-gray-800">${f}</div>`).join('') || '<p class="text-gray-600">No friends added yet.</p>'}
                        </div>
                    </div>
                </div>
            `;

                                     class="w-full aspect-square object-cover rounded-xl shadow-lg">
                                <span class="mt-2 text-sm font-medium text-gray-300 group-hover:text-white">${game}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        };

        window.launchGame = (gameName) => {
            const container = document.getElementById('main-content');
            container.innerHTML = `<div class="flex h-full items-center justify-center"><div class="loading-spinner w-12 h-12 rounded-full border-4 border-gray-700"></div></div>`;
            
            const page = gameName.toLowerCase().replace(/\s+/g, '-');
            // Simplified loading mock
            setTimeout(() => {
                container.innerHTML = `
                    <div class="w-full h-full flex flex-col">
                        <div class="p-4 bg-gray-900 text-sm">Now playing: ${gameName}</div>
                        <iframe src="/play/${page}/" class="w-full flex-grow border-0"></iframe>
                    </div>
                `;
            }, 800);
        };

        window.renderChat = () => {
            document.getElementById('main-content').innerHTML = `
            
            <div id="chat-container" class="content-view">
            <iframe src="/chat/pwa/" title="Chat" class="full-iframe"></iframe>
            </div>
            
                </div>
            `;
        };

        window.renderAccount = () => {
            const container = document.getElementById('main-content');
            const isAdmin = currentUserData.email === 'open.it.out.fortnite@gmail.com';
            
            container.innerHTML = `
                <div class="p-8 text-center flex flex-col items-center max-w-sm w-full">
                    <img src="${auth.currentUser.photoURL}" class="w-32 h-32 rounded-full mb-6 shadow-xl border-4 border-gray-800">
                    <h2 class="text-2xl font-bold">${currentUserData.username}</h2>
                    <p class="text-gray-400 mb-8">${currentUserData.email}</p>
                    
                    <button onclick="alert('Edit username feature coming soon')" class="bg-gray-800 w-full mb-3 p-3 rounded-xl border border-gray-700">Edit Username</button>
                    ${isAdmin ? `<button id="admin-btn" class="bg-red-900 text-red-200 w-full mb-3 p-3 rounded-xl border border-red-700 font-bold">Admin Settings</button>` : ''}
                    <button onclick="signOut(auth)" class="bg-black border border-gray-700 w-full p-3 rounded-xl">Log Out</button>
                </div>
            `;

            if (isAdmin) document.getElementById('admin-btn').onclick = () => showAdminPopup();
        };

        function renderLogin() {
            document.getElementById('main-content').innerHTML = `
                <div class="text-center p-8">
                    <h1 class="text-4xl font-bold mb-8">The Game Dungeon</h1>
                    <button onclick="signInWithPopup(auth, new GoogleAuthProvider())" class="bg-white text-black px-8 py-4 rounded-xl font-bold">Login with Google</button>
                </div>
            `;
        }
    </script>
