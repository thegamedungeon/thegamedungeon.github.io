<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon - Tablet Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            overflow: hidden;
            user-select: none;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        .tablet-screen {
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .status-bar {
            height: 28px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            color: white;
            font-size: 12px;
            font-weight: 500;
            z-index: 10;
        }

        .app-grid {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 24px;
            padding: 40px 30px;
            max-width: 900px;
            margin: 0 auto;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .app-icon:active {
            transform: scale(0.9);
        }

        .icon-shape {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            margin-bottom: 8px;
        }

        .icon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-label {
            color: white;
            font-size: 13px;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            text-align: center;
        }

        .dock {
            height: 110px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            margin: 0 40px 20px 40px;
            border-radius: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Global Navigation Bar */
        .system-nav-bar {
            height: 54px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 25%;
            z-index: 1000;
        }

        .nav-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .nav-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Overlay for "Apps" */
        .window-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            z-index: 100;
            display: none;
            flex-direction: column;
        }

        .window-header {
            padding: 10px 20px;
            background: #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            border-bottom: 1px solid #333;
        }

        iframe {
            width: 100%;
            flex-grow: 1;
            border: none;
        }

        /* Status Bar Icons */
        .battery {
            width: 22px;
            height: 11px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 3px;
            position: relative;
        }
        .battery::after {
            content: '';
            position: absolute;
            right: -3.5px;
            top: 2px;
            width: 2.5px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 0 1px 1px 0;
        }
        .battery-fill {
            width: 85%;
            height: 100%;
            background: #4caf50;
        }
    </style>
</head>
<body>

    <div class="tablet-screen">
        <!-- Status Bar -->
        <div class="status-bar">
            <div id="statusTime" class="tracking-tight">12:00 PM</div>
            <div class="flex items-center gap-3">
                <span class="opacity-80">Dungeon 5G</span>
                <div class="battery"><div class="battery-fill"></div></div>
            </div>
        </div>

        <!-- Main Game Grid -->
        <div class="app-grid" id="homeGrid">
            <div class="app-icon" onclick="openApp('Cookie Clicker', '/storage/cookieclick-main')">
                <div class="icon-shape"><img src="/storage/photos/cc.png" class="icon-img" onerror="this.src='https://via.placeholder.com/72?text=Cookie'"></div>
                <div class="app-label">Cookie</div>
            </div>
            <div class="app-icon" onclick="openApp('Geometry Dash', '/storage/gdl-main')">
                <div class="icon-shape"><img src="/storage/photos/gd.png" class="icon-img" onerror="this.src='https://via.placeholder.com/72?text=GD'"></div>
                <div class="app-label">Geometry Dash</div>
            </div>
            <div class="app-icon" onclick="openApp('Polytrack', '/storage/polytrack-0.5.2-clean-main')">
                <div class="icon-shape"><img src="/storage/photos/polytrack.png" class="icon-img" onerror="this.src='https://via.placeholder.com/72?text=Poly'"></div>
                <div class="app-label">Polytrack</div>
            </div>
            <div class="app-icon" onclick="openApp('Basket Random', '/storage/BasketRandom-main')">
                <div class="icon-shape"><img src="/storage/photos/br.png" class="icon-img" onerror="this.src='https://via.placeholder.com/72?text=Basket'"></div>
                <div class="app-label">Basket Random</div>
            </div>
            <div class="app-icon" onclick="openApp('Ragdoll Hit', '/storage/ragdoll-hit-main')">
                <div class="icon-shape"><img src="/storage/photos/rh.png" class="icon-img" onerror="this.src='https://via.placeholder.com/72?text=Ragdoll'"></div>
                <div class="app-label">Ragdoll Hit</div>
            </div>
            <div class="app-icon" onclick="openApp('Minecraft', '/storage/minecraft-main')">
                <div class="icon-shape"><img src="/storage/photos/minecraft.png" class="icon-img" onerror="this.src='https://via.placeholder.com/72?text=MC'"></div>
                <div class="app-label">Minecraft</div>
            </div>
            <div class="app-icon" onclick="openApp('ProxyCrib', '/play/proxicrib')">
                <div class="icon-shape"><img src="/storage/photos/proxicrib.png" class="icon-img" onerror="this.src='https://via.placeholder.com/72?text=Proxy'"></div>
                <div class="app-label">ProxyCrib</div>
            </div>
            <div class="app-icon" onclick="openApp('Kick the Sod', '/storage/kickthesod-main')">
                <div class="icon-shape"><img src="/storage/photos/kts.png" class="icon-img" onerror="this.src='https://via.placeholder.com/72?text=KTS'"></div>
                <div class="app-label">Kick The Sod</div>
            </div>
        </div>

        <!-- Dock (Now with ProxyCrib icon) -->
        <div class="dock">
            <div class="app-icon" onclick="openApp('ProxyCrib', '/play/proxicrib')">
                <div class="icon-shape"><img src="/storage/photos/proxicrib.png" class="icon-img" onerror="this.src='https://via.placeholder.com/72?text=Proxy'"></div>
                <div class="app-label">ProxyCrib</div>
            </div>
            <div class="app-icon" onclick="window.location.href='https://music.youtube.com/@HellsThread'">
    <div class="icon-shape" style="background: #ff0000;">
        <img src="/storage/photos/youtube.png" class="icon-img" onerror="this.src='https://via.placeholder.com/72?text=YT'">
    </div>
    <div class="app-label">Hell's Thread</div>
</div>
            <div class="app-icon" onclick="openApp('Settings', '/account')">
                <div class="icon-shape" style="background: #555;"><img src="/storage/photos/settings.png" class="icon-img" onerror="this.src='https://via.placeholder.com/72?text=Set'"></div>
                <div class="app-label">Settings</div>
            </div>
        </div>

        <!-- App Window Layer -->
        <div class="window-overlay" id="appOverlay">
            <div class="window-header">
                <span id="appTitle" class="font-semibold text-xs opacity-70">App Name</span>
                <span class="text-[10px] text-gray-500">Dungeon OS v1.2</span>
            </div>
            <iframe id="appFrame" src=""></iframe>
        </div>
    </div>

    <!-- Global System Navigation Bar -->
    <div class="system-nav-bar">
        <div class="nav-btn" onclick="goBack()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white" opacity="0.8"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </div>
        <div class="nav-btn" onclick="goHome()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white" opacity="0.8"><path d="M12 2L4 10v10h16V10L12 2zm0 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
        </div>
        <div class="nav-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white" opacity="0.8"><rect x="7" y="7" width="10" height="10" rx="1.5" stroke="white" fill="none" stroke-width="2"/></svg>
        </div>
    </div>

<script>
    function updateTime() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('statusTime').innerText = timeStr;
    }
    setInterval(updateTime, 1000);
    updateTime();

    function openApp(name, url) {
        if (url === '#') {
            alert("Restricted: Admins only.");
            return;
        }
        document.getElementById('appTitle').innerText = name;
        document.getElementById('appFrame').src = url;
        document.getElementById('appOverlay').style.display = 'flex';
    }

    function goHome() {
        document.getElementById('appOverlay').style.display = 'none';
        document.getElementById('appFrame').src = '';
    }

    function goBack() {
        const overlay = document.getElementById('appOverlay');
        if (overlay.style.display === 'flex') {
            goHome();
        }
    }
</script>

</body>
</html>
