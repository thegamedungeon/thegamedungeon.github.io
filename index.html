<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: white; }
        .nav-active { color: #3b82f6; }
        .loading-spinner { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex flex-col">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // App state
        let currentUserData = null;
        const isPWA = window.matchMedia('(display-mode: standalone)').matches;

        // UI Logic Helper
        window.switchView = async (view) => {
            const content = document.getElementById('main-content');
            content.innerHTML = `<div class="p-4 text-center">Loading...</div>`;
            
            // Highlight nav
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('text-blue-500'));
            document.getElementById(`nav-${view}`)?.classList.add('text-blue-500');

            if (view === 'home') renderHome();
            else if (view === 'play') renderPlay();
            else if (view === 'chat') renderChat();
            else if (view === 'account') renderAccount();
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const cleanEmail = user.email.split('@')[0];
                const userRef = doc(db, 'artifacts', 'the-game-dungeon-4d75d', 'public', 'data', 'users', cleanEmail);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists()) {
                    currentUserData = { ...userSnap.data(), email: user.email, id: cleanEmail };
                } else {
                    currentUserData = { username: "Guest", friends: [], email: user.email, id: cleanEmail };
                    await setDoc(userRef, currentUserData);
                }
                renderHome();
            } else {
                renderLogin();
            }
        });

        function renderHome() {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="p-6">
                    <img src="/storage/photos/tgdl.png" class="w-24 h-24 mx-auto rounded-full mb-4" onerror="this.src='https://placehold.co/100x100?text=Logo'">
                    <h1 class="text-2xl font-bold text-center">Welcome, ${currentUserData.username || 'User'}!</h1>
                    <div class="mt-8">
                        <h2 class="text-xl mb-4">Friends</h2>
                        <div id="friends-list" class="space-y-2"></div>
                    </div>
                </div>
            `;
            // Populate friends (mock logic for demo)
            const list = document.getElementById('friends-list');
            list.innerHTML = currentUserData.friends?.length 
                ? currentUserData.friends.map(f => `<div class="bg-gray-800 p-3 rounded">${f}</div>`).join('')
                : '<p class="text-gray-500">No friends added yet.</p>';
        }

        function renderPlay() {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="p-6 flex flex-col items-center">
                    <h1 class="text-2xl mb-6">Select a Game</h1>
                    <button onclick="launchGame('Ragdoll Hit')" class="bg-blue-600 px-8 py-3 rounded-xl font-bold">Ragdoll Hit</button>
                </div>
            `;
        }

        window.launchGame = (gameName) => {
            const container = document.getElementById('main-content');
            container.innerHTML = `<div class="flex h-full items-center justify-center"><div class="loading-spinner w-12 h-12 rounded-full border-4 border-gray-700"></div></div>`;
            
            setTimeout(() => {
                const page = gameName.toLowerCase().replace(/\s+/g, '-');
                container.innerHTML = `<iframe src="/play/${page}/" class="w-full h-full border-0"></iframe>`;
            }, 1500);
        };
    </script>

    <div id="app-container" class="flex-grow overflow-y-auto">
        <div id="main-content" class="h-full"></div>
    </div>

    <nav class="sticky bottom-0 bg-gray-900 border-t border-gray-800 p-4 flex justify-between items-center text-xs">
        <button onclick="switchView('home')" id="nav-home" class="nav-btn">Home</button>
        <button onclick="switchView('play')" id="nav-play" class="nav-btn">Play</button>
        <button onclick="switchView('chat')" id="nav-chat" class="nav-btn">Chat</button>
        <button onclick="switchView('account')" id="nav-account" class="nav-btn">Account</button>
    </nav>

    <script type="module">
        // Helper to render account
        window.renderAccount = () => {
            const container = document.getElementById('main-content');
            const isAdmin = currentUserData.email === 'open.it.out.fortnite@gmail.com';
            
            container.innerHTML = `
                <div class="p-6 text-center">
                    <img src="${auth.currentUser.photoURL}" class="w-20 h-20 rounded-full mx-auto mb-4">
                    <h2 class="text-xl">${currentUserData.username}</h2>
                    <p class="text-gray-400 mb-6">${currentUserData.email}</p>
                    ${isAdmin ? `<button id="admin-btn" class="bg-red-600 px-4 py-2 rounded mb-4">Admin Settings</button>` : ''}
                    <button onclick="signOut(auth)" class="bg-gray-700 px-4 py-2 rounded">Log Out</button>
                </div>
            `;

            if (isAdmin) {
                document.getElementById('admin-btn').onclick = () => showAdminPopup();
            }
        };

        window.showAdminPopup = () => {
            // Simplified modal injection
            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4";
            modal.innerHTML = `
                <div class="bg-gray-900 p-6 rounded-xl border border-gray-700">
                    <h2 class="text-xl mb-4">Blick User</h2>
                    <input id="blick-input" placeholder="Email or Username" class="bg-gray-800 p-2 w-full mb-4 text-white">
                    <div class="flex gap-2">
                        <button onclick="handleBlick(true)" class="bg-red-600 p-2 rounded">Blick</button>
                        <button onclick="handleBlick(false)" class="bg-green-600 p-2 rounded">Unblick</button>
                    </div>
                    <button onclick="this.parentElement.parentElement.remove()" class="mt-4 text-gray-400">Close</button>
                </div>
            `;
            document.body.appendChild(modal);
        };

        window.handleBlick = async (isBlick) => {
            const input = document.getElementById('blick-input').value;
            // logic to write to artifacts/the-game-dungeon-4d75d/public/data/banned-users/...
            console.log(isBlick ? "Blicking" : "Unblicking", input);
            alert("This functionality requires Firebase Admin SDK access which would be implemented in your backend handler.");
        };
    </script>
</body>
</html>
