<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Game Dungeon | CribOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --taskbar-height: 70px;
        }

        body, html { 
            margin: 0; padding: 0; 
            height: 100svh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: black; 
            touch-action: none; 
            color: white;
            user-select: none;
        }
        
        #boot-screen { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        
        #login-screen { 
            position: fixed; inset: 0; 
            background: rgba(0,0,0,0.95); 
            z-index: 9000; display: none; align-items: center; justify-content: center; 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
        }
        
        #desktop { 
            width: 100vw; 
            height: 100svh; 
            background-size: cover; 
            background-position: center; 
            position: relative; 
            display: none; 
            overflow: hidden;
        }

        .login-card {
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px; border-radius: 2.5rem; 
            width: 90%; max-width: 380px;
            text-align: center; box-shadow: 0 0 60px rgba(59, 130, 246, 0.15);
            display: flex; flex-direction: column; align-items: center;
        }

        .login-avatar-wrapper {
            width: 100px; height: 100px;
            margin-bottom: 24px;
            border-radius: 50%;
            border: 3px solid #3b82f6;
            overflow: hidden;
            flex-shrink: 0;
            background: #1a1a1a;
        }
        .login-avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .app-icon { 
            width: 90px; display: flex; flex-direction: column; align-items: center; cursor: pointer; margin: 12px; 
            transition: 0.2s; -webkit-tap-highlight-color: transparent; 
        }
        .app-icon:active { transform: scale(0.9); }
        .app-icon img { width: 65px; height: 65px; border-radius: 16px; margin-bottom: 8px; pointer-events: none; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .app-label { color: white; font-size: 11px; text-align: center; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        .window { 
            position: absolute; background: #161616; border: 1px solid #333; border-radius: 16px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.7); display: flex; flex-direction: column; 
            overflow: hidden; transition: opacity 0.2s, transform 0.2s;
            min-width: 300px; min-height: 200px;
        }
        .window.minimized {
            transform: scale(0.8) translateY(100px);
            opacity: 0;
            pointer-events: none;
        }
        .window.maximized {
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: calc(100svh - var(--taskbar-height) - 10px) !important;
            border-radius: 0;
        }

        .window-header { 
            background: #222; height: 45px; display: flex; align-items: center; 
            padding: 0 15px; cursor: move; user-select: none; border-bottom: 1px solid #333;
            touch-action: none;
        }
        .window-controls { display: flex; gap: 8px; }
        .control-btn { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; border: none; }
        .close { background: #ff5f56; } 
        .min { background: #ffbd2e; }
        .max { background: #27c93f; }
        
        .window-title { flex-grow: 1; text-align: center; color: #eee; font-size: 12px; font-weight: 600; pointer-events: none; }
        .window-content { flex-grow: 1; background: #000; position: relative; overflow: auto; }
        iframe { width: 100%; height: 100%; border: none; }

        #taskbar { 
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); 
            width: auto; height: var(--taskbar-height); 
            background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            display: flex; align-items: center; padding: 0 15px; z-index: 99999;
            border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
            gap: 10px;
        }
        
        .taskbar-item { 
            width: 50px; height: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; 
            transition: 0.2s; border-radius: 12px; position: relative;
        }
        .taskbar-item:active { transform: scale(0.8); }
        .taskbar-item img { width: 38px; height: 38px; border-radius: 10px; }
        .taskbar-item.active::after {
            content: ''; position: absolute; bottom: -5px; width: 4px; height: 4px; background: #3b82f6; border-radius: 50%;
        }

        #clock { border-left: 1px solid rgba(255,255,255,0.1); padding-left: 15px; margin-left: 5px; color: rgba(255,255,255,0.7); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
        
        /* DUNGEON SCROLLS STYLES */
        .scroll-pill {
            background: #2a2a2a;
            border-radius: 20px;
            padding: 12px 18px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .scroll-pill:hover { background: #333; transform: translateX(5px); }
        
        .avatar-main { width: 42px; height: 42px; border-radius: 14px; background: #444; overflow: hidden; object-fit: cover; }

        .chat-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 13px;
            position: relative;
            line-height: 1.4;
        }
        .bubble-sent { background: #3b82f6; color: white; border-bottom-right-radius: 2px; align-self: flex-end; }
        .bubble-received { background: #2a2a2a; color: #eee; border-bottom-left-radius: 2px; align-self: flex-start; border: 1px solid #333; }

        .tab-btn {
            flex: 1; padding: 12px; text-align: center; font-weight: 800; font-size: 11px; letter-spacing: 1px;
            color: rgba(255,255,255,0.4); border-bottom: 2px solid transparent; transition: 0.3s;
        }
        .tab-btn.active { color: #32ff32; border-bottom: 2px solid #32ff32; background: rgba(50, 255, 50, 0.05); }

    </style>
</head>
<body>

    <!-- Boot Sequence -->
    <div id="boot-screen">
        <img src="/storage/photos/tgdtc.png" class="w-20 mb-4 animate-pulse" onerror="this.src='https://thegamedungeon.github.io/logo.png'">
        <div class="text-[10px] font-mono opacity-40 uppercase tracking-[0.2em]">CribOS Core v2.5.0</div>
    </div>

    <!-- Login/Resident Entry -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-avatar-wrapper">
                <img src="/storage/photos/user.png" id="login-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Crib&background=3b82f6&color=fff'">
            </div>
            <h2 id="login-greeting" class="text-xl font-bold mb-6 italic text-blue-400">Welcome to the Crib</h2>
            
            <div id="login-form" class="w-full space-y-3">
                <input type="text" id="username-field" placeholder="Choose a Resident Name" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center text-white outline-none focus:border-blue-500 transition">
                <input type="password" id="pass-field" placeholder="Passkey (Optional)" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center text-white outline-none focus:border-blue-500 transition">
                
                <button onclick="doLogin()" class="w-full bg-blue-600 py-4 rounded-xl font-bold active:scale-95 transition-transform shadow-lg shadow-blue-900/20">ENTER CRIB</button>
                
                <div class="flex items-center gap-2 py-2">
                    <div class="flex-grow h-[1px] bg-white/10"></div>
                    <span class="text-[10px] text-white/30 font-bold uppercase tracking-widest">Instant Access</span>
                    <div class="flex-grow h-[1px] bg-white/10"></div>
                </div>

                <button onclick="googleFastpass()" class="w-full bg-white text-black py-3 rounded-xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-transform">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
                    <span>Google Fastpass</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Desktop Environment -->
    <div id="desktop">
        <div id="icon-layer" class="flex flex-col flex-wrap h-[calc(100svh-100px)] p-6 items-start gap-2"></div>
        
        <!-- Taskbar -->
        <div id="taskbar">
            <div class="taskbar-item" onclick="toggleMenu('start-menu')">
                <img src="/storage/photos/tgdtc.png" onerror="this.src='https://thegamedungeon.github.io/logo.png'">
            </div>
            <div class="flex items-center gap-2" id="running-apps-dock"></div>
            <div id="clock">00:00</div>
        </div>

        <!-- Start Menu -->
        <div id="start-menu" class="fixed bottom-24 left-1/2 -translate-x-1/2 w-[340px] bg-zinc-900/95 border border-white/10 rounded-[24px] p-5 hidden flex-col z-[100001] backdrop-blur-3xl shadow-2xl">
            <div class="flex items-center gap-4 mb-6 p-2 border-b border-white/10 pb-5">
                <img src="/storage/photos/user.png" class="w-12 h-12 rounded-full border-2 border-blue-500" id="menu-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Resident&background=3b82f6&color=fff'">
                <div class="flex flex-col">
                    <span id="stat-name" class="font-bold text-white text-lg">Wanderer</span>
                    <span class="text-[10px] text-blue-400 uppercase font-black tracking-widest">Crib Resident</span>
                </div>
            </div>
            <div class="grid grid-cols-1 gap-1" id="start-list"></div>
            <div class="mt-6 pt-4 border-t border-white/10 flex justify-between items-center">
                <button onclick="location.reload()" class="text-[10px] text-zinc-500 uppercase font-bold tracking-tighter">Restart CribOS</button>
                <span class="text-[10px] text-zinc-700">Ver 2.5.0-SPA</span>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // APP CONFIG (The Game Dungeon Official)
        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const globalAppId = 'the-crib-v2';

        let state = {
            z: 100,
            windows: {},
            currentUser: null,
            installed: ['browser', 'scrolls', 'ytmusic', 'cc', 'gd', 'kts', 'minecraft', 'polytrack', 'rh', 'settings'],
            scrolls: {
                currentTab: 'private', 
                chats: {} 
            }
        };

        const APPS = {
            browser: { name: 'ProxiCrib', icon: '/storage/photos/proxicrib.png', type: 'browser' },
            scrolls: { name: 'Scrolls', icon: 'https://cdn-icons-png.flaticon.com/512/3064/3064197.png', type: 'scrolls' },
            ytmusic: { name: 'YT Music', icon: '/storage/photos/ytmusic.png', type: 'ytm' },
            settings: { name: 'Settings', icon: '/storage/photos/settings.png' },
            cc: { name: 'Cookie Clicker', icon: '/storage/photos/cc.png', url: '/storage/cookieclick-main/index.html' },
            gd: { name: 'Geometry Dash', icon: '/storage/photos/gd.png', url: '/storage/gdl-main/index.html' },
            kts: { name: 'Kick the Sod', icon: '/storage/photos/kts.png', url: '/storage/kickthesod-main/index.html' },
            minecraft: { name: 'Minecraft', icon: '/storage/photos/minecraft.png', url: '/storage/minecraft-main/index.html' },
            polytrack: { name: 'Polytrack', icon: '/storage/photos/polytrack.png', url: '/storage/polytrack-0.5.2-clean-main/index.html' },
            rh: { name: 'Ragdoll Hit', icon: '/storage/photos/rh.png', url: '/storage/ragdoll-hit-main/index.html' }
        };

        onAuthStateChanged(auth, (user) => {
            state.currentUser = user;
            if (user) {
                const displayName = user.displayName || localStorage.getItem('crib_username') || "Resident";
                document.getElementById('stat-name').innerText = displayName;
                const profilePic = user.photoURL || `https://ui-avatars.com/api/?name=${displayName}&background=3b82f6&color=fff`;
                document.getElementById('menu-avatar').src = profilePic;
                document.getElementById('login-avatar').src = profilePic;
                setupScrollHistoryListener();
            }
        });

        window.googleFastpass = async () => {
            try { await signInWithPopup(auth, provider); enterDesktop(); } 
            catch (e) { await signInAnonymously(auth); enterDesktop(); }
        };

        window.doLogin = async () => {
            const user = document.getElementById('username-field').value.trim();
            await signInAnonymously(auth);
            localStorage.setItem('crib_username', user || "Wanderer");
            enterDesktop();
        };

        function enterDesktop() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('desktop').style.display = 'block';
            renderIcons(); startClock();
            const wall = localStorage.getItem('crib_wall') || 'https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070&auto=format&fit=crop';
            document.getElementById('desktop').style.backgroundImage = `url('${wall}')`;
        }

        function startClock() {
            setInterval(() => {
                document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }, 1000);
        }

        window.toggleMenu = (id) => {
            const m = document.getElementById(id);
            m.classList.toggle('hidden');
            m.classList.toggle('flex');
        };

        function renderIcons() {
            const layer = document.getElementById('icon-layer');
            const startList = document.getElementById('start-list');
            layer.innerHTML = ''; startList.innerHTML = '';
            
            state.installed.forEach(id => {
                const app = APPS[id];
                const div = document.createElement('div');
                div.className = 'app-icon';
                div.onclick = () => launchApp(id);
                div.innerHTML = `<img src="${app.icon}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3064/3064197.png'"><span class="app-label">${app.name}</span>`;
                layer.appendChild(div);

                const sItem = document.createElement('div');
                sItem.className = 'flex items-center gap-3 p-3 hover:bg-white/10 rounded-xl cursor-pointer text-white text-sm transition';
                sItem.innerHTML = `<img src="${app.icon}" class="w-8 h-8 rounded-lg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3064/3064197.png'"><span>${app.name}</span>`;
                sItem.onclick = () => { launchApp(id); toggleMenu('start-menu'); };
                startList.appendChild(sItem);
            });
        }

        window.launchApp = (id) => {
            const app = APPS[id];
            if (id === 'settings') return openSettings();
            if (app.type === 'browser') return openBrowser();
            if (app.type === 'scrolls') return openScrolls();
            createWindow(id, app.name, app.url, app.icon);
        };

        // --- DUNGEON SCROLLS ---
        function openScrolls() {
            const html = `
                <div class="bg-[#111] h-full flex flex-col font-sans overflow-hidden">
                    <div class="flex bg-[#1a1a1a] border-b border-white/5">
                        <div id="tab-private" class="tab-btn active" onclick="window.switchScrollTab('private')">PRIVATE SCROLLS</div>
                        <div id="tab-global" class="tab-btn" onclick="window.switchScrollTab('global')">GLOBAL CHANNEL</div>
                    </div>

                    <div id="scroll-main-view" class="flex-grow flex flex-col overflow-hidden relative">
                        <div id="private-view" class="flex-grow overflow-y-auto p-4 flex flex-col">
                            <button onclick="window.startNewScroll()" class="bg-blue-600/20 border border-blue-500/50 text-blue-400 p-4 rounded-2xl mb-4 font-bold text-xs uppercase tracking-widest active:scale-95 transition">+ Start New Scroll</button>
                            <div id="private-chats-list"></div>
                        </div>

                        <div id="global-view" class="hidden flex-grow flex flex-col">
                            <div id="global-messages" class="flex-grow p-4 overflow-y-auto flex flex-col gap-3"></div>
                            <div class="p-4 bg-zinc-900 flex gap-2 border-t border-white/5">
                                <input type="text" id="global-msg-input" class="flex-1 bg-black rounded-xl px-4 py-3 text-white outline-none border border-white/10 text-sm" placeholder="Message global channel...">
                                <button onclick="window.sendGlobalMsg()" class="bg-[#32ff32] text-black w-10 h-10 rounded-xl flex items-center justify-center font-bold">➤</button>
                            </div>
                        </div>

                        <div id="scroll-chat-overlay" class="absolute inset-0 bg-[#0a0a0a] hidden flex-col z-20">
                            <div class="p-4 border-b border-white/5 flex items-center justify-between bg-[#111]">
                                <div class="flex items-center gap-3">
                                    <button onclick="window.closeScrollChat()" class="text-zinc-500 font-bold text-xl px-2">←</button>
                                    <img id="target-avatar" src="" class="w-9 h-9 rounded-xl">
                                    <div class="flex flex-col">
                                        <span id="target-name" class="text-white font-bold text-sm"></span>
                                        <span class="text-[9px] text-blue-400 uppercase font-black tracking-widest">Resident</span>
                                    </div>
                                </div>
                                <button onclick="window.attachPhoto()" class="text-blue-400 text-xs font-bold uppercase tracking-tighter border border-blue-500/20 px-3 py-1 rounded-lg">+ Photo</button>
                            </div>
                            <div id="target-messages" class="flex-grow p-4 overflow-y-auto flex flex-col gap-3"></div>
                            <div class="p-4 bg-zinc-900 flex gap-2 items-center">
                                <div id="attachment-preview" class="hidden text-[10px] text-blue-400 font-black uppercase whitespace-nowrap bg-blue-500/10 px-2 py-1 rounded">IMG+</div>
                                <input type="text" id="target-msg-input" class="flex-1 bg-black rounded-xl px-4 py-3 text-white outline-none border border-white/10 text-sm" placeholder="Cast message...">
                                <button onclick="window.sendPrivateMsg()" class="bg-blue-600 w-10 h-10 rounded-xl flex items-center justify-center font-bold">➤</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            createWindow('scrolls', 'Dungeon Scrolls', null, 'https://cdn-icons-png.flaticon.com/512/3064/3064197.png', html);
            renderPrivateList();
            setupGlobalScrollListener();
        }

        window.switchScrollTab = (tab) => {
            state.scrolls.currentTab = tab;
            document.getElementById('tab-private').classList.toggle('active', tab === 'private');
            document.getElementById('tab-global').classList.toggle('active', tab === 'global');
            document.getElementById('private-view').style.display = tab === 'private' ? 'flex' : 'none';
            document.getElementById('global-view').style.display = tab === 'global' ? 'flex' : 'none';
        };

        let currentTargetId = '';
        let privateUnsub = null;
        let pendingImage = false;

        function setupScrollHistoryListener() {
            if (!state.currentUser) return;
            const q = query(collection(db, 'artifacts', globalAppId, 'users', state.currentUser.uid, 'scrolls'));
            onSnapshot(q, (snap) => {
                state.scrolls.chats = {}; 
                snap.forEach(doc => {
                    state.scrolls.chats[doc.id] = doc.data();
                });
                renderPrivateList();
            }, (err) => console.log("Scroll sync error:", err));
        }

        function renderPrivateList() {
            const list = document.getElementById('private-chats-list');
            if (!list) return;
            list.innerHTML = '';
            
            const allTargets = Object.values(state.scrolls.chats);

            if (allTargets.length === 0) {
                list.innerHTML = `<div class="text-zinc-600 text-[10px] text-center mt-10 uppercase font-black tracking-[0.2em]">No Scrolls Discovered</div>`;
                return;
            }

            allTargets.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'scroll-pill';
                div.onclick = () => window.openPrivateChat(chat.id, chat.name, chat.avatar || `https://ui-avatars.com/api/?name=${chat.name}`);
                
                // DUNGEON SAFETY: Hide the real message text behind a watermark in the list
                let displayMsg = "HIDDEN FOR SAFETY";
                if (chat.hasImage) {
                    displayMsg += " <attached_image>";
                }

                div.innerHTML = `
                    <img src="${chat.avatar || ''}" class="avatar-main" onerror="this.src='https://ui-avatars.com/api/?name=${chat.name}'">
                    <div class="flex flex-col flex-1 overflow-hidden">
                        <span class="text-white font-bold text-sm uppercase">${chat.name}</span>
                        <span class="text-blue-500/50 text-[9px] font-black italic tracking-widest truncate uppercase">${displayMsg}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        window.startNewScroll = () => {
            const name = prompt("Enter Resident Name or ID:");
            if(name) {
                const id = name.toLowerCase().replace(/\s/g, '_');
                window.openPrivateChat(id, name);
            }
        };

        window.attachPhoto = () => {
            pendingImage = true;
            document.getElementById('attachment-preview').classList.remove('hidden');
        };

        window.openPrivateChat = (id, name, avatar) => {
            currentTargetId = id;
            const overlay = document.getElementById('scroll-chat-overlay');
            if (!overlay) return;
            overlay.classList.remove('hidden'); overlay.classList.add('flex');
            document.getElementById('target-name').innerText = name;
            document.getElementById('target-avatar').src = avatar || `https://ui-avatars.com/api/?name=${name}`;
            
            if(privateUnsub) privateUnsub();
            
            const q = query(collection(db, 'artifacts', globalAppId, 'users', state.currentUser.uid, 'scrolls', id, 'messages'), orderBy('timestamp', 'asc'));
            privateUnsub = onSnapshot(q, (snap) => {
                const area = document.getElementById('target-messages');
                if(!area) return;
                area.innerHTML = '';
                snap.forEach(doc => {
                    const d = doc.data();
                    const isMe = d.sender === state.currentUser.uid;
                    const msg = document.createElement('div');
                    msg.className = `chat-bubble ${isMe ? 'bubble-sent' : 'bubble-received'}`;
                    
                    // Inside the chat, it's safe to see!
                    let content = d.text;
                    if (d.hasImage) content += "\n<attached_image>";
                    msg.innerText = content;
                    area.appendChild(msg);
                });
                area.scrollTop = area.scrollHeight;
            });
        };

        window.closeScrollChat = () => {
            document.getElementById('scroll-chat-overlay').classList.add('hidden');
            if(privateUnsub) privateUnsub();
            pendingImage = false;
        };

        window.sendPrivateMsg = async () => {
            const input = document.getElementById('target-msg-input');
            const text = input.value.trim();
            if((!text && !pendingImage) || !state.currentUser) return;

            const msgData = {
                text,
                sender: state.currentUser.uid,
                timestamp: serverTimestamp(),
                hasImage: pendingImage
            };

            await addDoc(collection(db, 'artifacts', globalAppId, 'users', state.currentUser.uid, 'scrolls', currentTargetId, 'messages'), msgData);

            await setDoc(doc(db, 'artifacts', globalAppId, 'users', state.currentUser.uid, 'scrolls', currentTargetId), {
                name: document.getElementById('target-name').innerText,
                id: currentTargetId,
                lastMessage: text || "(Image)",
                hasImage: pendingImage,
                lastUpdate: serverTimestamp()
            }, { merge: true });

            input.value = '';
            pendingImage = false;
            document.getElementById('attachment-preview').classList.add('hidden');
        };

        function setupGlobalScrollListener() {
            const q = query(collection(db, 'artifacts', globalAppId, 'public', 'data', 'global_scrolls'), orderBy("timestamp", "asc"), limit(50));
            onSnapshot(q, (snap) => {
                const area = document.getElementById('global-messages');
                if(!area) return;
                area.innerHTML = '';
                snap.forEach(doc => {
                    const d = doc.data();
                    const isMe = d.uid === state.currentUser?.uid;
                    const msg = document.createElement('div');
                    msg.className = `chat-bubble ${isMe ? 'bubble-sent' : 'bubble-received'}`;
                    msg.innerHTML = `<div class="text-[9px] opacity-40 font-bold mb-1">${d.user}</div>${d.text}`;
                    area.appendChild(msg);
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        window.sendGlobalMsg = async () => {
            const input = document.getElementById('global-msg-input');
            const text = input.value.trim();
            if(!text || !state.currentUser) return;
            await addDoc(collection(db, 'artifacts', globalAppId, 'public', 'data', 'global_scrolls'), {
                text, user: localStorage.getItem('crib_username') || "Resident", uid: state.currentUser.uid, timestamp: serverTimestamp()
            });
            input.value = '';
        };

        function openBrowser() {
            const html = `<div class="flex flex-col h-full bg-[#111]"><div class="p-2 bg-[#222] flex gap-2 items-center"><input type="text" id="br-input" class="flex-1 bg-black border border-zinc-700 rounded-lg p-2 text-white outline-none" placeholder="Enter URL..."><button onclick="window.goBrowse()" class="bg-blue-600 px-4 py-2 rounded-lg font-bold">GO</button></div><iframe id="br-frame" class="flex-grow bg-white"></iframe></div>`;
            createWindow('browser', 'ProxiCrib', null, '/storage/photos/proxicrib.png', html);
        }

        window.goBrowse = () => {
            const input = document.getElementById('br-input');
            const frame = document.getElementById('br-frame');
            let q = input.value.trim();
            if(!q) return;
            if(!q.includes('.') || q.includes(' ')) q = `https://www.bing.com/search?q=${encodeURIComponent(q)}`;
            if(!q.startsWith('http')) q = 'https://' + q;
            frame.src = `https://nodeunbl0cker.vercel.app/proxy/https:/${q.replace(/^https?:\/\//, '')}`;
        };

        function createWindow(appId, title, url, icon, customHtml = null) {
            if (state.windows[appId]) return window.toggleMinimize(appId);
            const winId = 'win_' + appId;
            const win = document.createElement('div');
            win.id = winId; win.className = 'window';
            state.z++; win.style.zIndex = state.z;
            win.style.width = '800px'; win.style.height = '500px'; win.style.left = '100px'; win.style.top = '100px';
            if (window.innerWidth < 800) { win.style.width = '95vw'; win.style.left = '2.5vw'; }

            win.innerHTML = `
                <div class="window-header" onmousedown="window.initDrag(event, '${winId}')" ontouchstart="window.initDrag(event, '${winId}')">
                    <div class="window-controls"><button class="control-btn close" onclick="window.closeWin('${appId}')"></button><button class="control-btn min" onclick="window.toggleMinimize('${appId}')"></button><button class="control-btn max" onclick="window.toggleMaximize('${winId}')"></button></div>
                    <div class="window-title">${title}</div>
                </div>
                <div class="window-content" onmousedown="window.bringToFront('${winId}')">
                    ${customHtml ? customHtml : `<iframe src="${url}"></iframe>`}
                    <div class="absolute inset-0 bg-transparent pointer-events-none" id="cover_${winId}"></div>
                </div>
            `;
            document.getElementById('desktop').appendChild(win);
            state.windows[appId] = { id: winId, title, icon };
            updateDock();
        }

        window.initDrag = (e, id) => {
            const el = document.getElementById(id);
            window.bringToFront(id);
            if (el.classList.contains('maximized')) return;
            const covers = document.querySelectorAll('[id^="cover_"]');
            covers.forEach(c => c.style.pointerEvents = 'auto');
            const startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            let startL = el.offsetLeft, startT = el.offsetTop;
            const move = (ev) => {
                const cx = ev.type.includes('touch') ? ev.touches[0].clientX : ev.clientX;
                const cy = ev.type.includes('touch') ? ev.touches[0].clientY : ev.clientY;
                el.style.left = (startL + cx - startX) + 'px';
                el.style.top = (startT + cy - startY) + 'px';
            };
            const stop = () => {
                covers.forEach(c => c.style.pointerEvents = 'none');
                window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop);
                window.removeEventListener('touchmove', move); window.removeEventListener('touchend', stop);
            };
            window.addEventListener('mousemove', move); window.addEventListener('mouseup', stop);
            window.addEventListener('touchmove', move, { passive: false }); window.addEventListener('touchend', stop);
        };

        window.closeWin = (id) => { document.getElementById('win_'+id).remove(); delete state.windows[id]; updateDock(); };
        window.toggleMinimize = (id) => {
            const el = document.getElementById('win_'+id);
            if(!el) return;
            el.classList.toggle('minimized');
            if (!el.classList.contains('minimized')) window.bringToFront('win_'+id);
        };
        window.toggleMaximize = (id) => document.getElementById(id).classList.toggle('maximized');
        window.bringToFront = (id) => { state.z++; document.getElementById(id).style.zIndex = state.z; };

        function updateDock() {
            const dock = document.getElementById('running-apps-dock');
            dock.innerHTML = '';
            Object.keys(state.windows).forEach(id => {
                const app = state.windows[id];
                const div = document.createElement('div');
                div.className = 'taskbar-item active';
                div.onclick = () => window.toggleMinimize(id);
                div.innerHTML = `<img src="${app.icon}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3064/3064197.png'">`;
                dock.appendChild(div);
            });
        }

        function openSettings() {
            const html = `
                <div class="p-8">
                    <h2 class="text-2xl font-bold mb-4">Wallpaper URL</h2>
                    <input type="text" id="wall-in" class="w-full bg-zinc-800 p-4 rounded-xl text-white outline-none mb-4" placeholder="Enter wallpaper URL...">
                    <button onclick="localStorage.setItem('crib_wall', document.getElementById('wall-in').value); location.reload()" class="w-full bg-blue-600 p-4 rounded-xl font-bold">Save & Refresh</button>
                    <div class="mt-8 text-zinc-600 text-xs">Resident ID: ${state.currentUser?.uid || 'Unknown'}</div>
                </div>
            `;
            createWindow('settings', 'Settings', null, '/storage/photos/settings.png', html);
        }

        window.onload = () => {
            setTimeout(() => {
                const boot = document.getElementById('boot-screen');
                boot.style.opacity = '0';
                setTimeout(() => {
                    boot.style.display = 'none';
                    document.getElementById('login-screen').style.display = 'flex';
                }, 500);
            }, 1200);
        };
    </script>
</body>
</html>
