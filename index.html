<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GAME DUNGEON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --dungeon-green: #00ff41;
            --dark-grey: #0a0a0a; /* Almost black */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-grey);
            font-family: 'Courier New', Courier, monospace;
            color: var(--dungeon-green);
            user-select: none;
            touch-action: none; 
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: transform 1s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.8s ease;
            background-color: var(--dark-grey);
        }

        .logo {
            width: 220px;
            height: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 15px rgba(0, 255, 65, 0.4));
        }

        .glitch-text {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.6rem;
            margin-bottom: 1rem;
            color: var(--dungeon-green);
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .swipe-hint {
            font-size: 1.3rem;
            opacity: 0.8;
            animation: pulse 1.5s infinite;
            text-transform: lowercase;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-10px); }
        }

        /* Disintegration effect - flying UP to the middle */
        .disintegrate {
            transform: translateY(-50%) scale(0.8);
            opacity: 0;
            pointer-events: none;
        }

        /* Library Grid */
        #game-library {
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
            opacity: 0;
            transform: translateY(100px);
            transition: opacity 1s ease 0.4s, transform 0.8s ease 0.4s;
            touch-action: auto; 
        }

        .library-visible {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .game-card {
            border: 2px solid rgba(0, 255, 65, 0.3);
            background: rgba(0, 255, 65, 0.03);
            padding: 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .game-card:hover {
            border-color: var(--dungeon-green);
            background: rgba(0, 255, 65, 0.1);
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.4);
            transform: scale(1.05) translateY(-5px);
        }

        .game-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
            border-radius: 15px;
            object-fit: cover;
            border: 1px solid var(--dungeon-green);
        }

        /* Modal "Rising from the Grave" to the MIDDLE */
        #modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            display: none;
            justify-content: center;
            align-items: center; /* Changed to center to hit the middle */
            z-index: 200;
            transition: background 0.5s ease;
        }

        #game-modal {
            width: 90%;
            max-width: 1200px;
            height: 75%;
            background: #000;
            border: 2px solid var(--dungeon-green);
            border-radius: 20px;
            position: relative;
            /* Start way below the screen */
            transform: translateY(150%); 
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 255, 65, 0.4);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2.5rem;
            color: var(--dungeon-green);
            cursor: pointer;
            z-index: 210;
            background: rgba(0,0,0,0.8);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid var(--dungeon-green);
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: var(--dungeon-green);
            color: black;
            box-shadow: 0 0 15px var(--dungeon-green);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Scrollbar hack */
        #game-library::-webkit-scrollbar {
            width: 6px;
        }
        #game-library::-webkit-scrollbar-thumb {
            background: var(--dungeon-green);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <img src="/storage/photos/tgdtc.png" alt="Dungeon Logo" class="logo" onerror="this.src='https://via.placeholder.com/200?text=DUNGEON'">
        <h1 class="glitch-text">THE GAME DUNGEON</h1>
        <p class="swipe-hint">Swipe up to play</p>
    </div>

    <!-- Main Game Grid -->
    <div id="game-library">
        <div class="game-card" onclick="openGame('Cookie Clicker', '/storage/cookieclick-main/index.html')">
            <img src="/storage/photos/cc.png" class="game-icon" alt="icon">
            <h2 class="text-xl font-bold">COOKIE CLICKER</h2>
        </div>

        <div class="game-card" onclick="openGame('Geometry Dash', '/storage/gdl-main/index.html')">
            <img src="/storage/photos/gd.png" class="game-icon" alt="icon">
            <h2 class="text-xl font-bold">GEOMETRY DASH</h2>
        </div>

        <div class="game-card" onclick="openGame('Kick The Sod', '/storage/kickthesod-main/index.html')">
            <img src="/storage/photos/kts.png" class="game-icon" alt="icon">
            <h2 class="text-xl font-bold">KICK THE SOD</h2>
        </div>

        <div class="game-card" onclick="openGame('Minecraft', '/storage/minecraft-main/index.html')">
            <img src="/storage/photos/minecraft.png" class="game-icon" alt="icon">
            <h2 class="text-xl font-bold">MINECRAFT</h2>
        </div>

        <div class="game-card" onclick="openGame('Polytrack', '/storage/polytrack-0.5.2-clean-main/index.html')">
            <img src="/storage/photos/polytrack.png" class="game-icon" alt="icon">
            <h2 class="text-xl font-bold">POLYTRACK</h2>
        </div>

        <div class="game-card" onclick="openGame('Ragdoll Hit', '/storage/ragdoll-hit-main/index.html')">
            <img src="/storage/photos/rh.png" class="game-icon" alt="icon">
            <h2 class="text-xl font-bold">RAGDOLL HIT</h2>
        </div>
    </div>

    <!-- The Grave Modal -->
    <div id="modal-overlay" onclick="closeGame()">
        <div id="game-modal" onclick="event.stopPropagation()">
            <div class="close-btn" onclick="closeGame()">&times;</div>
            <iframe id="game-frame" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        const splash = document.getElementById('splash-screen');
        const library = document.getElementById('game-library');
        const overlay = document.getElementById('modal-overlay');
        const modal = document.getElementById('game-modal');
        const frame = document.getElementById('game-frame');

        let touchStartY = 0;

        // Swipe UP Detection
        window.addEventListener('touchstart', e => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', e => {
            if (splash.classList.contains('disintegrate')) return;
            const touchEndY = e.changedTouches[0].clientY;
            if (touchEndY < touchStartY - 60) {
                enterDungeon();
            }
        }, { passive: true });

        // Desktop Scroll Detection
        window.addEventListener('wheel', e => {
            if (e.deltaY > 0 && !splash.classList.contains('disintegrate')) {
                enterDungeon();
            }
        });

        function enterDungeon() {
            splash.classList.add('disintegrate');
            library.classList.add('library-visible');
        }

        function openGame(title, url) {
            frame.src = url;
            overlay.style.display = 'flex';
            setTimeout(() => {
                overlay.style.background = 'rgba(0, 0, 0, 0.8)'; // Darkness = 80%
                modal.style.transform = 'translateY(0)'; // Rises to its centered position
            }, 10);
        }

        function closeGame() {
            modal.style.transform = 'translateY(150%)'; // Buries it back underground
            overlay.style.background = 'rgba(0, 0, 0, 0)';
            setTimeout(() => {
                overlay.style.display = 'none';
                frame.src = 'about:blank';
            }, 800);
        }
    </script>
</body>
</html>
