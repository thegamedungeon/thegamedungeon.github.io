<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CRIB | HPMS HIGH COUNCIL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root {
            --green-belt: #00ff00;
            --bg-black: #050505;
            --admin-red: #ff0033;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-black);
            color: white;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        .page-view {
            display: none;
            width: 100%;
            height: 100vh;
            padding-top: 80px;
            overflow-y: auto;
            position: absolute;
            top: 0; left: 0;
            background: var(--bg-black);
        }
        .active-view { 
            display: block !important; 
            z-index: 50; 
            animation: appFade 0.3s ease-in-out; 
        }

        @keyframes appFade {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; position: fixed; top: 0; width: 100%; height: 70px;
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px);
            z-index: 9000; border-bottom: 1px solid rgba(0, 255, 0, 0.1);
        }
        
        .crib-logo {
            text-shadow: 0 0 15px var(--green-belt);
            color: var(--green-belt);
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1.5px;
        }

        .vault-btn {
            background: rgba(0, 255, 0, 0.03);
            border: 2px solid var(--green-belt);
            color: var(--green-belt);
            padding: 22px 0;
            border-radius: 28px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 5px;
            width: 100%;
            font-size: 1.2rem;
            text-align: center;
        }

        .vault-btn:hover {
            background: var(--green-belt);
            color: black;
            box-shadow: 0 0 40px var(--green-belt);
            transform: scale(1.03);
        }

        .account-btn {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: var(--green-belt);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
        }

        .crib-input {
            width: 100%; padding: 18px; background: #0a0a0a;
            border: 1px solid #1a1a1a; border-radius: 20px; color: white; font-weight: bold;
            margin-bottom: 12px;
        }

        .ban-card {
            background: #110000; border: 1px solid var(--admin-red);
            padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="nav-header">
        <div class="crib-logo text-2xl cursor-pointer" onclick="showView('home')">THE CRIB</div>
        <div class="flex items-center">
            <button class="bell-btn mr-4" onclick="showView('notifications')">🔔</button>
            <div id="auth-status">
                <button class="account-btn" onclick="handleAccountClick()">🔑 LOGIN</button>
            </div>
        </div>
    </div>

    <!-- VIEW: HOME -->
    <section id="view-home" class="page-view active-view">
        <div class="flex flex-col items-center justify-center min-h-[85vh] text-center px-6">
            <h1 class="text-8xl sm:text-[10rem] font-black crib-logo mb-2 tracking-tighter">THE CRIB</h1>
            <p class="text-gray-600 uppercase tracking-[0.5em] text-[10px] mb-12 font-bold italic">HPMS HIGH COUNCIL</p>
            <div class="w-72">
                <button class="vault-btn" onclick="showView('vault')">🎮 OPEN VAULT</button>
            </div>
        </div>
    </section>

    <!-- VIEW: VAULT -->
    <section id="view-vault" class="page-view">
        <div class="max-w-6xl mx-auto px-6 pb-32 text-center">
            <div class="flex justify-between items-end mb-12">
                <h2 class="text-5xl font-black crib-logo uppercase italic">The Vault</h2>
                <button onclick="showView('records')" class="text-[10px] border border-green-500/30 text-green-500 px-4 py-2 rounded-full font-black">📜 RECORDS</button>
            </div>
            <div id="vaultGrid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </div>
    </section>

    <!-- VIEW: LOGIN -->
    <section id="view-login" class="page-view">
        <div class="flex items-center justify-center min-h-[80vh] px-6">
            <div class="w-full max-w-sm bg-[#0a0a0a] p-10 rounded-[2.5rem] border border-white/5 text-center shadow-2xl">
                <h2 class="text-3xl font-black crib-logo mb-8 uppercase italic">Gatekeeper</h2>
                <input type="email" id="email-in" class="crib-input" placeholder="User ID">
                <input type="password" id="pass-in" class="crib-input" placeholder="Secret Key">
                <button class="vault-btn !py-4 !text-lg !rounded-2xl mb-4" onclick="handleLogin()">ENTER</button>
                <div class="flex gap-2">
                    <button class="w-1/2 bg-white/5 text-[10px] py-3 rounded-xl font-black" onclick="handleCreateAccount()">CREATE</button>
                    <button class="w-1/2 bg-white text-black text-[10px] py-3 rounded-xl font-black" onclick="handleGoogleLogin()">GOOGLE</button>
                </div>
            </div>
        </div>
    </section>

    <!-- VIEW: ADMIN DASHBOARD -->
    <section id="view-admin" class="page-view">
        <div class="max-w-4xl mx-auto px-6 pb-32">
            <h2 class="text-4xl font-black text-red-500 mb-10 uppercase italic">Council Settings</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-[#0a0a0a] p-8 rounded-[2.5rem] border border-red-500/20 text-center">
                    <h3 class="font-black mb-4">Security Protocols</h3>
                    <button class="w-full bg-red-600 text-white font-black py-4 rounded-2xl shadow-lg mb-4" onclick="showView('bans')">🚫 MANAGE BAN LIST</button>
                    <button class="w-full bg-white/5 text-gray-400 font-black py-4 rounded-2xl" onclick="handleLogout()">TERMINATE SESSION</button>
                </div>
                <div class="bg-[#0a0a0a] p-8 rounded-[2.5rem] border border-green-500/20">
                    <h3 class="font-black mb-4 text-green-500 uppercase">Council Watch</h3>
                    <p class="text-xs text-gray-500 italic">Connor IQ: Error 404. Sod-erdine is still acting tuff. Leo is being Leo.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- VIEW: BAN PAGE -->
    <section id="view-bans" class="page-view">
        <div class="max-w-2xl mx-auto px-6 pb-32">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-4xl font-black text-red-500 uppercase italic">Blicked List</h2>
                <button onclick="showView('admin')" class="text-[10px] font-black text-gray-500">BACK</button>
            </div>
            <div class="bg-[#0a0a0a] p-6 rounded-3xl border border-red-500/20 mb-8">
                <input type="email" id="ban-email-in" class="crib-input" placeholder="User ID to blick...">
                <input type="text" id="ban-reason-in" class="crib-input" placeholder="Reason (The Roast)">
                <input type="number" id="ban-hours-in" class="crib-input" placeholder="Hours (Empty = Perma-Blick)">
                <button class="w-full bg-red-600 py-3 rounded-xl font-black" onclick="dispatchBan()">EXECUTE BAN</button>
            </div>
            <div id="ban-list-container" class="space-y-4"></div>
        </div>
    </section>

    <div id="game-layer" style="display:none; position:fixed; inset:0; background:black; z-index:20000;">
        <button onclick="exitGame()" class="fixed top-6 left-6 z-[20001] bg-black/80 text-white w-12 h-12 rounded-full border border-white/10 font-bold">✕</button>
        <iframe id="game-frame" src="about:blank" class="w-full h-full border-none" allowfullscreen></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const appId = 'the-game-dungeon-4d75d';

        let currentUser = null;
        const admins = ["open.it.out.fortnite@gmail.com", "awilson02341@outlook.com", "thegamedungeon.thecrib@gmail.com"];

        // --- GLOBAL BAN MONITORING & REDIRECT ---
        function startGlobalBanWatch() {
            const banCol = collection(db, 'artifacts', appId, 'public', 'data', 'banned_users');
            onSnapshot(banCol, (snap) => {
                const now = Date.now();
                let amIBanned = false;

                snap.forEach(d => {
                    const data = d.data();
                    const email = d.id;
                    const expiry = data.expiresAt || Infinity;

                    if (now < expiry) {
                        if (currentUser && currentUser.email?.toLowerCase() === email) {
                            amIBanned = true;
                        }
                    }
                });

                if (amIBanned) {
                    // ACTUALLY REDIRECT to the void
                    window.location.replace("https://thegamedungeon.github.io/blicked/");
                }

                const listContainer = document.getElementById('ban-list-container');
                if (listContainer) {
                    listContainer.innerHTML = '';
                    snap.forEach(d => {
                        const data = d.data();
                        const isPerma = !data.expiresAt;
                        const returnTime = isPerma ? "NEVER (PERMA)" : new Date(data.expiresAt).toLocaleString();
                        
                        const card = document.createElement('div');
                        card.className = 'ban-card';
                        card.innerHTML = `
                            <div class="text-left">
                                <div class="text-xs font-black text-red-500">${d.id}</div>
                                <div class="text-[10px] text-gray-400 font-bold uppercase">${data.reason || 'Council Order'}</div>
                                <div class="text-[8px] text-gray-600 mt-1">LOG BACK IN: ${returnTime}</div>
                            </div>
                            <button onclick="unbanUser('${d.id}')" class="text-[10px] text-green-500 font-black hover:underline">UNBLICK</button>
                        `;
                        listContainer.appendChild(card);
                    });
                }
            });
        }

        window.showView = (id) => {
            document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active-view'));
            document.getElementById('view-' + id).classList.add('active-view');
        };

        window.handleAccountClick = () => {
            if (!currentUser) showView('login');
            else if (admins.includes(currentUser.email.toLowerCase())) showView('admin');
            else showView('home');
        };

        window.handleLogin = () => {
            const e = document.getElementById('email-in').value;
            const p = document.getElementById('pass-in').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("GATEKEEPER REJECTED: " + err.message));
        };

        window.handleCreateAccount = () => {
            const e = document.getElementById('email-in').value;
            const p = document.getElementById('pass-in').value;
            createUserWithEmailAndPassword(auth, e, p).catch(err => alert("ERROR: " + err.message));
        };

        window.handleGoogleLogin = () => signInWithPopup(auth, provider);
        window.handleLogout = () => signOut(auth).then(() => showView('home'));

        window.dispatchBan = async () => {
            const email = document.getElementById('ban-email-in').value.trim().toLowerCase();
            const reason = document.getElementById('ban-reason-in').value.trim();
            const hours = document.getElementById('ban-hours-in').value;
            
            if(!email) return;

            const expiresAt = hours ? Date.now() + (parseInt(hours) * 60 * 60 * 1000) : null;
            
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'banned_users', email), {
                banned: true,
                reason: reason || "Oink Oink Level Threat",
                expiresAt: expiresAt,
                timestamp: Date.now()
            });

            document.getElementById('ban-email-in').value = '';
            document.getElementById('ban-reason-in').value = '';
            document.getElementById('ban-hours-in').value = '';
        };

        window.unbanUser = async (id) => {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'banned_users', id));
        };

        onAuthStateChanged(auth, async (user) => {
            const slot = document.getElementById('auth-status');
            if (user) {
                currentUser = user;
                const isAdmin = admins.includes(user.email.toLowerCase());
                slot.innerHTML = `<button class="account-btn" onclick="handleAccountClick()">${isAdmin ? '🛡️ COUNCIL' : '👤 ' + user.email.split('@')[0]}</button>`;
                if(isAdmin && document.getElementById('view-login').classList.contains('active-view')) showView('admin');
            } else {
                currentUser = null;
                slot.innerHTML = `<button class="account-btn" onclick="handleAccountClick()">🔑 LOGIN</button>`;
                signInAnonymously(auth).catch(() => {}); 
            }
        });

        // Init
        startGlobalBanWatch();
        const games = ['Ragdoll Hit', 'Cookie Clicker', 'Geometry Dash', 'Polytrack', 'Minecraft', 'Proxycrib', 'Kick The Sod'];
        const grid = document.getElementById('vaultGrid');
        games.forEach(g => {
            const card = document.createElement('div');
            card.className = 'game-card p-8 bg-[#0f0f0f] rounded-[2rem] cursor-pointer border border-transparent hover:border-green-500 transition';
            card.onclick = () => {
                document.getElementById('game-frame').src = `https://thegamedungeon.github.io/storage/games/${g.toLowerCase().replace(/\s+/g, '_')}/`;
                document.getElementById('game-layer').style.display = 'block';
            };
            card.innerHTML = `<h3 class="font-black text-xs uppercase">${g}</h3>`;
            grid.appendChild(card);
        });

        window.exitGame = () => { document.getElementById('game-layer').style.display = 'none'; document.getElementById('game-frame').src = 'about:blank'; };
    </script>
</body>
</html>
