<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Crib Vids</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }
        .vids-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .vids-container::-webkit-scrollbar {
            display: none;
        }
        .vid-card {
            position: relative;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .actions-panel {
            position: absolute;
            right: 15px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .creator-pfp {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #fff;
            object-fit: cover;
            background-color: #333;
        }
        .action-btn {
            background: rgba(0,0,0,0.6);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .action-btn.liked {
            color: #ff3b30;
        }
        .empty-state {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #555;
        }
        /* Floating Plus Action Button */
        .fab-add {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00ffcc, #0077ff);
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
        }
        /* Custom Upload Popup Frame */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: #1c1c1e;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid #3a3a3c;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-card h3 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #00ffcc;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #aeaeae;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        .form-group input[type="file"] {
            display: none;
        }
        .file-label-btn {
            display: block;
            background: #2c2c2e;
            border: 2px dashed #00ffcc;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            color: #00ffcc;
            font-weight: 500;
        }
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .tag-pill {
            background: rgba(0, 119, 255, 0.3);
            border: 1px solid #0077ff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tag-pill span {
            cursor: pointer;
            color: #ff3b30;
            font-weight: bold;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }
        .btn-ui {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-ui.cancel { background: #3a3a3c; color: white; }
        .btn-ui.submit { 
            background: #00ffcc; 
            color: #000;
            opacity: 0.5;
            pointer-events: none;
        }
        .btn-ui.submit.ready {
            opacity: 1;
            pointer-events: auto;
        }
        /* Custom Toast UI */
        .toast-msg {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 28, 30, 0.9);
            border: 1px solid #00ffcc;
            padding: 15px 30px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }
        .toast-msg.show { top: 30px; }
    </style>
</head>
<body>

    <div class="vids-container" id="vidsContainer"></div>
    <button class="fab-add" id="openUploadBtn">+</button>

    <!-- Upload Overlay Grid Popup -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-card">
            <h3>Drop The Clip</h3>
            <div class="form-group">
                <label>Video File</label>
                <label for="videoFile" class="file-label-btn" id="fileStatusLabel">Choose Video</label>
                <input type="file" id="videoFile" accept="video/*">
            </div>
            <div class="form-group">
                <label>Video Title</label>
                <input type="text" id="videoTitle" placeholder="Give it a name...">
            </div>
            <div class="form-group">
                <label>Tags (Press Enter to Add - Need 2)</label>
                <input type="text" id="tagInput" placeholder="Add tag...">
                <div class="tag-container" id="tagContainer"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-ui cancel" id="closeUploadBtn">Cancel</button>
                <button class="btn-ui submit" id="submitUploadBtn">Upload</button>
            </div>
        </div>
    </div>

    <div class="toast-msg" id="toastNotification">Status Updated</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration Hook (Uses existing Firestore DB)
        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeTags = [];
        let encodedVideoData = "";

        // Toast Engine 
        function showToast(msg) {
            const toast = document.getElementById('toastNotification');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- IndexedDB Watch Habits ---
        let idbInstance = null;
        const idbRequest = indexedDB.open("CribVidsHistory", 1);
        idbRequest.onupgradeneeded = (e) => {
            let idb = e.target.result;
            if (!idb.objectStoreNames.contains("watched_vids")) {
                idb.createObjectStore("watched_vids", { keyPath: "id" });
            }
        };
        idbRequest.onsuccess = (e) => {
            dbInstance = e.target.result;
            loadVideos();
        };

        function logVideoWatch(videoId) {
            if (!dbInstance) return;
            const transaction = dbInstance.transaction(["watched_vids"], "readwrite");
            transaction.objectStore("watched_vids").put({ id: videoId, watchedAt: new Date().toISOString() });
        }

        // --- Load Engine ---
        async function loadVideos() {
            const container = document.getElementById('vidsContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "videos"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="empty-state">welp, this sucks</div>`;
                    return;
                }

                // Check for URL Parameter deep linking (?v=ID)
                const urlParams = new URLSearchParams(window.location.search);
                const targetId = urlParams.get('v');
                let docsArr = [];

                querySnapshot.forEach(d => docsArr.push({id: d.id, ...d.data()}));
                
                if(targetId) {
                    docsArr.sort((x, y) => x.id === targetId ? -1 : y.id === targetId ? 1 : 0);
                }

                docsArr.forEach((videoData) => {
                    const card = document.createElement('div');
                    card.className = 'vid-card';
                    card.dataset.id = videoData.id;
                    card.innerHTML = `
                        <video src="${videoData.videoUrl}" loop muted playsinline></video>
                        <div class="actions-panel">
                            <img class="creator-pfp" src="${videoData.creatorPfp || 'https://via.placeholder.com/45'}" alt="pfp">
                            <button class="action-btn like-btn" data-id="${videoData.id}">❤️</button>
                            <button class="action-btn share-btn" data-id="${videoData.id}" data-title="${videoData.title}">🔗</button>
                        </div>
                    `;
                    container.appendChild(card);
                });

                initScrollEngine();
            } catch (err) {
                container.innerHTML = `<div class="empty-state">welp, this sucks</div>`;
            }
        }

        function initScrollEngine() {
            const container = document.getElementById('vidsContainer');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (entry.isIntersecting && video) {
                        video.play().catch(() => {});
                        logVideoWatch(entry.target.dataset.id);
                    } else if (video) {
                        video.pause();
                    }
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('.vid-card').forEach(card => observer.observe(card));

            container.addEventListener('click', async (e) => {
                if (e.target.classList.contains('like-btn')) {
                    e.target.classList.toggle('liked');
                    await updateDoc(doc(db, "videos", e.target.dataset.id), {
                        likes: increment(e.target.classList.contains('liked') ? 1 : -1)
                    });
                }
                if (e.target.classList.contains('share-btn')) {
                    const deepLink = `${window.location.origin}${window.location.pathname}?v=${e.target.dataset.id}`;
                    if (navigator.share) {
                        try {
                            await navigator.share({ title: e.target.dataset.title, url: deepLink });
                        } catch {}
                    } else {
                        navigator.clipboard.writeText(deepLink);
                        showToast("Link clipped to custom board!");
                    }
                }
                if (e.target.tagName === 'VIDEO') {
                    e.target.muted = !e.target.muted;
                }
            });
        }

        // --- Form Interaction UI Logic ---
        const modal = document.getElementById('uploadModal');
        const submitBtn = document.getElementById('submitUploadBtn');
        
        document.getElementById('openUploadBtn').onclick = () => modal.classList.add('active');
        document.getElementById('closeUploadBtn').onclick = () => resetModal();

        // Convert selected video binary into a Base64 Text String directly
        document.getElementById('videoFile').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            document.getElementById('fileStatusLabel').innerText = "Processing Clip...";
            
            reader.onload = (event) => {
                encodedVideoData = event.target.result;
                document.getElementById('fileStatusLabel').innerText = "Clip Encoded ✓";
                validateForm();
            };
            reader.readAsDataURL(file);
        };

        // Handling Entry Tag Inputs
        document.getElementById('tagInput').onkeydown = (e) => {
            if (e.key === 'Enter' && e.target.value.trim() !== "") {
                e.preventDefault();
                const tag = e.target.value.trim().toLowerCase();
                if (!activeTags.includes(tag)) {
                    activeTags.push(tag);
                    renderTags();
                }
                e.target.value = "";
                validateForm();
            }
        };

        function renderTags() {
            const container = document.getElementById('tagContainer');
            container.innerHTML = "";
            activeTags.forEach((tag, idx) => {
                const pill = document.createElement('div');
                pill.className = 'tag-pill';
                pill.innerHTML = `#${tag} <span data-idx="${idx}">&times;</span>`;
                container.appendChild(pill);
            });
        }

        document.getElementById('tagContainer').onclick = (e) => {
            if (e.target.tagName === 'SPAN') {
                activeTags.splice(e.target.dataset.idx, 1);
                renderTags();
                validateForm();
            }
        };

        function validateForm() {
            const title = document.getElementById('videoTitle').value.trim();
            if (title !== "" && activeTags.length >= 2 && encodedVideoData !== "") {
                submitBtn.classList.add('ready');
            } else {
                submitBtn.classList.remove('ready');
            }
        }

        document.getElementById('videoTitle').oninput = validateForm;

        // Push Document containing the base64 text video straight to Firestore
        submitBtn.onclick = async () => {
            submitBtn.innerText = "Encrypting & Uploading...";
            submitBtn.style.pointerEvents = "none";
            
            try {
                await addDoc(collection(db, "videos"), {
                    title: document.getElementById('videoTitle').value.trim(),
                    videoUrl: encodedVideoData, // The raw base64 data injection loop
                    tags: activeTags,
                    likes: 0,
                    creatorPfp: "https://lh3.googleusercontent.com/a/default-user=s100", // Default Google style profile asset
                    createdAt: new Date().toISOString()
                });
                
                showToast("Upload Successful!");
                setTimeout(() => window.location.reload(), 1500);
            } catch (err) {
                showToast("Upload Failed.");
                submitBtn.innerText = "Upload";
                submitBtn.style.pointerEvents = "auto";
            }
        };

        function resetModal() {
            modal.classList.remove('active');
            document.getElementById('videoFile').value = "";
            document.getElementById('videoTitle').value = "";
            document.getElementById('fileStatusLabel').innerText = "Choose Video";
            activeTags = [];
            encodedVideoData = "";
            renderTags();
            validateForm();
        }
    </script>
</body>
</html>
