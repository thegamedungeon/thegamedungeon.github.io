<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Crib | Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .song-card { transition: 0.2s; }
        .song-card:hover { background: #374151; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen">

    <!-- Top Bar -->
    <nav class="flex justify-between p-4 border-b border-gray-700">
        <a href="/home/" class="text-blue-400 font-bold">← Back to Home</a>
        <button id="addBtn" class="bg-green-600 px-4 py-1 rounded font-bold">+</button>
    </nav>

    <!-- Music List -->
    <div id="musicList" class="p-6 grid gap-4">
        <p id="emptyMsg" class="text-gray-500 text-center">No songs yet. Click + to add some!</p>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" class="hidden"></audio>

    <!-- Persistent Music Controller -->
    <div class="fixed bottom-0 w-full bg-gray-800 p-4 border-t border-gray-700 flex items-center gap-4">
        <div id="currentArt" class="w-12 h-12 bg-gray-700 rounded flex items-center justify-center font-bold">♪</div>
        <div class="flex-1">
            <h3 id="songTitle" class="font-bold text-sm truncate">No song playing</h3>
            <div class="flex items-center gap-2">
                <button id="prevBtn" class="text-xs font-bold">⏮</button>
                <button id="playPauseBtn" class="font-bold">Play</button>
                <button id="nextBtn" class="text-xs font-bold">⏭</button>
                <input type="range" id="progressBar" class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer" value="0" min="0" max="100">
            </div>
        </div>
        <div class="relative">
            <button id="gameMenuBtn" class="bg-blue-600 px-4 py-2 rounded font-bold">Games</button>
            <div id="gameDropdown" class="hidden absolute bottom-12 right-0 bg-gray-800 border border-gray-700 rounded-lg w-64 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Upload Popup -->
    <div id="uploadPopup" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center">
        <div class="bg-gray-800 p-6 rounded-lg w-80">
            <h2 class="mb-4">Upload MP3</h2>
            <input type="file" id="fileInput" accept="audio/mp3">
            <button onclick="closePopup()" class="mt-4 text-red-400 block">Cancel</button>
        </div>
    </div>

    <script>
        let db;
        let currentSongIndex = -1;
        let songList = [];
        const audioPlayer = document.getElementById('audioPlayer');
        const progressBar = document.getElementById('progressBar');
        const playPauseBtn = document.getElementById('playPauseBtn');

        const request = indexedDB.open("CribMusicDB", 1);
        request.onupgradeneeded = e => { e.target.result.createObjectStore("musicStore", { keyPath: "id" }); };
        request.onsuccess = e => { db = e.target.result; loadSongs(); };

        document.getElementById('addBtn').onclick = () => document.getElementById('uploadPopup').classList.remove('hidden');
        
        function closePopup() { 
            document.getElementById('uploadPopup').classList.add('hidden');
            document.getElementById('fileInput').value = ''; 
        }

        document.getElementById('fileInput').onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const tx = db.transaction("musicStore", "readwrite");
            tx.objectStore("musicStore").add({ id: file.name, name: file.name, data: file });
            tx.oncomplete = () => { closePopup(); loadSongs(); };
        };

        function loadSongs() {
            const list = document.getElementById('musicList');
            const tx = db.transaction("musicStore", "readonly");
            const req = tx.objectStore("musicStore").getAll();
            req.onsuccess = () => {
                songList = req.result;
                if(songList.length > 0) document.getElementById('emptyMsg').hidden = true;
                list.innerHTML = songList.map((s, idx) => `
                    <div class="song-card bg-gray-800 p-4 rounded flex justify-between items-center">
                        <span class="truncate">${s.name}</span>
                        <button onclick="playSong(${idx})" class="bg-blue-600 hover:bg-blue-500 p-2 rounded-full">
                            <svg width="16" height="16" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                    </div>
                `).join('');
            };
        }

        function playSong(idx) {
            if(idx < 0 || idx >= songList.length) return;
            currentSongIndex = idx;
            const song = songList[idx];
            if (audioPlayer.src) URL.revokeObjectURL(audioPlayer.src);
            const url = URL.createObjectURL(song.data);
            audioPlayer.src = url;
            document.getElementById('songTitle').innerText = song.name;
            audioPlayer.play();
            playPauseBtn.innerText = "Pause";
        }

        playPauseBtn.onclick = () => {
            if (audioPlayer.paused) { audioPlayer.play(); playPauseBtn.innerText = "Pause"; }
            else { audioPlayer.pause(); playPauseBtn.innerText = "Play"; }
        };

        document.getElementById('nextBtn').onclick = () => {
            if (currentSongIndex < songList.length - 1) playSong(currentSongIndex + 1);
        };

        document.getElementById('prevBtn').onclick = () => {
            if (currentSongIndex > 0) playSong(currentSongIndex - 1);
        };

        audioPlayer.onended = () => {
            if (songList.length > 1) {
                let nextIdx;
                do { nextIdx = Math.floor(Math.random() * songList.length); } while(nextIdx === currentSongIndex);
                playSong(nextIdx);
            }
        };

        audioPlayer.ontimeupdate = () => {
            if(audioPlayer.duration) progressBar.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        };

        progressBar.oninput = () => {
            if(audioPlayer.duration) audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
        };

        const games = ["Cookie Clicker", "Geometry Dash", "Polytrack", "Ragdoll Hit", "Minecraft", "Ragdoll Melon", "Bloons Tower Defense 2", "Earn to Die 2", "Cut the Rope", "Basket Random", "Ragdoll Archers", "BitLife"];
        const menu = document.getElementById('gameDropdown');
        menu.innerHTML = games.map(g => `<a href="/play/${g.toLowerCase().replace(/\s+/g, '-')}/" class="block px-4 py-2 hover:bg-gray-700">${g}</a>`).join('');
        document.getElementById('gameMenuBtn').onclick = () => menu.classList.toggle('hidden');
    </script>
</body>
</html>
