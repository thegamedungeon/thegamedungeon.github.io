<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Game Dungeon | Profile</title>
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase App (Compat version for easier global access on iPad) -->
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore-compat.js"></script>
    
    <!-- Styling & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-glow:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }
        #root-loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            z-index: 50;
        }
        .btn-confirm {
            background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
        }
    </style>
</head>
<body>
    <div id="root-loader">
        <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Firebase Global Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "the-game-dungeon-4d75d";

        // Lucide Icon Helper
        const Icon = ({ name, className }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [isOwner, setIsOwner] = useState(false);
            const [isFriend, setIsFriend] = useState(false);
            const [friendRequestStatus, setFriendRequestStatus] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [showSignOutConfirm, setShowSignOutConfirm] = useState(false);
            
            const [editData, setEditData] = useState({
                name: '', gamername: '', bio: '', privacy: 'everyone', photoURL: ''
            });

            const params = new URLSearchParams(window.location.search);
            const targetEmail = decodeURIComponent(params.get('user') || '').toLowerCase().trim();
            const triggerSignOut = params.get('signout') === 'true';

            useEffect(() => {
                document.getElementById('root-loader').style.display = 'none';
                const unsubscribe = auth.onAuthStateChanged(async (u) => {
                    if (u) {
                        setUser(u);
                    } else {
                        try {
                            const anon = await auth.signInAnonymously();
                            setUser(anon.user);
                        } catch (e) {
                            setError("Auth blicked. Check your connection.");
                        }
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                
                // If we have a signout flag, check if we need to show the confirmation UI
                if (triggerSignOut) {
                    if (user.email?.toLowerCase() === targetEmail) {
                        setShowSignOutConfirm(true);
                        setLoading(false);
                        return;
                    } else {
                        // Not the right user or trying to sign out an anon/someone else? Back to search.
                        window.location.href = '/profile/';
                        return;
                    }
                }

                // If no target email in URL, show search mode
                if (!targetEmail) {
                    setLoading(false);
                    return;
                }

                fetchProfile();
            }, [user, targetEmail, triggerSignOut]);

            const fetchProfile = async () => {
                setLoading(true);
                try {
                    const usersRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users');
                    const q = await usersRef.where("email", "==", targetEmail).get();
                    
                    if (q.empty) {
                        setError("This user hasn't joined the gang yet.");
                        setLoading(false);
                        return;
                    }

                    const targetDoc = q.docs[0].data();
                    const targetId = q.docs[0].id;

                    setProfile({ ...targetDoc, id: targetId });
                    setEditData({
                        name: targetDoc.name || '',
                        gamername: targetDoc.gamername || '',
                        bio: targetDoc.bio || '',
                        privacy: targetDoc.privacy || 'everyone',
                        photoURL: targetDoc.photoURL || ''
                    });

                    const currentIsOwner = user.uid === targetId || (user.email && user.email.toLowerCase() === targetEmail);
                    setIsOwner(currentIsOwner);

                    if (!currentIsOwner && user.uid) {
                        const friendDoc = await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('friends').doc(targetId).get();
                        setIsFriend(friendDoc.exists);
                        
                        const outgoingReq = await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('requests').doc(`${user.uid}_${targetId}`).get();
                        if (outgoingReq.exists) setFriendRequestStatus('sent');
                    }
                    setLoading(false);
                } catch (err) {
                    console.error("Firestore Error:", err);
                    setError("Security Blicked: Permission Denied.");
                    setLoading(false);
                }
            };

            const handleFinalSignOut = async () => {
                setLoading(true);
                await auth.signOut();
                window.location.href = '/login.html';
            };

            const cancelSignOut = () => {
                window.location.href = `/profile/?user=${encodeURIComponent(targetEmail)}`;
            };

            const handleSearch = (e) => {
                e.preventDefault();
                if (!searchQuery.trim()) return;
                window.location.href = `/profile/?user=${encodeURIComponent(searchQuery.trim().toLowerCase())}`;
            };

            const handleFriendAction = async () => {
                if (!user || user.isAnonymous) {
                    alert("Sign in to add people to your squad.");
                    return;
                }
                try {
                    if (isFriend) {
                        await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('friends').doc(profile.id).delete();
                        setIsFriend(false);
                    } else if (!friendRequestStatus) {
                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('requests').doc(`${user.uid}_${profile.id}`).set({
                            from: user.uid, to: profile.id, timestamp: Date.now()
                        });
                        setFriendRequestStatus('sent');
                    }
                } catch (e) { alert("Action blicked."); }
            };

            const saveProfile = async () => {
                try {
                    const userRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').doc(profile.id);
                    await userRef.update(editData);
                    setProfile(prev => ({ ...prev, ...editData }));
                    setIsEditing(false);
                } catch (e) { alert("Save blicked. Permission denied."); }
            };

            if (loading) return (
                <div className="min-h-screen flex items-center justify-center">
                    <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
            );

            // CONFIRM SIGN OUT UI
            if (showSignOutConfirm) {
                return (
                    <div className="min-h-screen p-6 flex items-center justify-center bg-[#020617]">
                        <div className="glass max-w-sm w-full p-8 rounded-[2.5rem] text-center border-red-500/20 shadow-2xl">
                            <div className="w-20 h-20 bg-red-500/10 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-red-500/20">
                                <Icon name="log-out" className="w-10 h-10 text-red-500" />
                            </div>
                            <h2 className="text-2xl font-black mb-2 uppercase tracking-tighter">Exit Terminal?</h2>
                            <p className="text-slate-400 text-sm mb-8">Are you sure you want to end your session at The Game Dungeon?</p>
                            
                            <div className="space-y-3">
                                <button 
                                    onClick={handleFinalSignOut}
                                    className="w-full py-4 btn-confirm rounded-2xl font-black text-white shadow-lg shadow-red-950/20 flex items-center justify-center gap-2"
                                >
                                    CONFIRM LOG OUT
                                </button>
                                <button 
                                    onClick={cancelSignOut}
                                    className="w-full py-4 bg-slate-800 text-slate-300 rounded-2xl font-black border border-white/5"
                                >
                                    STAY IN DUNGEON
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // SEARCH MODE
            if (!targetEmail && !error) {
                return (
                    <div className="min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">
                        <div className="max-w-md w-full">
                            <div className="text-center mb-10">
                                <div className="bg-blue-600/20 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-blue-500/30">
                                    <Icon name="search" className="w-10 h-10 text-blue-500" />
                                </div>
                                <h2 className="text-4xl font-black tracking-tighter mb-2">DUNGEON SEARCH</h2>
                                <p className="text-slate-500 uppercase text-xs font-bold tracking-[0.2em]">Locate a Gamer Profile</p>
                            </div>

                            <form onSubmit={handleSearch} className="glass p-8 rounded-[2.5rem] border-white/5 space-y-4">
                                <div>
                                    <label className="text-[10px] font-black uppercase text-slate-500 ml-1">Email or Gamername</label>
                                    <div className="relative mt-2">
                                        <input 
                                            type="text" 
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            placeholder="gamer@thecrib.com"
                                            className="w-full bg-slate-950/50 border border-white/10 rounded-2xl p-4 outline-none input-glow text-white placeholder:text-slate-700"
                                        />
                                        <button type="submit" className="absolute right-2 top-2 bottom-2 bg-blue-600 px-4 rounded-xl font-black text-xs hover:bg-blue-500 transition-colors">
                                            FIND
                                        </button>
                                    </div>
                                </div>
                                
                                {user && !user.isAnonymous && (
                                    <button 
                                        type="button"
                                        onClick={() => window.location.href = `/profile/?user=${encodeURIComponent(user.email)}`}
                                        className="w-full py-4 bg-slate-800 text-slate-300 rounded-2xl font-black text-xs border border-white/5 flex items-center justify-center gap-2"
                                    >
                                        <Icon name="user" className="w-4 h-4" /> MY PROFILE
                                    </button>
                                )}

                                <button 
                                    type="button"
                                    onClick={() => window.location.href = '/login.html'}
                                    className="w-full text-slate-600 text-[10px] font-black uppercase tracking-widest mt-2"
                                >
                                    Login to Terminal
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (error) return (
                <div className="min-h-screen flex items-center justify-center p-6 text-center">
                    <div className="glass p-10 rounded-[2.5rem] border-red-500/20 max-w-sm">
                        <Icon name="shield-alert" className="w-16 h-16 text-red-500 mx-auto mb-4" />
                        <h2 className="text-2xl font-black mb-2 uppercase">Passport Blicked</h2>
                        <p className="text-gray-400 mb-6">{error}</p>
                        <button onClick={() => window.location.href = '/profile/'} className="w-full py-4 bg-blue-600 rounded-2xl font-black">Search Again</button>
                    </div>
                </div>
            );

            const canSeeFull = isOwner || isFriend || profile.privacy === 'everyone';
            const displayBio = canSeeFull ? (profile.bio || "No bio yet.") : "This user's bio is locked. Only the squad can see it.";

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-2xl mx-auto">
                        <div className="flex justify-between items-center mb-8 px-2">
                            <button onClick={() => window.location.href = '/profile/'} className="text-blue-400 flex items-center gap-2 font-bold">
                                <Icon name="chevron-left" className="w-5 h-5" /> Search
                            </button>
                            <span className="text-[10px] font-black tracking-widest text-slate-600 uppercase">Dungeon ID</span>
                        </div>

                        <div className="glass rounded-[2.5rem] overflow-hidden shadow-2xl border-white/5">
                            <div className="h-32 bg-gradient-to-br from-blue-600/10 to-purple-600/10 relative">
                                {isOwner && (
                                    <button onClick={() => setIsEditing(!isEditing)} className="absolute top-4 right-4 bg-slate-900/80 p-3 rounded-2xl">
                                        <Icon name={isEditing ? "x" : "edit-3"} className="w-5 h-5 text-white" />
                                    </button>
                                )}
                            </div>

                            <div className="px-8 pb-10 -mt-16 text-center">
                                <div className="relative inline-block mb-6">
                                    <div className="w-32 h-32 rounded-[2rem] bg-slate-900 border-4 border-slate-950 overflow-hidden shadow-2xl">
                                        <img src={editData.photoURL || `https://ui-avatars.com/api/?name=${profile.gamername}&background=1e293b&color=3b82f6`} className="w-full h-full object-cover" />
                                        {isEditing && (
                                            <label className="absolute inset-0 bg-black/60 flex items-center justify-center cursor-pointer">
                                                <Icon name="camera" className="text-white" />
                                                <input type="file" className="hidden" accept="image/*" onChange={(e) => {
                                                    const reader = new FileReader();
                                                    reader.onload = () => setEditData({...editData, photoURL: reader.result});
                                                    reader.readAsDataURL(e.target.files[0]);
                                                }} />
                                            </label>
                                        )}
                                    </div>
                                </div>

                                {!isEditing ? (
                                    <div className="space-y-1">
                                        <div className="flex items-center justify-center gap-2">
                                            <h2 className="text-3xl font-black">{(isOwner || isFriend) ? profile.name : profile.gamername}</h2>
                                            {isFriend && <Icon name="check-circle" className="w-5 h-5 text-blue-500" />}
                                        </div>
                                        <p className="text-blue-400 font-mono font-bold text-sm tracking-tight mb-6">
                                            {isOwner || isFriend ? profile.email : `@${profile.gamername}`}
                                        </p>
                                        <div className="bg-slate-950/30 rounded-2xl p-6 mb-8 text-left border border-white/5">
                                            <p className="text-slate-400 leading-relaxed italic">{displayBio}</p>
                                        </div>

                                        <div className="space-y-3">
                                            {isOwner ? (
                                                <button onClick={() => window.location.href = `/profile/?user=${encodeURIComponent(targetEmail)}&signout=true`} className="w-full py-4 bg-red-500/10 text-red-400 rounded-2xl font-black border border-red-500/10 flex items-center justify-center gap-2">
                                                    <Icon name="log-out" className="w-5 h-5" /> SIGN OUT
                                                </button>
                                            ) : (
                                                <button onClick={handleFriendAction} disabled={friendRequestStatus === 'sent'} className={`w-full py-4 rounded-2xl font-black flex items-center justify-center gap-2 transition-all ${isFriend ? 'bg-slate-800 text-slate-400' : friendRequestStatus === 'sent' ? 'bg-slate-800/50 text-slate-600' : 'bg-blue-600 shadow-lg shadow-blue-500/20'}`}>
                                                    <Icon name={isFriend ? "user-minus" : friendRequestStatus === 'sent' ? "clock" : "user-plus"} className="w-5 h-5" />
                                                    {isFriend ? "UNFRIEND" : friendRequestStatus === 'sent' ? "PENDING" : "ADD SQUAD"}
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-left space-y-4 pt-4">
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-500 ml-1">Real Name</label>
                                            <input type="text" value={editData.name} onChange={e => setEditData({...editData, name: e.target.value})} className="w-full bg-slate-950/50 border border-white/10 rounded-xl p-3 outline-none focus:border-blue-500" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-500 ml-1">Gamer Name</label>
                                            <input type="text" value={editData.gamername} onChange={e => setEditData({...editData, gamername: e.target.value})} className="w-full bg-slate-950/50 border border-white/10 rounded-xl p-3 outline-none focus:border-blue-500" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-500 ml-1">Bio</label>
                                            <textarea value={editData.bio} onChange={e => setEditData({...editData, bio: e.target.value})} className="w-full bg-slate-950/50 border border-white/10 rounded-xl p-3 h-24 outline-none focus:border-blue-500 resize-none" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-black uppercase text-slate-500 ml-1">Privacy</label>
                                            <select value={editData.privacy} onChange={e => setEditData({...editData, privacy: e.target.value})} className="w-full bg-slate-950/50 border border-white/10 rounded-xl p-3 outline-none">
                                                <option value="everyone">Everyone</option>
                                                <option value="friends">Friends Only</option>
                                                <option value="onlyme">Only Me</option>
                                            </select>
                                        </div>
                                        <button onClick={saveProfile} className="w-full py-4 bg-green-600 rounded-2xl font-black mt-4 flex items-center justify-center gap-2">
                                            <Icon name="save" className="w-5 h-5" /> SAVE SETTINGS
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
