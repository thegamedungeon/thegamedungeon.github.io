<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Game Dungeon | Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-primary {
            background: #2563eb;
            transition: all 0.2s ease;
        }
        .btn-primary:active { transform: scale(0.95); }
        
        #page-loader {
            background: #020617;
            display: flex;
            transition: opacity 0.5s ease;
            position: fixed;
            inset: 0;
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        @keyframes pulse-blue {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <!-- Page Loader -->
    <div id="page-loader">
        <div class="text-center">
            <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-blue-400 font-mono text-sm tracking-widest uppercase">Syncing with The Crib...</p>
        </div>
    </div>

    <!-- 404 / Error State -->
    <div id="error-state" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-[#020617]">
        <div class="glass max-w-md w-full p-10 rounded-3xl text-center border-red-500/30">
            <div class="text-6xl mb-6">🚫</div>
            <h2 class="text-4xl font-black text-white mb-2">404</h2>
            <p class="text-gray-400 mb-8" id="error-message">This user hasn't joined The Dungeon yet. They might be "oink oink" or just lazy like Connor.</p>
            <div class="flex flex-col gap-4">
                <button onclick="showSearch()" class="btn-primary py-4 rounded-xl font-bold flex items-center justify-center gap-2">
                    <i class="fas fa-search"></i> Search for Users
                </button>
                <a href="/" class="bg-slate-800 hover:bg-slate-700 py-4 rounded-xl font-bold flex items-center justify-center gap-2">
                    <i class="fas fa-home"></i> Back to The Crib
                </a>
            </div>
        </div>
    </div>

    <!-- Main Profile Content -->
    <div id="profile-container" class="hidden opacity-0 transition-opacity duration-700 pb-20">
        <header class="p-6 glass mb-8 sticky top-0 z-40">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
                <a href="/" class="text-blue-400 hover:text-blue-300 transition-colors flex items-center gap-2 font-bold">
                    <i class="fas fa-chevron-left"></i> Home
                </a>
                <h1 class="text-xl font-black tracking-tighter">USER PROFILE</h1>
                <div class="w-10"></div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-6">
            <div class="glass rounded-3xl p-8 mb-8 text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-blue-600/20 to-transparent"></div>
                <div class="relative z-10">
                    <div id="pfp-container" class="w-32 h-32 mx-auto rounded-full border-4 border-blue-500 bg-slate-900 shadow-2xl overflow-hidden mb-6">
                        <i class="fas fa-user text-4xl text-slate-700 mt-10"></i>
                    </div>
                    <h2 id="display-name" class="text-3xl font-black mb-1">Loading...</h2>
                    <p id="display-email" class="text-blue-400 font-medium mb-6 text-sm"></p>
                    <div id="action-buttons" class="flex justify-center gap-4"></div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-gray-400 uppercase text-xs font-black tracking-widest mb-4">Total Playtime</h3>
                    <div id="profile-playtime" class="text-3xl font-black text-white">0.0h</div>
                </div>
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-gray-400 uppercase text-xs font-black tracking-widest mb-4">Squad Status</h3>
                    <div id="squad-count" class="text-3xl font-black text-white">0 Friends</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Search View -->
    <div id="search-view" class="hidden p-6 pt-20">
        <div class="max-w-md mx-auto text-center">
            <h2 class="text-4xl font-black mb-8">Find the Squad</h2>
            <div class="relative mb-8">
                <input type="text" id="main-search-input" placeholder="Enter email or name..." class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-6 py-5 text-lg focus:border-blue-500 outline-none shadow-xl">
                <i class="fas fa-search absolute right-6 top-1/2 -translate-y-1/2 text-gray-500"></i>
            </div>
            <div id="main-search-results" class="space-y-4 text-left"></div>
            <a href="/" class="inline-block mt-12 text-gray-500 hover:text-white transition-colors font-bold">
                <i class="fas fa-arrow-left mr-2"></i> Nevermind, take me home
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const __firebase_config = '{"apiKey": "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI", "authDomain": "the-game-dungeon-4d75d.firebaseapp.com", "projectId": "the-game-dungeon-4d75d", "storageBucket": "the-game-dungeon-4d75d.firebasestorage.app", "messagingSenderId": "533459716906", "appId": "1:533459716906:web:377bf4ea74cf21bf8aac53"}';
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "the-game-dungeon-4d75d";
        const avatarPlaceholder = "https://ui-avatars.com/api/?background=1e293b&color=3b82f6&bold=true&name=";

        const loader = document.getElementById('page-loader');
        const profileContainer = document.getElementById('profile-container');
        const errorState = document.getElementById('error-state');
        const searchView = document.getElementById('search-view');

        const params = new URLSearchParams(window.location.search);
        let targetUserEmail = params.get('user');

        window.showSearch = () => {
            errorState.classList.add('hidden');
            profileContainer.classList.add('hidden');
            searchView.classList.remove('hidden');
            if(loader) loader.classList.add('hidden');
            initSearchLogic();
        };

        // FAILSAFE: If it takes more than 5 seconds to sync, show search view
        const syncTimeout = setTimeout(() => {
            if (!profileContainer.classList.contains('opacity-100') && errorState.classList.contains('hidden')) {
                console.log("Sync timed out, forcing search view");
                showSearch();
            }
        }, 5000);

        onAuthStateChanged(auth, async (currentUser) => {
            if (!currentUser) {
                await signInAnonymously(auth);
                return; 
            }

            // If no user parameter is provided, jump straight to search
            if (!targetUserEmail) {
                clearTimeout(syncTimeout);
                showSearch();
                return;
            }

            const cleanEmail = decodeURIComponent(targetUserEmail).toLowerCase();
            document.getElementById('display-email').innerText = cleanEmail;

            try {
                const usersRef = collection(db, 'artifacts', appId, 'users');
                const q = await getDocs(usersRef);
                let foundUser = null;
                let foundUserId = null;

                q.forEach(doc => {
                    const data = doc.data();
                    if (data.email?.toLowerCase() === cleanEmail) {
                        foundUser = data;
                        foundUserId = doc.id;
                    }
                });

                // Check if the current user is the one we're looking for but isn't indexed yet
                if (!foundUser && currentUser.email && currentUser.email.toLowerCase() === cleanEmail) {
                    foundUserId = currentUser.uid;
                    foundUser = {
                        email: currentUser.email,
                        displayName: currentUser.displayName || currentUser.email.split('@')[0],
                        photoURL: currentUser.photoURL || null,
                        lastActive: new Date().toISOString()
                    };
                    await setDoc(doc(db, 'artifacts', appId, 'users', foundUserId), foundUser);
                }

                if (!foundUser) throw new Error("User missing");

                clearTimeout(syncTimeout);
                renderProfile(foundUser, foundUserId, currentUser);

            } catch (err) {
                console.error("Dungeon Logic Error:", err);
                clearTimeout(syncTimeout);
                if(loader) loader.classList.add('hidden');
                errorState.classList.remove('hidden');
            }
        });

        async function renderProfile(userData, uid, currentUser) {
            const pfp = userData.photoURL || (avatarPlaceholder + encodeURIComponent(userData.email || 'User'));
            document.getElementById('pfp-container').innerHTML = `<img src="${pfp}" class="w-full h-full object-cover">`;
            document.getElementById('display-name').innerText = userData.displayName || userData.email.split('@')[0];

            try {
                const playtimeRef = collection(db, 'artifacts', appId, 'users', uid, 'playtime');
                const playtimeSnap = await getDocs(playtimeRef);
                let totalSecs = 0;
                playtimeSnap.forEach(d => totalSecs += (d.data().seconds || 0));
                document.getElementById('profile-playtime').innerText = (totalSecs / 3600).toFixed(1) + 'h';

                const friendsRef = collection(db, 'artifacts', appId, 'users', uid, 'friends');
                const friendsSnap = await getDocs(friendsRef);
                document.getElementById('squad-count').innerText = friendsSnap.size + ' Friends';
            } catch (e) { console.log("Stats fetch blocked"); }

            const actions = document.getElementById('action-buttons');
            if (currentUser && currentUser.uid !== uid) {
                actions.innerHTML = `<button class="btn-primary px-8 py-3 rounded-xl font-bold flex items-center gap-2"><i class="fas fa-user-plus"></i> Add Friend</button>`;
            } else if (currentUser && currentUser.uid === uid) {
                actions.innerHTML = `<button class="bg-slate-700 px-8 py-3 rounded-xl font-bold flex items-center gap-2"><i class="fas fa-edit"></i> Edit Profile</button>`;
            }

            if(loader) loader.classList.add('hidden');
            profileContainer.classList.remove('hidden');
            setTimeout(() => profileContainer.classList.add('opacity-100'), 50);
        }

        let searchInitialized = false;
        async function initSearchLogic() {
            if (searchInitialized) return;
            searchInitialized = true;
            
            const input = document.getElementById('main-search-input');
            const results = document.getElementById('main-search-results');

            input.oninput = async () => {
                const val = input.value.trim().toLowerCase();
                if (val.length < 3) { results.innerHTML = ''; return; }

                const usersRef = collection(db, 'artifacts', appId, 'users');
                const q = await getDocs(usersRef);
                let matches = [];
                q.forEach(doc => {
                    const data = doc.data();
                    if (data.email?.toLowerCase().includes(val) || data.displayName?.toLowerCase().includes(val)) {
                        matches.push(data);
                    }
                });

                if (matches.length === 0) {
                    results.innerHTML = `<p class="text-gray-500 italic p-4 text-center">User not found. Check the spelling or tell them to log in.</p>`;
                    return;
                }

                results.innerHTML = matches.map(user => `
                    <div class="glass p-5 rounded-2xl flex items-center justify-between cursor-pointer hover:bg-blue-600/10 transition-all border-blue-500/20 active:scale-[0.98]" onclick="window.location.href='?user=${encodeURIComponent(user.email)}'">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-blue-600/20 rounded-full flex items-center justify-center overflow-hidden">
                                <img src="${user.photoURL || (avatarPlaceholder + encodeURIComponent(user.email))}" class="w-full h-full object-cover">
                            </div>
                            <div class="text-left">
                                <p class="font-bold">${user.displayName || user.email.split('@')[0]}</p>
                                <p class="text-xs text-gray-500 font-mono">${user.email}</p>
                            </div>
                        </div>
                        <i class="fas fa-chevron-right text-blue-500"></i>
                    </div>
                `).join('');
            };
        }
    </script>
</body>
</html>
