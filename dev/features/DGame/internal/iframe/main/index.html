<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGame Studio - The Crib's Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .editor-container { height: calc(100vh - 120px); }
        .dgame-object { position: absolute; transition: transform 0.1s; cursor: grab; }
        .dgame-object:active { cursor: grabbing; }
        .lasso-line { stroke: #fbbf24; stroke-width: 3; stroke-dasharray: 4; pointer-events: none; }
    </style>
</head>
<body class="overflow-hidden">

    <header class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900">
        <h1 class="text-xl font-bold text-yellow-500">DGame Studio</h1>
        <div class="flex gap-2">
            <button onclick="runDGame()" class="px-4 py-2 bg-green-600 rounded hover:bg-green-500 transition font-bold">RUN</button>
        </div>
    </header>

    <main class="flex h-screen">
        <div class="flex-1 flex p-4 gap-4 overflow-hidden">
            <textarea id="editor" class="w-1/2 h-full bg-slate-950 p-4 rounded border border-slate-700 font-mono text-sm resize-none focus:outline-none focus:border-yellow-500" placeholder="Type your .dgame code here..."></textarea>
            <div id="preview" class="w-1/2 h-full bg-slate-100 rounded border border-slate-700 overflow-hidden relative"></div>
        </div>
    </main>

    <script>
        function runDGame() {
            const code = document.getElementById('editor').value;
            const preview = document.getElementById('preview');
            preview.innerHTML = '';
            
            // 1. Create a container for the scene
            const scene = document.createElement('div');
            scene.className = 'w-full h-full relative';
            preview.appendChild(scene);

            // 2. Parse Objects
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = code;
            
            const objects = {};
            tempDiv.querySelectorAll('object').forEach(obj => {
                const id = obj.getAttribute('id');
                const div = document.createElement('div');
                div.id = id;
                div.className = 'dgame-object';
                div.style.left = (Math.random() * 200 + 50) + 'px';
                div.style.top = (Math.random() * 200 + 50) + 'px';
                
                // Set the inner content as an SVG
                const svgContent = obj.innerHTML.trim();
                div.innerHTML = `<svg width="100" height="100">${svgContent}</svg>`;
                
                scene.appendChild(div);
                objects[id] = div;
            });

            // 3. Render Ragdolls (Construct)
            tempDiv.querySelectorAll('construct').forEach(cons => {
                const listId = cons.getAttribute('list').replace('[', '').replace(']', '');
                const list = tempDiv.querySelector(`list#${listId}`);
                if(list) {
                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.setAttribute('class', 'absolute inset-0 w-full h-full');
                    scene.appendChild(svg);
                    
                    const parts = Array.from(list.children).map(c => c.textContent.match(/\[(.*?)\]/)[1]);
                    
                    parts.forEach((pId, i) => {
                        if(parts[i+1] && objects[pId] && objects[parts[i+1]]) {
                            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                            line.setAttribute('class', 'lasso-line');
                            
                            const updateLine = () => {
                                const rect1 = objects[pId].getBoundingClientRect();
                                const rect2 = objects[parts[i+1]].getBoundingClientRect();
                                const sceneRect = scene.getBoundingClientRect();
                                
                                line.setAttribute('x1', rect1.left - sceneRect.left + 25);
                                line.setAttribute('y1', rect1.top - sceneRect.top + 25);
                                line.setAttribute('x2', rect2.left - sceneRect.left + 25);
                                line.setAttribute('y2', rect2.top - sceneRect.top + 25);
                            };
                            
                            svg.appendChild(line);
                            // Attach event listener for dragging to update lines
                            window.addEventListener('mousemove', updateLine);
                            updateLine();
                        }
                    });
                }
            });

            // Simple Drag Logic
            let activeEl = null;
            scene.addEventListener('mousedown', (e) => {
                if(e.target.closest('.dgame-object')) activeEl = e.target.closest('.dgame-object');
            });
            window.addEventListener('mousemove', (e) => {
                if(activeEl) {
                    activeEl.style.left = (e.clientX - scene.offsetLeft - 25) + 'px';
                    activeEl.style.top = (e.clientY - scene.offsetTop - 25) + 'px';
                }
            });
            window.addEventListener('mouseup', () => activeEl = null);
        }
    </script>
</body>
</html>
