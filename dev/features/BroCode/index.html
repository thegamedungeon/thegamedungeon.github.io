<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Crib Code Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { height: 100vh; display: flex; flex-direction: column; }
        .editor-container { flex: 1; display: flex; overflow: hidden; }
        #sidebar { width: 250px; border-right: 1px solid #333; overflow-y: auto; }
        #main-view { flex: 1; display: flex; flex-direction: column; }
        #viewer { flex: 1; padding: 10px; overflow: auto; }
        textarea { width: 100%; height: 90%; font-family: monospace; }
    </style>
</head>
<body class="bg-gray-900 text-white">

<header class="p-3 bg-gray-800 flex justify-between items-center">
    <h1 class="text-xl font-bold">The Crib Code Studio</h1>
    <button onclick="showMenu()" class="bg-blue-600 px-4 py-2 rounded">+</button>
</header>

<div class="editor-container">
    <div id="sidebar" class="p-2">
        <div id="file-list"></div>
    </div>
    <div id="main-view">
        <div id="viewer" class="bg-black">
            <textarea id="code-area" class="bg-gray-900 text-green-400 p-2"></textarea>
            <div id="preview-area" class="hidden w-full h-full bg-white text-black"></div>
        </div>
        <div class="p-2 bg-gray-800">
            <button onclick="runCode()" class="bg-green-600 px-4 py-2 rounded">Run File</button>
            <button onclick="toggleView()" class="bg-purple-600 px-4 py-2 rounded">Switch View</button>
        </div>
    </div>
</div>

<script>
    const dbName = "CribCodeDB";
    let db;

    const request = indexedDB.open(dbName, 1);
    request.onupgradeneeded = e => {
        db = e.target.result;
        db.createObjectStore("files", { keyPath: "name" });
    };
    request.onsuccess = e => { db = e.target.result; loadFiles(); };

    function loadFiles() {
        const tx = db.transaction("files", "readonly");
        const store = tx.objectStore("files");
        store.getAll().onsuccess = e => {
            const container = document.getElementById('file-list');
            container.innerHTML = e.target.result.map(f => `<div class="cursor-pointer p-2 hover:bg-gray-700" onclick="openFile('${f.name}')">${f.name}</div>`).join('');
        };
    }

    function showMenu() {
        const choice = prompt("Choose: 'file', 'folder'");
        if (choice === 'file') {
            const type = prompt("Type: html, css, js");
            const name = prompt("Filename?");
            const tx = db.transaction("files", "readwrite");
            tx.objectStore("files").add({ name: name + '.' + type, content: "" });
            tx.oncomplete = loadFiles;
        }
    }

    function openFile(name) {
        const tx = db.transaction("files", "readonly");
        tx.objectStore("files").get(name).onsuccess = e => {
            document.getElementById('code-area').value = e.target.result.content;
            document.getElementById('code-area').dataset.current = name;
        };
    }

    function runCode() {
        const content = document.getElementById('code-area').value;
        const preview = document.getElementById('preview-area');
        preview.classList.remove('hidden');
        document.getElementById('code-area').classList.add('hidden');
        preview.innerHTML = content;
    }

    function toggleView() {
        document.getElementById('preview-area').classList.add('hidden');
        document.getElementById('code-area').classList.remove('hidden');
    }
</script>
</body>
</html>
