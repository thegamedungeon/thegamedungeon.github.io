<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .login-box {
            background: #171717;
            border: 1px solid #262626;
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.1);
        }
        .btn-glow:hover {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        .input-field {
            background: #000000;
            border: 1px solid #262626;
            transition: border-color 0.3s;
        }
        .input-field:focus {
            border-color: #3b82f6;
            outline: none;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-6">

    <div class="login-box w-full max-w-md p-8 rounded-3xl space-y-8">
        <div class="text-center">
            <h1 class="text-4xl font-black italic text-blue-500 tracking-tighter">THE ENTRANCE</h1>
            <p class="text-xs text-neutral-500 font-mono mt-2 uppercase tracking-widest">Identify Yourself or Begone</p>
        </div>

        <!-- Manual Login Form -->
        <div class="space-y-4">
            <div>
                <label class="text-[10px] text-neutral-500 font-bold uppercase ml-1">Email Address</label>
                <input type="email" id="email" placeholder="bro@example.com" class="input-field w-full p-4 rounded-xl text-sm">
            </div>
            <div>
                <label class="text-[10px] text-neutral-500 font-bold uppercase ml-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" class="input-field w-full p-4 rounded-xl text-sm">
            </div>
            <button id="manual-btn" onclick="handleManualAuth()" class="btn-glow w-full bg-blue-600 py-4 rounded-xl font-bold transition-all">
                ACCESS DUNGEON
            </button>
        </div>

        <div class="flex items-center space-x-4 py-2">
            <div class="h-[1px] flex-1 bg-white/5"></div>
            <span class="text-[10px] text-neutral-700 font-bold">OR</span>
            <div class="h-[1px] flex-1 bg-white/5"></div>
        </div>

        <!-- Google Fast Pass -->
        <button onclick="handleGoogleAuth()" class="w-full bg-white text-black py-4 rounded-xl font-bold flex items-center justify-center space-x-3 hover:bg-neutral-200 transition-all">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#EA4335" d="M12 5.04c1.94 0 3.51.68 4.67 1.77L20.13 3.4C17.67 1.28 14.89 0 12 0 7.31 0 3.25 2.67 1.22 6.57l3.96 3.07c.95-2.85 3.63-4.6 6.82-4.6z"/>
                <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27h-11.3v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58l3.89 3c2.28-2.1 3.53-5.2 3.53-8.82z"/>
                <path fill="#FBBC05" d="M5.18 14.5c-.25-.74-.4-1.53-.4-2.5s.15-1.76.4-2.5L1.22 6.57C.44 8.13 0 9.94 0 12s.44 3.87 1.22 5.43l3.96-3.07z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.89-3c-1.11.75-2.53 1.18-4.04 1.18-3.19 0-5.87-2.15-6.82-5.04l-3.96 3.07C3.25 21.33 7.31 24 12 24z"/>
            </svg>
            <span>GOOGLE FAST PASS</span>
        </button>

        <p id="error-msg" class="text-center text-red-500 text-xs font-bold hidden"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // PERSISTENCE: This ensures the login "remembers" you after closing the browser
        setPersistence(auth, browserLocalPersistence)
            .then(() => console.log("Persistence set to local"))
            .catch((error) => console.error("Persistence error:", error));

        const syncUserProfile = async (user) => {
            const username = user.email.split('@')[0];
            const userRef = doc(db, "artifacts", "the-game-dungeon-4d75d", "public", "data", "users", username);
            
            try {
                const snap = await getDoc(userRef);
                if (!snap.exists()) {
                    await setDoc(userRef, {
                        email: user.email,
                        bio: "This person hasn't edited their bio yet!",
                        joinedAt: new Date().toISOString()
                    });
                }
                window.location.href = "/";
            } catch (e) {
                console.error("Profile sync blicked:", e);
                window.location.href = "/";
            }
        };

        window.handleManualAuth = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');

            if (!email || !password) {
                errorEl.innerText = "FILL IN THE FIELDS, BRO.";
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                const result = await signInWithEmailAndPassword(auth, email, password);
                await syncUserProfile(result.user);
            } catch (err) {
                if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
                    try {
                        const result = await createUserWithEmailAndPassword(auth, email, password);
                        await syncUserProfile(result.user);
                    } catch (signUpErr) {
                        errorEl.innerText = signUpErr.message.toUpperCase();
                        errorEl.classList.remove('hidden');
                    }
                } else {
                    errorEl.innerText = err.message.toUpperCase();
                    errorEl.classList.remove('hidden');
                }
            }
        };

        window.handleGoogleAuth = async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                await syncUserProfile(result.user);
            } catch (err) {
                console.error("Google Auth Failed", err);
            }
        };
    </script>
</body>
</html>
