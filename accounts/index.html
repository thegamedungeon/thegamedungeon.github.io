<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Scanner | The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="/storage/js/status.js" data-game="Account"></script>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
        .id-card {
            background: #171717;
            border: 1px solid #262626;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.1);
        }
        .provider-icon {
            filter: drop-shadow(0 0 8px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-6 relative">

    <!-- Back Button -->
    <a href="/" class="absolute top-6 left-6 p-2 bg-neutral-900 border border-white/5 rounded-full hover:bg-neutral-800 transition-all group">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-neutral-500 group-hover:text-blue-500"><path d="m15 18-6-6 6-6"/></svg>
    </a>

    <div class="id-card w-full max-w-sm p-8 rounded-3xl text-center space-y-6">
        <h2 class="text-xs font-mono text-blue-500 tracking-[0.3em] uppercase">Identity Detected</h2>
        
        <!-- The Profile Image that changes to their ACTUAL account pfp -->
        <div class="relative inline-block">
            <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-blue-600 mx-auto bg-neutral-900 flex items-center justify-center">
                <img id="display-pfp" src="/storage/photos/guest.png" alt="Identity Icon" class="w-full h-full object-cover">
            </div>
            <div id="status-dot" class="absolute bottom-1 right-1 w-5 h-5 bg-red-500 border-4 border-[#171717] rounded-full"></div>
        </div>

        <div class="space-y-1">
            <p id="user-email" class="text-lg font-bold truncate text-neutral-300 italic">Scanning...</p>
            <p id="provider-name" class="text-[10px] font-mono text-neutral-500 uppercase tracking-widest">Unauthorized Access</p>
        </div>

        <!-- Tactical Log Out Button -->
        <button id="logout-btn" class="w-full py-3 bg-red-900/20 hover:bg-red-600 text-red-500 hover:text-white rounded-xl text-[10px] font-bold transition-all border border-red-500/20 uppercase tracking-widest">
            Log Out & Purge
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const guestImg = "/storage/photos/guest.png";

        onAuthStateChanged(auth, (user) => {
            const emailText = document.getElementById('user-email');
            const providerText = document.getElementById('provider-name');
            const pfpImg = document.getElementById('display-pfp');
            const statusDot = document.getElementById('status-dot');

            if (user && !user.isAnonymous) {
                const email = user.email.toLowerCase();
                emailText.innerText = email;
                statusDot.classList.replace('bg-red-500', 'bg-green-500');

                // Set PFP to the actual account photo if it exists, otherwise fallback to guest
                pfpImg.src = user.photoURL || guestImg;

                // Identify the provider for the text label
                if (email.endsWith('@gmail.com') || email.endsWith('.k12.mn.us')) {
                    providerText.innerText = "Verified Google Identity";
                } 
                else if (email.endsWith('@outlook.com') || email.endsWith('@hotmail.com') || email.endsWith('@live.com')) {
                    providerText.innerText = "Verified Microsoft Identity";
                }
                else {
                    providerText.innerText = "Custom Domain Identity";
                }
            } else {
                emailText.innerText = "Go log in right now, young man.";
                providerText.innerText = "Identity Blicked";
                pfpImg.src = guestImg;
                statusDot.classList.replace('bg-green-500', 'bg-red-500');
            }
        });

        // Log Out Logic
        window.handleLogout = async () => {
            try {
                await signOut(auth);
                window.location.href = "/account/login/";
            } catch (err) {
                console.error("Logout blicked:", err);
            }
        };

        document.getElementById('logout-btn').addEventListener('click', handleLogout);
    </script>
</body>
</html>
