<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Game Dungeon | Redirecting...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="/storage/js/status.js" data-game="Lost"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #006400;
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        /* Internal Navigation Loader */
        #nav-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(10px);
            display: none;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(59, 130, 246, 0.1);
            border-left-color: #3b82f6; 
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .glitch-text {
            text-shadow: 2px 0 #3b82f6, -2px 0 #ef4444;
            animation: glitch 2s infinite;
        }
        @keyframes glitch {
            0% { text-shadow: 2px 0 #3b82f6, -2px 0 #ef4444; }
            50% { text-shadow: -2px 0 #3b82f6, 2px 0 #ef4444; }
            100% { text-shadow: 2px 0 #3b82f6, -2px 0 #ef4444; }
        }

        .pfp-large {
            width: 100px; height: 100px; border-radius: 50%;
            border: 4px solid #3b82f6; object-fit: cover;
            background: #1a1a1a;
            transition: filter 0.3s;
        }

        .fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #taskbar {
            position: fixed;
            bottom: -100px; 
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            transition: bottom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
        #taskbar.show { bottom: 20px; }
        
        .nav-btn {
            color: #444;
            font-size: 1.2rem;
            transition: 0.3s;
            pointer-events: none;
            background: none;
            border: none;
            cursor: default;
        }
        .nav-btn.active { color: #3b82f6; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .nav-btn.enabled { color: #9ca3af; pointer-events: auto; cursor: pointer; }
        .nav-btn.enabled:hover { color: white; transform: translateY(-3px); }
    </style>
</head>
<body>
<p>You're straight <b>LOST...</b></p>
<a href="/home/" class="px-8 py-3 bg-neutral-800 hover:bg-neutral-700 font-bold rounded-xl transition-all border border-white/10">
                GO HOME
            </a>
</body>
</html>
