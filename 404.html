<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon | Redirecting...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-y: auto;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(59, 130, 246, 0.1);
            border-left-color: #3b82f6; 
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .glitch-text {
            text-shadow: 2px 0 #3b82f6, -2px 0 #ef4444;
            animation: glitch 2s infinite;
        }
        @keyframes glitch {
            0% { text-shadow: 2px 0 #3b82f6, -2px 0 #ef4444; }
            50% { text-shadow: -2px 0 #3b82f6, 2px 0 #ef4444; }
            100% { text-shadow: 2px 0 #3b82f6, -2px 0 #ef4444; }
        }
        .pfp-large {
            width: 100px; height: 100px; border-radius: 50%;
            border: 4px solid #3b82f6; object-fit: cover;
        }
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Loading State -->
    <div id="loading-ui" class="text-center p-8">
        <div class="spinner mx-auto mb-4"></div>
        <h1 class="text-2xl font-black mb-2 italic tracking-tighter text-blue-500 uppercase">Bypassing Oink Oink...</h1>
        <p id="loading-subtext" class="text-gray-500 text-xs uppercase tracking-widest text-center">Scanning for Dungeon Dweller...</p>
    </div>

    <!-- 404 State -->
    <div id="error-ui" class="hidden text-center p-8">
        <h1 class="text-9xl font-black mb-4 glitch-text">404</h1>
        <h2 class="text-2xl font-bold text-blue-500 uppercase tracking-widest mb-4">Gate Blicked!</h2>
        <p class="text-gray-400 max-w-md mx-auto mb-8 text-sm">
            The sector you tried to access doesn’t exist. Either the "oink oink" moved it, or someone (probably Connor) sent you a zesty link.
        </p>
        <a href="/" class="inline-block px-8 py-3 rounded-full font-bold uppercase tracking-widest bg-blue-600 text-white text-xs">Return Home</a>
    </div>

    <!-- Profile UI -->
    <div id="profile-ui" class="hidden w-full max-w-md p-6 text-center fade-in">
        <div class="mb-6 flex justify-center">
            <img id="view-pfp" src="" class="pfp-large shadow-2xl bg-gray-800" onerror="this.src='https://www.gravatar.com/avatar/0000?d=mp'">
        </div>
        <h1 id="view-username" class="text-3xl font-black italic tracking-tighter text-white mb-1 uppercase tracking-tighter">Loading...</h1>
        <p id="view-handle" class="text-blue-500 text-[10px] font-bold tracking-widest mb-6 uppercase">@dweller</p>
        
        <div class="bg-[#111] p-4 rounded-2xl border border-white/5 mb-6 text-left relative">
            <h3 class="text-[10px] text-gray-500 uppercase font-black mb-2 tracking-widest">Dweller Bio</h3>
            <p id="view-bio" class="text-gray-300 text-sm italic">"The Dungeon is silent..."</p>
            <textarea id="edit-bio" class="hidden w-full bg-black/50 border border-blue-500/50 rounded-lg p-2 text-sm text-white focus:outline-none h-24 resize-none"></textarea>
            <button id="edit-btn" class="hidden absolute top-4 right-4 text-blue-500 hover:text-white transition">
                <i class="fa-solid fa-pen-to-square"></i>
            </button>
        </div>

        <div class="flex gap-3">
            <button id="friend-btn" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl uppercase tracking-widest text-[10px]">Friend Request</button>
            <button onclick="window.location.href='/'" class="bg-white/5 border border-white/10 text-gray-300 font-bold px-6 py-3 rounded-xl uppercase tracking-widest text-[10px]">Home</button>
        </div>
    </div>

<!-- Taskbar -->
    <nav id="main-taskbar" class="taskbar fixed bottom-0 left-0 w-full h-16 flex items-center justify-around px-4">
        <button onclick="navTo('home')" class="nav-item flex flex-col items-center">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] mt-1">Home</span>
        </button>
        <button onclick="navTo('play')" class="nav-item active flex flex-col items-center">
            <i class="fa-solid fa-gamepad text-xl"></i>
            <span class="text-[10px] mt-1">Play</span>
        </button>
        <button onclick="navTo('chat')" class="nav-item flex flex-col items-center">
            <i class="fa-solid fa-comment-dots text-xl"></i>
            <span class="text-[10px] mt-1">Chat</span>
        </button>
        <button onclick="navTo('call')" class="nav-item flex flex-col items-center">
            <i class="fa-solid fa-phone text-xl"></i>
            <span class="text-[10px] mt-1">Call</span>
        </button>
        <button onclick="navTo('account')" class="nav-item flex flex-col items-center">
            <div id="pfp-slot" class="pfp-container">
                <i class="fa-solid fa-user text-lg"></i>
            </div>
            <span class="text-[10px] mt-1">Account</span>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "the-game-dungeon-4d75d";

        const loadingUI = document.getElementById('loading-ui');
        const loadingSub = document.getElementById('loading-subtext');
        const errorUI = document.getElementById('error-ui');
        const profileUI = document.getElementById('profile-ui');

        async function resolveDungeonPath() {
            const fullPath = window.location.pathname;
            const segments = fullPath.split('/').filter(p => p !== "");
            
            // The handle is the person's username from the URL
            let handle = segments.length > 0 ? segments[segments.length - 1] : null;
            
            if (!handle) {
                window.location.replace('/');
                return;
            }

            handle = decodeURIComponent(handle).trim();

            const systemPaths = ['home', 'play', 'chat', 'call', 'account', 'settings', 'index.html', '404.html'];
            if (systemPaths.includes(handle.toLowerCase())) {
                sessionStorage.setItem('redirect_path', fullPath);
                window.location.replace('/');
                return;
            }

            try {
                loadingSub.innerText = "Authenticating with the Dungeon...";
                await signInAnonymously(auth);

                loadingSub.innerText = `Fetching profile: ${handle}...`;
                
                // TACTICAL FIX: Replacing placeholder logic with the direct username path
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', handle);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    showProfile(docSnap.data(), handle);
                } else {
                    // Try lowercase fallback in case of casing issues
                    const docRefLower = doc(db, 'artifacts', appId, 'public', 'data', 'users', handle.toLowerCase());
                    const docSnapLower = await getDoc(docRefLower);
                    if (docSnapLower.exists()) {
                        showProfile(docSnapLower.data(), handle.toLowerCase());
                    } else {
                        show404();
                    }
                }
            } catch (err) {
                console.error("Dungeon verification failed:", err);
                loadingSub.innerText = "Blicked by Bot-Brained Security.";
                setTimeout(show404, 1500);
            }
        }

        function show404() {
            loadingUI.classList.add('hidden');
            errorUI.classList.remove('hidden');
            profileUI.classList.add('hidden');
            document.title = "404 | Gate Blicked";
        }

        function showProfile(data, usernameId) {
            loadingUI.classList.add('hidden');
            errorUI.classList.add('hidden');
            profileUI.classList.remove('hidden');
            document.title = `Dweller | ${usernameId}`;

            // PFP
            document.getElementById('view-pfp').src = data.pfp || "https://www.gravatar.com/avatar/0000?d=mp";
            
            // The person's actual username from the doc ID/path
            document.getElementById('view-username').innerText = usernameId;
            document.getElementById('view-handle').innerText = `@${usernameId}`;
            
            // The bio inside that doc
            document.getElementById('view-bio').innerText = data.bio || "This dweller hasn't etched a bio yet.";

            onAuthStateChanged(auth, (user) => {
                if (user && !user.isAnonymous) {
                    const myHandle = user.email ? user.email.split('@')[0] : null;
                    if (myHandle && myHandle.toLowerCase() === usernameId.toLowerCase()) {
                        setupEditMode(usernameId);
                    } else {
                        setupFriendButton(user.uid, usernameId);
                    }
                }
            });
        }

        function setupEditMode(docId) {
            const editBtn = document.getElementById('edit-btn');
            const viewBio = document.getElementById('view-bio');
            const editBio = document.getElementById('edit-bio');
            editBtn.classList.remove('hidden');
            
            let isEditing = false;
            editBtn.onclick = async () => {
                if (!isEditing) {
                    editBio.value = viewBio.innerText === "This dweller hasn't etched a bio yet." ? "" : viewBio.innerText;
                    viewBio.classList.add('hidden');
                    editBio.classList.remove('hidden');
                    editBtn.innerHTML = '<i class="fa-solid fa-check text-green-500 text-xl"></i>';
                    editBio.focus();
                    isEditing = true;
                } else {
                    const newBio = editBio.value.trim();
                    try {
                        editBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i>';
                        const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'users', docId);
                        await updateDoc(userDoc, { bio: newBio });
                        viewBio.innerText = newBio || "This dweller hasn't etched a bio yet.";
                        viewBio.classList.remove('hidden');
                        editBio.classList.add('hidden');
                        editBtn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i>';
                        isEditing = false;
                    } catch (e) {
                        editBtn.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-500"></i>';
                    }
                }
            };
        }

        function setupFriendButton(myUid, targetDocId) {
            const fBtn = document.getElementById('friend-btn');
            fBtn.onclick = () => {
                fBtn.innerText = "Request Sent";
                fBtn.disabled = true;
                fBtn.classList.replace('bg-blue-600', 'bg-gray-700');
            };
        }

        resolveDungeonPath();
    </script>
</body>
</html>
