<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module" src="storage/js/vpn.js>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crib Settings | Secure Access</title>
    <style>
        :root {
            --dungeon-green: #00ff00; /* Green belt energy */
            --zesty-purple: #ff00ff; /* Reserved for roasting Connor */
        }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .settings-container {
            background: #151515;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid var(--dungeon-green);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            width: 350px;
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .user-info {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid var(--dungeon-green);
        }
        .user-info p { margin: 5px 0; font-size: 0.9rem; color: #aaa; }
        #display-email { color: var(--dungeon-green); font-weight: bold; word-break: break-all; }
        
        .action-btn {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .logout-btn { background: #ff4444; color: white; }
        .logout-btn:hover { background: #cc0000; transform: scale(1.02); }

        /* DungeonBan Button - Straight to the point */
        .dungeon-btn { 
            background: var(--dungeon-green); 
            color: black; 
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dungeon-btn:hover { background: #00cc00; transform: scale(1.02); }
        
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .back-link:hover { color: var(--dungeon-green); }
    </style>
</head>
<body>

    <div class="settings-container">
        <h1>Guild Profile</h1>
        
        <div class="user-info">
            <p>Authenticated Member:</p>
            <p id="display-email">Identifying...</p>
        </div>

        <a href="dungeonban/" class="action-btn dungeon-btn">DUNGEONBAN TERMINAL</a>

        <button class="action-btn logout-btn" onclick="handleLogout()">TERMINATE SESSION (LOGOUT)</button>
        
        <a href="/index.html" class="back-link">← Return to The Crib</a>
        
        <p style="font-size: 0.6rem; color: #333; margin-top: 20px;">
            Security active. Connor detection: 100% effective.
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('display-email').innerText = user.email;
            } else {
                window.location.href = "/login/";
            }
        });

        window.handleLogout = () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                alert("Logout failed: " + error.message);
            });
        };
    </script>
</body>
</html>
