<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #f3f4f6;
        }
        /* Custom neon glowing elements */
        .neon-border:focus-within {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10s); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-black overflow-y-auto">

    <div class="w-full max-w-md bg-gray-950 border border-gray-900 rounded-3xl p-8 shadow-2xl animate-fade-in relative overflow-hidden">
        
        <!-- Glowing Ambient light -->
        <div class="absolute -top-16 -left-16 w-36 h-36 bg-blue-900/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -right-16 w-36 h-36 bg-red-900/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="text-center mb-8 relative z-10">
            <h2 class="text-3xl font-extrabold text-white tracking-tight">Dungeon Login</h2>
            <p class="text-gray-400 text-sm mt-2">Enter your credentials to descend back into the vault</p>
        </div>

        <!-- Custom Notification Alert Container -->
        <div id="alert-box" class="hidden mb-6 p-4 rounded-xl border text-sm relative z-10 transition-all duration-300">
            <p id="alert-message" class="font-medium"></p>
            <div id="alert-action" class="mt-3 hidden">
                <a href="/account/create/" class="inline-flex items-center text-blue-400 hover:text-blue-300 font-bold gap-1 transition">
                    Create Dungeon Account <span>&rarr;</span>
                </a>
            </div>
        </div>

        <form id="login-form" class="space-y-5 relative z-10">
            <div>
                <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider mb-2" for="email">Dungeon Email</label>
                <div class="relative rounded-xl border border-gray-800 bg-black/60 transition-all neon-border">
                    <input type="email" id="email" required placeholder="name@domain.com" 
                        class="w-full bg-transparent text-white px-4 py-3.5 rounded-xl focus:outline-none placeholder-gray-600 text-sm">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider" for="password">Password</label>
                </div>
                <div class="relative rounded-xl border border-gray-800 bg-black/60 transition-all neon-border">
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full bg-transparent text-white px-4 py-3.5 rounded-xl focus:outline-none placeholder-gray-600 text-sm">
                </div>
            </div>

            <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition duration-200 transform active:scale-95 shadow-lg shadow-blue-900/30 text-sm flex items-center justify-center gap-2">
                <span>Enter Dungeon</span>
            </button>
        </form>

        <div class="relative my-6 flex items-center justify-center z-10">
            <div class="border-t border-gray-900 w-full"></div>
            <span class="absolute bg-gray-950 px-4 text-xs font-bold text-gray-500 uppercase tracking-widest">or fast pass</span>
        </div>

        <div class="space-y-3 relative z-10">
            <!-- Google Fast Pass Button -->
            <button id="btn-google" class="w-full bg-white hover:bg-gray-100 text-black font-semibold py-3.5 rounded-xl transition duration-200 transform active:scale-95 shadow-md flex items-center justify-center gap-3 text-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.9h6.69a5.74 5.74 0 0 1-2.49 3.77v3.13h4.01c2.34-2.16 3.68-5.32 3.68-8.73z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-4.01-3.13c-1.12.75-2.55 1.19-3.92 1.19-3.04 0-5.61-2.05-6.53-4.82H1.31v3.23A12 12 0 0 0 12 24z"/>
                    <path fill="#FBBC05" d="M5.47 14.33a7.14 7.14 0 0 1 0-4.66V6.44H1.31a12 12 0 0 0 0 11.12l4.16-3.23z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43A11.93 11.93 0 0 0 12 0 12 12 0 0 0 1.31 6.44l4.16 3.23c.92-2.77 3.49-4.82 6.53-4.82z"/>
                </svg>
                <span>Google Fast Pass</span>
            </button>

            <!-- Create Account Button -->
            <a href="/account/create/" class="block w-full text-center bg-gray-900 hover:bg-gray-800 text-gray-300 hover:text-white font-semibold py-3.5 rounded-xl border border-gray-800 transition duration-200 transform active:scale-95 text-sm">
                Create New Dungeon Profile
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        const alertAction = document.getElementById('alert-action');
        const loginForm = document.getElementById('login-form');
        const btnLogin = document.getElementById('btn-login');
        const btnGoogle = document.getElementById('btn-google');

        // Helper function to render elegant custom alerts instead of messy native windows
        function showAlert(message, type = 'error', showCreateLink = false) {
            alertBox.className = "mb-6 p-4 rounded-xl border text-sm relative z-10 transition-all duration-300";
            if (type === 'error') {
                alertBox.classList.add('bg-red-950/40', 'border-red-900/60', 'text-red-300');
            } else {
                alertBox.classList.add('bg-blue-950/40', 'border-blue-900/60', 'text-blue-300');
            }
            alertMessage.textContent = message;
            
            if (showCreateLink) {
                alertAction.classList.remove('hidden');
            } else {
                alertAction.classList.add('hidden');
            }
            alertBox.classList.remove('hidden');
        }

        async function checkUserRecordAndFinish(user) {
            try {
                const cleanEmail = user.email.split('@')[0];
                const userRef = doc(db, 'artifacts', 'the-game-dungeon-4d75d', 'public', 'data', 'users', cleanEmail);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    // Profile verified! Give parent frame authorization to refresh and close login state
                    window.parent.postMessage('login_success', '*');
                } else {
                    // Auth state succeeded but no Firestore record means they need to sign up
                    await signOut(auth);
                    showAlert("This account does not exist inside our Dungeon Archives.", 'error', true);
                }
            } catch (error) {
                console.error("Firestore lookup failed:", error);
                await signOut(auth);
                showAlert("A dungeon anomaly occurred. Please try again.", 'error');
            }
        }

        // Handler for Manual Username/Password Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btnLogin.disabled = true;
            btnLogin.innerHTML = `<span>Opening Vault Gates...</span>`;
            alertBox.classList.add('hidden');

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                await checkUserRecordAndFinish(userCredential.user);
            } catch (error) {
                console.error("Login failed:", error);
                // Map common Firebase errors to user friendly responses
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    showAlert("This account doesn't exist.", 'error', true);
                } else {
                    showAlert("Invalid password or email address. Try again.", 'error');
                }
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerHTML = `<span>Enter Dungeon</span>`;
            }
        });

        // Handler for Google Fast Pass Sign In
        btnGoogle.addEventListener('click', async () => {
            btnGoogle.disabled = true;
            alertBox.classList.add('hidden');

            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                await checkUserRecordAndFinish(result.user);
            } catch (error) {
                console.error("Google authentication failed:", error);
                if (error.code !== 'auth/popup-closed-by-user') {
                    showAlert("Google Fast Pass validation was interrupted.", 'error');
                }
            } finally {
                btnGoogle.disabled = false;
            }
        });
    </script>
</body>
</html>
