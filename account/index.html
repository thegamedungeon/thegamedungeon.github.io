<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Dungeon | Identifying...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0a0a0a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* The Green Loading Circle */
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(34, 197, 94, 0.1);
            border-left-color: #22c55e; /* Green belt energy */
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            margin-top: 20px;
            color: #22c55e;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 10px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p id="status" class="status-text">Scanning Biometrics...</p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            const statusLabel = document.getElementById('status');
            
            if (user) {
                if (user.isAnonymous) {
                    statusLabel.innerText = "Guest Access Denied. Redirecting Home...";
                    setTimeout(() => navigateTo('/home/'), 1500);
                } else {
                    statusLabel.innerText = "Access Granted. Stripping Credentials...";
                    
                    // The Logic: Get email, remove the @domain.com
                    const email = user.email || "";
                    const answer = email.split('@')[0]; // This is the "answer" variable
                    
                    setTimeout(() => {
                        navigateTo(`/${answer}/`);
                    }, 800);
                }
            } else {
                statusLabel.innerText = "No Credentials Found. Redirecting to Login...";
                setTimeout(() => navigateTo('/login/'), 1500);
            }
        });

        function navigateTo(url) {
            if (window.self !== window.top) {
                window.parent.postMessage({ type: 'NAVIGATE', url: url }, '*');
            } else {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
