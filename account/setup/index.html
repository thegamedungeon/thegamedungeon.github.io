<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set CribName | The Crib</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0b0b] text-white h-screen flex items-center justify-center">

    <div class="bg-neutral-900 p-8 rounded-2xl border border-blue-500/30 w-96 text-center">
        <h2 class="text-2xl font-black text-blue-500 mb-6">SET YOUR CRIB-NAME</h2>
        <input id="username-input" type="text" placeholder="Enter username..." 
               class="w-full bg-neutral-800 border border-neutral-700 p-3 rounded-xl mb-4 text-center focus:border-blue-500 outline-none">
        <button id="save-btn" class="w-full bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-700 transition">
            SAVE
        </button>
    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // ... your firebaseConfig here ...
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 1. Define the handler separately so it's always accessible
    async function saveUsername(user) {
        const newUsername = document.getElementById('username-input').value;
        if (!newUsername) return alert("Bro, enter a name.");

        const emailId = user.email.split('@')[0];
        const docRef = doc(db, "artifacts", "the-game-dungeon-4d75d", "public", "data", "users", emailId);

        try {
            await setDoc(docRef, { username: newUsername }, { merge: true });
            window.location.href = "/";
        } catch (e) {
            console.error(e);
            alert("Failed to save, bro.");
        }
    }

    // 2. Attach the listener once the DOM is ready
    document.addEventListener('click', async (event) => {
    // Check if the element clicked was the save button
    if (event.target.id === 'save-btn') {
        console.log("Save button detected! Starting process...");
        
        // This makes sure we have the user
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                console.log("Error: User not logged in!");
                return;
            }
            
            const newUsername = document.getElementById('username-input').value;
            if (!newUsername) {
                console.log("Error: No username entered.");
                return;
            }

            const emailId = user.email.split('@')[0];
            const docRef = doc(db, "artifacts", "the-game-dungeon-4d75d", "public", "data", "users", emailId);

            try {
                await setDoc(docRef, { username: newUsername }, { merge: true });
                console.log("Success! Redirecting...");
                window.location.href = "/";
            } catch (e) {
                console.log("Firestore Error: " + e.message);
            }
        });
    }
});
</script>
</body>
</html>
