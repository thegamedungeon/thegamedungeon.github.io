<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set CribName | The Crib</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #save-btn {
            pointer-events: auto !important;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
    </style>
</head>
<body class="bg-[#0b0b0b] text-white h-screen flex items-center justify-center">

    <div class="bg-neutral-900 p-8 rounded-2xl border border-blue-500/30 w-96 text-center">
        <h2 class="text-2xl font-black text-blue-500 mb-6">SET YOUR CRIB-NAME</h2>
        <input id="username-input" type="text" placeholder="Enter username..." 
               class="w-full bg-neutral-800 border border-neutral-700 p-3 rounded-xl mb-4 text-center focus:border-blue-500 outline-none">
        
        <!-- The button is now a div for maximum compatibility -->
        <div id="save-btn" 
             onclick="handleSave()" 
             class="w-full bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-700 transition cursor-pointer select-none">
            SAVE
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Define the function globally so the onclick can see it
        window.handleSave = async () => {
            console.log("HandleSave triggered!");
            
            const user = auth.currentUser;
            if (!user) {
                console.log("No user logged in!");
                return;
            }

            const username = document.getElementById('username-input').value;
            if (!username) {
                alert("Bro, enter a name.");
                return;
            }

            const emailId = user.email.split('@')[0];
            const docRef = doc(db, "artifacts", "the-game-dungeon-4d75d", "public", "data", "users", emailId);

            try {
                await setDoc(docRef, { username: username }, { merge: true });
                console.log("Success! Redirecting...");
                window.location.href = "/";
            } catch (e) {
                console.log("Firestore error: " + e.message);
                alert("Something went wrong, bro.");
            }
        };
    </script>
</body>
</html>
