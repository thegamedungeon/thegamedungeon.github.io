<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col items-center justify-center">

    <!-- Loading Screen -->
    <div id="loader" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0a0a0a]">
        <img src="/storage/photos/loading.gif" alt="Loading" class="w-24 h-24">
    </div>

    <!-- Error Screen -->
    <div id="error-screen" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center bg-red-950 p-6 text-center">
        <h1 class="text-2xl font-bold mb-4 text-red-200">System Error</h1>
        <div id="error-message" class="bg-black/50 p-4 rounded-lg font-mono text-red-400 text-sm max-w-lg">firebase error</div>
        <button onclick="location.reload()" class="mt-6 px-4 py-2 bg-red-800 rounded-full hover:bg-red-700 transition">Retry Connection</button>
    </div>

    <!-- Main Dashboard -->
    <main id="home-screen" class="hidden flex flex-col items-center gap-8">
        <h1 class="text-4xl font-bold tracking-tighter">THE GAME DUNGEON</h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <a href="/play/" class="px-8 py-4 bg-white/10 hover:bg-white/20 rounded-2xl transition text-center font-semibold">Play</a>
            <a href="/settings/" class="px-8 py-4 bg-white/10 hover:bg-white/20 rounded-2xl transition text-center font-semibold">Settings</a>
            <a href="/chat/" class="px-8 py-4 bg-white/10 hover:bg-white/20 rounded-2xl transition text-center font-semibold">Notifications</a>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        async function runSystemCheck() {
            const loader = document.getElementById('loader');
            const errorScreen = document.getElementById('error-screen');
            const homeScreen = document.getElementById('home-screen');

            try {
                // 1. Initialize Firebase
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                
                // Optional: Force a quick ping if needed, or just proceed
                if (!app || !db) throw new Error("Init failure");

                // 2. Verify status.js
                const response = await fetch('/storage/js/status.js');
                if (!response.ok) throw new Error("Status failure");

                // 3. Inject script
                const s = document.createElement('script');
                s.type = 'module';
                s.src = '/storage/js/status.js';
                s.setAttribute('data-game', 'not in a game');
                document.body.appendChild(s);

                // 4. Transition
                loader.classList.add('hidden');
                homeScreen.classList.remove('hidden');

            } catch (err) {
                loader.classList.add('hidden');
                errorScreen.classList.remove('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', runSystemCheck);
    </script>
</body>
</html>
