<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/storage/js/hex.js"></script>
    <script type="module" src="/storage/js/status.js" data-game="Home"></script>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: auto;
        }
        .btn-glow:hover {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #title {
    display: block;
    margin-left: auto;
    margin-right: auto;
}

/* Forces the content to the left */
#nav-container-l {
  display: flex;
  gap: 15px;
}

/* Forces the content to the right */
#nav-container-r {
  display: flex;
  gap: 15px;
}
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center relative">

    <!-- Auth Guard Overlay -->
    <div id="loading-screen" class="fixed inset-0 bg-black z-50 flex items-center justify-center">
        <div class="flex flex-col items-center space-y-4">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
            <p class="text-blue-500 font-mono text-sm tracking-widest animate-pulse">ENTERING THE DUNGEON...</p>
        </div>
    </div>

    <!-- Music Popup -->
    <div id="game-popup" class="hidden fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4">
        <div class="bg-neutral-900 border border-blue-500/30 p-8 rounded-2xl max-w-sm w-full relative">
            <button onclick="closePopup()" class="absolute top-4 right-4 text-gray-400 hover:text-white">✕</button>
            <h2 class="text-2xl font-black text-blue-500 mb-2">NEW GAME</h2>
            <p class="text-gray-300 mb-6">Five Nights at Sods is finally here. Go play now.</p>
            <a href="/play/five-nights-at-sods/" class="block w-full text-center bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-700 transition">GO NOW</a>
        </div>
    </div>

    <!-- Top Right Nav -->
    <div id="nav-container-l" class="absolute top-6 right-6 flex items-center space-x-4 opacity-0 transition-opacity duration-500">
        <!-- Music Button -->
        <a href="/music/" class="p-2 hover:bg-white/10 rounded-full transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </a>
        <!-- Chat Bell -->
        <a href="/chat/" class="p-2 hover:bg-white/10 rounded-full transition-colors">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
</svg>
        </a>
        
        <!-- Profile Picture -->
        <a href="/account/" class="w-10 h-10 rounded-full overflow-hidden border-2 border-blue-500 hover:scale-110 transition-transform bg-neutral-800 flex items-center justify-center">
            <img id="user-pfp" src="/storage/photos/guest.png" alt="Profile" class="w-full h-full object-cover" onerror="this.src='/storage/photos/guest.png'">
        </a>
        <!-- Playtime -->
        <a href="/play/playtime/" class="p-3 glass rounded-2xl hover:bg-blue-600/20 hover:border-blue-500/30 transition-all group">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500 group-hover:scale-110 transition-transform"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            </a>
    </div>

    <!-- Top Left Nav -->
    <div id="nav-container-r" class="absolute top-6 left-6 flex items-center space-x-4 opacity-0 transition-opacity duration-500">
        <!-- Home Button -->
        <a href="/home/" class="w-10 h-10 rounded-full overflow-hidden border-2 border-blue-500 hover:scale-110 transition-transform bg-neutral-800 flex items-center justify-center">
            <img id="home-button-png" src="/storage/photos/tgdtc.png" alt="Home" class="w-full h-full object-cover">
        </a>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="text-center space-y-8 opacity-0">
        <img id="title" src="/storage/photos/tgdl.png" alt="THE GAME DUNGEON" width="250" height="auto"></img>
        <div class="flex flex-col space-y-4 items-center">
            <a href="/play/" class="btn-glow px-12 py-4 bg-blue-600 text-white font-bold rounded-xl text-2xl transition-all w-64 text-center">
                PLAY
            </a>
            <a href="/settings/" class="btn-glow px-12 py-4 bg-neutral-800 text-white font-bold rounded-xl text-xl transition-all w-64 text-center border border-white/10">
                SETTINGS
            </a>
            <p>Or miss the <b>OLD</b> Game Dungeon?</p>
            <a href="https://thegamedungeon.github.io/theoldgamedungeon/" class="btn-glow px-12 py-4 bg-red-800 text-blue font-bold rounded-xl text-xl transition-all w-64 text-center border border-white/10">
                THE OLD GAME DUNGEON
            </a>
            <p>Warning: There isn't a button back. You must retype the link <b>THEGAMEDUNGEON.GITHUB.IO</b></p>
        </div>
    </div>

    <script>
        function closePopup() {
            document.getElementById('game-popup').classList.add('hidden');
        }

        // Show popup only once
        if (!localStorage.getItem('sawMusicFeature')) {
            setTimeout(() => {
                document.getElementById('music-popup').classList.remove('hidden');
                localStorage.setItem('sawMusicFeature', 'true');
            }, 1000);
        }
    </script>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const safetyTimeout = setTimeout(() => {
            if (!auth.currentUser) window.location.href = "/account/login/";
        }, 5000);

        onAuthStateChanged(auth, async (user) => {
            clearTimeout(safetyTimeout);
            const loadingScreen = document.getElementById('loading-screen');
            const nav = document.getElementById('nav-container');
            const mainContent = document.getElementById('main-content');

            if (!user) {
                window.location.href = "/accounts/login/";
                return;
            }

            const pfpImg = document.getElementById('user-pfp');
            
            if (user.photoURL) {
                pfpImg.src = user.photoURL;
            }

            try {
                if (user.email) {
                    const username = user.email.split('@')[0];
                    const docRef = doc(db, "artifacts", "the-game-dungeon-4d75d", "public", "data", "users", username);
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.pfp && (data.pfp.startsWith('data:image') || data.pfp.length > 100)) {
                            pfpImg.src = data.pfp;
                        }
                    }
                }
            } catch (error) {
                console.error("Firestore error:", error);
            } finally {
                loadingScreen.style.display = 'none';
                nav.style.opacity = '1';
                mainContent.classList.add('fade-in');
                mainContent.classList.remove('opacity-0');
            }
        });
    </script>
</body>
</html>
