<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        /* Loading Highlight Overlay */
        #nav-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(10px);
            display: none;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .taskbar {
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .nav-item:hover {
            transform: translateY(-5px);
            color: #3b82f6;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background: #3b82f6;
            border-radius: 50%;
        }

        .game-card {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .game-card:hover {
            transform: scale(1.05);
            border-color: #3b82f6;
        }

        .pfp-container {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            background: #10b981; /* Default Green */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Internal Navigation Loader -->
    <div id="nav-loader">
        <div class="flex flex-col items-center">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <p id="loader-status" class="mt-4 font-bold text-blue-500 uppercase tracking-widest text-sm">Switching Sectors...</p>
        </div>
    </div>

    <!-- Main View -->
    <main id="main-content" class="h-full flex flex-col items-center justify-center p-6 pb-24 text-center">
        <div class="mb-12">
            <h1 class="text-4xl font-black italic tracking-tighter text-blue-500 mb-2">THE GAME DUNGEON</h1>
            <p class="text-gray-500 text-sm">Welcome back, Alex. No blicked gates here.</p>
        </div>

        <!-- Random Game Selection Area -->
        <div id="random-game-container" class="w-full max-w-sm">
            <div onclick="playRandomGame()" class="game-card cursor-pointer rounded-2xl p-8 flex flex-col items-center justify-center text-center">
                <img id="game-icon" src="" alt="Icon" class="w-24 h-24 rounded-2xl mb-4 shadow-2xl">
                <h3 id="game-name" class="text-2xl font-bold mb-1">...</h3>
                <p class="text-blue-500 text-xs font-bold uppercase tracking-widest">Random Drop</p>
            </div>
            <p class="text-center text-gray-600 text-[10px] mt-4 uppercase">Click the card to jump straight in</p>
        </div>
    </main>

    <!-- OS Taskbar -->
    <nav class="taskbar fixed bottom-0 left-0 w-full h-16 flex items-center justify-around px-4">
        <button onclick="navTo('home')" class="nav-item active flex flex-col items-center">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] mt-1">Home</span>
        </button>
        <button onclick="navTo('play')" class="nav-item flex flex-col items-center">
            <i class="fa-solid fa-gamepad text-xl"></i>
            <span class="text-[10px] mt-1">Play</span>
        </button>
        <button onclick="navTo('chat')" class="nav-item flex flex-col items-center">
            <i class="fa-solid fa-comment-dots text-xl"></i>
            <span class="text-[10px] mt-1">Chat</span>
        </button>
        <button onclick="navTo('call')" class="nav-item flex flex-col items-center">
            <i class="fa-solid fa-phone text-xl"></i>
            <span class="text-[10px] mt-1">Call</span>
        </button>
        <button onclick="navTo('account')" class="nav-item flex flex-col items-center" id="account-btn">
            <div id="pfp-slot" class="pfp-container">
                <i class="fa-solid fa-user text-lg"></i>
            </div>
            <span class="text-[10px] mt-1">Account</span>
        </button>
    </nav>

    <!-- Firebase Modular Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const pfpSlot = document.getElementById('pfp-slot');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email && user.email.endsWith('@gmail.com')) {
                    pfpSlot.innerHTML = `<img src="${user.photoURL}" class="w-full h-full object-cover">`;
                } else {
                    const initials = user.displayName ? 
                        user.displayName.split(' ').map(n => n[0]).join('').toUpperCase() : 
                        "TC";
                    pfpSlot.innerHTML = `<span>${initials}</span>`;
                }
            } else {
                pfpSlot.style.background = "#262626";
                pfpSlot.innerHTML = `<i class="fa-solid fa-user text-lg"></i>`;
            }
        });
    </script>

    <script>
        const games = [
            { name: "Ragdoll Hit", img: "/storage/photos/rh.png" },
            { name: "Geometry Dash", img: "/storage/photos/gd.png" },
            { name: "Cookie Clicker", img: "/storage/photos/cc.png" },
            { name: "PolyTrack", img: "/storage/photos/polytrack.png" },
            { name: "Minecraft", img: "/storage/photos/minecraft.png" }
        ];

        let selectedGame = null;

        function initRandomGame() {
            selectedGame = games[Math.floor(Math.random() * games.length)];
            document.getElementById('game-icon').src = selectedGame.img;
            document.getElementById('game-name').innerText = selectedGame.name;
        }

        function playRandomGame() {
            const slug = selectedGame.name.toLowerCase().replace(/\s+/g, '-');
            // Navigates to the play folder for that specific game
            navTo(`play/${slug}`);
        }

        function navTo(page) {
            // Clean the path to make it absolute from root
            const targetUrl = page.startsWith('/') ? page : `/${page}/`;
            const statusText = `Entering ${page.split('/')[0]}...`;
            smoothNav(targetUrl, statusText);
        }

        function smoothNav(url, status) {
            const loader = document.getElementById('nav-loader');
            const statusLabel = document.getElementById('loader-status');
            
            statusLabel.innerText = status;
            loader.style.display = 'flex';
            loader.style.opacity = '1';

            // TACTICAL SYNC: 
            // If we are inside the iframe shell (index.html), we should tell the PARENT to change the URL.
            // This prevents the whole site from refreshing and killing active calls.
            setTimeout(() => {
                if (window.self !== window.top) {
                    // Tell index.html to update the iframe src
                    window.parent.postMessage({ type: 'NAVIGATE', url: url }, '*');
                } else {
                    // Fallback if opened directly
                    window.location.href = url;
                }
            }, 600);
        }

        initRandomGame();
    </script>
</body>
</html>
