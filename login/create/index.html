<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Account | The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
            overflow-y: auto;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-glow:focus {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
        }
        .requirement-met { color: #4ade80; }
        .requirement-not-met { color: #64748b; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Background Elements -->
    <div class="fixed inset-0 overflow-hidden -z-10">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="max-w-md w-full animate-in fade-in zoom-in duration-500 py-10">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black tracking-tighter text-white uppercase">Join the <span class="text-blue-500">Crib</span></h1>
            <p class="text-slate-500 text-sm mt-2 font-medium">Initialize your gamer profile. No bots allowed.</p>
        </div>

        <!-- Create Card -->
        <div class="glass-panel p-8 rounded-[2.5rem] shadow-2xl">
            <!-- Google Fast Pass -->
            <button id="google-fast-pass" 
                class="w-full bg-white hover:bg-gray-100 text-gray-900 font-bold py-4 rounded-2xl transition-all active:scale-[0.98] shadow-lg mb-6 flex items-center justify-center gap-3">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="G">
                <span>Google Fast Pass</span>
            </button>

            <div class="flex items-center gap-4 mb-6">
                <div class="h-[1px] bg-slate-800 flex-1"></div>
                <span class="text-[10px] font-black text-slate-600 uppercase tracking-widest">OR REGISTER</span>
                <div class="h-[1px] bg-slate-800 flex-1"></div>
            </div>

            <form id="create-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Real Name</label>
                        <input type="text" id="name" required 
                            class="w-full bg-slate-950/50 border border-slate-800 rounded-xl py-3 px-4 outline-none transition-all input-glow text-white text-sm"
                            placeholder="Alex">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">GameTag</label>
                        <input type="text" id="gamename" required 
                            class="w-full bg-slate-950/50 border border-slate-800 rounded-xl py-3 px-4 outline-none transition-all input-glow text-white text-sm"
                            placeholder="CribMaster99">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Email</label>
                    <input type="email" id="email" required 
                        class="w-full bg-slate-950/50 border border-slate-800 rounded-xl py-3 px-4 outline-none transition-all input-glow text-white text-sm"
                        placeholder="gamer@thecrib.io">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Password</label>
                    <input type="password" id="password" required 
                        class="w-full bg-slate-950/50 border border-slate-800 rounded-xl py-3 px-4 outline-none transition-all input-glow text-white text-sm"
                        placeholder="••••••••">
                    
                    <!-- Requirement Tracker -->
                    <div id="password-reqs" class="mt-3 grid grid-cols-2 gap-y-1">
                        <div id="req-length" class="text-[10px] flex items-center gap-1 requirement-not-met"><i class="fas fa-circle text-[6px]"></i> 8+ Chars</div>
                        <div id="req-upper" class="text-[10px] flex items-center gap-1 requirement-not-met"><i class="fas fa-circle text-[6px]"></i> Uppercase</div>
                        <div id="req-lower" class="text-[10px] flex items-center gap-1 requirement-not-met"><i class="fas fa-circle text-[6px]"></i> Lowercase</div>
                        <div id="req-number" class="text-[10px] flex items-center gap-1 requirement-not-met"><i class="fas fa-circle text-[6px]"></i> Number</div>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Verify Password</label>
                    <input type="password" id="confirm-password" required 
                        class="w-full bg-slate-950/50 border border-slate-800 rounded-xl py-3 px-4 outline-none transition-all input-glow text-white text-sm"
                        placeholder="••••••••">
                </div>

                <button type="submit" id="submit-btn" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all active:scale-[0.98] shadow-lg shadow-blue-900/20 flex items-center justify-center gap-3 mt-4">
                    <span>Create Account</span>
                    <i class="fas fa-user-plus text-sm"></i>
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/login/" class="text-slate-500 text-xs hover:text-white transition-colors">Already have a key? Sign in</a>
            </div>
        </div>
        
        <p class="text-center mt-8 text-[9px] text-slate-700 uppercase tracking-[0.3em]">
            Connor is still a bot • Verified by Hell's Thread
        </p>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full bg-red-500 text-white font-bold text-sm shadow-2xl opacity-0 translate-y-10 transition-all pointer-events-none z-[100]">
        <span id="toast-msg">Error!</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const appId = "the-game-dungeon-4d75d"; // Fixed ID for paths

        const form = document.getElementById('create-form');
        const passInput = document.getElementById('password');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');

        function showToast(msg, isError = true) {
            toastMsg.innerText = msg;
            toast.className = `fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full text-white font-bold text-sm shadow-2xl transition-all pointer-events-none z-[100] ${isError ? 'bg-red-500' : 'bg-green-500'}`;
            toast.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => toast.classList.add('opacity-0', 'translate-y-10'), 3000);
        }

        // Real-time Password Validation UI
        passInput.addEventListener('input', () => {
            const val = passInput.value;
            const reqs = {
                'req-length': val.length >= 8,
                'req-upper': /[A-Z]/.test(val),
                'req-lower': /[a-z]/.test(val),
                'req-number': /[0-9]/.test(val)
            };
            
            for (const [id, met] of Object.entries(reqs)) {
                const el = document.getElementById(id);
                el.classList.toggle('requirement-met', met);
                el.classList.toggle('requirement-not-met', !met);
            }
        });

        const saveToDungeon = async (user, name, gametag) => {
            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile'), {
                displayName: name,
                gameTag: gametag,
                email: user.email,
                joinedAt: new Date().toISOString(),
                isBot: false
            });
        };

        // Google Fast Pass
        document.getElementById('google-fast-pass').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                // For Google, we use their name as gametag initially
                await saveToDungeon(result.user, result.user.displayName, result.user.displayName.replace(/\s+/g, ''));
                showToast("Account Created! Redirecting...", false);
                setTimeout(() => window.location.href = '/', 1500);
            } catch (error) {
                showToast("Google Fast Pass Blicked");
            }
        });

        // Manual Creation
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            const name = document.getElementById('name').value;
            const gametag = document.getElementById('gamename').value;
            const btn = document.getElementById('submit-btn');

            // Validation
            if (password !== confirm) return showToast("Passwords don't match, bro.");
            if (!/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password) || password.length < 8) {
                return showToast("Password is Bot-Brained. Check requirements.");
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch animate-spin"></i> Creating Profile...`;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
                await saveToDungeon(userCredential.user, name, gametag);
                
                showToast("Session Initialized!", false);
                setTimeout(() => window.location.href = '/', 1500);
            } catch (error) {
                btn.disabled = false;
                btn.innerHTML = `<span>Create Account</span> <i class="fas fa-user-plus text-sm"></i>`;
                let message = "Creation Failed";
                if (error.code === 'auth/email-already-in-use') message = "Email already in the gang.";
                showToast(message);
            }
        });

        document.addEventListener('touchstart', () => {}, {passive: true});
    </script>
</body>
</html>
