<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
            /* Fixed: Changed hidden to auto so you can actually scroll on iPad */
            overflow-y: auto;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-glow:focus {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Background Elements -->
    <div class="fixed inset-0 overflow-hidden -z-10">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-900/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-900/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="max-w-md w-full animate-in fade-in zoom-in duration-500 py-10">
        <!-- Logo Section -->
        <div class="text-center mb-8">
            <div class="inline-block p-4 rounded-3xl bg-slate-900 border border-slate-800 mb-4 animate-float">
                <img src="/storage/photos/tgdtc.png" alt="TGD" class="w-20 h-20 rounded-xl shadow-2xl">
            </div>
            <h1 class="text-4xl font-black tracking-tighter text-white">THE CRIB <span class="text-blue-500">AUTH</span></h1>
            <p class="text-slate-500 text-sm mt-2">Enter your credentials to bypass the Oink Oink security.</p>
        </div>

        <!-- Login Card -->
        <div class="glass-panel p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
            <!-- Google Fast Pass -->
            <button id="google-fast-pass" 
                class="w-full bg-white hover:bg-gray-100 text-gray-900 font-bold py-4 rounded-2xl transition-all active:scale-[0.98] shadow-lg mb-6 flex items-center justify-center gap-3">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="G">
                <span>Google Fast Pass</span>
            </button>

            <div class="flex items-center gap-4 mb-6">
                <div class="h-[1px] bg-slate-800 flex-1"></div>
                <span class="text-[10px] font-black text-slate-600 uppercase tracking-widest">OR USE KEY</span>
                <div class="h-[1px] bg-slate-800 flex-1"></div>
            </div>

            <!-- Form -->
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Identity (Email)</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="email" id="email" required 
                            class="w-full bg-slate-950/50 border border-slate-800 rounded-2xl py-4 pl-12 pr-4 outline-none transition-all input-glow text-white"
                            placeholder="gamer@thecrib.com">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 ml-1">Access Key</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="password" id="password" required 
                            class="w-full bg-slate-950/50 border border-slate-800 rounded-2xl py-4 pl-12 pr-4 outline-none transition-all input-glow text-white"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="submit-btn" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all active:scale-[0.98] shadow-lg shadow-blue-900/20 flex items-center justify-center gap-3">
                    <span>Initialize Session</span>
                    <i class="fas fa-arrow-right text-sm"></i>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-800 text-center">
                <p class="text-slate-400 text-sm">New to the Dungeon?</p>
                <a href="/login/create/" class="inline-block mt-2 text-blue-400 font-bold hover:text-blue-300 transition-colors">
                    Create a Non-Bot Account
                </a>
            </div>
        </div>

        <!-- Footer / Roasting Connor -->
        <p class="text-center mt-8 text-[10px] text-slate-600 uppercase tracking-[0.2em]">
            Protected by Hell's Thread Systems • Connor is still a bot
        </p>
    </div>

    <!-- Error/Success Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full bg-red-500 text-white font-bold text-sm shadow-2xl opacity-0 translate-y-10 transition-all pointer-events-none z-[100]">
        <span id="toast-msg">Invalid Credentials</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const form = document.getElementById('login-form');
        const googleBtn = document.getElementById('google-fast-pass');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');

        function showToast(msg, isError = true) {
            toastMsg.innerText = msg;
            toast.classList.replace(isError ? 'bg-green-500' : 'bg-red-500', isError ? 'bg-red-500' : 'bg-green-500');
            toast.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-10');
            }, 3000);
        }

        // Google Fast Pass Logic
        googleBtn.addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                showToast(`Welcome, ${result.user.displayName}`, false);
                setTimeout(() => {
                    window.location.href = `/?logginginuser=${encodeURIComponent(result.user.email)}&fastpass=true`;
                }, 1000);
            } catch (error) {
                console.error(error);
                showToast("Fast Pass Blicked by Browser");
            }
        });

        // Email/Pass Login
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch animate-spin"></i> Authenticating...`;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showToast("Access Granted!", false);
                setTimeout(() => {
                    window.location.href = `/?logginginuser=${encodeURIComponent(email)}&2faverify=check`;
                }, 1000);

            } catch (error) {
                btn.disabled = false;
                btn.innerHTML = `<span>Initialize Session</span> <i class="fas fa-arrow-right text-sm"></i>`;
                let message = "Oink Oink: Access Denied";
                if (error.code === 'auth/user-not-found') message = "Account doesn't exist, bro.";
                if (error.code === 'auth/wrong-password') message = "Weak memory? Wrong password.";
                showToast(message);
            }
        });

        document.addEventListener('touchstart', () => {}, {passive: true});
    </script>
</body>
</html>
