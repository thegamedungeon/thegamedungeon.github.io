<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | The Game Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
        }
        .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        .input-field {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }
        #status-msg { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="glass max-w-md w-full p-10 rounded-3xl shadow-2xl relative overflow-hidden">
        <!-- Glow Effect -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-600/20 rounded-full blur-3xl"></div>
        
        <div class="text-center relative z-10">
            <img src="/storage/photos/tgdtc.png" alt="Logo" class="w-20 h-20 mx-auto mb-6 rounded-2xl border border-blue-500/30">
            <h1 class="text-3xl font-black tracking-tighter mb-2">ACCESS TERMINAL</h1>
            <p class="text-gray-400 text-sm mb-8 uppercase tracking-widest">Enter The Game Dungeon</p>
        </div>

        <form id="login-form" class="space-y-5 relative z-10">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2 ml-1">Email Address</label>
                <input type="email" id="email" required class="input-field w-full px-5 py-4 rounded-xl text-white" placeholder="gamer@thecrib.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2 ml-1">Password</label>
                <input type="password" id="password" required class="input-field w-full px-5 py-4 rounded-xl text-white" placeholder="••••••••">
            </div>
            
            <button type="submit" id="auth-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl transition-all shadow-lg shadow-blue-900/20 flex items-center justify-center gap-2">
                <span>ENTER THE DUNGEON</span>
                <i class="fas fa-chevron-right text-xs"></i>
            </button>
        </form>

        <div class="mt-4 relative z-10">
            <button id="fast-pass" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold rounded-xl transition-all border border-white/5 flex items-center justify-center gap-2 text-sm">
                <i class="fas fa-bolt text-yellow-400"></i> FAST PASS
            </button>
        </div>

        <div id="status-msg" class="mt-6 text-center text-sm font-medium opacity-0"></div>
        
        <p class="mt-8 text-center text-[10px] text-gray-600 uppercase tracking-[0.2em]">© THE GAME DUNGEON SECURITY UNIT</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
            authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
            projectId: "the-game-dungeon-4d75d",
            storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
            messagingSenderId: "533459716906",
            appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
            measurementId: "G-CER9SE96MC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('login-form');
        const statusMsg = document.getElementById('status-msg');
        const fastPass = document.getElementById('fast-pass');

        function showStatus(text, isError = false) {
            statusMsg.innerText = text;
            statusMsg.className = `mt-6 text-center text-sm font-medium opacity-100 ${isError ? 'text-red-400' : 'text-blue-400'}`;
        }

        // Redirect if already signed in
        onAuthStateChanged(auth, (user) => {
            if (user && user.email) {
                window.location.href = `/profile/?user=${encodeURIComponent(user.email)}`;
            }
        });

        form.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('auth-btn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i> VERIFYING...';
            showStatus("Checking credentials...");

            try {
                // Try logging in
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                // If user doesn't exist, create account
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    try {
                        showStatus("User not found. Creating account...");
                        await createUserWithEmailAndPassword(auth, email, password);
                    } catch (createError) {
                        showStatus(createError.message, true);
                        btn.disabled = false;
                        btn.innerHTML = 'ENTER THE DUNGEON';
                    }
                } else {
                    showStatus(error.message, true);
                    btn.disabled = false;
                    btn.innerHTML = 'ENTER THE DUNGEON';
                }
            }
        };

        // Fast Pass logic (Anonymous login or quick entry)
        fastPass.onclick = async () => {
            showStatus("Activating Fast Pass...");
            try {
                await signInAnonymously(auth);
                // Since it's anonymous, it won't have an email for the redirect check above
                // We'll manually push to the main page if no email
                window.location.href = "/";
            } catch (err) {
                showStatus("Fast Pass failed: " + err.message, true);
            }
        };
    </script>
</body>
</html>
