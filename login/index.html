<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon | Access Granted?</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1a1a1a;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            border: 1px solid #00ff00; /* Green Belt Green */
            width: 340px;
            text-align: center;
        }
        h1 { margin-bottom: 1.5rem; font-size: 1.8rem; color: #00ff00; letter-spacing: 2px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #00ff00; }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-primary { background: #00ff00; color: #000; }
        .btn-primary:hover { background: #00cc00; box-shadow: 0 0 10px #00ff00; }
        .btn-google { 
            background: #ffffff; 
            color: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
            margin-top: 15px;
        }
        .divider { margin: 20px 0; color: #666; font-size: 0.8rem; text-transform: uppercase; }
        #status-msg { margin-top: 15px; font-size: 0.9rem; color: #ff4d4d; min-height: 20px; }
    </style>
</head>
<body>

<div class="login-card">
    <h1>THE CRIB</h1>
    
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    
    <button class="btn-primary" onclick="handleLogin()">ENTER DUNGEON</button>
    <button style="background: #333; color: #ccc; font-size: 0.8rem;" onclick="handleSignUp()">CREATE ACCOUNT</button>

    <div class="divider">OR USE THE FAST PASS</div>

    <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
        Sign in with Google
    </button>

    <p id="status-msg"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, 
        GoogleAuthProvider, 
        signInWithPopup, 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
        authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
        projectId: "the-game-dungeon-4d75d",
        storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
        messagingSenderId: "533459716906",
        appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
        measurementId: "G-CER9SE96MC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const status = document.getElementById('status-msg');

    // Monitor auth state
    onAuthStateChanged(auth, (user) => {
        if (user) {
            console.log("Logged in:", user.email);
            window.location.href = "/index.html";
        }
    });

    // --- GOOGLE POPUP LOGIN ---
    window.loginWithGoogle = async () => {
        status.style.color = "#00ff00";
        status.innerText = "Opening Google Sign-In...";
        try {
            const result = await signInWithPopup(auth, provider);
            if (result.user) {
                window.location.href = "/index.html";
            }
        } catch (error) {
            console.error("Login Error:", error);
            // This alert will tell us the EXACT reason it's failing
            alert("Error: " + error.code + " - " + error.message);
            status.innerText = "Login Failed.";
        }
    };

    // --- EMAIL FUNCTIONS ---
    window.handleLogin = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        if(!email || !pass) { status.innerText = "Fill the fields, bro."; return; }
        
        try {
            await signInWithEmailAndPassword(auth, email, pass);
            window.location.href = "index.html";
        } catch (err) {
            status.innerText = "Access Denied.";
        }
    };

    window.handleSignUp = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try {
            await createUserWithEmailAndPassword(auth, email, pass);
            status.style.color = "#00ff00";
            status.innerText = "Account created! Now login.";
        } catch (err) {
            status.innerText = "Error: " + err.message;
        }
    };
</script>

</body>
</html>
