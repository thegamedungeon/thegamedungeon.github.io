<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game Dungeon | Access Granted?</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #333;
            width: 320px;
            text-align: center;
        }
        h1 { margin-bottom: 1.5rem; font-size: 1.5rem; color: #00d4ff; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-primary { background: #00d4ff; color: #000; }
        .btn-primary:hover { background: #0099bb; }
        .btn-google { 
            background: #ffffff; 
            color: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
        }
        .divider { margin: 20px 0; color: #666; font-size: 0.8rem; }
        #status-msg { margin-top: 15px; font-size: 0.9rem; color: #ff4d4d; }
    </style>
</head>
<body>

<div class="login-card">
    <h1>THE CRIB</h1>
    
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    
    <button class="btn-primary" onclick="handleLogin()">Enter Dungeon</button>
    <button style="background: #333; color: white;" onclick="handleSignUp()">Create Account</button>

    <div class="divider">OR USE THE FAST PASS</div>

    <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
        Sign in with Google
    </button>

    <p id="status-msg"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // YOUR CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyAn1vmoPRGXgtsGQrKGtpf0Jt89HWoXRUI",
        authDomain: "the-game-dungeon-4d75d.firebaseapp.com",
        projectId: "the-game-dungeon-4d75d",
        storageBucket: "the-game-dungeon-4d75d.firebasestorage.app",
        messagingSenderId: "533459716906",
        appId: "1:533459716906:web:377bf4ea74cf21bf8aac53",
        measurementId: "G-CER9SE96MC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const status = document.getElementById('status-msg');

    // Email/Pass Login
    window.handleLogin = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
            window.location.href = "index.html";
        } catch (err) {
            status.innerText = "Access Denied. Wrong credentials, bro.";
        }
    };

    // Sign Up
    window.handleSignUp = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try {
            await createUserWithEmailAndPassword(auth, email, pass);
            status.style.color = "#00ff00";
            status.innerText = "Account created! Now login.";
        } catch (err) {
            status.innerText = "Error: " + err.message;
        }
    };

    // Google Sign-In (Best for iPad)
    window.loginWithGoogle = () => {
        signInWithRedirect(auth, provider);
    };

    // Handle the redirect back from Google
    getRedirectResult(auth).then((result) => {
        if (result) window.location.href = "index.html";
    }).catch((err) => {
        console.error(err);
    });
</script>

</body>
</html>
